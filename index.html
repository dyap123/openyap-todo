<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#08020f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%93</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200..400,0..1,0&display=swap" rel="stylesheet">

<style>
:root {
  /* Refined dark pro — deep slate base, one soft-indigo accent.
     Variable NAMES are load-bearing (themes override them); only values changed. */
  --bg:#0b0e14;--card:rgba(255,255,255,0.028);
  --panel-1:rgba(22,27,36,0.85);--panel-2:rgba(15,19,26,0.90);
  --accent1:#7c9cff;--accent2:#5ec2d6;--accent3:#9d8cff;
  --accent1-10:rgba(124,156,255,0.10);--accent1-06:rgba(124,156,255,0.06);
  --card-border:rgba(255,255,255,0.07);--card-hover:rgba(124,156,255,0.28);
  --red:#f87171;--yellow:#fbbf24;--gray:#66717f;--text:#e6edf3;--text-body:#a9b4c2;--text-muted:#66717f;
  --border:rgba(255,255,255,0.06);--radius:14px;--ease:cubic-bezier(0.16,1,0.3,1);
  --blue:var(--accent2);--pink:var(--accent1);--purple:var(--accent3);
  --glow1:rgba(124,156,255,0.05);--glow2:rgba(94,194,214,0.04);--glow3:rgba(157,140,255,0.03);
  --glow-pink:rgba(124,156,255,0.10);--glow-cyan:rgba(94,194,214,0.08);--glow-magenta:rgba(157,140,255,0.08);
  --body-bg:radial-gradient(ellipse 1200px 800px at 25% 15%,rgba(124,156,255,0.05),transparent 60%),radial-gradient(ellipse 1000px 800px at 80% 75%,rgba(94,194,214,0.03),transparent 65%),linear-gradient(180deg,#0d1017 0%,#0b0e14 100%);
  --hdr-bg:rgba(13,16,23,0.85);--sidebar-bg:rgba(13,16,23,0.94);
  --cat-work-bg:rgba(94,194,214,0.10);--cat-work-fg:rgba(94,194,214,0.75);
  --cat-pers-bg:rgba(124,156,255,0.10);--cat-pers-fg:rgba(124,156,255,0.75);
  --cat-proj-bg:rgba(157,140,255,0.10);--cat-proj-fg:rgba(157,140,255,0.75);
  --font-en:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --font-cn:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
/* ── Themes — accent variants over the shared slate base ── */
body.t-ocean{--accent1:#38bdf8;--accent2:#5eead4;--accent3:#60a5fa;--accent1-10:rgba(56,189,248,0.10);--accent1-06:rgba(56,189,248,0.06);--card-hover:rgba(56,189,248,0.28);--glow1:rgba(56,189,248,0.05);--glow2:rgba(94,234,212,0.04);--glow3:rgba(96,165,250,0.03);--cat-work-bg:rgba(94,234,212,0.10);--cat-work-fg:rgba(94,234,212,0.75);--cat-pers-bg:rgba(56,189,248,0.10);--cat-pers-fg:rgba(56,189,248,0.75);--cat-proj-bg:rgba(96,165,250,0.10);--cat-proj-fg:rgba(96,165,250,0.75)}
body.t-forest{--accent1:#6ee7a0;--accent2:#a3c9b4;--accent3:#8fd6b0;--accent1-10:rgba(110,231,160,0.09);--accent1-06:rgba(110,231,160,0.05);--card-hover:rgba(110,231,160,0.26);--glow1:rgba(110,231,160,0.04);--glow2:rgba(163,201,180,0.03);--glow3:rgba(143,214,176,0.03);--cat-work-bg:rgba(163,201,180,0.10);--cat-work-fg:rgba(163,201,180,0.75);--cat-pers-bg:rgba(110,231,160,0.10);--cat-pers-fg:rgba(110,231,160,0.75);--cat-proj-bg:rgba(143,214,176,0.10);--cat-proj-fg:rgba(143,214,176,0.75)}
body.t-sunset{--accent1:#fb923c;--accent2:#f9a8d4;--accent3:#fbbf24;--accent1-10:rgba(251,146,60,0.10);--accent1-06:rgba(251,146,60,0.06);--card-hover:rgba(251,146,60,0.28);--glow1:rgba(251,146,60,0.05);--glow2:rgba(249,168,212,0.03);--glow3:rgba(251,191,36,0.03);--cat-work-bg:rgba(249,168,212,0.10);--cat-work-fg:rgba(249,168,212,0.75);--cat-pers-bg:rgba(251,146,60,0.10);--cat-pers-fg:rgba(251,146,60,0.75);--cat-proj-bg:rgba(251,191,36,0.10);--cat-proj-fg:rgba(251,191,36,0.75)}
body.t-mono{--accent1:#a8b2c0;--accent2:#cdd5de;--accent3:#828d9c;--accent1-10:rgba(168,178,192,0.08);--accent1-06:rgba(168,178,192,0.05);--card-hover:rgba(168,178,192,0.24);--glow1:rgba(168,178,192,0.04);--glow2:rgba(205,213,222,0.03);--glow3:rgba(130,141,156,0.03);--cat-work-bg:rgba(205,213,222,0.08);--cat-work-fg:rgba(205,213,222,0.6);--cat-pers-bg:rgba(168,178,192,0.08);--cat-pers-fg:rgba(168,178,192,0.6);--cat-proj-bg:rgba(130,141,156,0.08);--cat-proj-fg:rgba(130,141,156,0.6)}
body.t-sakura{--accent1:#f0a6c8;--accent2:#c4b5fd;--accent3:#fda4af;--accent1-10:rgba(240,166,200,0.10);--accent1-06:rgba(240,166,200,0.06);--card-hover:rgba(240,166,200,0.28);--glow1:rgba(240,166,200,0.05);--glow2:rgba(196,181,253,0.03);--glow3:rgba(253,164,175,0.03);--cat-work-bg:rgba(196,181,253,0.10);--cat-work-fg:rgba(196,181,253,0.75);--cat-pers-bg:rgba(240,166,200,0.10);--cat-pers-fg:rgba(240,166,200,0.75);--cat-proj-bg:rgba(253,164,175,0.10);--cat-proj-fg:rgba(253,164,175,0.75)}
/* Light theme — inverted with dark text on warm white */
body.t-light{
  --is-light:1;
  --bg:#f6f5fb;--card:rgba(255,255,255,0.78);
  --panel-1:rgba(255,255,255,0.95);--panel-2:rgba(248,247,253,0.92);
  --accent1:#7c3aed;--accent2:#2563eb;--accent3:#db2777;
  --accent1-10:rgba(124,58,237,0.10);--accent1-06:rgba(124,58,237,0.05);
  --card-border:rgba(124,58,237,0.12);--card-hover:rgba(124,58,237,0.22);
  --text:#1a1a2e;--text-body:#525266;--text-muted:#8a8aa0;
  --border:rgba(0,0,0,0.06);
  --glow1:rgba(124,58,237,0.06);--glow2:rgba(37,99,235,0.05);--glow3:rgba(219,39,119,0.04);
  --body-bg:linear-gradient(160deg,#f6f5fb 0%,#efebf7 35%,#f0e9f4 70%,#f2eef8 100%);
  --hdr-bg:rgba(246,245,251,0.88);--sidebar-bg:rgba(246,245,251,0.95);
  --cat-work-bg:rgba(37,99,235,0.10);--cat-work-fg:rgba(37,99,235,0.85);
  --cat-pers-bg:rgba(124,58,237,0.10);--cat-pers-fg:rgba(124,58,237,0.85);
  --cat-proj-bg:rgba(219,39,119,0.10);--cat-proj-fg:rgba(219,39,119,0.85);
}
/* Light-mode overrides for elements using rgba(255,255,255,...) directly */
body.t-light .ck{border-color:rgba(0,0,0,0.22)}
body.t-light .fp,body.t-light .sort-btn{border-color:rgba(0,0,0,0.08);color:rgba(0,0,0,0.55)}
body.t-light .tab-btn{color:rgba(0,0,0,0.55)}
body.t-light .ob{border-color:rgba(0,0,0,0.08);color:rgba(0,0,0,0.45)}
body.t-light .ob:hover{color:rgba(0,0,0,0.7)}
body.t-light .tex textarea,body.t-light .tex-row select,body.t-light .tex-row input,body.t-light .tex-title{background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.08);color:var(--text)}
body.t-light .input-card input[type="text"],body.t-light .notes-row textarea,body.t-light .input-card input[type="text"]::placeholder{color:var(--text)}
body.t-light .input-card input[type="text"]::placeholder,body.t-light .notes-row textarea::placeholder{color:rgba(0,0,0,0.35)}
body.t-light .t-rank{color:rgba(0,0,0,0.18)}
body.t-light .pd.medium{background:var(--accent1)}
body.t-light .pd.low{background:var(--gray)}
body.t-light .stats{color:rgba(124,58,237,0.4)}
body.t-light .empty-bubble{color:var(--text)}
body.t-light .empty-bubble::before{background:rgba(255,255,255,0.78)}
body.t-light .ai-row input{color:var(--text)}
body.t-light .am.user{color:var(--text)}
body.t-light #alfredSidebar{background:rgba(246,245,251,0.95)}
body.t-light .stat-emoji{filter:grayscale(0.5) brightness(0.85)}
body.t-light .bg-mesh::before{opacity:0.6}
/* Light Sisyphus canvas */
/* Sisyphus canvas + sis-wrap removed — see <div class="cmd-strip"> in markup */

/* Mascot — blended, subtle, alive (ambient motion calmed) */

/* Motion modes — "calm" is default; "lively" restores original pace; prefers-reduced-motion zeroes ambient loops */
html[data-motion="lively"] .bg-mesh::before{animation-duration:60s !important}
@media (prefers-reduced-motion: reduce){
  .bg-mesh::before{animation:none !important}
  .sync-dot{animation-duration:4s !important}
}

/* Theme picker */
.theme-picker{position:relative;display:inline-block}
.theme-dots{display:none;position:absolute;top:100%;right:0;margin-top:6px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:12px;padding:8px;gap:6px;display:none;flex-wrap:wrap;width:160px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.theme-dots.show{display:flex}
.theme-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:12px}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{border-color:var(--accent1);box-shadow:0 0 8px rgba(255,255,255,0.1)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Seamless themed scrollbars — no cheap white OS tracks anywhere */
*{scrollbar-width:thin;scrollbar-color:var(--card-border) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--card-hover);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
html{background:var(--bg,#08020f)}
body{background:var(--body-bg);color:var(--text-body);font-family:var(--font-en);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;transition:margin-right .3s var(--ease);overflow-x:hidden;position:relative}
/* Vertical Chinese signage decorations behind content (Chongqing nightscape vibe) */
body::before{content:'任务';position:fixed;top:8vh;left:2vw;font-family:var(--font-cn);font-weight:700;font-size:clamp(120px,18vw,260px);line-height:0.92;color:transparent;-webkit-text-stroke:1px rgba(255,46,136,0.10);opacity:0.55;writing-mode:vertical-rl;letter-spacing:0.1em;pointer-events:none;z-index:0;text-shadow:0 0 30px rgba(255,46,136,0.05);user-select:none}
body::after{content:'今日';position:fixed;bottom:6vh;right:2vw;font-family:var(--font-cn);font-weight:700;font-size:clamp(110px,16vw,220px);line-height:0.92;color:transparent;-webkit-text-stroke:1px rgba(0,229,255,0.10);opacity:0.45;writing-mode:vertical-rl;letter-spacing:0.1em;pointer-events:none;z-index:0;text-shadow:0 0 30px rgba(0,229,255,0.05);user-select:none}
@media (max-width:900px){body::before,body::after{display:none}}
/* Bilingual EN/中文 utility — append to any label */
.cn{font-family:var(--font-cn);color:var(--accent1);font-weight:500;letter-spacing:0.04em;text-shadow:0 0 8px var(--glow-pink);margin-left:6px}
.cn-cyan{color:var(--accent2);text-shadow:0 0 8px var(--glow-cyan)}
.mono{font-family:var(--font-mono)}
::selection{background:var(--card-hover)}
input,select,textarea,button{font-family:inherit}

/* Animated gradient mesh background */
.bg-mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-mesh::before{content:'';position:absolute;width:140%;height:140%;top:-20%;left:-20%;background:radial-gradient(ellipse 600px 500px at 25% 35%,var(--glow2) 0%,transparent 70%),radial-gradient(ellipse 500px 600px at 75% 60%,var(--glow1) 0%,transparent 70%),radial-gradient(ellipse 500px 400px at 50% 80%,var(--glow3) 0%,transparent 70%);will-change:transform;transform:translateZ(0);animation:meshDrift 120s linear infinite alternate;opacity:0.75}
@keyframes meshDrift{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-10px,6px,0)}}
.bg-mesh::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:32px 32px}

/* Gradient line accents */

/* Header */
.header{position:sticky;top:0;z-index:50;background:var(--hdr-bg);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--card-border)}
.header-inner{max-width:min(1500px,95vw);margin:0 auto;padding:0 28px;height:48px;display:flex;align-items:center;justify-content:space-between}
.app-title{font-weight:300;font-size:11px;letter-spacing:.3em;color:var(--accent1);opacity:0.6;text-transform:uppercase}
.header-right{display:flex;gap:8px;align-items:center}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--accent1);box-shadow:0 0 8px var(--accent1-10);animation:syncPulse 2s ease-in-out infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:0.4}}
.sync-label{font-size:9px;color:var(--accent1);opacity:0.3;letter-spacing:0.6px;font-weight:600}

/* Main */
.main{max-width:min(1500px,95vw);margin:0 auto;padding:20px 28px 100px;position:relative;z-index:1}

/* Input Card */
.input-card{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-bottom:20px;transition:border-color .3s}
.input-card:focus-within{border-color:var(--card-hover);box-shadow:0 0 30px rgba(139,92,246,0.04)}
.input-card input[type="text"]{width:100%;background:transparent;border:none;font-size:15px;color:var(--text);outline:none;margin-bottom:12px}
.input-card input[type="text"]::placeholder{color:rgba(168,164,184,0.4)}
.input-opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt-grp{display:flex;gap:3px}
.ob{padding:5px 12px;border-radius:14px;font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.25);cursor:pointer;transition:all .15s}
.ob:hover{color:rgba(255,255,255,0.45)}
.ob.s{color:#fff}
.ob.s[data-c="work"]{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.25);color:var(--blue)}
.ob.s[data-c="personal"]{background:var(--card-hover);border-color:var(--card-hover);color:var(--purple)}
.ob.s[data-c="project"]{background:rgba(236,72,153,0.12);border-color:rgba(236,72,153,0.2);color:var(--pink)}
.ob.s[data-p="high"]{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.2);color:var(--red)}
.ob.s[data-p="medium"]{background:var(--accent1-10);border-color:var(--card-hover);color:var(--purple)}
.ob.s[data-p="low"]{background:rgba(100,116,139,0.12);border-color:rgba(100,116,139,0.2);color:var(--gray)}
.add-btn{padding:6px 20px;border-radius:14px;margin-left:auto;background:linear-gradient(135deg,var(--card-hover),rgba(59,130,246,0.15));color:var(--purple);border:1px solid var(--card-hover);font-weight:700;font-size:12px;cursor:pointer;transition:all .2s var(--ease)}
.add-btn:hover{background:linear-gradient(135deg,rgba(139,92,246,0.3),rgba(59,130,246,0.25));transform:translateY(-1px);box-shadow:0 4px 16px var(--card-hover)}

/* Date button */
.date-btn{padding:5px 12px;border-radius:12px;font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.25);cursor:pointer;transition:all .15s;position:relative;display:inline-flex;align-items:center;gap:4px}
.date-btn::before{content:'📅';font-size:11px;filter:grayscale(0.4);opacity:.7}
.date-btn:hover{color:rgba(255,255,255,0.6);border-color:var(--card-hover);background:var(--accent1-06)}
.date-btn.has-date{background:var(--accent1-10);border-color:var(--card-hover);color:var(--accent1)}
.date-btn.has-date::before{filter:none;opacity:1}
.date-btn input[type="date"]{display:none}
/* Time picker pill */
.time-btn{padding:5px 10px;border-radius:12px;font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.25);cursor:pointer;transition:all .15s;position:relative;display:inline-flex;align-items:center;gap:4px}
.time-btn::before{content:'🕐';font-size:10px;filter:grayscale(0.4);opacity:.7}
.time-btn:hover{color:rgba(255,255,255,0.6);border-color:var(--card-hover);background:var(--accent1-06)}
.time-btn.has-time{background:var(--accent1-10);border-color:var(--card-hover);color:var(--accent1)}
.time-btn.has-time::before{filter:none;opacity:1}
.time-btn input[type="time"]{display:none}
/* ── Custom time picker popover ── */
.tp-pop{position:fixed;z-index:9999;width:220px;background:linear-gradient(160deg,var(--panel-1),var(--panel-2));backdrop-filter:blur(24px);border:1.5px solid transparent;background-clip:padding-box;border-radius:16px;padding:14px;box-shadow:0 16px 48px rgba(0,0,0,0.5),0 0 48px var(--accent1-10),0 0 96px var(--accent1-06);animation:dpIn .3s var(--ease)}
.tp-pop::before{content:'';position:absolute;inset:-1.5px;border-radius:16px;padding:1.5px;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55}
.tp-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.tp-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.tp-col-label{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted)}
.tp-spinner{display:flex;flex-direction:column;align-items:center;gap:2px}
.tp-spinner button{width:30px;height:22px;border-radius:6px;border:1px solid var(--card-border);background:var(--accent1-06);color:var(--accent1);font-size:14px;line-height:1;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-family:inherit}
.tp-spinner button:hover{background:var(--accent1-10);border-color:var(--accent1)}
.tp-val{font-family:'JetBrains Mono','SF Mono',monospace;font-size:24px;font-weight:800;color:var(--text);min-width:36px;text-align:center;line-height:1}
.tp-sep{font-size:24px;font-weight:800;color:var(--text-muted);line-height:1;padding-bottom:22px}
.tp-ampm button{padding:4px 10px;border-radius:6px;border:1px solid var(--card-border);background:transparent;color:var(--text-muted);font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.tp-ampm button.active{background:var(--accent1-10);color:var(--accent1);border-color:var(--card-hover)}
.tp-quick{display:flex;gap:4px;padding-top:10px;border-top:1px solid var(--card-border)}
.tp-quick button{flex:1;padding:5px 4px;border-radius:8px;border:1px solid var(--card-border);background:rgba(255,255,255,0.03);color:var(--text-muted);font-size:9px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.tp-quick button:hover{background:var(--accent1-10);color:var(--accent1);border-color:var(--card-hover)}
.tp-quick button.clear:hover{background:rgba(239,68,68,0.1);color:var(--red);border-color:rgba(239,68,68,0.3)}
/* ── Custom date picker popover ── */
.dp-pop{position:fixed;z-index:9999;width:280px;background:linear-gradient(160deg,var(--panel-1),var(--panel-2));backdrop-filter:blur(24px);border:1.5px solid transparent;background-clip:padding-box;border-radius:18px;padding:14px;box-shadow:0 16px 48px rgba(0,0,0,0.5),0 0 48px var(--accent1-10),0 0 96px var(--accent1-06);animation:dpIn .3s var(--ease)}
.dp-pop::before{content:'';position:absolute;inset:-1.5px;border-radius:18px;padding:1.5px;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55}
@keyframes dpIn{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative}
.dp-title{font-size:14px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,var(--accent1),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dp-nav{width:26px;height:26px;border-radius:8px;border:1px solid var(--card-border);background:var(--accent1-06);color:var(--accent1);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.dp-nav:hover{background:var(--accent1-10);border-color:var(--accent1);transform:scale(1.08)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px;position:relative}
.dp-dow{font-size:8px;font-weight:700;text-transform:uppercase;color:var(--text-muted);text-align:center;padding:4px 0;letter-spacing:.5px}
.dp-day{font-size:11px;font-weight:600;color:var(--text-body);aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;transition:all .15s var(--ease);border:1px solid transparent;position:relative}
.dp-day:hover{background:var(--accent1-10);color:var(--accent1);border-color:var(--card-hover);transform:scale(1.06)}
.dp-day.blank{cursor:default;pointer-events:none}
.dp-day.today{color:var(--accent1);font-weight:800;background:var(--accent1-06)}
.dp-day.today::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--accent1);box-shadow:0 0 6px var(--accent1)}
.dp-day.selected{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:var(--accent1);box-shadow:0 2px 12px var(--accent1-10)}
.dp-day.selected::after{background:#fff;box-shadow:0 0 6px #fff}
.dp-day.past{opacity:.45}
.dp-day.has-tasks{background:var(--accent1-06);border-color:var(--card-border)}
.dp-day-count{position:absolute;top:1px;right:1px;font-size:7px;font-weight:800;color:var(--accent1);background:var(--accent1-10);border:1px solid var(--card-hover);border-radius:8px;min-width:12px;height:12px;padding:0 3px;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none}
.dp-day-count.overdue{color:var(--red);background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.3)}
.dp-quick{display:flex;gap:4px;padding-top:10px;border-top:1px solid var(--card-border);position:relative}
.dp-quick button{flex:1;padding:6px 4px;border-radius:8px;border:1px solid var(--card-border);background:rgba(255,255,255,0.03);color:var(--text-muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:all .2s;font-family:inherit}
.dp-quick button:hover{background:var(--accent1-10);color:var(--accent1);border-color:var(--card-hover)}
.dp-quick button.clear:hover{background:rgba(239,68,68,0.1);color:var(--red);border-color:rgba(239,68,68,0.3)}
/* Theme native inputs */
input[type="date"],select{color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7)}
.fp.a{background:var(--accent1-10);color:var(--accent1);border-color:var(--card-hover)}
.sort-btn.a{background:var(--accent1-10);color:var(--accent1);border-color:var(--card-hover)}

/* Notes input */
.notes-row{margin-top:8px}
.notes-row textarea{width:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:8px 12px;color:var(--text-body);font-size:12px;resize:none;height:36px;outline:none;transition:all .2s}
.notes-row textarea:focus{height:70px;border-color:var(--card-hover)}
.notes-row textarea::placeholder{color:rgba(168,164,184,0.25)}
/* Difficulty buttons */
.ob.s[data-d="easy"]{background:rgba(74,222,128,0.12);border-color:rgba(74,222,128,0.3);color:#4ade80}
.ob.s[data-d="medium"]{background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.3);color:#fbbf24}
.ob.s[data-d="hard"]{background:rgba(249,115,22,0.12);border-color:rgba(249,115,22,0.3);color:#f97316}
.ob.s[data-d="epic"]{background:rgba(236,72,153,0.15);border-color:rgba(236,72,153,0.35);color:var(--accent3)}
.ob.s[data-d="super_epic"]{background:linear-gradient(135deg,rgba(255,46,136,0.18),rgba(0,229,255,0.16),rgba(255,214,0,0.16));border-color:var(--accent1);color:#fff;text-shadow:0 0 8px var(--glow-pink)}
.ob.s[data-r="none"]{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.08);color:rgba(255,255,255,0.5)}
.ob.s[data-r="daily"],.ob.s[data-r="weekly"],.ob.s[data-r="monthly"]{background:var(--accent1-10);border-color:var(--card-hover);color:var(--accent1)}
.ob[data-r]:not(.s):hover{color:var(--accent1)}
.t-repeat{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:10px;background:var(--accent1-10);color:var(--accent1);border:1px solid var(--accent1-10)}
.t-repeat::before{content:'↻';font-size:10px}
/* Difficulty stars on task card */
.t-diff{display:inline-flex;gap:1px;font-size:9px;line-height:1;letter-spacing:0;color:rgba(255,255,255,0.2)}
.t-diff.easy{color:#4ade80}.t-diff.medium{color:#fbbf24}.t-diff.hard{color:#f97316}.t-diff.epic{color:var(--accent3)}.t-diff.super_epic{background:linear-gradient(135deg,#7c9cff,#5ec2d6,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
/* Progress slider on task card */
.t-prog{display:flex;align-items:center;gap:6px;margin-top:6px;padding:2px 0;pointer-events:none}
.t-prog-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.05);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,0.03)}
.t-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent1),var(--accent3));transition:width .35s var(--ease);box-shadow:0 0 6px var(--accent1-10)}
.t-prog-val{font-size:9px;font-weight:700;color:var(--text-muted);min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.t-prog-input{width:100%;background:rgba(255,255,255,0.02);border:1px solid var(--card-border);border-radius:8px;padding:5px 8px;color:var(--text-body);font-size:11px;outline:none}
.t-prog-input:focus{border-color:var(--card-hover)}
/* Celebration overlay */
<!-- celebOverlay/celebCanvas/celebText/celeb-sub/celebTextIn removed; new lean CSS celebration lives on .tc.celebrating -->

/* Search */
.search-wrap{position:relative;margin-bottom:10px;display:flex;align-items:center}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5;pointer-events:none;filter:grayscale(.3)}
.search-input{flex:1;padding:9px 34px 9px 34px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);backdrop-filter:blur(10px);color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:var(--accent1);background:var(--accent1-06);box-shadow:0 0 24px var(--accent1-10),0 2px 12px rgba(0,0,0,0.15)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,0.06);color:var(--text-muted);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .2s}
.search-clear:hover{background:var(--accent1-10);color:var(--accent1);transform:translateY(-50%) rotate(90deg)}
/* Highlight matched text */
.search-hl{background:var(--accent1-10);color:var(--accent1);font-weight:700;padding:0 1px;border-radius:2px;box-shadow:0 0 6px var(--accent1-10)}
/* Filters */
.filters{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap}
.fp{padding:4px 12px;border-radius:14px;font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;transition:all .15s}
.fp:hover{color:rgba(255,255,255,0.4)}

/* Task Cards */
.task-list{display:flex;flex-direction:column;gap:10px}

/* Kanban grouping — Today / This Week / Later / Done columns side-by-side on desktop. */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(280px,1fr));gap:18px;margin-top:8px}
.kc{display:flex;flex-direction:column;gap:10px;min-width:0}
.kc-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px;border-bottom:1px solid var(--card-border);margin-bottom:6px}
.kc-head h3{font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text);display:flex;align-items:baseline}
.kc-head .cn{font-size:12px;font-weight:500;letter-spacing:0.04em;text-transform:none}
.kc-count{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:rgba(255,255,255,0.04);border:1px solid var(--card-border);border-radius:999px;padding:2px 9px;min-width:24px;text-align:center}
.kc[data-col="today"] .kc-head{border-bottom-color:rgba(255,46,136,0.30);box-shadow:0 1px 0 0 rgba(255,46,136,0.12)}
.kc[data-col="today"] .kc-head h3{color:var(--accent1);text-shadow:0 0 8px var(--glow-pink)}
.kc[data-col="week"] .kc-head{border-bottom-color:rgba(0,229,255,0.28)}
.kc[data-col="week"] .kc-head h3{color:var(--accent2);text-shadow:0 0 8px var(--glow-cyan)}
.kc[data-col="later"] .kc-head{border-bottom-color:rgba(192,38,211,0.28)}
.kc[data-col="later"] .kc-head h3{color:var(--accent3);text-shadow:0 0 8px var(--glow-magenta)}
.kc[data-col="done"] .kc-head{border-bottom-color:rgba(255,214,0,0.24)}
.kc[data-col="done"] .kc-head h3{color:var(--yellow);text-shadow:0 0 8px rgba(255,214,0,0.30)}
.kc-empty{font-size:12px;font-family:var(--font-mono);color:var(--text-muted);opacity:0.6;padding:24px 8px;text-align:center;border:1px dashed var(--card-border);border-radius:10px;background:rgba(255,255,255,0.015)}
.kc-empty .cn{display:block;margin-top:4px;color:inherit;text-shadow:none;opacity:0.7}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}}
@media(max-width:640px){.kanban{grid-template-columns:1fr;gap:12px}}
.tc{position:relative;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--card-border);border-radius:14px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;transition:transform .25s var(--ease),border-color .25s var(--ease),box-shadow .35s var(--ease),opacity .35s var(--ease)}
.tc:not(.expanded){cursor:pointer}
/* External halo — sits BEHIND the card, same approach as the verdict card */
/* Hover — single-layer neon outline + lift. No filter:blur (GPU-cheap). */
.tc:hover{border-color:var(--accent1);box-shadow:0 8px 20px rgba(0,0,0,0.40),0 0 0 1px var(--accent1-10),0 0 18px var(--accent1-10);transform:translateY(-1px)}
/* Completion — lean CSS-only sequence, no canvas, no filter:blur.
   0–120ms scale pulse → 120–300ms neon ring pulse → 300–700ms fade + slide. */
.tc.celebrating{will-change:transform,opacity;animation:tcCelebrate 700ms var(--ease) forwards;overflow:visible}
.tc.celebrating::after{content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;box-shadow:inset 0 0 0 1px var(--accent1),0 0 18px var(--glow-pink);animation:tcRing 700ms var(--ease) forwards;z-index:4}
.tc.celebrating .ck{background:var(--accent1);border-color:var(--accent1);color:#fff;box-shadow:0 0 12px var(--glow-pink);animation:ckPop .25s var(--ease) forwards}
@keyframes tcCelebrate{
  0%{transform:translateY(-1px) scale(1);opacity:1}
  18%{transform:scale(0.985);opacity:1}
  35%{transform:scale(1.012);opacity:1}
  55%{transform:scale(1) translateX(0);opacity:1}
  100%{transform:scale(1) translateX(8px);opacity:0.55}
}
@keyframes tcRing{
  0%{opacity:0}
  18%{opacity:1}
  60%{opacity:1}
  100%{opacity:0}
}
@keyframes ckPop{
  0%{transform:scale(1)}
  45%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
/* Completion particles — spawned via JS, each carries its own --angle/--dist/--sz */
.celeb-spark{position:absolute;top:20px;left:36px;width:var(--sz,6px);height:var(--sz,6px);border-radius:50%;pointer-events:none;z-index:6;opacity:0;will-change:transform,opacity;animation-name:sparkOut;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.celeb-spark.sq{border-radius:1px;transform-origin:center center}
@keyframes sparkOut{
  0%{transform:rotate(var(--angle))translateX(0)scale(0.4);opacity:0}
  18%{transform:rotate(var(--angle))translateX(12px)scale(1.15);opacity:1}
  70%{opacity:0.9}
  100%{transform:rotate(var(--angle))translateX(var(--dist))scale(0)rotate(180deg);opacity:0}
}
/* Fullscreen ring burst — for hard/epic/super_epic completions */
.celeb-ring{position:fixed;top:50%;left:50%;width:60px;height:60px;border-radius:50%;border:2px solid var(--accent1);margin:-30px 0 0 -30px;pointer-events:none;z-index:9999;will-change:transform,opacity;animation-name:celebRing;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.22,1,.36,1);opacity:0}
@keyframes celebRing{
  0%{transform:scale(0);opacity:0.95}
  100%{transform:scale(28);opacity:0}
}
/* SUPER EPIC flash badge */
.celeb-flash{position:absolute;top:-32px;right:8px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#7c9cff,#9d8cff,#5ec2d6);background-size:200% 200%;-webkit-background-clip:padding-box;background-clip:padding-box;padding:5px 12px;border-radius:999px;pointer-events:none;z-index:8;box-shadow:0 0 18px var(--glow-pink);will-change:transform,opacity;animation:celebFlash 900ms cubic-bezier(.16,1,.3,1) forwards}
@keyframes celebFlash{
  0%{transform:translateY(8px)scale(0.6);opacity:0}
  20%{transform:translateY(0)scale(1.08);opacity:1}
  35%{transform:translateY(-4px)scale(1)}
  80%{opacity:1;transform:translateY(-10px)scale(1)}
  100%{transform:translateY(-22px)scale(0.96);opacity:0}
}
/* Centered encouragement word — randomized text + points sub */
.celeb-word{position:fixed;top:38%;left:50%;font-family:var(--font-en);font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:-0.02em;text-align:center;background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 24px var(--glow-pink);pointer-events:none;z-index:9998;will-change:transform,opacity;animation:celebWord 1.2s cubic-bezier(.16,1,.3,1) forwards;line-height:1.0;white-space:nowrap}
.celeb-word .sub{display:block;font-size:0.30em;font-weight:600;letter-spacing:0.20em;text-transform:uppercase;color:var(--text-muted);-webkit-text-fill-color:var(--text-muted);background:none;margin-top:6px;text-shadow:none}
.celeb-word-easy{background:linear-gradient(135deg,#4ade80,#86efac);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 18px rgba(74,222,128,0.5)}
.celeb-word-hard{background:linear-gradient(135deg,#f97316,#fbbf24);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 22px rgba(249,115,22,0.5)}
.celeb-word-epic{background:linear-gradient(135deg,#7c9cff,#9d8cff,#5ec2d6);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 26px var(--glow-pink)}
.celeb-word-super_epic{background:linear-gradient(135deg,#7c9cff,#fbbf24,#5ec2d6,#9d8cff);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;text-shadow:0 0 32px var(--glow-pink);font-size:clamp(36px,6.5vw,72px);animation:celebWord 1.5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes celebWord{
  0%{opacity:0;transform:translate(-50%,-30%)scale(0.6)}
  18%{opacity:1;transform:translate(-50%,-50%)scale(1.12)}
  32%{transform:translate(-50%,-50%)scale(1)}
  75%{opacity:1;transform:translate(-50%,-55%)scale(1)}
  100%{opacity:0;transform:translate(-50%,-68%)scale(0.94)}
}
/* Reduced motion: keep the card ring + scale but skip particle bursts entirely */
@media (prefers-reduced-motion: reduce){
  .celeb-spark,.celeb-ring,.celeb-flash,.celeb-word{display:none}
}
/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;animation:emptyIn .5s var(--ease)}
@keyframes emptyIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.empty-mascot{font-size:64px;line-height:1;animation:emptyBob 4s ease-in-out infinite;filter:grayscale(0.3) brightness(0.85);opacity:0.8}
@keyframes emptyBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(3deg)}}
.empty-bubble{margin-top:18px;padding:10px 18px;border-radius:18px;font-size:12px;font-weight:600;letter-spacing:0.5px;color:var(--text-body);background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--accent1-10);position:relative}
.empty-bubble::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--card);border-left:1px solid var(--accent1-10);border-top:1px solid var(--accent1-10)}
.tc.done{opacity:.3}
.tc.done .tt{text-decoration:line-through;color:var(--text-muted)}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:2px;border:2px solid rgba(255,255,255,0.18);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease);color:transparent;font-size:12px}
.ck:hover{border-color:var(--accent1);background:var(--accent1-10);box-shadow:0 0 10px var(--accent1-10)}
.tc.done .ck{border-color:var(--accent1);background:var(--accent1);color:#fff}
.tb{flex:1;min-width:0}
.tt{font-size:14px;font-weight:500;color:var(--text);line-height:1.4;cursor:pointer}
.t-notes{font-size:11px;color:rgba(168,164,184,0.5);margin-top:2px;white-space:pre-wrap}
.tm{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;align-items:center}
.pd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pd.high{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,0.4)}
.pd.medium{background:var(--purple);box-shadow:0 0 4px rgba(139,92,246,0.3)}
.pd.low{background:var(--gray)}
.cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:10px}
.cat.work{background:var(--cat-work-bg);color:var(--cat-work-fg)}
.cat.personal{background:var(--cat-pers-bg);color:var(--cat-pers-fg)}
.cat.project{background:var(--cat-proj-bg);color:var(--cat-proj-fg)}
.cat.rfi{background:rgba(251,191,36,0.14);color:#fbbf24;font-weight:800}

/* ── From field + Focus mode + Requester pills ───────────────────── */
.from-input{background:transparent;border:1px dashed var(--card-border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text-body);min-width:0;width:130px;outline:none;transition:border-color .15s ease;margin-left:auto}
.from-input::placeholder{color:var(--text-muted);opacity:0.6}
.from-input:hover,.from-input:focus{border-color:var(--card-hover);border-style:solid}
.focus-btn{background:var(--card);border:1px solid var(--card-border);color:var(--text-muted);padding:6px 12px;border-radius:100px;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;transition:all .15s ease}
.focus-btn:hover{border-color:var(--card-hover);color:var(--text-body)}
.focus-btn.on{background:var(--accent1);color:#fff;border-color:var(--accent1);box-shadow:0 0 12px var(--accent1-10)}
.req-strip{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px;padding:0 2px;align-items:center}
.req-strip-label{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);margin-right:4px}
.req-pill{background:var(--card);border:1px solid var(--card-border);color:var(--text-body);padding:4px 10px;border-radius:100px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.req-pill:hover{border-color:var(--card-hover)}
.req-pill.active{background:var(--accent1);color:#fff;border-color:var(--accent1)}
.req-pill .cnt{opacity:.65;font-size:10px;font-weight:700}
.req-pill.active .cnt{opacity:1}
.t-from{font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:.03em}
.t-from::before{content:'from ';opacity:0.6}

/* ── RFI sub-tabs + dashboard ────────────────────────────────────── */
.rfi-subnav{display:flex;gap:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--card-border);border-radius:100px;padding:4px;width:fit-content}
.rfi-subnav button{background:transparent;border:none;color:var(--text-muted);font-size:12px;font-weight:700;padding:8px 20px;border-radius:100px;cursor:pointer;transition:all .15s ease;letter-spacing:.04em;font-family:inherit}
.rfi-subnav button:hover{color:var(--text-body)}
.rfi-subnav button.active{background:rgba(251,191,36,0.18);color:#fbbf24;box-shadow:inset 0 0 0 1px rgba(251,191,36,0.3)}

.rfi-hero{background:linear-gradient(135deg,rgba(251,191,36,0.12),rgba(251,191,36,0.02));border:1px solid rgba(251,191,36,0.3);border-radius:14px;padding:20px 24px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.rfi-hero-big{display:flex;flex-direction:column;gap:6px}
.rfi-hero-lbl{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#fbbf24}
.rfi-hero-val{font-size:54px;font-weight:200;color:var(--text);letter-spacing:-.04em;line-height:1}
.rfi-hero-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.rfi-hero-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rfi-hero-mini-card{background:rgba(0,0,0,0.15);border:1px solid var(--card-border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.rfi-hero-mini-val{font-size:22px;font-weight:300;color:var(--text);line-height:1}
.rfi-hero-mini-val.sent{color:#34d399}
.rfi-hero-mini-val.danger{color:#ef4444}
.rfi-hero-mini-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}

.rfi-panel{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.rfi-panel h3{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px}

.rfi-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.rfi-two-col .rfi-panel{margin-bottom:0}

.rfi-leader{display:flex;flex-direction:column;gap:8px}
.rfi-leader-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.rfi-leader-name{font-size:13px;color:var(--text);font-weight:600}
.rfi-leader-bar{background:rgba(255,255,255,0.04);border-radius:4px;height:6px;width:100%;overflow:hidden;grid-column:1/-1;margin-top:2px}
.rfi-leader-bar-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:4px;transition:width .3s}
.rfi-leader-stat{font-size:11px;color:var(--text-muted);font-family:'SF Mono',Menlo,Consolas,monospace}
.rfi-leader-stat .pct{color:#fbbf24;font-weight:700}

.rfi-activity{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.rfi-activity-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:12px;transition:background .15s ease}
.rfi-activity-row:hover{background:var(--card-hover)}
.rfi-activity-dot{width:8px;height:8px;border-radius:50%}
.rfi-activity-dot.sent{background:#34d399;box-shadow:0 0 6px rgba(52,211,153,0.4)}
.rfi-activity-dot.closed{background:#fbbf24;box-shadow:0 0 6px rgba(251,191,36,0.4)}
.rfi-activity-dot.opened{background:var(--accent1);box-shadow:0 0 6px var(--accent1-10)}
.rfi-activity-text{min-width:0}
.rfi-activity-action{font-weight:700;color:var(--text-body);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.rfi-activity-body{color:var(--text);font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfi-activity-when{font-size:10px;color:var(--text-muted);font-family:'SF Mono',Menlo,Consolas,monospace;white-space:nowrap}

.rfi-week-bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:80px;margin-top:8px}
.rfi-week-bar{background:linear-gradient(180deg,rgba(52,211,153,0.7),rgba(52,211,153,0.2));border-radius:4px 4px 0 0;min-height:2px;position:relative;transition:all .2s ease}
.rfi-week-bar:hover{background:linear-gradient(180deg,rgba(52,211,153,0.9),rgba(52,211,153,0.4))}
.rfi-week-bar[data-count="0"]{background:rgba(255,255,255,0.04)}
.rfi-week-labels{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:4px;font-size:9px;color:var(--text-muted);text-align:center;letter-spacing:.05em}

.rfi-aging{display:flex;flex-direction:column;gap:8px}
.rfi-aging-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;background:var(--card-hover);border-radius:8px;font-size:12px;transition:background .15s ease,border-color .15s ease}
.rfi-aging-row:hover{background:var(--accent1-10)}
.rfi-aging-row.old{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2)}
.rfi-aging-row.old:hover{background:rgba(239,68,68,0.14)}
.rfi-aging-row .rfi-aging-main{display:contents;cursor:pointer}
.rfi-aging-num{font-family:'SF Mono',Menlo,Consolas,monospace;font-weight:800;font-size:11px;color:#fbbf24}
.rfi-aging-title{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rfi-aging-days{font-size:11px;color:var(--text-muted);font-family:'SF Mono',Menlo,Consolas,monospace;white-space:nowrap}
.rfi-aging-days.old{color:#ef4444;font-weight:700}
.rfi-aging-actions{display:flex;gap:4px;align-items:center}
.rfi-inline-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:4px 8px;border-radius:6px;border:1px solid transparent;background:rgba(255,255,255,0.04);color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .15s ease;white-space:nowrap;min-height:24px}
.rfi-inline-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.rfi-inline-btn.send{color:#34d399}
.rfi-inline-btn.send:hover{background:rgba(52,211,153,0.12);border-color:rgba(52,211,153,0.35);color:#34d399}
.rfi-inline-btn.send.on{background:rgba(52,211,153,0.14);border-color:rgba(52,211,153,0.35);color:#34d399}
.rfi-inline-btn.close{color:#a0a0b0}
.rfi-inline-btn.close:hover{background:rgba(139,92,246,0.14);border-color:rgba(139,92,246,0.35);color:var(--accent1)}
.rfi-inline-btn svg{width:12px;height:12px}
.rfi-urgent-actions{display:flex;gap:6px}
.rfi-triage-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border:1px solid var(--card-border);border-radius:999px;font-size:11px;font-weight:600;color:var(--text);letter-spacing:.02em}
.rfi-triage-dot{width:8px;height:8px;border-radius:50%;background:var(--accent1)}
.rfi-triage-dot.tosend{background:#fbbf24}
.rfi-triage-dot.awaiting{background:#34d399}
.rfi-triage-dot.overdue{background:#ef4444}
.rfi-triage-chip button{background:transparent;border:0;color:var(--text-muted);font-size:14px;line-height:1;cursor:pointer;padding:0 2px;margin-left:2px}
.rfi-triage-chip button:hover{color:var(--text)}
.rfi-hero-mini-card{transition:border-color .15s ease,transform .15s ease,background .15s ease}
.rfi-hero-mini-card:hover{border-color:var(--card-hover);transform:translateY(-1px);background:rgba(0,0,0,0.25)}

/* ── RFI view ─────────────────────────────────────────────────────── */
.rfi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.rfi-head h2{font-size:20px;font-weight:300;letter-spacing:.04em;color:var(--text);margin:0}
.rfi-head-mid{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rfi-new{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.4);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s ease;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.rfi-new:hover{background:rgba(251,191,36,0.22);transform:translateY(-1px)}

/* Dashboard cards */
.rfi-dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.rfi-dash-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s ease}
.rfi-dash-card:hover{border-color:var(--card-hover)}
.rfi-dash-card.accent{background:linear-gradient(135deg,rgba(251,191,36,0.08),rgba(251,191,36,0.02));border-color:rgba(251,191,36,0.25)}
.rfi-dash-card.sent{background:linear-gradient(135deg,rgba(52,211,153,0.08),rgba(52,211,153,0.02));border-color:rgba(52,211,153,0.25)}
.rfi-dash-card.danger{background:linear-gradient(135deg,rgba(239,68,68,0.1),rgba(239,68,68,0.02));border-color:rgba(239,68,68,0.25)}
.rfi-dash-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}
.rfi-dash-val{font-size:26px;font-weight:300;color:var(--text);letter-spacing:-.02em;line-height:1}
.rfi-dash-card.accent .rfi-dash-val{color:#fbbf24}
.rfi-dash-card.sent .rfi-dash-val{color:#34d399}
.rfi-dash-card.danger .rfi-dash-val{color:#ef4444}
.rfi-dash-sub{font-size:10px;color:var(--text-muted);margin-top:2px}

.rfi-urgent{background:linear-gradient(135deg,rgba(251,191,36,0.08),rgba(251,191,36,0.02));border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rfi-urgent-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#fbbf24}
.rfi-urgent-body{flex:1;min-width:0}
.rfi-urgent-title{font-size:13px;color:var(--text);font-weight:600}
.rfi-urgent-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.rfi-urgent-cta{background:rgba(251,191,36,0.18);color:#fbbf24;border:1px solid rgba(251,191,36,0.4);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s ease;letter-spacing:.04em;text-transform:uppercase}
.rfi-urgent-cta:hover{background:rgba(251,191,36,0.25)}

.rfi-recipients{margin-bottom:14px}
.rfi-recipients-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;display:block}
.rfi-rec-pills{display:flex;gap:6px;flex-wrap:wrap}
.rfi-rec-pill{background:var(--card);border:1px solid var(--card-border);color:var(--text-body);padding:4px 10px;border-radius:100px;font-size:11px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:all .15s ease}
.rfi-rec-pill:hover{border-color:var(--card-hover);color:var(--text)}
.rfi-rec-pill.active{background:rgba(251,191,36,0.18);color:#fbbf24;border-color:rgba(251,191,36,0.4)}
.rfi-rec-pill .cnt{opacity:.65;font-size:10px;font-weight:700}

/* Card grid */
.rfi-list{display:flex;flex-direction:column;gap:10px}
.rfi-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:all .15s ease;border-left:3px solid #fbbf24}
.rfi-card:hover{border-color:var(--card-hover);box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.rfi-card.sent{border-left-color:#34d399}
.rfi-card.done{border-left-color:#34d399;opacity:.6}
.rfi-card.done .rfi-subj-input{text-decoration:line-through;color:var(--text-muted)}

.rfi-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rfi-num-badge{background:rgba(251,191,36,0.14);color:#fbbf24;padding:4px 10px;border-radius:8px;font-weight:800;font-size:12px;letter-spacing:.04em;font-family:'SF Mono',Menlo,Consolas,monospace;flex-shrink:0}
.rfi-num-input{background:transparent;border:none;color:inherit;font:inherit;width:78px;outline:none;letter-spacing:.04em}
.rfi-num-input:focus{background:rgba(255,255,255,0.05);border-radius:4px}
.rfi-subj-input{flex:1;min-width:150px;background:transparent;border:none;color:var(--text);font:500 14px/1.4 inherit;padding:4px 0;outline:none;border-bottom:1px dashed transparent}
.rfi-subj-input:hover,.rfi-subj-input:focus{border-bottom-color:var(--card-border)}
.rfi-subj-input::placeholder{color:var(--text-muted);font-style:italic;opacity:.6}

.rfi-status-group{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rfi-sent-toggle{display:inline-flex;align-items:center;gap:5px;background:var(--card-hover);padding:4px 10px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:1px solid transparent;transition:all .15s ease;color:var(--text-muted);user-select:none}
.rfi-sent-toggle:hover{border-color:var(--card-border)}
.rfi-sent-toggle.on{background:rgba(52,211,153,0.15);color:#34d399;border-color:rgba(52,211,153,0.4)}
.rfi-sent-toggle input{display:none}

.rfi-desc{background:rgba(0,0,0,0.15);border:1px solid var(--card-border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-body);line-height:1.45;width:100%;resize:vertical;min-height:36px;max-height:200px;outline:none;font-family:inherit;transition:border-color .15s ease}
.rfi-desc:focus{border-color:var(--card-hover)}
.rfi-desc::placeholder{color:var(--text-muted);font-style:italic;opacity:.5}

.rfi-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px}
.rfi-meta-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px dashed var(--card-border);color:var(--text-muted);padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer;transition:all .15s ease;font-family:inherit}
.rfi-meta-btn:hover{border-color:var(--card-hover);color:var(--text-body);border-style:solid}
.rfi-meta-btn.has-val{color:var(--text);border-style:solid;border-color:var(--card-hover)}
.rfi-meta-btn.overdue{color:#ef4444;border-color:rgba(239,68,68,0.4)}
.rfi-sendto-input{background:transparent;border:none;color:inherit;font:inherit;outline:none;min-width:60px;width:auto}

.rfi-actions{display:flex;gap:4px;margin-left:auto}
.rfi-actions button{background:transparent;border:1px solid transparent;color:var(--text-muted);font-size:13px;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .15s ease}
.rfi-actions button:hover{background:var(--card-hover);color:var(--text);border-color:var(--card-border)}
.rfi-actions button.rfi-del:hover{color:#ef4444;border-color:rgba(239,68,68,0.3)}

.rfi-empty{padding:50px 20px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--card);border:1px dashed var(--card-border);border-radius:12px}

@media (max-width:620px){
  .rfi-dash{grid-template-columns:repeat(2,1fr)}
  .rfi-top{gap:6px}
  .rfi-num-input{width:70px}
}
.dl{font-size:10px;color:var(--text-muted)}
.dl.od{color:var(--red)}
.ta{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .2s}
.tc:hover .ta{opacity:1}
.tab{width:26px;height:26px;border-radius:8px;border:none;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.25);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tab:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5)}
.tab.del:hover{background:rgba(239,68,68,0.08);color:var(--red)}

/* Expand — inline edit form. Styled to match the polished card aesthetic
   (every control gets the same neon-accent treatment; no raw browser inputs). */
.tex{margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--accent1-10);
  background:rgba(255,46,136,0.035);display:flex;flex-direction:column;gap:9px}
.tc.expanded{border-color:var(--accent1-10);box-shadow:0 0 0 1px var(--accent1-10),0 0 16px var(--accent1-10)}
.tex textarea,.tex-title,
.tex-row select,.tex-row input{
  background:rgba(255,255,255,0.04);border:1px solid var(--card-border);border-radius:9px;
  padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);box-sizing:border-box}
.tex textarea:focus,.tex-title:focus,
.tex-row select:focus,.tex-row input:focus{
  border-color:var(--accent1);box-shadow:0 0 0 2px var(--accent1-10)}
.tex textarea{width:100%;resize:vertical;min-height:56px;line-height:1.45}
.tex-title{width:100%;font-size:14px;font-weight:600}
.tex-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;align-items:center}
.tex-row select,.tex-row input{width:100%;min-height:34px;cursor:pointer}
.tex-row input[type="text"]{cursor:text}
.tex-row select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) center,calc(100% - 9px) center;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}

/* Dashboard Metrics */
.dash{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.dash-card.proud::before{opacity:.85!important;animation:proudPulse 2.8s ease-in-out infinite}
@keyframes proudPulse{0%,100%{opacity:.55}50%{opacity:1}}
.dash-card{position:relative;background:linear-gradient(135deg,var(--panel-1),var(--panel-2));backdrop-filter:blur(12px);border:1.5px solid transparent;background-clip:padding-box;border-radius:14px;padding:14px 12px;text-align:center;transition:transform .35s var(--ease),box-shadow .55s var(--ease)}
/* Gradient border ring */
.dash-card::before{content:'';position:absolute;inset:-1.5px;border-radius:14px;padding:1.5px;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:0.35;transition:opacity .35s}
/* External halo glow — matches verdict-card style */
.dash-card::after{content:'';position:absolute;inset:-10px;border-radius:22px;background:radial-gradient(ellipse at center,var(--accent1) 0%,transparent 60%);opacity:0;filter:blur(24px);transition:opacity .55s var(--ease);pointer-events:none;z-index:-1}
.dash-card:hover::after{opacity:.35}
.dash-card:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(0,0,0,0.35),0 0 40px var(--accent1-10),0 0 80px var(--accent1-06)}
.dash-card:hover::before{opacity:0.95}
.dash-val{font-size:26px;font-weight:900;line-height:1;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 12px var(--accent1-10))}
.dash-val.green{background:linear-gradient(135deg,#34d399,var(--accent1),#34d399);-webkit-background-clip:text;background-clip:text}
.dash-label{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-top:4px}
.dash-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.04);margin-top:8px;overflow:hidden}
.dash-bar-fill{height:100%;border-radius:2px;transition:width .6s var(--ease)}
/* Streak / Stats row */
.stat-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-chip{position:relative;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;flex:1 1 170px;min-width:0;overflow:hidden;transition:transform .35s var(--ease),box-shadow .55s var(--ease),border-color .35s var(--ease)}
/* External halo matching dash-card / verdict-card */
.stat-chip::before{content:'';position:absolute;inset:-8px;border-radius:18px;background:radial-gradient(ellipse at center,var(--accent1) 0%,transparent 60%);opacity:0;filter:blur(20px);transition:opacity .55s var(--ease);pointer-events:none;z-index:-1}
.stat-chip:hover::before{opacity:.3}
.stat-chip:hover{border-color:var(--accent1);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3),0 0 32px var(--accent1-10),0 0 64px var(--accent1-06)}
.stat-emoji{font-size:18px;filter:grayscale(0.5) brightness(0.8);opacity:0.6;transition:all .3s var(--ease);animation:statPulse 6s ease-in-out infinite}
.stat-chip:hover .stat-emoji{filter:grayscale(0) brightness(1);opacity:1;transform:scale(1.15)}
@keyframes statPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.stat-info{display:flex;flex-direction:column;min-width:0;flex:1;overflow:hidden}
.stat-val{font-size:14px;font-weight:800;color:var(--text);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-desc{font-size:8px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{margin-top:24px;text-align:center;font-size:10px;color:var(--card-hover);letter-spacing:0.6px;font-weight:600}
@media(max-width:720px){.dash{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.dash{grid-template-columns:repeat(2,1fr)}}

/* Alfred Sidebar */
#alfredToggle{position:fixed;right:0;top:50%;z-index:99;transform:translateY(-50%);width:36px;height:72px;background:var(--card-border);backdrop-filter:blur(16px);border:1px solid var(--card-hover);border-right:none;border-radius:10px 0 0 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:0 0 20px rgba(139,92,246,0.04)}
#alfredToggle:hover{background:var(--card-hover);border-color:rgba(139,92,246,0.3)}
#alfredSidebar{position:fixed;top:0;right:0;bottom:0;width:340px;z-index:100;background:var(--sidebar-bg);backdrop-filter:blur(24px);border-left:1px solid var(--accent1-06);transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,0.3)}
#alfredSidebar.open{transform:translateX(0)}
@media(max-width:640px){#alfredSidebar{width:100vw}}
.ah{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--accent1-06)}
.ah-t{font-size:10px;font-weight:700;letter-spacing:.25em;color:var(--card-hover)}
.ah-x{background:none;border:none;color:rgba(255,255,255,0.15);cursor:pointer;font-size:18px}.ah-x:hover{color:rgba(255,255,255,0.4)}
.ab{height:130px;background:rgba(6,6,16,0.8);border-bottom:1px solid rgba(139,92,246,0.04);position:relative;overflow:hidden}
#alfBrain{width:100%;height:100%;display:block;box-shadow:inset 0 0 40px var(--accent1-06)}
.am-wrap{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px;scrollbar-width:thin}
.am{padding:7px 11px;border-radius:10px;font-size:12px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap;animation:mi .3s var(--ease) both;position:relative}
@keyframes mi{from{opacity:0;transform:translateY(4px)}}
.am.u{background:var(--card-border);color:rgba(232,230,240,0.7);max-width:80%;margin-left:auto;border:1px solid var(--accent1-10)}
/* Alfred — plain text, futuristic font, no bubble */
.am.ai{color:var(--text);font-family:var(--font-en);font-weight:400;font-size:13px;line-height:1.6;letter-spacing:-.1px;background:none;border:none;padding:6px 4px 8px;max-width:100%}
.am.ai p{margin:0 0 6px}
.am.ai p:last-child{margin-bottom:0}
.am.ai strong{color:var(--text);font-weight:700;letter-spacing:-.2px}
.am.ai em{color:var(--accent1);font-style:italic}
.am.ai code{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:11px;color:var(--accent1);background:var(--accent1-06);padding:1px 5px;border-radius:4px}
.am.ai pre{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:11px;color:var(--text);background:rgba(0,0,0,0.22);border-left:2px solid var(--accent1);padding:8px 10px;margin:6px 0;overflow-x:auto;border-radius:4px}
.am.ai pre code{background:none;padding:0;color:inherit}
.am.ai ul,.am.ai ol{margin:4px 0 6px 18px;padding:0}
.am.ai li{margin:2px 0}
.am.ai ul li{list-style:disc}
.am.ai ol li{list-style:decimal}
.am.ai ul li::marker,.am.ai ol li::marker{color:var(--accent1)}
.am.ai h3,.am.ai h4{color:var(--text);font-weight:700;font-size:14px;margin:8px 0 4px;letter-spacing:-.3px}
.am.ai h3:first-child,.am.ai h4:first-child{margin-top:0}
.am.ai a{color:var(--accent2);text-decoration:none;border-bottom:1px solid var(--accent1-10)}
.am.ai a:hover{border-bottom-color:var(--accent1)}
.am.ai hr{border:none;border-top:1px solid var(--card-border);margin:8px 0}
/* Word-by-word reveal animation during streaming — opacity+transform only for cheap compositing */
.alf-word{display:inline-block;white-space:pre}
.alf-word.reveal{animation:alfWord .55s cubic-bezier(0.16,1,0.3,1) both}
@keyframes alfWord{0%{opacity:0;transform:translate3d(0,5px,0)}100%{opacity:1;transform:translate3d(0,0,0)}}
/* Streaming caret */
.am.ai .alf-caret{display:inline-block;width:2px;height:1em;margin-left:2px;background:var(--accent1);vertical-align:text-bottom;animation:alfCaret 1s ease-in-out infinite;border-radius:1px;box-shadow:0 0 8px var(--accent1)}
@keyframes alfCaret{0%,100%{opacity:.15}50%{opacity:1}}
/* Thinking dots — shown before first token */
.alf-dots{display:inline-flex;gap:5px;align-items:center;padding:3px 2px}
.alf-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent1);box-shadow:0 0 8px var(--accent1-10);animation:alfDot 1.3s ease-in-out infinite}
.alf-dots span:nth-child(2){animation-delay:.15s}
.alf-dots span:nth-child(3){animation-delay:.3s}
@keyframes alfDot{0%,70%,100%{opacity:.25;transform:translateY(0) scale(.8)}35%{opacity:1;transform:translateY(-5px) scale(1)}}
.ai-row{padding:10px 12px;display:flex;gap:8px;border-top:1px solid rgba(139,92,246,0.04);background:rgba(10,10,20,0.8)}
.ai-row input{flex:1;background:rgba(255,255,255,0.02);border:1px solid var(--accent1-06);border-radius:10px;padding:10px 14px;font-size:12px;color:rgba(232,230,240,0.7);outline:none}
.ai-row input::placeholder{color:var(--card-hover)}
.ai-row input:focus{border-color:var(--card-hover)}
.ai-send{padding:10px 14px;border-radius:10px;background:var(--accent1-06);color:rgba(139,92,246,0.35);border:1px solid var(--card-border);font-weight:700;font-size:12px;cursor:pointer;transition:all .2s}
.ai-send:hover{background:var(--card-hover);color:rgba(139,92,246,0.5)}

/* Blackjack Sidebar */
#bjToggle{position:fixed;left:0;top:50%;z-index:99;transform:translateY(-50%);width:36px;height:72px;background:rgba(236,72,153,0.08);backdrop-filter:blur(16px);border:1px solid rgba(236,72,153,0.15);border-left:none;border-radius:0 10px 10px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
#bjToggle:hover{background:rgba(236,72,153,0.15);border-color:rgba(236,72,153,0.3)}
#bjPanel{position:fixed;top:0;left:0;bottom:0;width:320px;z-index:100;background:rgba(17,17,34,0.95);backdrop-filter:blur(20px);border-right:1px solid rgba(236,72,153,0.06);transform:translateX(-100%);transition:transform .35s var(--ease);display:flex;flex-direction:column}
#bjPanel.open{transform:translateX(0)}
@media(max-width:640px){#bjPanel{width:100vw}}
.bj-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(236,72,153,0.04),transparent 70%)}
.bj-head{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 14px;border-bottom:1px solid rgba(236,72,153,0.06)}
.bj-title{font-size:10px;font-weight:700;letter-spacing:.2em;color:rgba(236,72,153,0.25)}
.bj-card-w{display:inline-block;perspective:600px;margin:3px}
.bj-card{width:48px;height:66px;border-radius:8px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;transform-style:preserve-3d;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.bj-card.r{background:linear-gradient(145deg,#1a1520,#12101a);color:#ff4d6a;border:1px solid rgba(255,77,106,0.12)}
.bj-card.b{background:linear-gradient(145deg,#1a1a22,#12121a);color:#d4d0e0;border:1px solid rgba(255,255,255,0.06)}
.bj-card.h{background:linear-gradient(145deg,#1a1028,#0d0818);color:transparent;border:1px solid var(--card-hover)}
.bj-card.h::after{content:'Y';font-size:16px;color:var(--accent1-10);font-weight:900}
@keyframes bjIn{from{opacity:0;transform:translateX(-80px) rotate(-12deg)}to{opacity:1;transform:none}}
.bj-deal{animation:bjIn .6s var(--ease) both}
.bj-score{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);margin:4px 0}
.bj-label{font-size:8px;font-weight:600;letter-spacing:0.6px;color:rgba(255,255,255,0.15);text-transform:uppercase}
.bj-result{font-size:16px;font-weight:900;letter-spacing:0.6px;margin:8px 0;min-height:24px}
.bj-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.bj-btn{padding:6px 16px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.3);cursor:pointer;transition:all .15s}
.bj-btn:hover{color:rgba(255,255,255,0.6);border-color:rgba(255,255,255,0.12)}
.bj-btn.deal{background:rgba(236,72,153,0.1);border-color:rgba(236,72,153,0.2);color:var(--pink)}
.bj-btn.deal:hover{background:rgba(236,72,153,0.18)}
.bj-chips{display:flex;align-items:center;gap:8px;margin-top:12px}
.bj-chips-val{font-size:14px;font-weight:800;color:var(--pink)}
.bj-bet-ctrl{display:flex;align-items:center;gap:4px}
.bj-bet-btn{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.bj-bet-val{font-size:12px;font-weight:700;color:var(--purple);min-width:28px;text-align:center}

/* Tabs */
.tab-btn{padding:5px 14px;border-radius:16px;font-size:10px;font-weight:600;border:none;cursor:pointer;transition:all .2s var(--ease);background:transparent;color:rgba(255,255,255,0.5)}
.tab-btn:hover{color:rgba(255,255,255,0.5)}
.tab-btn.active{background:var(--accent1-10);color:var(--accent1)}
.view{display:none}.view.active{display:block}

/* Calendar */
.cal-wrap{max-width:780px;margin:0 auto;padding:20px 20px 100px;position:relative;z-index:1}
.cal-wrap::before{content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:640px;height:640px;max-width:120%;background:radial-gradient(circle,var(--accent1-10) 0%,transparent 60%);pointer-events:none;z-index:-1}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:10px 16px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--card-border);border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,0.2),0 0 28px var(--accent1-06)}
.cal-month{font-size:20px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cal-arrow{width:36px;height:36px;border-radius:12px;border:1px solid var(--card-border);background:var(--accent1-06);color:var(--accent1);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .25s var(--ease)}
.cal-arrow:hover{background:var(--accent1-10);border-color:var(--accent1);box-shadow:0 0 16px var(--accent1-10);transform:scale(1.05)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day-head{text-align:center;font-size:9px;font-weight:800;color:var(--accent1);text-transform:uppercase;letter-spacing:2px;padding:6px 0;opacity:.7}
.cal-day{position:relative;background:linear-gradient(160deg,var(--card),rgba(0,0,0,0.12));backdrop-filter:blur(10px);border:1px solid var(--card-border);border-radius:14px;min-height:92px;padding:8px;cursor:pointer;transition:transform .35s var(--ease),border-color .35s var(--ease),box-shadow .45s var(--ease);overflow:hidden;--cmx:50%;--cmy:50%}
/* Aurora glow layer — cursor tracked via JS */
.cal-day::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(180px circle at var(--cmx) var(--cmy),var(--accent1-10),transparent 60%);opacity:0;transition:opacity .4s var(--ease);pointer-events:none;mix-blend-mode:screen}
.cal-day:hover::before{opacity:1}
/* Subtle shimmer sheen on hover */
.cal-day::after{content:'';position:absolute;top:0;bottom:0;left:-80%;width:60%;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0.06) 50%,transparent 70%);pointer-events:none;opacity:0;transition:opacity .3s var(--ease)}
.cal-day:hover::after{opacity:1;animation:hoverSheen 1.2s var(--ease)}
.cal-day>*{position:relative;z-index:2}
.cal-day:hover{border-color:var(--accent1);transform:translateY(-3px) scale(1.02);box-shadow:0 12px 30px rgba(0,0,0,0.35),0 0 30px var(--accent1-10),inset 0 1px 0 rgba(255,255,255,0.06)}
.cal-day.today{border-color:var(--accent1);background:linear-gradient(160deg,var(--accent1-10),rgba(0,0,0,0.15));box-shadow:0 0 22px var(--accent1-10),inset 0 0 0 1px var(--accent1-10);animation:calTodayPulse 3.5s ease-in-out infinite}
@keyframes calTodayPulse{0%,100%{box-shadow:0 0 22px var(--accent1-10),inset 0 0 0 1px var(--accent1-10)}50%{box-shadow:0 0 32px var(--accent1-10),0 0 56px var(--accent1-06),inset 0 0 0 1px var(--card-hover)}}
.cal-day.other{opacity:.3;filter:saturate(.5)}
.cal-num{font-size:13px;font-weight:800;color:var(--text-muted);margin-bottom:3px;display:inline-block;line-height:1}
.cal-day.today .cal-num{color:var(--accent1);text-shadow:0 0 12px var(--accent1-10);font-size:15px}
.cal-day[data-done="1"]{box-shadow:inset 0 0 18px var(--accent1-10),0 4px 16px rgba(0,0,0,0.2)}
.cal-day[data-done="2"]{box-shadow:inset 0 0 24px var(--accent1-10),inset 0 0 8px var(--card-hover),0 4px 18px rgba(0,0,0,0.22)}
.cal-day[data-done="3"]{box-shadow:inset 0 0 30px var(--accent1-10),inset 0 0 14px var(--card-hover),0 0 18px var(--accent1-10),0 6px 22px rgba(0,0,0,0.25);border-color:var(--accent1);animation:calHotPulse 2.6s ease-in-out infinite}
@keyframes calHotPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12) saturate(1.15)}}
/* Mini task dots row at bottom of day cell */
.cal-dots{display:flex;gap:3px;position:absolute;bottom:6px;left:8px;right:8px;flex-wrap:wrap}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent1);box-shadow:0 0 6px var(--accent1);opacity:.8}
.cal-dot.work{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
.cal-dot.personal{background:var(--accent1);box-shadow:0 0 6px var(--accent1)}
.cal-dot.project{background:var(--accent3);box-shadow:0 0 6px var(--accent3)}
.cal-dot.done{opacity:.25;box-shadow:none}
.cal-count{position:absolute;top:6px;right:8px;font-size:8px;font-weight:800;color:var(--accent1);background:var(--accent1-10);padding:1px 6px;border-radius:10px;border:1px solid var(--accent1-10);backdrop-filter:blur(4px)}
.cal-count.has-overdue{color:var(--red);background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.3);animation:calOverduePulse 2s ease-in-out infinite}
@keyframes calOverduePulse{0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 12px rgba(239,68,68,0.4)}}
/* Day popup modal */
/* Day modal — immersive popup matching the verdict-card aesthetic */
.day-modal{position:fixed;inset:0;z-index:300;background:radial-gradient(ellipse at center,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.85) 100%);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s var(--ease);padding:20px}
.day-modal::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--accent1-10) 0%,transparent 50%);pointer-events:none}
.day-modal-card{position:relative;background:linear-gradient(160deg,var(--panel-1),var(--panel-2));backdrop-filter:blur(24px);border:1.5px solid transparent;background-clip:padding-box;border-radius:22px;padding:24px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;overflow-x:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.5),0 0 60px var(--accent1-10),0 0 120px var(--accent1-06)}
/* Modal scrolls seamlessly — no visible scrollbar track (still wheel/trackpad scrollable) */
.day-modal-card{scrollbar-width:none}
.day-modal-card::-webkit-scrollbar{width:0;height:0;display:none}
.day-modal-card::before{content:'';position:absolute;inset:-1.5px;border-radius:22px;padding:1.5px;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.5}
.day-modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--card-border);position:relative}
.day-modal-date{font-size:24px;font-weight:900;letter-spacing:-1px;line-height:1;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 12px var(--accent1-10))}
.day-modal-day{font-size:10px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-top:6px}
.day-modal-day .today-pill{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:10px;background:var(--accent1-10);color:var(--accent1);border:1px solid var(--card-hover);font-size:8px;letter-spacing:0.6px}
.day-modal-x{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--card-border);color:rgba(255,255,255,0.5);cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.day-modal-x:hover{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.3);color:var(--red);transform:rotate(90deg)}
/* Stats strip */
.day-modal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.day-stat{background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:12px;padding:10px 8px;text-align:center;transition:all .25s var(--ease)}
.day-stat:hover{border-color:var(--card-hover);transform:translateY(-1px)}
.day-stat-val{font-size:20px;font-weight:900;color:var(--text);line-height:1;letter-spacing:-.5px}
.day-stat-val.accent{background:linear-gradient(135deg,var(--accent1),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.day-stat-val.red{color:var(--red)}
.day-stat-val.done{color:#4ade80}
.day-stat-label{font-size:7px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;margin-top:3px}
.day-modal-empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:12px;animation:emptyIn .4s var(--ease)}
.day-modal-empty-emoji{font-size:48px;opacity:.5;margin-bottom:12px;display:block;animation:emptyBob 4s ease-in-out infinite;filter:grayscale(.3)}
.day-modal-empty-text{font-weight:600;letter-spacing:.3px}
/* Task list inside modal — tighter spacing */
.day-modal-tasks{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
/* Inline add-task input */
.day-modal-add-wrap{display:flex;gap:8px;align-items:center;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:14px;transition:all .25s var(--ease);margin-top:4px}
.day-modal-add-wrap:focus-within{border-color:var(--accent1);background:var(--accent1-06);box-shadow:0 0 24px var(--accent1-10)}
.day-modal-add-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit;font-weight:500}
.day-modal-add-input::placeholder{color:var(--text-muted)}
.day-modal-add-btn{padding:6px 14px;border-radius:10px;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border:none;font-weight:700;font-size:10px;cursor:pointer;transition:all .2s var(--ease);text-transform:uppercase;letter-spacing:.5px}
.day-modal-add-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px var(--accent1-10)}
.day-modal-add-btn:active{transform:translateY(0)}
/* Task detail modal — read view of a single task (reuses .day-modal shell) */
.tm-modal-title{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.25;color:var(--text);padding-right:12px;word-break:break-word}
.tm-modal-title.done{text-decoration:line-through;opacity:.55}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 16px;margin:16px 0 4px;padding:14px 16px;background:rgba(255,255,255,0.02);border:1px solid var(--card-border);border-radius:14px}
.tm-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.tm-field-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
