// Parametrized so the same popover drives the main quick-add, the project
// scoped add, and the modal edit form. _dpTarget names the hidden input +
// anchor button and an after(value) callback.
let dpMonth=new Date().getMonth(),dpYear=new Date().getFullYear();
let _dpTarget={dueId:'newDue',wrapId:'dateBtnWrap',after:updateDateBtn};
function toggleDatePicker(e,cfg){
  if(e)e.stopPropagation();
  let pop=document.getElementById('datePickerPop');
  if(pop){closeDatePicker();return}
  _dpTarget=cfg?{after:null,...cfg}:{dueId:'newDue',wrapId:'dateBtnWrap',after:updateDateBtn};
  const dueEl=document.getElementById(_dpTarget.dueId);
  const curVal=dueEl?dueEl.value:'';
  if(curVal){const d=new Date(curVal+'T00:00:00');dpMonth=d.getMonth();dpYear=d.getFullYear()}
  pop=document.createElement('div');
  pop.className='dp-pop';pop.id='datePickerPop';
  // Append to body (not the button) so stacking contexts can't hide it
  document.body.appendChild(pop);
  // Always position BELOW the button with constrained max-height + scroll
  const btn=document.getElementById(_dpTarget.wrapId).getBoundingClientRect();
  let left=btn.right-280;
  if(left<8)left=8;
  if(left+280>window.innerWidth-8)left=window.innerWidth-288;
  const top=btn.bottom+8;
  const maxH=Math.max(260,window.innerHeight-top-12);
  pop.style.left=left+'px';
  pop.style.top=top+'px';
  pop.style.maxHeight=maxH+'px';
  pop.style.overflowY='auto';
  renderDatePicker();
  setTimeout(()=>document.addEventListener('click',dpClickOutside),50);
}
function dpClickOutside(e){
  if(!e.target.closest('#datePickerPop')&&!e.target.closest('#'+_dpTarget.wrapId))closeDatePicker();
}
function closeDatePicker(){
  document.getElementById('datePickerPop')?.remove();
  document.removeEventListener('click',dpClickOutside);
}
function renderDatePicker(){
  const pop=document.getElementById('datePickerPop');if(!pop)return;
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const todayStr=new Date().toISOString().slice(0,10);
  const tomorrowStr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)})();
  const nextWeek=(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)})();
  const selEl=document.getElementById(_dpTarget.dueId);
  const selected=selEl?selEl.value:'';
  const first=new Date(dpYear,dpMonth,1);
  const startDay=first.getDay();
  const daysInMonth=new Date(dpYear,dpMonth+1,0).getDate();

  // Build map of dates → active (non-completed) task count
  const dayTasks={};
  Object.values(tasks).forEach(t=>{
    if(!t.dueDate||t.completed)return;
    if(!dayTasks[t.dueDate])dayTasks[t.dueDate]=0;
    dayTasks[t.dueDate]++;
  });

  let html=`<div class="dp-head">
    <button class="dp-nav" onclick="dpNav(-1)">&larr;</button>
    <div class="dp-title">${months[dpMonth]} ${dpYear}</div>
    <button class="dp-nav" onclick="dpNav(1)">&rarr;</button>
  </div>
  <div class="dp-grid">
    ${['S','M','T','W','T','F','S'].map(d=>`<div class="dp-dow">${d}</div>`).join('')}`;
  for(let i=0;i<startDay;i++)html+=`<div class="dp-day blank"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${dpYear}-${String(dpMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const isSel=ds===selected;
    const isPast=ds<todayStr;
    const count=dayTasks[ds]||0;
    const hasTasks=count>0?'has-tasks':'';
    const badge=count?`<span class="dp-day-count ${isPast?'overdue':''}">${count}</span>`:'';
    html+=`<div class="dp-day ${isToday?'today':''} ${isSel?'selected':''} ${isPast?'past':''} ${hasTasks}" onclick="dpSelect('${ds}')" title="${count?count+' task'+(count>1?'s':''):''}">${d}${badge}</div>`;
  }
  html+=`</div>
  <div class="dp-quick">
    <button onclick="dpSelect('${todayStr}')">Today</button>
    <button onclick="dpSelect('${tomorrowStr}')">Tmrw</button>
    <button onclick="dpSelect('${nextWeek}')">+1wk</button>
    <button class="clear" onclick="dpClear()">Clear</button>
  </div>`;
  pop.innerHTML=html;
}
function dpNav(dir){
  dpMonth+=dir;

// ═══════════════════════════════════════════
//  Smart quick-add — one input bar with inline tokens.
//  Tokens and panel controls write the SAME state (newPri, #newDue,
//  qaProject); last write wins; Enter reads state. Unknown #tokens stay
//  in the title — user text is never silently dropped.
//  Vocabulary: !high/!h !med/!m !low/!l · #project-name (prefix match)
//  · today/tod tomorrow/tmr/tom · weekday names · next week · in Nd · YYYY-MM-DD
//  · *easy/*med/*hard/*epic/*super (or *1..*5) for difficulty
//  · "// free text" — everything after // becomes the task's notes
// ═══════════════════════════════════════════
let qaProject='',qaCleanTitle='',qaChipList=[],qaPrevTok={pri:false,due:false,proj:false,diff:false,notes:false};
const QA_DIFFS={e:'easy',easy:'easy','1':'easy',m:'medium',med:'medium',medium:'medium','2':'medium',h:'hard',hard:'hard','3':'hard',epic:'epic','4':'epic',se:'super_epic',super:'super_epic',superepic:'super_epic',super_epic:'super_epic','5':'super_epic'};
const QA_WEEKDAYS={sunday:0,sun:0,monday:1,mon:1,tuesday:2,tues:2,tue:2,wednesday:3,wed:3,thursday:4,thurs:4,thur:4,thu:4,friday:5,fri:5,saturday:6,sat:6};
function qaAddDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function qaNextWeekday(w){const d=new Date();d.setDate(d.getDate()+((w-d.getDay()+7)%7));return d.toISOString().slice(0,10)}
function qaNormName(s){return(s||'').toLowerCase().trim().replace(/\s+/g,'-')}
// #token → project id. Exact normalized match wins, else alphabetically-first
// prefix match, else null (token stays in the title).
function qaMatchProject(tok){
  const q=tok.toLowerCase();
  const cands=Object.entries(projects).filter(([,p])=>p.status!=='archived')
    .map(([id,p])=>[id,qaNormName(p.name)]).sort((a,b)=>a[1].localeCompare(b[1]));
  const exact=cands.find(([,n])=>n===q);if(exact)return exact[0];
  const pre=cands.find(([,n])=>n.startsWith(q));
  return pre?pre[0]:null;
}
function qaFmtDate(ds){const d=new Date(ds+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function qaSetDue(ds){const h=document.getElementById('newDue');if(!h)return;h.value=ds||'';updateDateBtn()}
function qaParse(v){
  qaChipList=[];
  let s=' '+(v||'')+' ';
  let pri=null,priRaw=null,proj=null,projRaw=null,due=null,dueRaw=null,diffTok=null,diffRaw=null,notesTok=null,notesRaw=null;
  // Notes split FIRST — "// anything" after the marker is notes, never tokens
  const slash=s.indexOf(' //');
  if(slash>=0){
    notesTok=s.slice(slash+3).trim();
    notesRaw=s.slice(slash).trim();
    s=s.slice(0,slash)+' ';
    if(!notesTok){notesTok=null;notesRaw=null}
  }
  s=s.replace(/\s!(high|medium|med|low|h|m|l)(?=\s)/gi,(m,g)=>{pri={h:'high',high:'high',m:'medium',med:'medium',medium:'medium',l:'low',low:'low'}[g.toLowerCase()];priRaw=m.trim();return ' '});
  s=s.replace(/\s\*(easy|medium|med|hard|epic|superepic|super_epic|super|se|e|m|h|[1-5])(?=\s)/gi,(m,g)=>{diffTok=QA_DIFFS[g.toLowerCase()]||null;if(diffTok){diffRaw=m.trim();return ' '}return m});
  s=s.replace(/\s#([a-z0-9\-_]+)(?=\s)/gi,(m,g)=>{const id=qaMatchProject(g);if(id){proj=id;projRaw=m.trim();return ' '}return m});
  s=s.replace(/\snext week(?=\s)/gi,m=>{due=qaAddDays(7);dueRaw=m.trim();return ' '});
  s=s.replace(/\sin (\d{1,3}) ?d(?:ays?)?(?=\s)/gi,(m,g)=>{due=qaAddDays(parseInt(g,10));dueRaw=m.trim();return ' '});
  s=s.replace(/\s(tomorrow|today|tmr|tom|tod)(?=\s)/gi,(m,g)=>{due=qaAddDays(/^(tomorrow|tmr|tom)$/i.test(g)?1:0);dueRaw=m.trim();return ' '});
  s=s.replace(/\s(monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues|tue|wed|thurs|thur|thu|fri|sat|sun)(?=\s)/gi,(m,g)=>{due=qaNextWeekday(QA_WEEKDAYS[g.toLowerCase()]);dueRaw=m.trim();return ' '});
  // Literal date runs LAST so an explicit YYYY-MM-DD beats a stray weekday word
  s=s.replace(/\s(\d{4}-\d{2}-\d{2})(?=\s)/g,(m,g)=>{due=g;dueRaw=m.trim();return ' '});
  // Apply token state; revert only fields a token previously set
  if(pri)setPri(pri);else if(qaPrevTok.pri)setPri('medium');
  if(diffTok)setDiff(diffTok);else if(qaPrevTok.diff)setDiff('medium');
  const sel=document.getElementById('newProject');
  if(proj!==null){qaProject=proj;if(sel)sel.value=proj}
  else if(qaPrevTok.proj){qaProject='';if(sel)sel.value=''}
  if(due)qaSetDue(due);else if(qaPrevTok.due)qaSetDue('');
  const notesEl=document.getElementById('newNotes');
  if(notesTok!==null){if(notesEl)notesEl.value=notesTok}
  else if(qaPrevTok.notes&&notesEl)notesEl.value='';
  qaPrevTok={pri:!!pri,due:!!due,proj:proj!==null,diff:!!diffTok,notes:notesTok!==null};
  qaCleanTitle=s.replace(/\s+/g,' ').trim();
  if(pri)qaChipList.push({type:'pri',raw:priRaw,label:'⚑ '+pri});
  if(diffTok)qaChipList.push({type:'diff',raw:diffRaw,label:'★ '+diffTok.replace('_',' ')});
  if(proj)qaChipList.push({type:'proj',raw:projRaw,label:'# '+(projects[proj]?.name||'project')});
  if(due)qaChipList.push({type:'due',raw:dueRaw,label:'📅 '+qaFmtDate(due)});
  if(notesTok)qaChipList.push({type:'notes',raw:notesRaw,label:'📝 '+(notesTok.length>28?notesTok.slice(0,28)+'…':notesTok)});
  qaRenderChips();
}
function qaRenderChips(){
  const host=document.getElementById('qaChips');if(!host)return;
  const chips=[...qaChipList];
  if(!chips.some(c=>c.type==='proj')&&qaProject&&projects[qaProject])chips.push({type:'projSel',label:'# '+(projects[qaProject].name||'Untitled')});
  host.innerHTML=chips.map((c,i)=>`<span class="qa-chip ${c.type}">${esc(c.label)}<button class="qa-chip-x" onclick="qaRemoveChip(${i},'${c.type}')" title="Remove">×</button></span>`).join('');
  host.style.display=chips.length?'flex':'none';
}
function qaRemoveChip(i,type){
  const inp=document.getElementById('newTask');
  if(type==='projSel'){qaProject='';const sel=document.getElementById('newProject');if(sel)sel.value='';qaRenderChips();return}
  const c=qaChipList[i];if(!c||!c.raw)return;
  inp.value=(' '+inp.value+' ').replace(' '+c.raw+' ',' ').replace(/\s+/g,' ').trim();
  qaParse(inp.value);
  inp.focus();
}

function qaKeydown(e){

function qaReset(){
  const inp=document.getElementById('newTask');if(inp)inp.value='';
  document.getElementById('newDue').value='';document.getElementById('newTime').value='';

}
function addTask(){

function toggleDone(id){
  const t=tasks[id];if(!t)return;
  const wasDone=t.completed;
  // Find the card element BEFORE Firebase rerender clears it
  const card=document.querySelector(`.tc .ck[onclick*="'${id}'"]`)?.closest('.tc')
            ||document.querySelector(`.dc-row .dc-ck[onclick*="'${id}'"]`)?.closest('.dc-row');
  const rep=t.repeat||'none';
  // Recurring + completing → log instance, then reset + advance due date
  if(!wasDone&&rep!=='none'){
    // Advance from today (not the old dueDate) so a stale/overdue recurring
    // task still lands strictly in the future — otherwise daily tasks whose
    // dueDate fell behind never register as "done for today".
    const _td=new Date().toISOString().slice(0,10);
    const nd=nextDueDate((t.dueDate&&t.dueDate>_td)?t.dueDate:_td,rep);
    // Stamp history so Sisyphus + stats count the completion
    fbPush('todo/history',{
      title:t.title||'',difficulty:t.difficulty||'medium',category:t.category||'personal',
      priority:t.priority||'medium',completedAt:new Date().toISOString(),
      ...historyProjectFields(t)
    });
    fbSet(`todo/tasks/${id}/dueDate`,nd);
    fbSet(`todo/tasks/${id}/progress`,0);
    fbSet(`todo/tasks/${id}/completed`,false);
    fbSet(`todo/tasks/${id}/completedAt`,'');
    playCelebrate(card,t.difficulty||'medium');
    return;
  }
  fbSet(`todo/tasks/${id}/completed`,!wasDone);
  fbSet(`todo/tasks/${id}/completedAt`,!wasDone?new Date().toISOString():'');
  if(!wasDone){
    fbSet(`todo/tasks/${id}/progress`,100);
    // Log to history so day-modal/per-day tracking works for one-shots too
    fbPush('todo/history',{
      taskId:id,title:t.title||'',difficulty:t.difficulty||'medium',
      category:t.category||'personal',priority:t.priority||'medium',
      notes:t.notes||'',completedAt:new Date().toISOString(),
      ...historyProjectFields(t)
    });
    playCelebrate(card,t.difficulty||'medium');
  }
}
function setProgress(id,val){
  const v=Math.max(0,Math.min(100,Math.round(parseFloat(val)||0)));
  const t=tasks[id];
  const rep=t?.repeat||'none';
  // Recurring tasks: hitting 100 → reset + advance, log completion
  if(v>=100&&!t?.completed&&rep!=='none'){
    const _td=new Date().toISOString().slice(0,10);
    const nd=nextDueDate((t.dueDate&&t.dueDate>_td)?t.dueDate:_td,rep);
    const card=document.querySelector(`.tc .ck[onclick*="'${id}'"]`)?.closest('.tc')
            ||document.querySelector(`.dc-row .dc-ck[onclick*="'${id}'"]`)?.closest('.dc-row');
    fbPush('todo/history',{
      title:t.title||'',difficulty:t.difficulty||'medium',category:t.category||'personal',
      priority:t.priority||'medium',completedAt:new Date().toISOString(),
      ...historyProjectFields(t)
    });
    fbSet(`todo/tasks/${id}/dueDate`,nd);
    fbSet(`todo/tasks/${id}/progress`,0);
    fbSet(`todo/tasks/${id}/completed`,false);
    fbSet(`todo/tasks/${id}/completedAt`,'');
    playCelebrate(card,t.difficulty||'medium');
    return;
  }
  fbSet(`todo/tasks/${id}/progress`,v);
  // Auto-mark complete at 100 (one-shot tasks)
  if(v>=100&&!tasks[id]?.completed){
    const card=document.querySelector(`.tc .ck[onclick*="'${id}'"]`)?.closest('.tc')
            ||document.querySelector(`.dc-row .dc-ck[onclick*="'${id}'"]`)?.closest('.dc-row');
    fbSet(`todo/tasks/${id}/completed`,true);
    fbSet(`todo/tasks/${id}/completedAt`,new Date().toISOString());
    fbPush('todo/history',{
      taskId:id,title:t?.title||'',difficulty:t?.difficulty||'medium',
      category:t?.category||'personal',priority:t?.priority||'medium',
      notes:t?.notes||'',completedAt:new Date().toISOString(),
      ...historyProjectFields(t||{})
    });
    playCelebrate(card,t?.difficulty||'medium');
  } else if(v<100&&tasks[id]?.completed){
    fbSet(`todo/tasks/${id}/completed`,false);
    fbSet(`todo/tasks/${id}/completedAt`,'');
  }
}

// ═══════════════════════════════════════════
//  Completion animation — CSS keyframes + spawned CSS particles.
//  No canvas, no rAF, no filter:blur. Each particle is a <span> with
//  per-instance --angle / --dist / --color vars driving a single
//  GPU-cheap transform animation. Particles + (optional) fullscreen
//  rings are removed when their animation ends.
// ═══════════════════════════════════════════
const CELEB_CFG={
  easy:      {count:5,  rings:0, dist:[36,60],  size:[4,7],  duration:600},
  medium:    {count:9,  rings:0, dist:[48,80],  size:[5,8],  duration:700},
  hard:      {count:14, rings:1, dist:[60,100], size:[6,10], duration:800},
  epic:      {count:20, rings:2, dist:[70,130], size:[7,12], duration:950},
  super_epic:{count:32, rings:3, dist:[90,180], size:[8,14], duration:1100},
};
const CELEB_PALETTE=['#7c9cff','#5ec2d6','#9d8cff','#fbbf24','#34d399','#e6edf3'];
const CELEB_WORDS={
  easy:['Done.','Nice','Crossed off','Tick','Easy.','Cleared','One down','Yay'],
  medium:['Nice!','Got it','Boom','Yes!','Crisp','Locked in','Clean','Solid'],
  hard:['Crushing it','Nailed it','Powerful','Yes!','No flinch','Heavy lift','Reps','Big one'],
  epic:['LEGENDARY','EPIC','Absolute unit','UNSTOPPABLE','SHEEEESH','Built different','Diff','Cracked'],
  super_epic:['GODLIKE','MYTHIC','TRANSCENDENT','YOU ARE HIM','INHUMAN','SUPER EPIC','ASCENDED','NO LAW'],
};
function playCelebrate(card,difficulty){
  const cfg=CELEB_CFG[difficulty]||CELEB_CFG.medium;
  if(card){
    card.classList.add('celebrating');
    // Springy scale pop — fire-and-forget; a Firebase re-render replacing the
    // node mid-flight is fine (we never hold the handle)
    if(fxOn())fx(card,{scale:[1,1.05,1],duration:500,ease:anime.createSpring({stiffness:220,damping:13})});
    // Anchor for absolute-positioned particles
    if(getComputedStyle(card).position==='static')card.style.position='relative';
    const baseAngle=Math.random()*360;
    for(let i=0;i<cfg.count;i++){
      const sp=document.createElement('span');
      sp.className='celeb-spark';
      const angle=baseAngle + (360/cfg.count)*i + (Math.random()-0.5)*18;
      const dist=cfg.dist[0]+Math.random()*(cfg.dist[1]-cfg.dist[0]);
      const size=cfg.size[0]+Math.random()*(cfg.size[1]-cfg.size[0]);
      const color=CELEB_PALETTE[(i+Math.floor(Math.random()*CELEB_PALETTE.length))%CELEB_PALETTE.length];
      const shape=Math.random()<0.35?'sq':'dot';
      sp.classList.add(shape==='sq'?'sq':'dot');
      sp.style.setProperty('--angle',angle+'deg');
      sp.style.setProperty('--dist',dist+'px');
      sp.style.setProperty('--sz',size+'px');
      sp.style.background=color;
      sp.style.boxShadow=`0 0 6px ${color}`;
      sp.style.animationDelay=(i*10)+'ms';
      sp.style.animationDuration=cfg.duration+'ms';
      card.appendChild(sp);
      // Auto-cleanup
      sp.addEventListener('animationend',()=>sp.remove(),{once:true});
      setTimeout(()=>{if(sp.parentNode)sp.remove()},cfg.duration+300);
    }
    setTimeout(()=>card.classList.remove('celebrating'),Math.max(720,cfg.duration));
  }
  // Fullscreen ring bursts for higher difficulties.
  if(cfg.rings){
    const ringColors=['#7c9cff','#5ec2d6','#fbbf24','#9d8cff'];
    for(let i=0;i<cfg.rings;i++){
      const ring=document.createElement('div');
      ring.className='celeb-ring';
      ring.style.borderColor=ringColors[i%ringColors.length];
      ring.style.animationDelay=(i*120)+'ms';
      ring.style.animationDuration=(cfg.duration+200)+'ms';
      document.body.appendChild(ring);
      ring.addEventListener('animationend',()=>ring.remove(),{once:true});
      setTimeout(()=>{if(ring.parentNode)ring.remove()},cfg.duration+600);
    }
  }
  // Randomized word of encouragement flashed mid-screen.
  const wordPool=CELEB_WORDS[difficulty]||CELEB_WORDS.medium;
  const wordEl=document.createElement('div');
  wordEl.className='celeb-word celeb-word-'+(difficulty||'medium');
  const wordText=wordPool[Math.floor(Math.random()*wordPool.length)];
  const pts=DIFF_WEIGHTS[difficulty]||2;
  wordEl.innerHTML=`${wordText}<span class="sub">+${pts} pt${pts===1?'':'s'}${difficulty==='super_epic'?' · SUPER EPIC':''}</span>`;
  document.body.appendChild(wordEl);
  wordEl.addEventListener('animationend',()=>wordEl.remove(),{once:true});
  setTimeout(()=>{if(wordEl.parentNode)wordEl.remove()},1500);
  try{playCompleteSound(difficulty||'medium')}catch(e){}
}

// ── WebAudio meme sound bank ──────────────────────
// Each completion plays the next sound in the cycle. Index persists in
// localStorage so the cycle continues across reloads. All sounds are
// synthesized live (no audio files needed).
let audioCtx=null;
function getAudio(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }catch{return null}
}
// Helper: build an oscillator + gain envelope
function tone(ctx,t,freq,type,peak,attack,release){
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type=type;osc.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+attack);
  g.gain.exponentialRampToValueAtTime(0.001,t+attack+release);
  osc.connect(g);g.connect(ctx.destination);
  osc.start(t);osc.stop(t+attack+release+0.05);
  return {osc,g};
}
// ── The meme bank ──
const MEME_SOUNDS=[
  // 0. Mario coin (BING-BING)
  function marioCoin(ctx,gain){
    const t=ctx.currentTime;
    tone(ctx,t,    988,'square',0.18*gain,0.005,0.08); // B5
    tone(ctx,t+0.08,1318,'square',0.18*gain,0.005,0.35); // E6
  },
  // 1. Mario power-up (ascending arpeggio)
  function powerUp(ctx,gain){
    const t=ctx.currentTime;
    const notes=[523,659,784,1047,1319,1568];
    notes.forEach((f,i)=>tone(ctx,t+i*0.05,f,'square',0.13*gain,0.005,0.08));
  },
  // 2. Vine boom
  function vineBoom(ctx,gain){
    const t=ctx.currentTime;
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(120,t);
    osc.frequency.exponentialRampToValueAtTime(38,t+0.45);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.4*gain,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.85);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+0.9);
    // tail rumble
    const sub=ctx.createOscillator(),sg=ctx.createGain();
    sub.type='triangle';sub.frequency.value=55;
    sg.gain.setValueAtTime(0,t);
    sg.gain.linearRampToValueAtTime(0.18*gain,t+0.04);
    sg.gain.exponentialRampToValueAtTime(0.001,t+1.0);
    sub.connect(sg);sg.connect(ctx.destination);
    sub.start(t);sub.stop(t+1.1);
  },
  // 3. Air horn
  function airHorn(ctx,gain){
    const t=ctx.currentTime;
    const osc=ctx.createOscillator(),lfo=ctx.createOscillator();
    const g=ctx.createGain(),lfoG=ctx.createGain();
    osc.type='sawtooth';osc.frequency.value=440;
    lfo.type='sine';lfo.frequency.value=6;
    lfoG.gain.value=15;
    lfo.connect(lfoG).connect(osc.frequency);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.18*gain,t+0.02);
    g.gain.setValueAtTime(0.18*gain,t+0.45);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.65);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+0.7);
    lfo.start(t);lfo.stop(t+0.7);

    tone(ctx,t,880,'sawtooth',0.08*gain,0.02,0.55);

  // 4. Sad trombone (wah-wah-wah-waaah)
  function sadTrombone(ctx,gain){
    const t=ctx.currentTime;
    const notes=[[262,0,0.18],[247,0.16,0.18],[233,0.32,0.18],[196,0.48,0.7]];
    notes.forEach(([f,d,r])=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.type='sawtooth';

      osc.frequency.linearRampToValueAtTime(f,t+d+0.05);
      g.gain.setValueAtTime(0,t+d);
      g.gain.linearRampToValueAtTime(0.18*gain,t+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+d+r);
      osc.connect(g);g.connect(ctx.destination);
      osc.start(t+d);osc.stop(t+d+r+0.05);
    });
  },
  // 5. WOW (pitch slide up — like Owen Wilson)
  function wow(ctx,gain){
    const t=ctx.currentTime;
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(220,t);

    osc.frequency.exponentialRampToValueAtTime(440,t+0.55);
    g.gain.setValueAtTime(0,t);

    g.gain.linearRampToValueAtTime(0.16*gain,t+0.4);

  // 6. Bell ding (Skype/iMessage-ish)

      osc.type='sine';osc.frequency.value=f;

function playCompleteSound(difficulty){
  const ctx=getAudio();if(!ctx)return;
  // Cycle through the bank
  let idx=parseInt(localStorage.getItem('oyt_sound_idx')||'0',10);
  if(isNaN(idx)||idx<0)idx=0;
  idx=idx%MEME_SOUNDS.length;
  const fn=MEME_SOUNDS[idx];
  // Loudness scales with difficulty
  const gain={easy:0.85,medium:1.0,hard:1.2,epic:1.5,super_epic:1.8}[difficulty]||1.0;
  try{fn(ctx,gain)}catch(e){console.warn('sound failed',e)}
  localStorage.setItem('oyt_sound_idx',String((idx+1)%MEME_SOUNDS.length));
  // Epic: also stack a vine boom underneath whatever the cycle plays
  if(difficulty==='epic'&&fn!==MEME_SOUNDS[2]){
    setTimeout(()=>{try{MEME_SOUNDS[2](ctx,1.2)}catch{}},100);
  }
}

function renderDash(){

  // Difficulty-weighted points (sums task weights × completion %)
  let totalPts=0,donePts=0,activePts=0;

    const pct=t.completed?100:(parseFloat(t.progress)||0);

    if(!t.completed)activePts+=w*(1-pct/100);

  // Daily goal for the progress bar — scales with effort

    </div>
    <div class="dash-card">
      <div class="dash-val green">${pctPts}%</div>
      <div class="dash-label">${donePtsRounded}/${totalPts} pts</div>
      <div class="dash-bar"><div class="dash-bar-fill" style="width:${pctPts}%;background:#34d399"></div></div>
    </div>
    <div class="dash-card">
      <div class="dash-val pink">${overdue}</div>
      <div class="dash-label">Overdue</div>
      <div class="dash-bar"><div class="dash-bar-fill" style="width:${total?overdue/total*100:0}%;background:var(--pink)"></div></div>

      <div class="dash-label">High Pri</div>
      <div class="dash-bar"><div class="dash-bar-fill" style="width:${total?high/total*100:0}%;background:var(--blue)"></div></div>

function calcStreak(){
  const completed=Object.values(tasks).filter(t=>t.completedAt).map(t=>t.completedAt.slice(0,10));
  if(!completed.length)return 0;
  const unique=[...new Set(completed)].sort().reverse();
  let streak=0;const d=new Date();
  for(let i=0;i<unique.length;i++){
    const check=new Date(d);check.setDate(check.getDate()-i);
    if(unique.includes(check.toISOString().slice(0,10)))streak++;else break;
  }
  return streak;
}

function sortTasks(fl){
  const priVal={high:0,medium:1,low:2};
  const diffVal={epic:0,hard:1,medium:2,easy:3};
  const today=new Date().toISOString().slice(0,10);
  // Smart priority — multi-tier comparator with sensible tie-breakers:
  //   1. Overdue (any priority) bubbles up first
  //   2. Priority (high → low)
  //   3. Has due date before no due date
  //   4. Earlier due date first
  //   5. Higher difficulty first (more weight = more impact)
  //   6. Older order first (so the same list is stable across renders)
  function smartCmp(a,b){
    const ta=a[1],tb=b[1];
    const aOver=ta.dueDate&&ta.dueDate<today?1:0;
    const bOver=tb.dueDate&&tb.dueDate<today?1:0;
    if(aOver!==bOver)return bOver-aOver;
    const ap=priVal[ta.priority]??1,bp=priVal[tb.priority]??1;
    if(ap!==bp)return ap-bp;
    const aHas=ta.dueDate?1:0,bHas=tb.dueDate?1:0;
    if(aHas!==bHas)return bHas-aHas;
    if(aHas&&ta.dueDate!==tb.dueDate)return ta.dueDate.localeCompare(tb.dueDate);
    const ad=diffVal[ta.difficulty]??2,bd=diffVal[tb.difficulty]??2;
    if(ad!==bd)return ad-bd;
    return (ta.order||0)-(tb.order||0);
  }
  switch(sortBy){
    case 'priority':
      fl.sort(smartCmp); break;
    case 'due':
      // Tasks with a due date first (soonest top), then no-due tasks at the bottom
      fl.sort((a,b)=>{
        const ad=a[1].dueDate,bd=b[1].dueDate;
        if(ad&&!bd)return -1;
        if(!ad&&bd)return 1;
        if(!ad&&!bd)return (a[1].order||0)-(b[1].order||0);
        if(ad!==bd)return ad.localeCompare(bd);
        // tie: higher priority first
        return (priVal[a[1].priority]??1)-(priVal[b[1].priority]??1);
      }); break;
    case 'category':
      fl.sort((a,b)=>{
        const c=(a[1].category||'').localeCompare(b[1].category||'');
        return c!==0?c:smartCmp(a,b);
      }); break;
    case 'newest': fl.sort((a,b)=>(b[1].order||0)-(a[1].order||0)); break;
    case 'oldest': fl.sort((a,b)=>(a[1].order||0)-(b[1].order||0)); break;
    default: fl.sort((a,b)=>(a[1].order||0)-(b[1].order||0)); // manual = by order field
  }
  // Always push completed to bottom
  fl.sort((a,b)=>{if(a[1].completed!==b[1].completed)return a[1].completed?1:-1;return 0});
  return fl;
}

function moveTask(id,dir){
  const fl=Object.entries(tasks).filter(([,t])=>!t.completed).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const idx=fl.findIndex(([tid])=>tid===id);
  if(idx<0)return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=fl.length)return;
  const myOrder=fl[idx][1].order||0;
  const theirOrder=fl[swapIdx][1].order||0;
  fbSet(`todo/tasks/${fl[idx][0]}/order`,theirOrder);
  fbSet(`todo/tasks/${fl[swapIdx][0]}/order`,myOrder);
}

function renderStatRow(){
  const el=document.getElementById('statRow');
  const all=Object.values(tasks);
  const done=all.filter(t=>t.completed);
  const today=new Date().toISOString().slice(0,10);

  // Deadline stats: completed tasks that had a due date
  const withDue=done.filter(t=>t.dueDate&&t.completedAt);
  let early=0,onTime=0,late=0;
  withDue.forEach(t=>{
    const comp=t.completedAt.slice(0,10);
    if(comp<t.dueDate)early++;
    else if(comp===t.dueDate)onTime++;
    else late++;
  });
  const totalDue=withDue.length;
  const beatPct=totalDue?Math.round((early+onTime)/totalDue*100):0;

  // Streak
  const streak=calcStreak();

  // Average completion time (days from created to completed)
  let avgDays=0;
  if(done.length){
    const total=done.reduce((s,t)=>{
      if(!t.createdAt||!t.completedAt)return s;
      return s+Math.max(0,(new Date(t.completedAt)-new Date(t.createdAt))/86400000);
    },0);
    avgDays=Math.round(total/done.length*10)/10;
  }

  // Themed emojis
  const curTheme=localStorage.getItem('oyt_theme')||'';
  const te=(THEMES[curTheme]||THEMES['']).stats;

  // Same rotating pool as the Stats Verdict card
  const STRIP_POOL={
    him:['YOU ARE HIM','LIGHTS OUT','UNTOUCHABLE','HE IS HIM','BUILT DIFFERENT','GOATED','LEGENDARY'],
    locked:['LOCKED IN','IN THE ZONE','ON A HEATER','MOMENTUM','HOT HAND','CRUISING'],
    solid:['SOLID','HOLDING THE LINE','RESPECTABLE','BUILDING','KEEP GOING','PROVE IT'],
    grind:['WORK HARDER','LOCK IN','WAKE UP','GET IT TOGETHER','SHOW UP','YOU OWE YOURSELF'],
    nodata:['NO DATA YET','LET\u2019S COOK','EMPTY SLATE','BEGIN','GO','PROVE SOMETHING'],
  };
  let stripTier='nodata',emoji=te.nodata;
  if(beatPct>=90){stripTier='him';emoji=te.him}
  else if(beatPct>=70){stripTier='locked';emoji=te.locked}
  else if(beatPct>=50){stripTier='solid';emoji=te.solid}
  else if(totalDue>0){stripTier='grind';emoji=te.grind}
  const sp=STRIP_POOL[stripTier];
  const verdict=sp[Math.floor(Math.random()*sp.length)];

  el.innerHTML=`
    <div class="stat-chip">
      <span class="stat-emoji">${emoji}</span>
      <div class="stat-info"><span class="stat-val">${verdict}</span><span class="stat-desc">${beatPct}% deadlines met</span></div>
    </div>
    <div class="stat-chip">
      <span class="stat-emoji">${streak>=3?te.streak:streak>=1?te.streak:'💤'}</span>
      <div class="stat-info"><span class="stat-val">${streak} day${streak!==1?'s':''}</span><span class="stat-desc">Completion streak</span></div>
    </div>
    <div class="stat-chip">
      <span class="stat-emoji">${early>=late?te.early:te.late}</span>
      <div class="stat-info"><span class="stat-val">${early} early / ${late} late</span><span class="stat-desc">${onTime} on time</span></div>
    </div>
    <div class="stat-chip">
      <span class="stat-emoji">${te.time}</span>
      <div class="stat-info"><span class="stat-val">${avgDays}d avg</span><span class="stat-desc">Time to complete</span></div>
    </div>`;
}

// Sisyphus canvas + rAF loop removed — see <div class="cmd-strip"> in markup

function renderTasks(){
  // Preserve scroll position — avoids jumping to top when Firebase listener
  // re-renders (e.g. after slider release triggers a task update)
  const savedScroll=window.scrollY;
  renderDashV2();
  renderCmdMetrics();
  updateControlBarLabels();
  // (Sisyphus + collapse mechanism removed)
  const list=document.getElementById('taskList'),stats=document.getElementById('stats');
  const entries=Object.entries(tasks);
  if(!entries.length){
    const curTheme=localStorage.getItem('oyt_theme')||'';
    const th=THEMES[curTheme]||THEMES[''];
    const sprSrc=th.sprite?SPRITE_BASE+th.sprite.corner:'';
    const mascotEl=sprSrc?`<img src="${sprSrc}" style="width:64px;height:64px;image-rendering:pixelated" alt="">`:`<span>${th.mascot}</span>`;
    const lines=['The boulder awaits','Time to feed the mountain','Every legend starts with one task','Let\'s cook','What needs to be done?','The grind begins above'];
    const line=lines[Math.floor(Date.now()/8000)%lines.length];
    list.innerHTML=`<div class="empty-state">
      <div class="empty-mascot">${mascotEl}</div>
      <div class="empty-bubble">${line}</div>
    </div>`;
    stats.innerHTML='';
    if(savedScroll>0)requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,savedScroll)));
    return;
  }
  // Re-render ancillary UI whose state depends on current tasks
  renderRequesterStrip();
  updateFocusBtn();
  refreshFromSuggestions();

  let fl=entries;
  // RFIs live on the RFI tab only — they still count in stats via todo/history.
  // Exception: if user explicitly filters to rfi, show them here too.
  if(fCat!=='rfi')fl=fl.filter(([,t])=>t.category!=='rfi');
  if(fStatus==='active')fl=fl.filter(([,t])=>!t.completed);
  if(fStatus==='completed')fl=fl.filter(([,t])=>t.completed);
  if(fCat!=='all')fl=fl.filter(([,t])=>t.category===fCat);
  if(fProject!=='all')fl=fl.filter(([,t])=>(t.projectId||'')===fProject);
  if(fFrom!=='all')fl=fl.filter(([,t])=>fFrom===''?!(t.from||'').trim():(t.from||'').trim()===fFrom);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    fl=fl.filter(([,t])=>(t.title||'').toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q)||(t.from||'').toLowerCase().includes(q));
  }
  // Focus mode — hide clutter: far-out non-high-priority + undated low-priority
  if(focusOn){
    const today=new Date();today.setHours(0,0,0,0);
    const cutoff=new Date(today);cutoff.setDate(today.getDate()+14);
    fl=fl.filter(([,t])=>{
      if(t.completed)return false;
      if((t.priority||'')==='high')return true;
      if(!t.dueDate){return(t.priority||'')!=='low'}
      const d=new Date(t.dueDate+'T00:00:00');
      return d<=cutoff;
    });
  }
  fl=sortTasks(fl);
  // Calendar sort view — render week grid instead of flat list
  if(sortBy==='calendar'){
    renderCalendarSort(fl);
    const total=Object.entries(tasks).length,done=Object.entries(tasks).filter(([,t])=>t.completed).length;
    document.getElementById('stats').textContent=done+' of '+total+' completed';
    if(savedScroll>0)window.scrollTo(0,savedScroll);
    return;
  }
  // Empty search result state
  if(searchQuery&&!fl.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-mascot">🔍</div><div class="empty-bubble">No tasks match "${esc(searchQuery)}"</div></div>`;
    stats.textContent='0 of '+entries.length+' matched';
    if(savedScroll>0)requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,savedScroll)));
    return;
  }
  const today=new Date().toISOString().slice(0,10);
  // Group remaining tasks into Today / This Week / Later / Done.
  // Bucketing rules:
  //   Today   — due today, overdue, or no due AND priority==='high'
  //   Week    — due > today AND due <= today+7d, or no due AND priority==='medium'
  //   Later   — due > today+7d, or no due AND priority==='low'
  //   Done    — anything t.completed
  const wk=new Date();wk.setDate(wk.getDate()+7);const weekCutoff=wk.toISOString().slice(0,10);
  const buckets={today:[],week:[],later:[],done:[]};
  fl.forEach(([id,t])=>{
    if(t.completed){buckets.done.push([id,t]);return}
    const due=t.dueDate||'';
    if(due){
      if(due<=today)buckets.today.push([id,t]);
      else if(due<=weekCutoff)buckets.week.push([id,t]);
      else buckets.later.push([id,t]);
    }else{
      const p=t.priority||'medium';
      if(p==='high')buckets.today.push([id,t]);
      else if(p==='low')buckets.later.push([id,t]);
      else buckets.week.push([id,t]);
    }
  });
  const cols=[
    ['today','Today','今日'],
    ['week','This Week','本周'],
    ['later','Later','之后'],
    ['done','Done','完成'],
  ];
  list.innerHTML=`<div class="kanban">${cols.map(([key,en,cn])=>`
    <section class="kc" data-col="${key}">
      <header class="kc-head"><h3>${en}<span class="cn">${cn}</span></h3><span class="kc-count">${buckets[key].length}</span></header>
      <div class="task-list">${buckets[key].length
        ? buckets[key].map(([id,t],i)=>renderTaskCard(id,t,i)).join('')
        : `<div class="kc-empty">Nothing here<span class="cn">空空如也</span></div>`}</div>
    </section>`).join('')}</div>`;
  const total=entries.length,done=entries.filter(([,t])=>t.completed).length;
  stats.textContent=done+' of '+total+' completed';
  // Restore scroll position so Firebase re-renders don't jump to top
  if(savedScroll>0)window.scrollTo(0,savedScroll);
  if(listAnimPending){listAnimPending=false;fxStaggerIn(list.querySelectorAll('.tc'))}
}

// Render a single task card. Top-level so both the kanban and the project
// detail view can use it. opts: {drag:true, rank:true, showProject:true}
function renderTaskCard(id,t,i,opts={}){
  const today=new Date().toISOString().slice(0,10);
  const exp=expanded===id;
  const od=t.dueDate&&!t.completed&&t.dueDate<today;
  const proj=t.projectId?projects[t.projectId]:null;
  const cc=proj?(proj.color||'var(--accent1)'):t.category==='work'?'var(--accent2)':t.category==='project'?'var(--accent3)':t.category==='rfi'?'#fbbf24':'var(--accent1)';
  const rank=(opts.rank===false||t.completed)?'':String(i+1);
  // Card is draggable for reorder ONLY when collapsed — when expanded the
  // user is editing fields (esp. the progress range slider) and the parent
  // drag would hijack mousedown events
  const drag=opts.drag!==false&&!t.completed&&sortBy==='manual'&&!exp;
  const diff=t.difficulty||'medium';
  const diffStars={easy:'★',medium:'★★',hard:'★★★',epic:'★★★★',super_epic:'★★★★★'}[diff];
  const prog=t.completed?100:Math.max(0,Math.min(100,parseFloat(t.progress)||0));
  const projBadge=(opts.showProject!==false&&proj)?`<span class="t-proj" style="--pc:${proj.color||'#7c9cff'}" onclick="event.stopPropagation();openProjectView('${t.projectId}')" title="Open project">${proj.icon?proj.icon+' ':''}${esc(proj.name||'Untitled')}</span>`:'';
  let h=`<div class="tc ${t.completed?'done':''}" data-id="${id}" style="border-left:3px solid ${cc}" onclick="if(!event.target.closest('button,a,.t-proj,.reorder,.ta'))openTaskModal('${id}')" ${drag?'draggable="true" ondragstart="dragStart(event,\''+id+'\')" ondragover="dragOver(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="dragDrop(event,\''+id+'\')" ondragend="dragEnd(event)"':''}>
    <span class="t-rank">${rank}</span>
    <button class="ck" onclick="event.stopPropagation();toggleDone('${id}')">${t.completed?'&#10003;':''}</button>
    <div class="tb">
      <div class="tt" title="View details">${highlightMatch(t.title||'')}</div>
      ${t.notes?`<div class="t-notes">${highlightMatch((t.notes||'').slice(0,80))}${t.notes.length>80?'...':''}</div>`:''}
      <div class="tm">
        <span class="pd ${t.priority||'medium'}"></span>
        <span class="cat ${t.category||'personal'}">${t.category||'personal'}</span>
        <span class="t-diff ${diff}">${diffStars}</span>
        ${projBadge}
        ${t.repeat&&t.repeat!=='none'?`<span class="t-repeat">${t.repeat}</span>`:''}
        ${t.from?`<span class="t-from">${esc(t.from)}</span>`:''}
        ${t.dueDate?`<span class="dl ${od?'od':''}">${od?'Overdue':'Due'}: ${t.dueDate}${t.dueTime?' '+fmtTime12(t.dueTime):''}</span>`:''}
      </div>
      ${!t.completed&&prog>0?`<div class="t-prog">
        <div class="t-prog-bar"><div class="t-prog-fill" style="width:${prog}%"></div></div>
        <span class="t-prog-val">${prog}%</span>
      </div>`:''}`;
  h+=`</div>
    ${opts.drag!==false&&!t.completed&&sortBy==='manual'?`<div class="reorder">
      <button class="ro-btn" onclick="event.stopPropagation();moveTask('${id}',-1)">&#9650;</button>
      <button class="ro-btn" onclick="event.stopPropagation();moveTask('${id}',1)">&#9660;</button>
    </div>`:''}
    <div class="ta">
      <button class="tab" onclick="event.stopPropagation();openTaskModal('${id}','edit')" title="Edit">&#9998;</button>
      <button class="tab del" onclick="event.stopPropagation();deleteTask('${id}')" title="Delete">&times;</button>
    </div>
  </div>`;
  return h;
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
// Format "HH:MM" (24hr) → "H:MM AM/PM"
function fmtTime12(t){
  if(!t)return '';
  const [h,m]=t.split(':');
  const hr=parseInt(h)||0;
  return(hr>12?hr-12:hr||12)+':'+m+(hr>=12?' PM':' AM');
}

// (toggleCmd removed — collapse mechanism deleted with Sisyphus)
function renderCmdMetrics(){
  const entries=Object.entries(tasks);
  const active=entries.filter(([,t])=>!t.completed);
  const today=new Date().toISOString().slice(0,10);
  const wk=new Date();wk.setDate(wk.getDate()+7);const weekCutoff=wk.toISOString().slice(0,10);
  // Count history events too — completed-then-reset recurring tasks count toward "Done Today".
  let doneToday=entries.filter(([,t])=>t.completed&&(t.completedAt||'').slice(0,10)===today).length;
  Object.values(taskHistory||{}).forEach(h=>{if((h.completedAt||'').slice(0,10)===today)doneToday++});
  const totalPts=entries.reduce((s,[,t])=>(s+(DIFF_WEIGHTS[t.difficulty||'medium']||2)),0);
  const donePts=entries.filter(([,t])=>t.completed).reduce((s,[,t])=>(s+(DIFF_WEIGHTS[t.difficulty||'medium']||2)),0);
  const pct=totalPts?Math.round(donePts/totalPts*100):0;
  const overdue=active.filter(([,t])=>t.dueDate&&t.dueDate<today).length;
  const weekAhead=active.filter(([,t])=>t.dueDate&&t.dueDate>=today&&t.dueDate<=weekCutoff).length;
  // Streak = consecutive days (counting back from today) with >=1 completion (history OR task completedAt).
  const dayHas=ds=>{
    if(entries.some(([,t])=>t.completed&&(t.completedAt||'').slice(0,10)===ds))return true;
    return Object.values(taskHistory||{}).some(h=>(h.completedAt||'').slice(0,10)===ds);
  };
  let streak=0;{
    const d=new Date();
    for(let i=0;i<365;i++){
      const ds=d.toISOString().slice(0,10);
      if(dayHas(ds))streak++;else if(i>0)break;
      d.setDate(d.getDate()-1);
    }
  }
  // 7-day completions (task.completedAt + history so recurring instances count)
  const dows=['S','M','T','W','T','F','S'];
  const sparkData=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    let c=entries.filter(([,t])=>t.completed&&(t.completedAt||'').slice(0,10)===ds).length;
    Object.values(taskHistory||{}).forEach(h=>{if((h.completedAt||'').slice(0,10)===ds)c++});
    sparkData.push({ds,c,isToday:ds===today,dow:dows[d.getDay()]});
  }
  const sparkTotal=sparkData.reduce((s,d)=>s+d.c,0);
  // Smooth area sparkline
  const SW=180,SH=46,sp=4,smax=Math.max(1,...sparkData.map(s=>s.c));
  const sx=i=>sp+i*((SW-sp*2)/(sparkData.length-1));
  const sy=c=>SH-sp-(c/smax)*(SH-sp*2);
  const spPts=sparkData.map((s,i)=>[sx(i),sy(s.c)]);
  const spLine=spPts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const spArea=`M${sp} ${SH-sp} `+spPts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${SW-sp} ${SH-sp} Z`;
  const spEnd=spPts[spPts.length-1];
  const sparkHTML=`<svg viewBox="0 0 ${SW} ${SH}" preserveAspectRatio="none">
    <defs><linearGradient id="deckSparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent1)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent1)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${spArea}" fill="url(#deckSparkGrad)"/>
    <path d="${spLine}" fill="none" stroke="var(--accent1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${spEnd[0].toFixed(1)}" cy="${spEnd[1].toFixed(1)}" r="3" fill="var(--accent1)" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
  const sparkDays=sparkData.map(s=>`<span class="${s.isToday?'today':''}">${s.dow}</span>`).join('');
  // Difficulty + category mix of ACTIVE tasks
  const diffCnt={easy:0,medium:0,hard:0,epic:0,super_epic:0};
  active.forEach(([,t])=>{const d=t.difficulty||'medium';if(diffCnt[d]!==undefined)diffCnt[d]++});
  const diffColors={easy:'#34d399',medium:'#fbbf24',hard:'#f97316',epic:'#9d8cff',super_epic:'#7c9cff'};
  const diffLabels={easy:'Easy',medium:'Med',hard:'Hard',epic:'Epic',super_epic:'Super'};
  const catCnt={work:0,personal:0,project:0,rfi:0};
  active.forEach(([,t])=>{const c=t.category||'personal';if(catCnt[c]!==undefined)catCnt[c]++});
  const catColors={work:'#5ec2d6',personal:'#7c9cff',project:'#9d8cff',rfi:'#fbbf24'};
  const catLabels={work:'Work',personal:'Personal',project:'Project',rfi:'RFI'};
  const meter=(cnt,colors,labels)=>{
    const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
    const segs=Object.entries(cnt).filter(([,n])=>n>0)
      .map(([k,n])=>`<div class="deck-meter-seg" style="flex:${n};background:${colors[k]}" title="${labels[k]}: ${n}"></div>`).join('');
    const legend=Object.entries(cnt).filter(([,n])=>n>0)
      .map(([k,n])=>`<span><i style="background:${colors[k]}"></i>${labels[k]} <b>${n}</b></span>`).join('');
    return {tot,bar:tot?segs:`<div class="deck-meter-empty"></div>`,legend};
  };
  const dm=meter(diffCnt,diffColors,diffLabels), cm=meter(catCnt,catColors,catLabels);
  // Hero ring (points completion)
  const R=42,CIRC=2*Math.PI*R,OFF=CIRC*(1-pct/100);
  const kpi=(val,lbl,color,warnCls,ic)=>`<div class="deck-kpi ${warnCls||''}" style="--kc:${color}"><span class="deck-kpi-val">${ic?`<span class="ic">${ic}</span>`:''}${val}</span><span class="deck-kpi-lbl">${lbl}</span></div>`;
  const el=document.getElementById('cmdMetrics');
  if(!el)return;
  el.innerHTML=`
  <div class="deck">
    <div class="deck-hero">
      <div class="deck-ring">
        <svg viewBox="0 0 100 100">
          <defs><linearGradient id="deckRingGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7c9cff"/><stop offset="100%" stop-color="#5ec2d6"/>
          </linearGradient></defs>
          <circle class="ring-bg" cx="50" cy="50" r="${R}"/>
          <circle class="ring-fg" id="deckRingFg" cx="50" cy="50" r="${R}" stroke-dasharray="${CIRC.toFixed(2)}" stroke-dashoffset="${OFF.toFixed(2)}" data-pct="${pct}"/>
        </svg>
        <div class="deck-ring-center"><span class="deck-ring-pct">${pct}%</span><span class="deck-ring-cap">Complete</span></div>
      </div>
      <div class="deck-hero-side">
        <div class="deck-hero-pts"><b>${donePts}</b>/${totalPts} pts done</div>
        <div class="deck-hero-pts"><b>${active.length}</b> active · <b>${weekAhead}</b> this week</div>
      </div>
    </div>
    <div class="deck-kpis">
      ${kpi(doneToday,'Done today','#34d399',null,'✓')}
      ${kpi(streak,'Day streak','#fbbf24',null,'🔥')}
      ${kpi(active.length,'Active','#7c9cff')}
      ${kpi(overdue,'Overdue',overdue?'#f87171':'var(--text-muted)',overdue?'warn':'')}
    </div>
    <div class="deck-spark">
      <div class="deck-spark-head"><span class="deck-lbl">Last 7 days</span><b>${sparkTotal} done</b></div>
      ${sparkHTML}
      <div class="deck-spark-days">${sparkDays}</div>
    </div>
    <div class="deck-meters">
      <div class="deck-meter-block">
        <div class="deck-meter-head"><span class="deck-lbl">Active by difficulty</span><b>${dm.tot}</b></div>
        <div class="deck-meter">${dm.bar}</div>
        <div class="deck-legend">${dm.legend||'<span style="color:var(--text-muted)">No active tasks</span>'}</div>
      </div>
      <div class="deck-meter-block">
        <div class="deck-meter-head"><span class="deck-lbl">Active by category</span><b>${cm.tot}</b></div>
        <div class="deck-meter">${cm.bar}</div>
        <div class="deck-legend">${cm.legend||'<span style="color:var(--text-muted)">No active tasks</span>'}</div>
      </div>
    </div>
  </div>`;
  // Animate the ring sweep from its previous value
  const ring=document.getElementById('deckRingFg');
  if(ring&&fxOn()){
    const prev=_lastCmdPct;const offFor=p=>CIRC*(1-Math.max(0,Math.min(100,p))/100);
    if(prev!==pct){ring.setAttribute('stroke-dashoffset',offFor(prev));fx(ring,{strokeDashoffset:[offFor(prev),offFor(pct)],duration:800,ease:'inOut(2)'})}
  }

function getWeekDates(offset){
  const now=new Date();
  const day=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+offset*7);
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);
    days.push(d);
  }
  return days;
}
function renderCalendarSort(fl){
  const list=document.getElementById('taskList');
  const stats=document.getElementById('stats');
  const days=getWeekDates(calSortWeekOffset);
  const today=new Date().toISOString().slice(0,10);
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const weekLabel=`${monthNames[days[0].getMonth()]} ${days[0].getDate()} – ${monthNames[days[6].getMonth()]} ${days[6].getDate()}, ${days[6].getFullYear()}`;
  const buckets={};
  days.forEach(d=>{buckets[d.toISOString().slice(0,10)]=[]});
  const unscheduled=[];
  fl.forEach(([id,t])=>{
    if(!t.dueDate){unscheduled.push([id,t]);return}
    const ds=t.dueDate;
    if(buckets[ds]!==undefined)buckets[ds].push([id,t]);
  });
  const priVal={high:0,medium:1,low:2};
  const sortBucket=arr=>arr.sort((a,b)=>{
    if(a[1].completed!==b[1].completed)return a[1].completed?1:-1;
    return(priVal[a[1].priority]||1)-(priVal[b[1].priority]||1);
  });
  function taskCard(id,t){
    const cc=t.category==='work'?'var(--cat-work-fg)':t.category==='project'?'var(--accent3,var(--accent2))':t.category==='rfi'?'#fbbf24':'var(--accent1)';
    const checked=t.completed;
    const priDot=t.priority==='high'?'🔴':t.priority==='low'?'⚪':'';
    return `<div class="cal-sort-task ${checked?'done':''}" style="border-left-color:${cc}">
      ${priDot?`<span style="font-size:5px;flex-shrink:0">${priDot}</span>`:''}
      <span class="cst-title">${esc(t.title||'')}</span>
      ${checked?'<span style="font-size:7px;opacity:.4">✓</span>':''}
    </div>`;
  }
  let h=`<div class="cal-sort-wrap">
    <div class="cal-sort-nav">
      <button onclick="calSortWeekOffset--;renderTasks()">◀</button>
      <span class="cal-sort-label">${weekLabel}</span>
      <button onclick="calSortWeekOffset++;renderTasks()">▶</button>
      <button onclick="calSortWeekOffset=0;renderTasks()" style="margin-left:4px">Today</button>
    </div>
    <div class="cal-sort-grid">`;
  days.forEach((d,i)=>{
    const ds=d.toISOString().slice(0,10);
    const isToday=ds===today;
    const isPast=ds<today;
    const items=sortBucket(buckets[ds]||[]);
    const activeItems=items.filter(([,t])=>!t.completed);
    h+=`<div class="cal-sort-col ${isToday?'today':''}${isPast&&!isToday?' past':''}" onclick="openDayModal('${ds}')" style="cursor:pointer">
      <div class="cal-sort-col-head">
        <span class="cal-sort-day-name">${dayNames[i]}</span>
        <span class="cal-sort-day-num">${d.getDate()}</span>
      </div>`;
    if(items.length) h+=`<div class="cal-sort-col-count">${activeItems.length} task${activeItems.length!==1?'s':''} · tap to view</div>`;
    if(!items.length){
      h+=`<div class="cal-sort-empty">${isPast?'—':'no tasks'}</div>`;
    }else{
      items.forEach(([id,t])=>{h+=taskCard(id,t)});
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  if(unscheduled.length){
    h+=`<div class="cal-sort-unscheduled"><h4>Unscheduled · ${unscheduled.length}</h4>`;
    sortBucket(unscheduled).forEach(([id,t])=>{h+=taskCard(id,t)});
    h+=`</div>`;
  }
  h+=`</div>`;
  list.innerHTML=h;
  const total=Object.entries(tasks).length,done=Object.entries(tasks).filter(([,t])=>t.completed).length;
  stats.textContent=done+' of '+total+' completed';
}

function renderDashV2(){
  const el=document.getElementById('dash');
  if(!el)return;
  const entries=Object.entries(tasks);
  const today=new Date().toISOString().slice(0,10);
  const active=entries.filter(([,t])=>!t.completed);
  const completed=entries.filter(([,t])=>t.completed);
  const doneToday=completed.filter(([,t])=>(t.completedAt||'').slice(0,10)===today).length;
  const totalPts=entries.reduce((s,[,t])=>(s+(DIFF_WEIGHTS[t.difficulty||'medium']||2)),0);
  const donePts=completed.reduce((s,[,t])=>(s+(DIFF_WEIGHTS[t.difficulty||'medium']||2)),0);
  const pct=totalPts?Math.round(donePts/totalPts*100):0;
  const overdue=active.filter(([,t])=>t.dueDate&&t.dueDate<today).length;
  const highPri=active.filter(([,t])=>t.priority==='high').length;
  const dailyGoal=5;
  // Sparkline: last 7 days done count
  const spark=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const cnt=completed.filter(([,t])=>(t.completedAt||'').slice(0,10)===ds).length;
    spark.push({date:ds,count:cnt,isToday:ds===today});
  }
  const sparkMax=Math.max(1,...spark.map(s=>s.count));
  // Streak
  let streak=0;
  for(let i=0;i<365;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    if(completed.some(([,t])=>(t.completedAt||'').slice(0,10)===ds))streak++;else if(i>0)break;
  }
  // Verdict
  const deadlines=completed.filter(([,t])=>t.dueDate);
  const beatCount=deadlines.filter(([,t])=>(t.completedAt||'').slice(0,10)<=t.dueDate).length;
  const beatPct=deadlines.length?Math.round(beatCount/deadlines.length*100):0;
  const pools={him:['HIM','GOAT MODE','LEGENDARY'],locked:['LOCKED IN','ON FIRE','UNSTOPPABLE'],solid:['SOLID','CONSISTENT','RELIABLE'],grind:['KEEP GRINDING','ALMOST THERE','BUILDING'],nodata:['FRESH START','BLANK CANVAS','LOADING...']};
  let tier='nodata';
  if(deadlines.length>=3){
    if(beatPct>=90)tier='him';else if(beatPct>=70)tier='locked';else if(beatPct>=50)tier='solid';else tier='grind';
  }
  const pool=pools[tier];
  const verdict=pool[Math.floor(Date.now()/60000)%pool.length];

  el.innerHTML=`
    <div class="dash-v2-card">
      <div class="dv2-hero">${pct}%</div>
      <div class="dv2-label">Progress</div>
      <div class="dv2-sub"><b>${donePts}</b> of <b>${totalPts}</b> pts completed</div>
      <div class="dash-v2-bar"><div class="dash-v2-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--accent1),var(--accent2))"></div></div>
      <div class="dash-v2-spark">${spark.map(s=>`<div class="dash-v2-spark-bar ${s.isToday?'today-bar':''}" style="height:${Math.max(2,s.count/sparkMax*100)}%"></div>`).join('')}</div>
    </div>
    <div class="dash-v2-card">
      <div class="dv2-hero">${doneToday}</div>
      <div class="dv2-label">Done Today${doneToday>=dailyGoal?' 🔥':''}</div>
      <div class="dv2-sub"><b>${active.length}</b> active${overdue?` · <span class="dv2-overdue">${overdue} overdue</span>`:''}${highPri?` · <b>${highPri}</b> high pri`:''}</div>
      ${doneToday>0?`<div class="dash-v2-bar"><div class="dash-v2-bar-fill" style="width:${Math.min(100,doneToday/dailyGoal*100)}%;background:linear-gradient(90deg,var(--accent2),var(--accent3,var(--accent1)))"></div></div>`:''}
    </div>
    <div class="dash-v2-card">
      <div class="dv2-hero">${streak}</div>
      <div class="dv2-label">Day Streak${streak<3?' 😴':streak>=7?' 🔥':''}</div>
      <div class="dv2-verdict">${verdict}</div>
      <div class="dv2-sub">${deadlines.length?`<b>${beatPct}%</b> deadlines met`:'No deadlines tracked yet'}</div>
    </div>`;
}

async function sendAlfred(){

    while(true){const{done,value}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';
      for(const line of lines){if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(!d)continue;
        try{const e=JSON.parse(d);if(e.type==='content_block_delta'&&e.delta?.type==='text_delta'&&e.delta?.text){
          if(firstToken){firstToken=false;el.innerHTML='';el.classList.add('str')}
          full+=e.delta.text;
          pendingVisible=full.replace(/```(?:task|done|edit|sheet|rfi|rfi-sent)\s*\n[\s\S]*?\n```/g,'');
          if(!pendingRaf)pendingRaf=requestAnimationFrame(flushRender);
        }}catch{}}}
    // Flush any pending render before finalizing
    if(pendingRaf){cancelAnimationFrame(pendingRaf);flushRender()}
    el.classList.remove('str');alfHistory.push({role:'assistant',content:full});

    const finalVisible=full.replace(/```(?:task|done|edit|sheet|rfi|rfi-sent)\s*\n[\s\S]*?\n```/g,'').trim();
    renderAlfStreaming(el,finalVisible,prevWords,false);
    const tm=full.match(/```task\s*\n?([\s\S]*?)\n?```/);
    if(tm){try{const c=JSON.parse(tm[1]);createTask({title:c.title||'',priority:c.priority||'medium',category:c.category||'personal',difficulty:c.difficulty||'medium',dueDate:c.dueDate||'',notes:c.notes||'',projectId:(c.projectId&&projects[c.projectId])?c.projectId:''})}catch{}}
    const dm=full.match(/```done\s*\n?([\s\S]*?)\n?```/);
    if(dm){try{const c=JSON.parse(dm[1]);if(c.taskId){fbSet(`todo/tasks/${c.taskId}/completed`,true);fbSet(`todo/tasks/${c.taskId}/completedAt`,new Date().toISOString())}}catch{}}
    const em=full.match(/```edit\s*\n?([\s\S]*?)\n?```/);
    if(em){try{const c=JSON.parse(em[1]);if(c.taskId&&c.field)updateTask(c.taskId,c.field,c.value)}catch{}}
    // ── RFI commands ──
    const rm=full.match(/```rfi\s*\n?([\s\S]*?)\n?```/);
    if(rm){
      try{
        const c=JSON.parse(rm[1]);
        const num=c.rfiNumber||nextRfiNumber();
        createTask({
          title:c.title||'',category:'rfi',rfiNumber:num,priority:c.priority||'medium',
          difficulty:'easy',dueDate:c.dueDate||'',
          description:c.description||'',sendTo:c.sendTo||'',sent:false
        });
      }catch{}
    }
    const rs=full.match(/```rfi-sent\s*\n?([\s\S]*?)\n?```/);
    if(rs){
      try{
        const c=JSON.parse(rs[1]);
        if(c.taskId){
          const now=c.sent!==false;
          fbSet(`todo/tasks/${c.taskId}/sent`,now);
          if(now)fbSet(`todo/tasks/${c.taskId}/sentAt`,new Date().toISOString());
        }
      }catch{}
    }
    const sm=full.match(/```sheet\s*\n?([\s\S]*?)\n?```/);
    if(sm){try{const c=JSON.parse(sm[1]);if(c.sheetId&&c.row)writeSheet(c.sheetId,c.tab||'Sheet1',c.row)}catch{}}
  }catch(e){el.classList.remove('str');el.innerHTML='';el.textContent='Error: '+e.message}
  alfStreaming=false;
}

// Render streaming text with word-level reveal animation.
// Walks the formatted markdown DOM, wraps each word in a .alf-word span,
// applies .reveal (fade+blur-in animation) only to words beyond `prevWords`.
// Returns the new total word count so the next tick can skip animating them.
function renderAlfStreaming(el,text,prevWords,showCaret){
  el.innerHTML=formatAlfMd(text);
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  const textNodes=[];let n;while((n=walker.nextNode()))textNodes.push(n);
  let wordIdx=0;
  textNodes.forEach(node=>{
    const parts=node.textContent.split(/(\s+)/);
    const frag=document.createDocumentFragment();
    parts.forEach(part=>{
      if(!part)return;
      if(!/\S/.test(part)){frag.appendChild(document.createTextNode(part));return}
      const span=document.createElement('span');
      span.className='alf-word';
      span.textContent=part;
      if(wordIdx>=prevWords){
        span.classList.add('reveal');
        span.style.animationDelay=Math.min((wordIdx-prevWords)*55,900)+'ms';
      }
      frag.appendChild(span);
      wordIdx++;
    });
    node.parentNode.replaceChild(frag,node);
  });
  if(showCaret){
    const caret=document.createElement('span');
    caret.className='alf-caret';
    el.appendChild(caret);
  }
  return wordIdx;
}

// Minimal markdown → HTML for Alfred's replies. HTML escapes first, then
// applies transforms. Supports: **bold**, *italic*, `code`, ```fenced code```,
// ### headings, - and 1. lists, links, paragraphs, line breaks.
function formatAlfMd(text){
  if(!text)return '';
  // Escape HTML first
  let h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Fenced code blocks ```lang\n...\n```
  h=h.replace(/```([a-z]*)\n?([\s\S]*?)```/g,(m,lang,code)=>'<pre><code>'+code.trim()+'</code></pre>');
  // Inline code
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Headings
  h=h.replace(/^###\s+(.+)$/gm,'<h4>$1</h4>');
  h=h.replace(/^##\s+(.+)$/gm,'<h3>$1</h3>');
  // Bold (before italic)
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  // Italic *text* (not **)
  h=h.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  // Links [text](url)
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Unordered list items
  h=h.replace(/^(?:-|\*)\s+(.+)$/gm,'<li class="ul">$1</li>');
  // Ordered list items
  h=h.replace(/^\d+\.\s+(.+)$/gm,'<li class="ol">$1</li>');
  // Wrap consecutive <li> into ul/ol
  h=h.replace(/(?:<li class="ul">[\s\S]*?<\/li>\n?)+/g,m=>'<ul>'+m.replace(/ class="ul"/g,'')+'</ul>');
  h=h.replace(/(?:<li class="ol">[\s\S]*?<\/li>\n?)+/g,m=>'<ol>'+m.replace(/ class="ol"/g,'')+'</ol>');
  // Horizontal rule
  h=h.replace(/^---+$/gm,'<hr>');
  // Paragraphs: split on blank lines, wrap non-block chunks
  h=h.split(/\n{2,}/).map(chunk=>{
    const c=chunk.trim();
    if(!c)return '';
    // If already starts with a block element, leave it
    if(/^<(h3|h4|ul|ol|pre|hr)/.test(c))return c;
    return '<p>'+c.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  return h;
}

// Alfred brain — orbiting dots with bright core + streaming pulse
let alfBaseSpeeds=[];
function initAlfBrain(){
  alfBrainInit=true;const canvas=document.getElementById('alfBrain');
  const W=canvas.parentElement.clientWidth*2,H=canvas.parentElement.clientHeight*2;
  canvas.width=W;canvas.height=H;canvas.style.width=canvas.parentElement.clientWidth+'px';canvas.style.height=canvas.parentElement.clientHeight+'px';
  // 3 concentric rings — scaled to canvas, more nodes, wider spread
  const cx=W/2,cy=H/2;
  const baseR=Math.min(cx,cy)*0.85;
  const colors=['#A78BFA','#60A5FA','#F472B6'];
  const rings=[
    {n:5,rFrac:0.28, sp:.0030, sz:3.2},
    {n:7,rFrac:0.58, sp:-.0018,sz:2.6},
    {n:9,rFrac:0.92, sp:.0012, sz:2.0},
  ];
  alfNodes=[];alfBaseSpeeds=[];
  rings.forEach((ring,ri)=>{
    for(let i=0;i<ring.n;i++){
      alfNodes.push({angle:(i/ring.n)*Math.PI*2+ri*0.3,r:baseR*ring.rFrac,speed:ring.sp,size:ring.sz,color:colors[ri],glow:0});
      alfBaseSpeeds.push(ring.sp);
    }
  });
  alfBrainRafId=requestAnimationFrame(alfBrainLoop);
}
function alfBrainLoop(){
  const c=document.getElementById('alfBrain');if(!c)return;
  // Pause the loop entirely when sidebar is closed — saves CPU
  if(!alfOpen){alfBrainRafId=null;return}
  const ctx=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  const t=Date.now()*0.001;
  // Always-on breathing brightness (0.7 - 1.0)
  const baseBright=0.7+Math.sin(t*0.8)*0.15;
  // Thinking pulse during streaming — much stronger rhythm
  const thinking=alfStreaming?0.5+Math.abs(Math.sin(t*3.5))*0.5:1;
  // Additive blending for the glow bloom
  ctx.globalCompositeOperation='lighter';
  // Subtle rings
  const minR=Math.min(cx,cy)*0.85;
  [0.28,0.58,0.92].forEach(f=>{
    ctx.strokeStyle='rgba(139,92,246,0.05)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,minR*f,0,Math.PI*2);ctx.stroke();
  });
  // Connections between adjacent rings
  ctx.lineWidth=0.8;
  for(let i=0;i<alfNodes.length;i++){
    const a=alfNodes[i];
    // Speed up during streaming
    a.angle+=a.speed*(alfStreaming?3.2:1);
    const ax=cx+Math.cos(a.angle)*a.r,ay=cy+Math.sin(a.angle)*a.r;
    for(let j=i+1;j<alfNodes.length;j++){
      const b=alfNodes[j];
      if(Math.abs(a.r-b.r)<20)continue;
      const bx=cx+Math.cos(b.angle)*b.r,by=cy+Math.sin(b.angle)*b.r;
      const d=Math.hypot(ax-bx,ay-by);
      if(d<minR*0.6){
        const alpha=(1-d/(minR*0.6))*0.18*thinking;
        ctx.strokeStyle='rgba(167,139,250,'+alpha.toFixed(3)+')';
        ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
      }
    }
    // Node — cheap: no shadowBlur (software-rendered blur is the killer),
    // use additive-blended filled arcs for glow instead
    const bright=baseBright*thinking+(a.glow>0?a.glow*0.6:0);
    if(a.glow>0)a.glow-=.008;
    ctx.fillStyle=a.color;
    ctx.globalAlpha=Math.min(bright,1);
    ctx.beginPath();ctx.arc(ax,ay,a.size,0,Math.PI*2);ctx.fill();
  }
  // Center core — pulses with Alfred's heartbeat
  const corePulse=1+Math.sin(t*2.2)*0.2+(alfStreaming?Math.abs(Math.sin(t*5))*0.4:0);
  ctx.fillStyle='#C4B5FD';ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(cx,cy,4*corePulse,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(cx,cy,1.8*corePulse,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  alfBrainRafId=requestAnimationFrame(alfBrainLoop);
}
function flashAlfBrain(){alfNodes.forEach(n=>{n.glow=1})}

// ═══════════════════════════════════════════
//  anime.js micro-interactions — fire-and-forget wrapper.
//  Policy: prefers-reduced-motion → no JS animation (elements land in
//  final state); calm (default) → 0.75× durations; lively → full.
//  CDN failure degrades to instant UI (fxOn() checks window.anime).
// ═══════════════════════════════════════════
const _fxReduced=matchMedia('(prefers-reduced-motion: reduce)');
function fxOn(){return typeof anime!=='undefined'&&!_fxReduced.matches}
function fxScale(){return(document.documentElement.getAttribute('data-motion')||'calm')==='lively'?1:0.75}
function fx(targets,params){
  if(!fxOn()||!targets)return null;
  if(targets.length===0)return null;
  const p={...params};
  if(p.duration)p.duration*=fxScale();
  try{return anime.animate(targets,p)}catch(e){return null}
}
// Staggered card entrance — capped so huge lists stay snappy
function fxStaggerIn(nodes){
  if(!fxOn())return;

// Build unique requester list from active (non-completed) tasks
function uniqueRequesters(){
  const m=new Map();
  Object.values(tasks).forEach(t=>{
    if(t.completed)return;
    const f=(t.from||'').trim();
    if(!f)return;
    m.set(f,(m.get(f)||0)+1);
  });

}
function renderRequesterStrip(){
  const el=document.getElementById('reqStrip');

  const reqs=uniqueRequesters();

  if(!reqs.length&&!unassigned){el.innerHTML='';return}
  let html='<span class="req-strip-label">From</span>';

    html+=`<span class="req-pill ${fFrom===''?'active':''}" onclick="setFromFilter('')">Mine <span class="cnt">${unassigned}</span></span>`;

function refreshFromSuggestions(){
