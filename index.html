<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenYap Todo</title>
<meta name="description" content="Career and OpenYap tasks, what is in progress, and a log of finished work.">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%237c9cff' stroke-width='3'/><path d='M10 16.5l4 4 8-9' fill='none' stroke='%237c9cff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>
// Apply the saved theme before first paint. First visit inherits the legacy app's choice.
(function(){var t='slate';try{t=localStorage.getItem('oym_theme');if(!t){var l=localStorage.getItem('oyt_theme')||'';t={'':'slate','t-ocean':'ocean','t-forest':'forest','t-sunset':'sunset','t-mono':'mono','t-sakura':'sakura','t-light':'light'}[l]||'slate'}}catch(e){t='slate'}document.documentElement.setAttribute('data-theme',t)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<style>
/* ── Themes ─────────────────────────────────────────────────────────────
   Every theme sets the same tokens. The seven legacy themes keep their
   colors; Minimal and Dracula are new. --print* are the PDF ink colors. */
:root,[data-theme="slate"]{
  color-scheme:dark;
  --bg:#0b0e14;--surface:#121721;--raise:#1a2130;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --text:#e6edf3;--body:#b4bfcc;--muted:#7d8896;--faint:#3f4856;
  --accent:#7c9cff;--on-accent:#0b0e14;--career:#5ec2d6;--openyap:#7c9cff;
  --danger:#f87171;--urgent:#fbbf24;--ok:#6ee7a0;--scrim:rgba(3,5,9,.62);
  --glow-a:#7c9cff;--glow-b:#5ec2d6;--glow-opacity:.12;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
[data-theme="ocean"]{
  --bg:#071116;--surface:#0c1a21;--raise:#122630;--line:rgba(125,211,252,.08);--line-2:rgba(125,211,252,.17);
  --text:#e4f4f8;--body:#accbd3;--muted:#718f98;--faint:#35515b;
  --accent:#38bdf8;--openyap:#38bdf8;--career:#5eead4;--scrim:rgba(2,12,17,.68);
  --glow-a:#0ea5e9;--glow-b:#2dd4bf;--glow-opacity:.14;
}
[data-theme="forest"]{
  --bg:#09110c;--surface:#101b14;--raise:#18271d;--line:rgba(167,243,208,.07);--line-2:rgba(167,243,208,.15);
  --text:#e7f2e9;--body:#b5cab9;--muted:#78907e;--faint:#3c5442;
  --accent:#6ee7a0;--openyap:#6ee7a0;--career:#a3c9b4;--scrim:rgba(4,12,6,.68);
  --glow-a:#22c55e;--glow-b:#a3c9b4;--glow-opacity:.11;
}
[data-theme="sunset"]{
  --bg:#150c0b;--surface:#211310;--raise:#301b18;--line:rgba(253,186,116,.08);--line-2:rgba(253,186,116,.17);
  --text:#faeee9;--body:#d8bdb4;--muted:#987a72;--faint:#61443e;
  --accent:#fb923c;--openyap:#fb923c;--career:#f9a8d4;--scrim:rgba(15,5,4,.7);
  --glow-a:#f97316;--glow-b:#ec4899;--glow-opacity:.13;
}
[data-theme="mono"]{
  --bg:#0c0e11;--surface:#14171b;--raise:#1d2127;--line:rgba(226,232,240,.07);--line-2:rgba(226,232,240,.14);
  --text:#edf0f3;--body:#bdc3cb;--muted:#808892;--faint:#444b54;
  --accent:#cdd5de;--openyap:#cdd5de;--career:#8b95a3;--glow-a:#cbd5e1;--glow-b:#64748b;--glow-opacity:.07;
}
[data-theme="sakura"]{
  --bg:#130d15;--surface:#1e1421;--raise:#2b1c30;--line:rgba(244,183,214,.08);--line-2:rgba(244,183,214,.16);
  --text:#f7ebf4;--body:#d5bcd0;--muted:#967b91;--faint:#5c4258;
  --accent:#f0a6c8;--openyap:#f0a6c8;--career:#c4b5fd;--scrim:rgba(12,5,13,.7);
  --glow-a:#ec4899;--glow-b:#a78bfa;--glow-opacity:.13;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f5fb;--surface:#ffffff;--raise:#ffffff;--line:rgba(26,26,46,.08);--line-2:rgba(26,26,46,.15);
  --text:#1a1a2e;--body:#3f3f55;--muted:#6b6b80;--faint:#b9b9c8;
  --accent:#7c3aed;--on-accent:#ffffff;--career:#2563eb;--openyap:#7c3aed;
  --danger:#dc2626;--urgent:#b45309;--ok:#15803d;--scrim:rgba(26,26,46,.28);
  --glow-a:#8b5cf6;--glow-b:#3b82f6;--glow-opacity:.09;
}
[data-theme="minimal"]{
  color-scheme:light;
  --bg:#ffffff;--surface:#f7f7f7;--raise:#ffffff;--line:#efefef;--line-2:#dedede;
  --text:#171717;--body:#3a3a3a;--muted:#686868;--faint:#b8b8b8;
  --accent:#171717;--on-accent:#ffffff;--career:#737373;--openyap:#171717;
  --danger:#c0392b;--urgent:#171717;--ok:#171717;--scrim:rgba(0,0,0,.18);
  --glow-a:#b8b8b8;--glow-b:#ededed;--glow-opacity:.055;
}
[data-theme="dracula"]{
  color-scheme:dark;
  --bg:#282a36;--surface:#21222c;--raise:#343746;--line:rgba(98,114,164,.22);--line-2:#44475a;
  --text:#f8f8f2;--body:#e0e0da;--muted:#91a0d0;--faint:#59617f;
  --accent:#bd93f9;--on-accent:#282a36;--career:#8be9fd;--openyap:#bd93f9;
  --danger:#ff5555;--urgent:#ffb86c;--ok:#50fa7b;--scrim:rgba(20,21,28,.7);
  --glow-a:#bd93f9;--glow-b:#8be9fd;--glow-opacity:.13;
  --font:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;isolation:isolate;transition:background-color .35s,color .35s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* Quiet color in motion. The shapes stay behind the product and follow the
   active theme; Anime.js gives each one a different, very slow orbit. */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient-orb{position:absolute;display:block;width:34rem;height:34rem;border-radius:50%;filter:blur(72px);opacity:var(--glow-opacity);will-change:transform;background:var(--glow-a)}
.ambient-orb:nth-child(1){top:-22rem;right:-12rem}
.ambient-orb:nth-child(2){bottom:-25rem;left:-15rem;background:var(--glow-b);width:40rem;height:40rem}
.ambient-orb:nth-child(3){top:42%;left:56%;width:17rem;height:17rem;background:linear-gradient(135deg,var(--glow-a),var(--glow-b));opacity:calc(var(--glow-opacity) * .42);filter:blur(58px)}
.ambient-line{position:absolute;top:15%;right:8%;width:1px;height:40vh;background:linear-gradient(transparent,var(--accent),transparent);opacity:.14;transform-origin:50% 50%;will-change:transform,opacity}

/* ── Header ── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background-color .35s,border-color .35s}
.top .wrap{display:flex;align-items:center;gap:20px;height:58px}
.today{font-weight:600;font-size:15px;letter-spacing:-.005em;white-space:nowrap}
.offline{font-size:12px;color:var(--danger)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{padding:6px 11px;border-radius:7px;color:var(--muted);font-size:14px;transform-origin:50% 60%}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);background:var(--raise)}
.acts{display:flex;align-items:center;gap:10px}
.theme-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center}
.theme-btn span{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--accent) 50%,var(--career) 50%)}

/* ── Controls ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);font-size:13px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:none}
.btn.danger{color:var(--danger)}
.link{color:var(--accent);font-size:13px}
.link:hover{text-decoration:underline}
.link.danger{color:var(--danger)}
.seg{justify-self:start;display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.seg button{padding:4px 11px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.seg.sm button{padding:2px 9px;font-size:12px}
.chip{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--muted)}
.chip.urgent[aria-pressed="true"]{color:var(--urgent);border-color:var(--urgent)}
.txt{height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);width:100%;outline:none}
.txt:focus{border-color:var(--accent)}
.icon-btn{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:7px;color:var(--muted)}
.icon-btn:hover{color:var(--text);background:var(--surface)}

/* ── Tasks view: two sides ── */
.switch{display:none}
.switch .dim{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.sides{display:grid;grid-template-columns:1fr 1fr;padding-top:8px}
.side{display:grid;grid-template-rows:subgrid;grid-row:span 4;padding:0 36px 48px;min-width:0}
.side:first-child{padding-left:0}
.side:last-child{padding-right:0;border-left:1px solid var(--line)}
.side[data-side="career"]{--side-c:var(--career)}
.side[data-side="openyap"]{--side-c:var(--openyap)}
.side-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 0 0}
.side-name{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.side-name::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--side-c)}
.side-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* The one loud element: what you are doing right now, per side. */
.now{padding:18px 0 22px 16px;margin:14px 0 6px;border-left:2px solid var(--side-c);min-width:0}
.now.empty{border-left-color:var(--line-2)}
.now-label{font-size:12px;color:var(--side-c);font-weight:500}
.now.empty .now-label{color:var(--muted)}
.now-title{font-size:26px;line-height:1.22;font-weight:500;letter-spacing:-.015em;margin:4px 0 8px;overflow-wrap:anywhere;cursor:text}
.now.empty .now-title{color:var(--faint);cursor:default}
.now-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.now-acts{display:flex;gap:8px;margin-top:14px}
.now-acts .btn.primary{background:var(--side-c);border-color:var(--side-c)}
.now-more{margin-top:12px;font-size:13px;color:var(--muted)}
.now-more button{color:var(--body);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.now .editor{padding-top:6px}

.add{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);padding:10px 0;margin-top:6px}
.add:focus-within{border-bottom-color:var(--side-c,var(--accent))}
.add input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.add input::placeholder{color:var(--muted)}
.plus{width:18px;display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1}
.plus::before{content:'+'}
.add-hint{font-size:12px;color:var(--muted);padding-top:6px;display:none}
.addwrap:focus-within .add-hint{display:block}

.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);position:relative}
.task.open{display:block}
.ck{flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck:hover{border-color:var(--side-c)}
.task.completing .ck{background:var(--side-c);border-color:var(--side-c)}
.task.completing .t-title{color:var(--muted);text-decoration:line-through}
.task.completing{transition:opacity .28s .1s;opacity:.35}
.task-spark{position:absolute;left:8px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--side-c);pointer-events:none;z-index:2}
.t-main{flex:1;min-width:0;cursor:text}
.t-title{overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:2px;font-size:12px;color:var(--muted)}
.t-meta svg{display:block}
.due.late{color:var(--danger)}
.due.soon{color:var(--text)}
.urgent{color:var(--urgent)}
.t-go{flex:none;width:28px;height:28px;margin-top:-3px;display:grid;place-items:center;border-radius:7px;color:var(--muted);opacity:0;transition:opacity .12s}
.t-go:hover{color:var(--side-c);background:var(--surface)}
.task:hover .t-go,.t-go:focus-visible{opacity:1}
@media (hover:none){.t-go{opacity:.7}}
.list-empty{padding:14px 0;color:var(--muted);font-size:14px;list-style:none}
.side-foot{padding-top:14px;font-size:13px;color:var(--muted)}
.side-foot button{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.side-foot button:hover{color:var(--text)}

/* Inline editor */
.editor{display:grid;gap:10px;padding:4px 0 6px}
.e-title{width:100%;background:none;border:0;border-bottom:1px solid var(--line-2);padding:4px 0 8px;font-size:16px;font-weight:500;outline:none}
.e-title:focus{border-bottom-color:var(--side-c,var(--accent))}
.e-notes{width:100%;min-height:76px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.5;outline:none;color:var(--body)}
.e-notes:focus{border-color:var(--line-2)}
.e-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.e-field{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.e-field input{height:28px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);padding:0 8px;font-size:12px;outline:none}
.e-foot{padding-top:2px}
.e-created{font-size:12px;color:var(--muted);margin-left:auto}

/* ── Done view ── */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:26px 0 0}
.search{flex:1;min-width:180px;max-width:280px;margin-left:auto;height:32px;font-size:13px}
.summary{margin:18px 0 0;font-size:14px;color:var(--body)}
.summary .dim{color:var(--muted)}
.bulk{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
.logadd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);padding:10px 0;margin-top:14px}
.logadd:focus-within{border-bottom-color:var(--accent)}
.logadd input{flex:1;min-width:0;background:none;border:0;outline:none}
.logadd input::placeholder{color:var(--muted)}
.wk{margin-top:30px}
.wk-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.drow{display:grid;grid-template-columns:56px 8px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.d-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.d-dot{width:7px;height:7px;border-radius:50%;background:var(--side-c);align-self:center}
.d-main{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.d-title{overflow-wrap:anywhere}
.d-proj{font-size:12px;color:var(--muted)}
.d-lock{color:var(--muted);display:inline-flex;align-self:center}
.drow.is-priv .d-title{color:var(--muted)}
.d-acts{display:flex;gap:2px;opacity:0;transition:opacity .12s;align-self:center}
.drow:hover .d-acts,.drow:focus-within .d-acts{opacity:1}
@media (hover:none){.d-acts{opacity:.8}}
.done-empty{padding:40px 0;color:var(--muted)}

/* ── Dashboard ── */
.late{color:var(--danger)}
.dash{padding:34px 0 10px;display:grid;gap:56px}
.d-top{display:grid;grid-template-columns:1.2fr 1fr 1fr;align-items:end}
.hero-n{font-size:72px;line-height:.9;font-weight:600;letter-spacing:-.04em}
.hero-l{font-size:15px;color:var(--body);margin-top:14px}
.hero-s{font-size:13px;color:var(--muted);margin-top:3px}
.tile{padding:4px 0 2px 28px;border-left:1px solid var(--line);min-width:0}
.tile-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.tile-h::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--side-c)}
.tile-n{font-size:34px;line-height:1;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px}
.tile-l,.tile-meta{font-size:13px;color:var(--muted)}
.tile-now{margin-top:12px;font-size:13px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-now b{font-weight:500;color:var(--side-c)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-h h3{margin:0;font-size:14px;font-weight:600}
.sec-h span{font-size:13px;color:var(--muted);display:inline-flex;gap:14px;align-items:baseline}
.weeks{display:grid;gap:26px}
.wrow{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:end}
.wlab{font-size:13px;font-weight:500;display:grid;gap:2px;padding-bottom:2px}
.wlab b{display:flex;align-items:center;gap:8px;font-weight:600}
.wlab b::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--side-c)}
.wlab span{font-size:12px;color:var(--muted);font-weight:400}
.wplot{height:92px;display:grid;grid-template-columns:repeat(12,1fr);align-items:end;border-bottom:1px solid var(--line-2)}
.wcol{position:relative;height:100%;display:flex;justify-content:center;align-items:flex-end}
.wcol:hover .wbar{filter:brightness(1.15)}
.wbar{width:min(22px,58%);height:var(--h);background:var(--side-c);border-radius:4px 4px 0 0;transform-origin:50% 100%}
.wbar.nz{min-height:3px}
.wcap{position:absolute;bottom:calc(var(--h) + 5px);font-size:11px;color:var(--body);font-variant-numeric:tabular-nums}
.wx{display:grid;grid-template-columns:repeat(12,1fr);margin-left:128px;font-size:11px;color:var(--muted);margin-top:-16px}
.wx span{text-align:center;white-space:nowrap}
.wtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:18px}
.wtable th{text-align:left;font-weight:500;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line-2)}
.wtable td{padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wtable th:not(:first-child),.wtable td:not(:first-child){text-align:right}
.dsplit{display:grid;grid-template-columns:auto 1fr;gap:64px;align-items:start}
.heat{display:grid;gap:6px;justify-content:start}
.hmonths,.hgrid{display:grid;grid-template-columns:repeat(26,11px);gap:3px}
.hmonths{margin-left:34px;font-size:11px;color:var(--muted);height:14px}
.hmonths span{white-space:nowrap;overflow:visible}
.hbody{display:flex;gap:8px}
.hdays{display:grid;grid-template-rows:repeat(7,11px);gap:3px;width:26px;font-size:10px;color:var(--muted);line-height:11px}
.hgrid{grid-template-rows:repeat(7,11px);grid-auto-flow:column}
.hc{width:11px;height:11px;border-radius:2px;background:var(--line-2)}
.hc.is-f{background:none}
.hc[data-b="1"],.hlegend i[data-b="1"]{background:color-mix(in srgb,var(--accent) 32%,var(--line-2))}
.hc[data-b="2"],.hlegend i[data-b="2"]{background:color-mix(in srgb,var(--accent) 56%,var(--line-2))}
.hc[data-b="3"],.hlegend i[data-b="3"]{background:color-mix(in srgb,var(--accent) 78%,var(--line-2))}
.hc[data-b="4"],.hlegend i[data-b="4"]{background:var(--accent)}
.hc:not(.is-f):hover{outline:1px solid var(--text);outline-offset:1px}
.hlegend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin:8px 0 0 34px}
.hlegend i{width:11px;height:11px;border-radius:2px;background:var(--line-2)}
.hlegend span{margin:0 5px}
.up-row{display:grid;grid-template-columns:58px 8px minmax(0,1fr);gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.up-row:hover .up-t{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.up-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.up-d.late{color:var(--danger)}
.up-t{overflow-wrap:anywhere}
.up-more{font-size:13px;color:var(--muted);padding-top:10px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--raise);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--body);white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.tip b{color:var(--text);font-size:13px;font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}

/* ── Timeline: Career left of the spine, OpenYap right ── */
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;padding:34px 0 8px}
.tl-top h2{margin:0;font-size:15px;font-weight:600}
.tl-top p{margin:0;font-size:13px;color:var(--muted)}
.tl-cols{display:grid;grid-template-columns:1fr 96px 1fr;font-size:13px;font-weight:600;padding:18px 0 8px;border-bottom:1px solid var(--line)}
.tl-cols span{display:flex;align-items:center;gap:8px}
.tl-cols span:first-child{justify-content:flex-end}
.tl-cols i{width:8px;height:8px;border-radius:2px;background:var(--side-c)}
.tl{position:relative;padding:10px 0 20px}
.tl-spine{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line-2);transform-origin:50% 0}
.tl-week{position:relative;display:flex;justify-content:center;padding:26px 0 8px}
.tl-week span{background:var(--bg);padding:3px 10px;font-size:12px;color:var(--muted)}
.tl-day{position:relative;display:grid;grid-template-columns:1fr 96px 1fr;align-items:start;padding:6px 0}
.tl-date{display:flex;justify-content:center;padding-top:2px}
.tl-date span{background:var(--bg);border:1px solid var(--line-2);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-day.is-today .tl-date span{border-color:var(--accent);color:var(--text);font-weight:500}
.tl-day.is-today::before{content:'';position:absolute;left:0;right:0;top:15px;height:1px;background:linear-gradient(90deg,transparent,var(--line-2) 20%,var(--line-2) 80%,transparent)}
.tl-lane{display:grid;gap:10px;min-width:0;position:relative}
.tl-item{display:flex;gap:10px;align-items:flex-start;min-width:0}
.tl-lane[data-lane="career"] .tl-item{flex-direction:row-reverse;text-align:right}
.tl-item[data-open]{cursor:pointer}
.tl-item[data-open]:hover .tl-t{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.tl-dot{flex:none;width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--side-c)}
.tl-txt{min-width:0}
.tl-t{font-size:14px;overflow-wrap:anywhere}
.tl-m{font-size:12px;color:var(--muted)}
.k-due .tl-dot,.k-due-today .tl-dot{background:none;box-shadow:inset 0 0 0 1.5px var(--side-c)}
.k-due .tl-t{color:var(--body)}
.k-late .tl-dot{background:none;box-shadow:inset 0 0 0 1.5px var(--danger)}
.k-late .tl-m{color:var(--danger)}
.k-now .tl-dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--side-c) 28%,transparent)}
.k-now .tl-t{font-weight:500}
.tl-item.is-priv .tl-t{color:var(--muted)}
.tl-more{display:flex;justify-content:center;padding:10px 0 30px}

/* ── Calendar: due work and finished work share one month ── */
.cal{padding:32px 0 18px}
.cal-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.cal-title h2{font-size:28px;line-height:1.1;letter-spacing:-.025em;margin:0 0 5px;font-weight:600}
.cal-title p{margin:0;color:var(--muted);font-size:13px}
.cal-nav{display:flex;align-items:center;gap:7px}
.cal-nav .icon-btn{border:1px solid var(--line-2);font-size:19px;line-height:1}
.cal-legend{display:flex;align-items:center;gap:18px;margin:0 0 12px;font-size:12px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:7px}
.cal-legend i{width:7px;height:7px;border-radius:50%;background:var(--side-c)}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-weekdays{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cal-weekdays span{padding:0 9px 8px}
.cal-grid{border-top:1px solid var(--line-2);border-left:1px solid var(--line)}
.cal-day{min-height:118px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;transition:background .15s,box-shadow .15s}
.cal-day:hover{background:color-mix(in srgb,var(--surface) 68%,transparent)}
.cal-day.is-out{color:var(--muted);background:color-mix(in srgb,var(--surface) 25%,transparent)}
.cal-day.is-selected{background:color-mix(in srgb,var(--accent) 7%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent)}
.cal-num{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:12px;color:var(--body);font-variant-numeric:tabular-nums;margin-bottom:4px}
.cal-num:hover{background:var(--raise);color:var(--text)}
.cal-day.is-today .cal-num{background:var(--accent);color:var(--on-accent);font-weight:600}
.cal-events{display:grid;gap:3px}
.cal-event{display:grid;grid-template-columns:6px minmax(0,1fr);align-items:center;gap:6px;width:100%;padding:2px 3px;border-radius:4px;font-size:11px;color:var(--body);min-width:0}
button.cal-event:hover{background:var(--raise);color:var(--text)}
.cal-event span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-mark{width:6px;height:6px;border-radius:50%;background:var(--side-c)}
.cal-event.k-done{color:var(--muted)}
.cal-event.k-done .cal-mark{background:transparent;box-shadow:inset 0 0 0 1px var(--side-c)}
.cal-event.is-late{color:var(--danger)}
.cal-more{font-size:10px;color:var(--muted);padding:2px 3px}
.cal-agenda{display:grid;grid-template-columns:180px minmax(0,1fr);gap:30px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.cal-agenda h3{font-size:14px;margin:0 0 3px;font-weight:600}
.cal-agenda-head p{font-size:12px;color:var(--muted);margin:0}
.cal-agenda-list{display:grid}
.cal-a-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:11px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.cal-a-row[data-open]{cursor:pointer}
.cal-a-row[data-open]:hover .cal-a-title{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.cal-a-dot{width:7px;height:7px;border-radius:50%;background:var(--side-c);align-self:center}
.cal-a-row.k-done .cal-a-dot{background:transparent;box-shadow:inset 0 0 0 1px var(--side-c)}
.cal-a-title{overflow-wrap:anywhere}
.cal-a-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.cal-a-row.is-late .cal-a-meta{color:var(--danger)}

/* ── Export sheet ── */
.back{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);border:1px solid var(--line-2);border-radius:14px;width:min(700px,100%);max-height:min(90vh,920px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.sheet-head h2{margin:0;font-size:17px;font-weight:600}
.sheet-body{padding:16px 22px 8px;overflow:auto;display:grid;gap:16px}
.fld{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.lbl{font-size:13px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:16px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--body);cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.pick-head{display:flex;align-items:baseline;gap:14px;font-size:13px;color:var(--body)}
.pick-head span{margin-right:auto}
.pick{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto}
.pick-row{display:grid;grid-template-columns:16px 58px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.pick-row:last-child{border-bottom:0}
.pick-row input{accent-color:var(--accent);margin:0;align-self:center}
.pk-date{color:var(--muted);font-variant-numeric:tabular-nums}
.pk-title{overflow-wrap:anywhere}
.pk-tag{font-size:11px;color:var(--muted)}
.pick-empty{padding:18px 12px;color:var(--muted);font-size:13px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tpl{display:grid;gap:6px;align-content:start;padding:10px;border:1px solid var(--line-2);border-radius:10px;color:var(--muted)}
.tpl:hover{border-color:var(--muted)}
.tpl[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--text)}
.tpl svg{width:48px;height:62px;color:var(--muted)}
.tpl[aria-checked="true"] svg{color:var(--accent)}
.tpl-name{font-size:13px;font-weight:500;color:var(--text)}
.tpl-desc{font-size:12px;line-height:1.35;color:var(--muted)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.sheet-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.ex-status{margin-right:auto;font-size:13px;color:var(--muted)}
.ex-status.err{color:var(--danger)}

/* ── Theme popover, toast, footer ── */
.pop{position:fixed;z-index:70;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:10px;width:282px;box-shadow:0 18px 44px rgba(0,0,0,.3)}
.th-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.th{display:grid;justify-items:center;gap:6px;padding:8px 4px;border-radius:8px;font-size:12px;color:var(--muted)}
.th:hover{background:var(--surface);color:var(--text)}
.th[aria-pressed="true"]{color:var(--text);background:var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.th-sw{width:44px;height:30px;border-radius:7px;border:1px solid;position:relative;overflow:hidden}
.th-sw i{position:absolute;left:7px;right:7px;height:3px;border-radius:2px}
.th-sw i:first-child{top:9px}
.th-sw i:last-child{top:16px;right:18px}
.th-new{font-size:10px;color:var(--accent)}
.pop-foot{border-top:1px solid var(--line);margin-top:8px;padding:10px 4px 2px;font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);z-index:80;display:flex;align-items:center;gap:16px;max-width:calc(100vw - 32px);background:var(--raise);color:var(--text);border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{padding:40px 32px 36px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted);text-underline-offset:3px}
.foot a:hover{color:var(--text)}

/* ── Dracula: a few terminal tells, nothing more ── */
[data-theme="dracula"] body{font-size:14px}
[data-theme="dracula"] .side-name{text-transform:lowercase}
[data-theme="dracula"] .side-name::before{content:'~/';width:auto;height:auto;background:none;color:var(--muted);border-radius:0;margin-right:-9px}
[data-theme="dracula"] .now-label::before{content:'// ';color:var(--muted)}
[data-theme="dracula"] .now-title{font-size:22px;letter-spacing:0}
[data-theme="dracula"] .plus::before{content:'\276F';color:var(--ok);font-size:14px}
[data-theme="dracula"] .add input,[data-theme="dracula"] .logadd input,[data-theme="dracula"] .e-title{caret-color:var(--ok)}
[data-theme="dracula"] .ck{border:0;width:auto;height:auto;margin-top:0;border-radius:0;background:none!important;color:var(--muted);font-size:13px;line-height:1.5}
[data-theme="dracula"] .ck::before{content:'[ ]'}
[data-theme="dracula"] .ck:hover{color:var(--side-c)}
[data-theme="dracula"] .ck:hover::before{content:'[x]'}
[data-theme="dracula"] .task.completing .ck{color:var(--ok)}
[data-theme="dracula"] .task.completing .ck::before{content:'[x]'}
[data-theme="dracula"] .tab[aria-selected="true"]{background:none;color:var(--ok)}
[data-theme="dracula"] .tab[aria-selected="true"]::before{content:'> '}
[data-theme="dracula"] .today::before{content:'$ ';color:var(--ok)}
[data-theme="dracula"] .btn,[data-theme="dracula"] .seg,[data-theme="dracula"] .seg button,[data-theme="dracula"] .chip,[data-theme="dracula"] .txt{border-radius:4px}
[data-theme="dracula"] .d-dot{border-radius:1px}
/* Minimal: no swatch chrome, hairlines only */
[data-theme="minimal"] .seg{background:none}
[data-theme="minimal"] .seg button[aria-pressed="true"]{box-shadow:none;background:var(--surface)}
[data-theme="minimal"] .now{border-left-width:1px}
[data-theme="minimal"] .side-name::before{border-radius:50%}

/* ── Small screens: one side at a time ── */
@media (max-width:820px){
  .wrap{padding:0 16px}
  .top .wrap{gap:12px;height:54px}
  .today{font-size:14px}
  .switch{display:flex;margin-top:14px}
  .switch .seg{width:100%}
  .switch .seg button{flex:1;padding:6px 10px}
  .sides{grid-template-columns:1fr}
  .side{padding:0 0 40px!important;border-left:0!important;grid-row:auto;display:block}
  .sides[data-m="career"] .side[data-side="openyap"],.sides[data-m="openyap"] .side[data-side="career"]{display:none}
  .side-head{display:none}
  .now{margin-top:18px}
  .now-title{font-size:23px}
  .search{max-width:none;margin-left:0;flex-basis:100%}
  .drow{grid-template-columns:48px 8px minmax(0,1fr);gap:10px}
  .d-acts{grid-column:3;opacity:1;justify-content:flex-start;margin-left:-6px}
  .d-top{grid-template-columns:1fr 1fr;row-gap:30px}
  .hero{grid-column:1/-1}
  .tile:nth-child(2){padding-left:0;border-left:0}
  .wrow{grid-template-columns:1fr;gap:8px}
  .wx{margin-left:0;margin-top:-4px}
  .dsplit{grid-template-columns:1fr;gap:44px}
  .tl-cols{display:none}
  .tl-spine{left:26px}
  .tl-week{justify-content:flex-start;padding-left:0}
  .tl-day{grid-template-columns:52px 1fr;column-gap:8px}
  .tl-date{grid-column:1;grid-row:1 / span 2;justify-content:flex-start}
  .tl-lane{grid-column:2}
  .tl-lane[data-lane="career"] .tl-item{flex-direction:row;text-align:left}
  .tl-lane[data-lane="openyap"]:not(:empty){padding-top:10px}
  .cal-day{min-height:70px;padding:5px}
  .cal-num{width:24px;height:24px;margin-bottom:5px}
  .cal-events{display:flex;gap:3px;flex-wrap:wrap;padding:0 4px}
  .cal-event{display:block;width:7px;height:7px;padding:0;border-radius:50%;background:var(--side-c)}
  .cal-event.k-done{background:transparent;box-shadow:inset 0 0 0 1px var(--side-c)}
  .cal-event > *{display:none}
  .cal-more{font-size:9px;padding:0}
  .cal-agenda{grid-template-columns:1fr;gap:12px}
  .fld{grid-template-columns:1fr;gap:6px}
  .back{padding:0;place-items:end stretch}
  .sheet{width:100%;max-height:94vh;border-radius:14px 14px 0 0}
  .foot{padding:30px 16px}
}
@media (max-width:520px){
  .top .wrap{flex-wrap:wrap;height:auto;row-gap:8px;padding-top:10px;padding-bottom:8px}
  .today{flex:1;font-size:13px;color:var(--muted);font-weight:500}
  .acts{order:1}
  .tabs{order:2;flex-basis:100%;margin-left:-8px}
  .hero-n{font-size:60px}
  .tab{padding:6px 8px}
  .today .yr{display:none}
  .cal{padding-top:24px}
  .cal-top{align-items:flex-start;margin-bottom:18px}
  .cal-title h2{font-size:23px}
  .cal-title p{max-width:18ch}
  .cal-nav{flex-wrap:wrap;justify-content:flex-end;max-width:130px}
  .cal-nav .btn{order:3}
  .cal-weekdays span{padding:0 2px 7px;text-align:center;font-size:10px}
  .cal-day{min-height:58px;padding:3px}
  .cal-num{width:22px;height:22px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  body,.top{transition:none}
  .ambient-orb,.ambient-line{transform:none!important}
  .ambient-line{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <i class="ambient-orb"></i><i class="ambient-orb"></i><i class="ambient-orb"></i><i class="ambient-line"></i>

      <button class="tab" role="tab" data-view="dashboard">Dashboard</button>
      <button class="tab" role="tab" data-view="timeline">Timeline</button>
      <button class="tab" role="tab" data-view="calendar">Calendar</button>
      <button class="tab" role="tab" data-view="done">Done</button>
    </nav>
    <div class="acts">
      <button class="btn" id="exportBtn">Export</button>
      <button class="theme-btn" id="themeBtn" aria-label="Change theme" title="Theme"><span></span></button>
    </div>
  </div>
</header>

<main>
  <section id="v-tasks" class="view" aria-label="Tasks">
    <div class="wrap">
      <div class="switch"><div class="seg" role="group" aria-label="Side" id="mswitch"></div></div>
      <div class="sides" id="sides"></div>
    </div>
  </section>

  <section id="v-done" class="view" aria-label="Done" hidden>
    <div class="wrap">
      <div class="bar">
        <div class="seg" role="group" aria-label="Period" data-g="range"></div>
        <div class="seg" role="group" aria-label="Side" data-g="dside"></div>
        <input class="txt search" id="doneSearch" type="search" placeholder="Search finished work" aria-label="Search finished work">
      </div>
      <p class="summary" id="doneSummary"></p>

<script>
(()=>{

// ═══ Small helpers ═══════════════════════════════════════════════════════

};

// ═══ Themes ══════════════════════════════════════════════════════════════

  {id:'ocean',  name:'Ocean',  bg:'#071116',line:'#24434d',a:'#38bdf8',b:'#5eead4',print:'#0284c7',pc:'#0f766e',po:'#0284c7'},
  {id:'forest', name:'Forest', bg:'#09110c',line:'#2b4833',a:'#6ee7a0',b:'#a3c9b4',print:'#15803d',pc:'#4d7c65',po:'#15803d'},
  {id:'sunset', name:'Sunset', bg:'#150c0b',line:'#56332c',a:'#fb923c',b:'#f9a8d4',print:'#c2410c',pc:'#be185d',po:'#c2410c'},
  {id:'mono',   name:'Mono',   bg:'#0c0e11',line:'#333941',a:'#cdd5de',b:'#8b95a3',print:'#334155',pc:'#64748b',po:'#1e293b'},
  {id:'sakura', name:'Sakura', bg:'#130d15',line:'#51324d',a:'#f0a6c8',b:'#c4b5fd',print:'#be185d',pc:'#6d28d9',po:'#be185d'},

// ═══ Firebase (same database and paths as the legacy app) ═══════════════
const DB_URL='https://gen-lang-client-0119642855-default-rtdb.firebaseio.com';
let db=null;
try{if(!firebase.apps.length)firebase.initializeApp({databaseURL:DB_URL});db=firebase.database()}catch(e){console.error('Firebase',e)}
const newKey=p=>db.ref(p).push().key;
function upd(o){if(!db)return Promise.reject(new Error('No database'));return db.ref().update(o).catch(err=>{toast('Could not save: '+err.message);throw err})}
const TP=id=>'todo/tasks/'+id;

// ═══ State ═══════════════════════════════════════════════════════════════
const SIDES=['career','openyap'];

const other=s=>s==='career'?'openyap':'career';
const PRI_RANK={high:0,medium:1,low:2};
// Legacy tasks have no side. OpenYap-flavored titles land on the OpenYap side.
const OY_RE=/open\s?yap|\bai\b|\bllm\b|claude|minimax|deepseek/i;

let tasks={},hist={},projects={},sideMap={};
const ready={tasks:false,hist:false};
const VIEWS=['tasks','dashboard','timeline','calendar','done'];
let view=LS.get('oym_view','tasks');if(!VIEWS.includes(view))view='tasks';
// The Drive notes feature was removed; forget any connector saved on this device.
LS.del('oym_bridge');LS.del('oym_bridge_setup');LS.del('oym_upside');
let mSide=LS.get('oym_mside','career');if(!SIDES.includes(mSide))mSide='career';
let openId=null;
let lastAddSide='career';
const doneF={range:LS.get('oym_drange','week'),side:LS.get('oym_dside','all'),q:''};
let logSide=LS.get('oym_logside','career');if(!SIDES.includes(logSide))logSide='career';

// ═══ Sides and privacy ═══════════════════════════════════════════════════
// todo/sides/{projectId} = {side, private}. Maps legacy projects onto a side and
// marks the ones that must never reach a report.
function projSide(pid){
  if(!pid)return null;
  if(sideMap[pid])return sideMap[pid];
  if(/open\s?yap/i.test(projects[pid]?.name||''))return {side:'openyap'};
  return null;
}
function taskSide(t){
  if(t.side==='career'||t.side==='openyap')return t.side;

}
function taskPrivate(t){
  if(t.private!=null)return !!t.private;
  const m=projSide(t.projectId);
  if(m&&m.private)return true;
  return t.category==='personal';
}
const projName=pid=>(pid&&projects[pid]?.name)||'';
const oyProjectId=()=>{for(const [id,p] of Object.entries(projects))if(p&&/^open\s?yap$/i.test(p.name||'')&&p.status!=='archived')return id;return ''};
const shownProject=(name,side)=>name&&name.toLowerCase().replace(/\s/g,'')!==SIDE_NAME[side].toLowerCase()?name:'';

// ═══ Done log ════════════════════════════════════════════════════════════
// History rows are the record. A one-shot task keeps only its latest row, a
// reopened task drops out, and completed tasks that predate the history log
// are folded in so nothing finished goes missing.
let _entries=null;
function entries(){
  if(_entries)return _entries;
  const out=[],best=new Map();
  for(const [hid,h] of Object.entries(hist)){
    if(!h||!h.completedAt)continue;
    const t=h.taskId?tasks[h.taskId]:null;
    const oneShot=!!(t&&(t.repeat||'none')==='none'&&!h.subId);
    if(oneShot&&(!t.completed||t.logHidden))continue;
    const e=rowEntry(hid,h,t,oneShot);
    if(oneShot){const k=h.taskId,cur=best.get(k);if(!cur||cur.completedAt<e.completedAt)best.set(k,e)}
    else out.push(e);
  }
  for(const [id,t] of Object.entries(tasks)){
    if(!t||!t.completed||!t.completedAt||t.logHidden||(t.repeat||'none')!=='none'||best.has(id))continue;
    best.set(id,{key:'t:'+id,hid:null,taskId:id,title:t.title||'(untitled)',notes:t.notes||'',completedAt:t.completedAt,
      projectName:projName(t.projectId),side:taskSide(t),private:taskPrivate(t),routine:false,timeSpent:t.timeSpent||0,reopenable:true});
  }
  _entries=out.concat([...best.values()]).sort((a,b)=>a.completedAt<b.completedAt?1:a.completedAt>b.completedAt?-1:0);
  return _entries;
}
function rowEntry(hid,h,t,oneShot){
  let side=h.side;
  if(!SIDES.includes(side))side=t?taskSide(t):(projSide(h.projectId)?.side||(OY_RE.test(h.title||'')?'openyap':'career'));
  let priv;
  if(h.private!=null)priv=!!h.private;
  else if(t)priv=taskPrivate(t);
  else{const m=projSide(h.projectId);priv=!!(m&&m.private)||h.category==='personal'}
  return {key:'h:'+hid,hid,taskId:h.taskId||null,title:h.title||'(untitled)',notes:h.notes||'',completedAt:h.completedAt,
    projectName:h.projectName||projName(h.projectId),side,private:priv,routine:h.category==='routine',timeSpent:h.timeSpent||0,reopenable:oneShot};
}
function rangeBounds(r){
  const now=new Date(),mon=mondayOf(now);
  if(r==='week')return [mon,addDays(mon,7)];
  if(r==='lastweek')return [addDays(mon,-7),mon];
  if(r==='month')return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)];
  return [new Date(0),new Date(8.64e15)];
}
function inRange(e,r){const [a,b]=rangeBounds(r),d=new Date(e.completedAt);return d>=a&&d<b}
function spanLabel(a,b){
  if(a.getFullYear()!==b.getFullYear())return fmtMDY(a)+' – '+fmtMDY(b);
  if(a.getMonth()===b.getMonth())return MON[a.getMonth()]+' '+a.getDate()+'–'+b.getDate()+', '+b.getFullYear();
  return fmtMD(a)+' – '+fmtMD(b)+', '+b.getFullYear();
}
function rangeTitle(r,list){
  const now=new Date(),mon=mondayOf(now);
  if(r==='week')return 'This week, '+spanLabel(mon,addDays(mon,6));
  if(r==='lastweek')return 'Last week, '+spanLabel(addDays(mon,-7),addDays(mon,-1));
  if(r==='month')return MONL[now.getMonth()]+' '+now.getFullYear();
  if(list&&list.length)return 'All time, '+spanLabel(new Date(list[list.length-1].completedAt),now);
  return 'All time';
}
const RANGES=[['week','This week'],['lastweek','Last week'],['month','This month'],['all','All time']];
const RANGE_PHRASE={week:'this week',lastweek:'last week',month:'this month',all:'in total'};

// ═══ Task actions ════════════════════════════════════════════════════════
function buildTask(o={}){return{
  title:'',priority:'medium',category:'work',difficulty:'medium',
  progress:0,dueDate:'',dueTime:'',repeat:'none',notes:'',from:'',projectId:'',
  completed:false,completedAt:'',createdAt:new Date().toISOString(),order:Date.now(),...o}}
function sideFields(side){
  return side==='openyap'?{side,category:'project',projectId:oyProjectId()}:{side,category:'work'};
}
function nextDueDate(ds,rep){
  if(!ds||!rep||rep==='none')return '';
  const d=parseYmd(ds);
  if(rep==='daily')d.setDate(d.getDate()+1);else if(rep==='weekly')d.setDate(d.getDate()+7);else if(rep==='monthly')d.setMonth(d.getMonth()+1);else return '';
  return ymd(d);
}
const sessionMs=t=>t&&t.doing&&t.doingSince?Math.max(0,Date.now()-Date.parse(t.doingSince)):0;
function pauseFields(id,t,up){
  const spent=(t.timeSpent||0)+sessionMs(t);
  up[TP(id)+'/doing']=null;up[TP(id)+'/doingSince']=null;up[TP(id)+'/timeSpent']=spent||null;
}

// Quick add: "@fri" or "@9/30" sets a date, a lone "!" marks it urgent, "// text" becomes a note.
function parseDateTok(tok,past){
  tok=tok.toLowerCase().replace(/[.,;]$/,'');
  const base=sod();
  if(tok==='today'||tok==='tod'||tok==='now')return ymd(base);
  if(tok==='tomorrow'||tok==='tmr'||tok==='tom')return ymd(addDays(base,1));
  if(tok==='yesterday'||tok==='yday')return ymd(addDays(base,-1));
  if(tok==='nextweek'||tok==='next-week'){const m=mondayOf(base);return ymd(addDays(m,7))}
  let m=tok.match(/^(sun|mon|tue|wed|thu|fri|sat)[a-z]*$/);
  if(m){
    const i=DOW.map(s=>s.toLowerCase()).indexOf(m[1]);
    if(past){let diff=(base.getDay()-i+7)%7;return ymd(addDays(base,-diff))}
    let diff=(i-base.getDay()+7)%7;if(diff===0)diff=7;return ymd(addDays(base,diff));
  }
  m=tok.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return ymd(new Date(+m[1],m[2]-1,+m[3]));
  m=tok.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){
    let y=m[3]?+m[3]:base.getFullYear();if(y<100)y+=2000;
    const d=new Date(y,m[1]-1,+m[2]);
    if(!m[3]){if(!past&&d<addDays(base,-30))d.setFullYear(y+1);if(past&&d>base)d.setFullYear(y-1)}
    return isNaN(d)?null:ymd(d);
  }
  m=tok.match(/^in(\d{1,3})d$/);
  if(m&&!past)return ymd(addDays(base,+m[1]));
  return null;
}
function parseQuick(raw,past){
  let s=' '+String(raw||'').trim()+' ',notes='';
  const ni=s.indexOf(' // ');
  if(ni>=0){notes=s.slice(ni+4).trim();s=s.slice(0,ni)+' '}
  let urgent=false,due='';
  s=s.replace(/\s!(?:high|urgent)?(?=\s)/gi,()=>{urgent=true;return ' '});
  s=s.replace(/\s@(\S+)(?=\s)/g,(all,tok)=>{const d=parseDateTok(tok,past);if(d){due=d;return ' '}return all});
  return {title:s.replace(/\s+/g,' ').trim(),urgent,due,notes};
}

function addTask(side,raw){
  const p=parseQuick(raw);
  if(!p.title)return false;
  const key=newKey('todo/tasks');
  upd({[TP(key)]:buildTask({title:p.title,priority:p.urgent?'high':'medium',dueDate:p.due,notes:p.notes,...sideFields(side)})});
  return true;
}
function startTask(id){
  const t=tasks[id];if(!t)return;
  const side=taskSide(t),up={};
  for(const [oid,o] of Object.entries(tasks))if(oid!==id&&o&&o.doing&&!o.completed&&taskSide(o)===side)pauseFields(oid,o,up);
  up[TP(id)+'/doing']=true;up[TP(id)+'/doingSince']=new Date().toISOString();
  const wasOpen=openId===id;if(wasOpen)openId=null;
  upd(up);if(wasOpen)render(true);
}
function pauseTask(id){const t=tasks[id];if(!t)return;const up={};pauseFields(id,t,up);const wasOpen=openId===id;if(wasOpen)openId=null;upd(up);if(wasOpen)render(true)}
function completeTask(id,rowEl){
  const t=tasks[id];if(!t)return;
  const go=()=>{
    const now=new Date().toISOString(),spent=(t.timeSpent||0)+sessionMs(t),side=taskSide(t),rep=t.repeat||'none';
    const hk=newKey('todo/history');
    const row={title:t.title||'',difficulty:t.difficulty||'medium',category:t.category||'work',priority:t.priority||'medium',
      notes:t.notes||'',completedAt:now,projectId:t.projectId||'',projectName:projName(t.projectId),side};
    if(taskPrivate(t))row.private=true;
    if(spent)row.timeSpent=spent;
    const up={},P=TP(id);
    if(rep!=='none'){
      const td=ymd(new Date());
      up[P+'/dueDate']=nextDueDate(t.dueDate&&t.dueDate>td?t.dueDate:td,rep);up[P+'/progress']=0;
    }else{
      row.taskId=id;up[P+'/completed']=true;up[P+'/completedAt']=now;up[P+'/progress']=100;
      if(spent)up[P+'/timeSpent']=spent;
    }
    up[P+'/doing']=null;up[P+'/doingSince']=null;
    if(rep!=='none')up[P+'/timeSpent']=null;
    up['todo/history/'+hk]=row;
    const wasOpen=openId===id;if(wasOpen)openId=null;
    upd(up);if(wasOpen)render(true);
    toast('Done: '+t.title,'Undo',()=>{
      const back={['todo/history/'+hk]:null};
      for(const f of ['completed','completedAt','progress','dueDate','doing','doingSince','timeSpent'])back[P+'/'+f]=t[f]===undefined?null:t[f];
      upd(back);
    });
  };
  const row=rowEl&&rowEl.closest('.task');
  if(row&&!reduceMotion()){celebrate(row);row.classList.add('completing');setTimeout(go,300)}else go();
}
function deleteTask(id){
  const t=tasks[id];if(!t)return;
  const wasOpen=openId===id;if(wasOpen)openId=null;
  upd({[TP(id)]:null});if(wasOpen)render(true);toast('Deleted: '+t.title,'Undo',()=>upd({[TP(id)]:t}));
}
function setTaskSide(id,side){
  const t=tasks[id];if(!t||!SIDES.includes(side))return;
  const up={[TP(id)+'/side']:side},oy=oyProjectId();
  if(side==='openyap'&&!t.projectId&&oy)up[TP(id)+'/projectId']=oy;
  if(side==='career'&&oy&&t.projectId===oy)up[TP(id)+'/projectId']='';
  if(t.doing)for(const [oid,o] of Object.entries(tasks))if(oid!==id&&o&&o.doing&&!o.completed&&taskSide(o)===side)pauseFields(oid,o,up);
  upd(up);
}
function saveField(id,f,v){
  const t=tasks[id];if(!t)return;
  if(f==='title'){v=String(v).trim();if(!v)return}
  if((t[f]||'')===v)return;
  upd({[TP(id)+'/'+f]:v});
}
function logDone(raw,side){
  const p=parseQuick(raw,true);
  if(!p.title)return false;
  let when=new Date();

let dashTable=LS.get('oym_dashtable','0')==='1';
const WEEKS_SHOWN=12,HEAT_WEEKS=26;
function dashData(){
  const E=entries(),now=new Date(),today=sod(now),mon=mondayOf(now),lastMon=addDays(mon,-7);
  const zero=()=>({career:0,openyap:0});
  const wk=zero(),lwk=zero(),tracked=zero(),byDay=new Map();
  const weeks=[];for(let i=WEEKS_SHOWN-1;i>=0;i--)weeks.push({start:addDays(mon,-7*i),career:0,openyap:0});
  for(const e of E){
    const d=new Date(e.completedAt);
    if(d>=mon){wk[e.side]++;tracked[e.side]+=e.timeSpent||0}else if(d>=lastMon)lwk[e.side]++;
    const k=ymd(d);let c=byDay.get(k);if(!c){c=zero();byDay.set(k,c)}c[e.side]++;
    const wi=Math.round((mondayOf(d)-weeks[0].start)/(7*864e5));
    if(wi>=0&&wi<WEEKS_SHOWN)weeks[wi][e.side]++;
  }
  const open=zero(),over=zero(),nowT={},todayK=ymd(today),upcoming=[];
  const horizon=ymd(addDays(today,14));
  for(const [id,t] of Object.entries(tasks)){
    if(!t||t.completed)continue;const s=taskSide(t);open[s]++;
    if(t.dueDate&&t.dueDate<todayK)over[s]++;
    if(t.doing){if(!nowT[s])nowT[s]=t;const since=Math.max(Date.parse(t.doingSince||0)||0,mon.getTime());tracked[s]+=Math.max(0,Date.now()-since)}
    if(t.dueDate&&t.dueDate<=horizon)upcoming.push({id,t,side:s});
  }
  upcoming.sort((a,b)=>a.t.dueDate<b.t.dueDate?-1:a.t.dueDate>b.t.dueDate?1:(PRI_RANK[a.t.priority]??1)-(PRI_RANK[b.t.priority]??1));
  let streak=0,d=today;if(!byDay.has(ymd(d)))d=addDays(d,-1);
  while(byDay.has(ymd(d))){streak++;d=addDays(d,-1)}
  const heatStart=addDays(mon,-7*(HEAT_WEEKS-1));
  return {wk,lwk,tracked,open,over,nowT,weeks,byDay,upcoming,streak,heatStart,today,total:E.length,first:E.length?new Date(E[E.length-1].completedAt):null};
}

  if(!ready.tasks||!ready.hist){host.innerHTML='<p class="hint" style="padding:40px 0">Loading…</p>';return}
  const D=dashData(),total=D.wk.career+D.wk.openyap,last=D.lwk.career+D.lwk.openyap,diff=total-last;
  const cmp=diff>0?`${diff} more than last week`:diff<0?`${-diff} fewer than last week`:'Same as last week';
  const tile=s=>{
    const t=D.nowT[s],meta=[`${D.open[s]} open`];
    if(D.over[s])meta.push(`<span class="late">${D.over[s]} overdue</span>`);
    if(D.tracked[s]>=60000)meta.push(`${fmtDur(D.tracked[s])} tracked`);
    return `<div class="tile" style="--side-c:var(--${s})">
      <div class="tile-h">${SIDE_NAME[s]}</div>
      <div class="tile-n" data-count="${D.wk[s]}">${D.wk[s]}</div>
      <div class="tile-l">finished this week, ${D.lwk[s]} last week</div>
      <div class="tile-meta">${meta.join(', ')}</div>
      <div class="tile-now">${t?`<b>Now</b> ${esc(t.title)}`:'Nothing in progress'}</div>
    </div>`;
  };
  const max=Math.max(1,...D.weeks.map(w=>Math.max(w.career,w.openyap)));
  const wrow=s=>{
    const sum=D.weeks.reduce((a,w)=>a+w[s],0);
    let peak=-1;D.weeks.forEach((w,i)=>{if(w[s]>0&&(peak<0||w[s]>D.weeks[peak][s]))peak=i});
    const cols=D.weeks.map((w,i)=>{
      const v=w[s],h=v/max*100,cap=v>0&&(i===peak||i===WEEKS_SHOWN-1);
      return `<div class="wcol" style="--h:${h.toFixed(2)}%" data-tip="${v}|${SIDE_NAME[s]}, week of ${fmtMD(w.start)}">${cap?`<span class="wcap">${v}</span>`:''}<span class="wbar${v?' nz':''}"></span></div>`;
    }).join('');
    return `<div class="wrow" style="--side-c:var(--${s})"><div class="wlab"><b>${SIDE_NAME[s]}</b><span>${sum} in 12 weeks</span></div><div class="wplot">${cols}</div></div>`;
  };
  const xl=D.weeks.map((w,i)=>`<span>${i%4===0||i===WEEKS_SHOWN-1?esc(fmtMD(w.start)):''}</span>`).join('');
  const table=dashTable?`<table class="wtable"><thead><tr><th>Week of</th><th>Career</th><th>OpenYap</th></tr></thead><tbody>${D.weeks.slice().reverse().map(w=>`<tr><td>${esc(fmtMDY(w.start))}</td><td>${w.career}</td><td>${w.openyap}</td></tr>`).join('')}</tbody></table>`:'';
  // Heatmap: 26 weeks by 7 days, one sequential hue.
  let cells='',months='',prevM=-1,lastMonthCol=-9;
  for(let c=0;c<HEAT_WEEKS;c++){
    const ws=addDays(D.heatStart,7*c);
    const changed=ws.getMonth()!==prevM,show=changed&&(c-lastMonthCol>=3)&&(c<HEAT_WEEKS-2||prevM===-1);
    months+=`<span>${show?MON[ws.getMonth()]:''}</span>`;if(show)lastMonthCol=c;prevM=ws.getMonth();
    for(let r=0;r<7;r++){
      const day=addDays(ws,r);
      if(day>D.today){cells+='<i class="hc is-f"></i>';continue}
      const n=D.byDay.get(ymd(day))||{career:0,openyap:0},sum=n.career+n.openyap;
      cells+=`<i class="hc" data-b="${heatBin(sum)}" data-tip="${sum}|finished ${DOW[day.getDay()]}, ${fmtMD(day)}: ${n.career} Career, ${n.openyap} OpenYap"></i>`;
    }
  }
  const up=D.upcoming.slice(0,8).map(({id,t,side})=>{
    const late=t.dueDate<ymd(D.today),dl=dueLabel(t.dueDate);
    return `<div class="up-row" data-open="${id}" role="button" tabindex="0" style="--side-c:var(--${side})" title="${late?'Overdue':'Due'} ${esc(fmtMD(parseYmd(t.dueDate)))}, ${SIDE_NAME[side]}">
      <span class="up-d${late?' late':''}">${late?esc(fmtMD(parseYmd(t.dueDate))):dl.txt}</span><span class="d-dot"></span><span class="up-t">${esc(t.title)}</span></div>`;
  }).join('');
  const more=D.upcoming.length>8?`<div class="up-more">and ${D.upcoming.length-8} more with dates</div>`:'';
  host.innerHTML=`<div class="dash">
    <div class="d-top">
      <div class="hero"><div class="hero-n" data-count="${total}">${total}</div>
        <div class="hero-l">finished this week</div>
        <div class="hero-s">${cmp}${D.streak>1?`. ${D.streak} days in a row`:''}.</div></div>
      ${SIDES.map(tile).join('')}
    </div>
    <section>
      <div class="sec-h"><h3>Finished per week</h3><span>Same scale for both sides<button class="link" data-dash="table">${dashTable?'Hide table':'Show as a table'}</button></span></div>
      <div class="weeks">${SIDES.map(wrow).join('')}<div class="wx" aria-hidden="true">${xl}</div></div>
      ${table}
    </section>
    <section class="dsplit">
      <div>
        <div class="sec-h"><h3>Every day</h3><span>Last six months</span></div>
        <div class="heat" role="img" aria-label="Finished tasks per day over the last six months. Daily counts are listed on the Done tab.">
          <div class="hmonths" aria-hidden="true">${months}</div>
          <div class="hbody"><div class="hdays" aria-hidden="true"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div><div class="hgrid">${cells}</div></div>
          <div class="hlegend" aria-hidden="true">Less<span></span><i data-b="0"></i><i data-b="1"></i><i data-b="2"></i><i data-b="3"></i><i data-b="4"></i><span></span>More</div>
        </div>
      </div>
      <div>
        <div class="sec-h"><h3>Coming up</h3><span>Overdue and the next 14 days</span></div>
        ${up||'<p class="hint">Nothing due in the next two weeks.</p>'}${more}
      </div>
    </section>
    <p class="hint">${D.total} finished since ${D.first?esc(fmtMDY(D.first)):'you started'}.</p>
  </div>`;
  if(!anim){return}
  fx($$('.hero,.tile',host),{opacity:[0,1],translateY:[10,0],duration:640,delay:stg(80),ease:'out(3)'});
  $$('[data-count]',host).forEach(el=>countUp(el,+el.dataset.count));
  fx($$('.wbar',host),{scaleY:[0,1],duration:760,delay:stg(24,{start:180}),ease:'out(4)'});
  fx($$('.wcap',host),{opacity:[0,1],duration:420,delay:stg(40,{start:620})});
  fx($$('.hc:not(.is-f)',host),{opacity:[0,1],duration:280,delay:stg(2,{start:300}),ease:'out(2)'});
  fx($$('.up-row',host),{opacity:[0,1],translateX:[-8,0],duration:460,delay:stg(45,{start:360}),ease:'out(3)'});
}

// ═══ Calendar ════════════════════════════════════════════════════════════
// Due dates and completed work use the same normalized side colors as the
// rest of the app. The six-week grid keeps adjacent-month context visible.
const CAL_DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let calCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),calSelected=ymd(new Date());
function calendarData(cursor=calCursor){
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=mondayOf(first),end=addDays(start,42),byDay=new Map();
  const add=(k,item)=>{if(k<ymd(start)||k>=ymd(end))return;let a=byDay.get(k);if(!a){a=[];byDay.set(k,a)}a.push(item)};
  const todayK=ymd(new Date());
  for(const [id,t] of Object.entries(tasks)){
    if(!t||t.completed||!t.dueDate)continue;
    add(t.dueDate,{kind:'due',id,title:t.title||'(untitled)',side:taskSide(t),late:t.dueDate<todayK,urgent:t.priority==='high'});
  }
  for(const e of entries()){
    const k=ymd(new Date(e.completedAt));
    add(k,{kind:'done',title:e.title||'(untitled)',side:e.side,private:e.private,at:e.completedAt});
  }
  for(const a of byDay.values())a.sort((x,y)=>(x.kind==='due'?0:1)-(y.kind==='due'?0:1)||(x.urgent?-1:0)-(y.urgent?-1:0)||String(y.at||'').localeCompare(String(x.at||'')));
  let due=0,done=0;
  for(const [k,a] of byDay)if(k.slice(0,7)===ymd(first).slice(0,7))for(const x of a)x.kind==='due'?due++:done++;
  return {first,start,end,byDay,todayK,due,done};
}
function calEvent(e){
  const tag=e.kind==='due'?'button':'span',open=e.id?` data-open="${e.id}"`:'';
  const title=(e.kind==='due'?(e.late?'Overdue: ':'Due: '):'Finished: ')+(e.title||'');
  return `<${tag} class="cal-event k-${e.kind}${e.late?' is-late':''}" style="--side-c:var(--${e.side})"${open} title="${esc(title)}"><i class="cal-mark"></i><span>${esc(e.title)}</span></${tag}>`;
}
function calAgendaRow(e){
  const open=e.id?` data-open="${e.id}" role="button" tabindex="0"`:'';
  const meta=e.kind==='due'?(e.late?'Overdue':e.urgent?'Due, urgent':'Due'):(e.private?'Finished, private':'Finished');
  return `<div class="cal-a-row k-${e.kind}${e.late?' is-late':''}" style="--side-c:var(--${e.side})"${open}><i class="cal-a-dot"></i><span class="cal-a-title">${esc(e.title)}</span><span class="cal-a-meta">${esc(meta)} · ${SIDE_NAME[e.side]}</span></div>`;
}
function renderCalendar(anim){
  const host=$('#calHost');
  if(!ready.tasks||!ready.hist){host.innerHTML='<p class="hint" style="padding:40px 0">Loading…</p>';return}
  const C=calendarData(),days=[];
  for(let i=0;i<42;i++){
    const d=addDays(C.start,i),k=ymd(d),items=C.byDay.get(k)||[],out=d.getMonth()!==C.first.getMonth(),shown=items.slice(0,3);
    const label=`${DOWL[d.getDay()]}, ${MONL[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}${items.length?`, ${items.length} item${items.length===1?'':'s'}`:''}`;
    days.push(`<div class="cal-day${out?' is-out':''}${k===C.todayK?' is-today':''}${k===calSelected?' is-selected':''}" data-cal-day="${k}">
      <button class="cal-num" data-cal-pick="${k}" aria-label="${esc(label)}">${d.getDate()}</button>
      <div class="cal-events">${shown.map(calEvent).join('')}${items.length>3?`<span class="cal-more">+${items.length-3}</span>`:''}</div>
    </div>`);
  }
  const selected=parseYmd(calSelected),agenda=C.byDay.get(calSelected)||[],aDue=agenda.filter(e=>e.kind==='due').length,aDone=agenda.length-aDue;
  const sub=[aDue?`${aDue} due`:'',aDone?`${aDone} finished`:''].filter(Boolean).join(' · ')||'Nothing scheduled or finished';
  host.innerHTML=`<div class="cal">
    <div class="cal-top"><div class="cal-title"><h2>${MONL[C.first.getMonth()]} ${C.first.getFullYear()}</h2><p>${C.due} due · ${C.done} finished this month</p></div>
      <div class="cal-nav"><button class="icon-btn" data-cal-nav="prev" aria-label="Previous month">‹</button><button class="btn" data-cal-nav="today">Today</button><button class="icon-btn" data-cal-nav="next" aria-label="Next month">›</button></div></div>
    <div class="cal-legend"><span style="--side-c:var(--career)"><i></i>Career</span><span style="--side-c:var(--openyap)"><i></i>OpenYap</span><span>Solid due · ring finished</span></div>
    <div class="cal-weekdays" aria-hidden="true">${CAL_DOW.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${days.join('')}</div>
    <section class="cal-agenda" aria-live="polite"><div class="cal-agenda-head"><h3>${DOWL[selected.getDay()]}, ${fmtMDY(selected)}</h3><p>${sub}</p></div><div class="cal-agenda-list">${agenda.length?agenda.map(calAgendaRow).join(''):'<p class="hint">Choose another day, or add a due date to a task.</p>'}</div></section>
  </div>`;
  if(!anim)return;
  fx($('.cal-top',host),{opacity:[0,1],translateY:[8,0],duration:480,ease:'out(3)'});
  fx($$('.cal-day',host),{opacity:[0,1],scale:[.975,1],duration:360,delay:stg(8,{start:80}),ease:'out(3)'});
  fx($('.cal-agenda',host),{opacity:[0,1],translateY:[8,0],duration:440,delay:260,ease:'out(3)'});
}

// ═══ Timeline ════════════════════════════════════════════════════════════
// Time runs down the page: due dates ahead at the top, today, then finished
// work going back. Career sits left of the spine and OpenYap right.
let tlWeeks=4,tlPrevStart='';
const tlStartKey=()=>ymd(addDays(mondayOf(new Date()),-7*(tlWeeks-1)));
function timelineData(){
  const now=new Date(),todayK=ymd(now),startK=tlStartKey(),days=new Map();
  const add=(k,side,item)=>{let d=days.get(k);if(!d){d={key:k,career:[],openyap:[]};days.set(k,d)}d[side].push(item)};
  const RANK={now:0,late:1,'due-today':2,due:3,done:4};
  for(const [id,t] of Object.entries(tasks)){
    if(!t||t.completed)continue;const side=taskSide(t);
    if(t.doing)add(todayK,side,{kind:'now',id,title:t.title,meta:'In progress, '+fmtDur((t.timeSpent||0)+sessionMs(t))});
    else if(t.dueDate&&t.dueDate<todayK)add(todayK,side,{kind:'late',id,title:t.title,meta:'Overdue since '+fmtMD(parseYmd(t.dueDate))});
    else if(t.dueDate)add(t.dueDate,side,{kind:t.dueDate===todayK?'due-today':'due',id,title:t.title,meta:(t.dueDate===todayK?'Due today':'Due')+(t.priority==='high'?', urgent':'')});
  }
  let finished=0,older=0;
  for(const e of entries()){
    const d=new Date(e.completedAt),k=ymd(d);
    if(k<startK){older++;continue}
    finished++;
    add(k,e.side,{kind:'done',title:e.title,at:e.completedAt,priv:e.private,
      meta:[shownProject(e.projectName,e.side),e.routine?'Recurring check':'',e.timeSpent?fmtDur(e.timeSpent):''].filter(Boolean).join(', ')});
  }
  if(!days.has(todayK))days.set(todayK,{key:todayK,career:[],openyap:[]});
  for(const d of days.values())for(const s of SIDES)d[s].sort((a,b)=>RANK[a.kind]-RANK[b.kind]||String(b.at||'').localeCompare(String(a.at||'')));
  return {keys:[...days.keys()].sort().reverse(),days,todayK,finished,older};
}
function tlItem(it,side){
  const open=it.id?` data-open="${it.id}" role="button" tabindex="0"`:'';
  return `<div class="tl-item k-${it.kind}${it.priv?' is-priv':''}"${open}><span class="tl-dot"></span><div class="tl-txt"><div class="tl-t">${esc(it.title||'(untitled)')}</div>${it.meta?`<div class="tl-m">${esc(it.meta)}</div>`:''}</div></div>`;
}
function renderTimeline(anim){
  const host=$('#tlHost');
  if(!ready.tasks||!ready.hist){host.innerHTML='<p class="hint" style="padding:40px 0">Loading…</p>';return}
  const T=timelineData(),thisMon=ymd(mondayOf(new Date()));
  let html='',curWeek=null;
  for(const k of T.keys){
    const d=parseYmd(k),wkK=ymd(mondayOf(d)),day=T.days.get(k),isToday=k===T.todayK,isFuture=k>T.todayK;
    if(wkK!==curWeek){
      curWeek=wkK;
      const n=[...T.days.values()].filter(x=>ymd(mondayOf(parseYmd(x.key)))===wkK).reduce((a,x)=>a+x.career.filter(i=>i.kind==='done').length+x.openyap.filter(i=>i.kind==='done').length,0);
      const label=wkK===thisMon?'This week':wkK>thisMon?(wkK===ymd(addDays(mondayOf(new Date()),7))?'Next week':'Week of '+fmtMD(parseYmd(wkK))):'Week of '+fmtMD(parseYmd(wkK));
      html+=`<div class="tl-week"><span>${esc(label)}${n?`, ${n} finished`:''}</span></div>`;
    }
    const isNew=tlPrevStart&&k<tlPrevStart;
    html+=`<section class="tl-day${isToday?' is-today':''}${isFuture?' is-future':''}"${isNew?' data-new':''}>
      <div class="tl-lane" data-lane="career" style="--side-c:var(--career)">${day.career.map(i=>tlItem(i,'career')).join('')}</div>
      <div class="tl-date"><span>${isToday?'Today':DOW[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate()}</span></div>
      <div class="tl-lane" data-lane="openyap" style="--side-c:var(--openyap)">${day.openyap.map(i=>tlItem(i,'openyap')).join('')}</div>
    </section>`;
  }
  host.innerHTML=`<div class="tl-top"><h2>Timeline</h2><p>${T.finished} finished in the last ${tlWeeks} weeks. Due dates sit above today.</p></div>
    <div class="tl-cols"><span style="--side-c:var(--career)">Career<i></i></span><span></span><span style="--side-c:var(--openyap)"><i></i>OpenYap</span></div>
    <div class="tl"><div class="tl-spine"></div>${html}</div>
    <div class="tl-more">${T.older?`<button class="btn" data-tl="more">Show four more weeks</button>`:'<p class="hint">That is everything you have finished.</p>'}</div>`;
  const prev=tlPrevStart;tlPrevStart='';
  if(!anim)return;
  const scope=prev?$$('.tl-day[data-new]',host):$$('.tl-day',host);
  const narrow=window.innerWidth<=820;
  if(!prev)fx($('.tl-spine',host),{scaleY:[0,1],duration:1000,ease:'inOut(3)'});
  fx(scope.map(d=>d.querySelector('.tl-date span')).slice(0,40),{opacity:[0,1],scale:[.7,1],duration:420,delay:stg(38,{start:prev?0:140}),ease:'out(3)'});
  const items=l=>scope.flatMap(d=>[...d.querySelectorAll(`.tl-lane[data-lane="${l}"] .tl-item`)]).slice(0,40);
  fx(items('career'),{opacity:[0,1],translateX:[narrow?-10:14,0],duration:540,delay:stg(22,{start:prev?40:220}),ease:'out(3)'});
  fx(items('openyap'),{opacity:[0,1],translateX:[-14,0],duration:540,delay:stg(22,{start:prev?40:220}),ease:'out(3)'});
  fx($$('.tl-week span',host).slice(0,12),{opacity:[0,1],duration:500,delay:stg(60,{start:100})});
}
// ═══ PDF export ══════════════════════════════════════════════════════════
let pdfLib=null;
function loadPDF(){
  if(window.jspdf)return Promise.resolve();
  if(!pdfLib)pdfLib=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=()=>res();s.onerror=()=>{pdfLib=null;rej(new Error('The PDF library did not load. Check your connection and try again.'))};
    document.head.appendChild(s);
  });
  return pdfLib;
}
// Standard PDF fonts only carry Latin-1; fold typographic marks, drop the rest.
const pc=s=>String(s||'').replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"').replace(/[–—−]/g,'-').replace(/…/g,'...')
  .replace(/[   ]/g,' ').replace(/•/g,'-').replace(/[\r\t]/g,' ').replace(/[^\n\x20-\x7E¡-ÿ]/g,'').replace(/ {2,}/g,' ').trim();
const hexRgb=h=>{h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return isNaN(n)?[80,80,80]:[n>>16&255,n>>8&255,n&255]};
function pdfKit(paper){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:paper==='a4'?'a4':'letter',compress:true});
  const th=curTheme();
  const P={ink:[28,31,36],body:[64,70,80],muted:[118,124,134],rule:[208,213,219],line:[208,215,224],dot:[168,175,184],
    acc:hexRgb(th.print),career:hexRgb(th.pc),openyap:hexRgb(th.po),font:th.mono?'courier':'helvetica'};
  return {doc,P,F:P.font,W:doc.internal.pageSize.getWidth(),H:doc.internal.pageSize.getHeight()};
}
function fit(doc,s,w){s=pc(s);if(doc.getTextWidth(s)<=w)return s;while(s.length>1&&doc.getTextWidth(s+'...')>w)s=s.slice(0,-1);return s.trimEnd()+'...'}
function wrap(doc,s,w,max){
  let lines=doc.splitTextToSize(pc(s)||' ',w);
  if(max&&lines.length>max){lines=lines.slice(0,max);let last=lines[max-1];while(last.length>1&&doc.getTextWidth(last+'...')>w)last=last.slice(0,-1);lines[max-1]=last.trimEnd()+'...'}
  return lines;
}
function setT(k,style,size,color){k.doc.setFont(k.F,style);k.doc.setFontSize(size);k.doc.setTextColor(...color)}
function pageNumbers(k,label){
  const n=k.doc.getNumberOfPages();if(n<2&&!label)return;
  for(let i=1;i<=n;i++){k.doc.setPage(i);setT(k,'normal',7.5,k.P.muted);
    const m=k.M||40;
    if(label)k.doc.text(fit(k.doc,label,k.W-2*m-80),m,k.H-24);
    if(n>1)k.doc.text('Page '+i+' of '+n,k.W-m,k.H-24,{align:'right'})}
}

// Report for a manager: finished work in a period, grouped by side, then by day or week.
function buildReport(o){
  const k=pdfKit(o.paper),{doc,P,W,H}=k,M=54,R=W-M;let y=M;k.M=M;
  const byDay=o.range==='week'||o.range==='lastweek';
  function head(first){
    y=M;
    if(first){
      setT(k,'bold',20,P.ink);doc.text('Completed work',M,y+16);
      setT(k,'normal',9.5,P.muted);doc.text(pc(o.rangeTitle),R,y+8,{align:'right'});doc.text('Generated '+fmtMDY(new Date()),R,y+21,{align:'right'});
      if(o.name){setT(k,'normal',11,P.body);doc.text(fit(doc,o.name,R-M-200),M,y+35)}
      y+=o.name?48:34;doc.setDrawColor(...P.acc);doc.setLineWidth(1.2);doc.line(M,y,R,y);y+=26;
    }else{setT(k,'normal',8.5,P.muted);doc.text(pc('Completed work, '+o.rangeTitle),M,y+2);y+=26}
  }
  const need=h=>{if(y+h>H-M-10){doc.addPage();head(false);return true}return false};
  head(true);
  const cnt={career:0,openyap:0};o.items.forEach(e=>cnt[e.side]++);
  let s=o.items.length+' task'+(o.items.length===1?'':'s')+' completed';
  if(o.side==='both')s+=': '+cnt.career+' Career, '+cnt.openyap+' OpenYap';
  if(o.routine.length)s+='. Plus '+o.routine.length+' recurring check'+(o.routine.length===1?'':'s');
  setT(k,'normal',11,P.ink);doc.text(pc(s+'.'),M,y);y+=26;
  if(!o.items.length&&!o.routine.length){setT(k,'normal',10.5,P.muted);doc.text('Nothing was completed in this period.',M,y)}
  const sides=o.side==='both'?SIDES:[o.side];
  const colW=R-M-14-122;
  for(const side of sides){
    const list=o.items.filter(e=>e.side===side);if(!list.length)continue;
    if(sides.length>1){
      need(70);setT(k,'bold',13,P[side]);doc.text(SIDE_NAME[side],M,y);
      setT(k,'normal',10,P.muted);doc.text(String(list.length),R,y,{align:'right'});
      y+=8;doc.setDrawColor(...P.rule);doc.setLineWidth(.6);doc.line(M,y,R,y);y+=20;
    }
    const groups=new Map();
    for(const e of list){const d=new Date(e.completedAt),g=byDay?ymd(d):ymd(mondayOf(d));if(!groups.has(g))groups.set(g,[]);groups.get(g).push(e)}
    for(const [g,rows] of groups){
      const gd=parseYmd(g);
      need(44);setT(k,'bold',9.5,P.muted);doc.text(pc(byDay?DOWL[gd.getDay()]+', '+fmtMD(gd):'Week of '+fmtMDY(gd)),M,y);y+=16;
      for(const e of rows){
        const d=new Date(e.completedAt);
        setT(k,'normal',10.5,P.ink);const lines=wrap(doc,e.title,colW,3);
        let notes=[];if(o.notes&&e.notes){doc.setFontSize(9);notes=wrap(doc,e.notes.replace(/\s+/g,' '),colW,2)}
        need(lines.length*13.5+(notes.length?notes.length*11.6+2:0)+8);
        doc.setFillColor(...P[side]);doc.rect(M+1,y-7,4,4,'F');
        setT(k,'normal',10.5,P.ink);doc.text(lines,M+14,y,{lineHeightFactor:1.29});
        const right=[];if(!byDay)right.push(DOW[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate());
        const pn=shownProject(e.projectName,e.side);if(pn)right.push(pn);if(e.timeSpent)right.push(fmtDur(e.timeSpent));
        setT(k,'normal',8.5,P.muted);let ry=y;for(const t of right.slice(0,3)){doc.text(fit(doc,t,116),R,ry,{align:'right'});ry+=11}
        y+=Math.max(lines.length*13.5,(Math.min(right.length,3))*11);
        if(notes.length){setT(k,'normal',9,P.muted);doc.text(notes,M+14,y-1.5,{lineHeightFactor:1.29});y+=notes.length*11.6+2}
        y+=8;
      }
      y+=8;
    }
    y+=10;
  }
  if(o.routine.length){
    need(70);setT(k,'bold',13,P.ink);doc.text('Recurring checks',M,y);
    setT(k,'normal',10,P.muted);doc.text(String(o.routine.length),R,y,{align:'right'});
    y+=8;doc.setDrawColor(...P.rule);doc.setLineWidth(.6);doc.line(M,y,R,y);y+=20;
    const tally=new Map();for(const e of o.routine)tally.set(e.title,(tally.get(e.title)||0)+1);
    for(const [t,n] of [...tally].sort((a,b)=>b[1]-a[1])){
      need(16);setT(k,'normal',10,P.body);doc.text(fit(doc,t,R-M-80),M+14,y);
      setT(k,'normal',9,P.muted);doc.text(n===1?'once':n+' times',R,y,{align:'right'});y+=15;
    }
  }
  pageNumbers(k,(o.name?o.name+'. ':'')+'Completed work, '+o.rangeTitle);
  return doc;
}
