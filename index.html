<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenYap Todo</title>
<meta name="description" content="Career and OpenYap tasks, what is in progress, and a log of finished work.">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%237c9cff' stroke-width='3'/><path d='M10 16.5l4 4 8-9' fill='none' stroke='%237c9cff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>
// Apply the saved theme before first paint. First visit inherits the legacy app's choice.
(function(){var t='slate';try{t=localStorage.getItem('oym_theme');if(!t){var l=localStorage.getItem('oyt_theme')||'';t={'':'slate','t-ocean':'ocean','t-forest':'forest','t-sunset':'sunset','t-mono':'mono','t-sakura':'sakura','t-light':'light'}[l]||'slate'}}catch(e){t='slate'}document.documentElement.setAttribute('data-theme',t)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
/* ── Themes ─────────────────────────────────────────────────────────────
   Every theme sets the same tokens. The seven legacy themes keep their
   colors; Minimal and Dracula are new. --print* are the PDF ink colors. */
:root,[data-theme="slate"]{
  color-scheme:dark;
  --bg:#0b0e14;--surface:#121721;--raise:#1a2130;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --text:#e6edf3;--body:#b4bfcc;--muted:#7d8896;--faint:#3f4856;
  --accent:#7c9cff;--on-accent:#0b0e14;--career:#5ec2d6;--openyap:#7c9cff;
  --danger:#f87171;--urgent:#fbbf24;--ok:#6ee7a0;--scrim:rgba(3,5,9,.62);
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
[data-theme="ocean"]{--accent:#38bdf8;--openyap:#38bdf8;--career:#5eead4}
[data-theme="forest"]{--accent:#6ee7a0;--openyap:#6ee7a0;--career:#a3c9b4}
[data-theme="sunset"]{--accent:#fb923c;--openyap:#fb923c;--career:#f9a8d4}
[data-theme="mono"]{--accent:#cdd5de;--openyap:#cdd5de;--career:#8b95a3}
[data-theme="sakura"]{--accent:#f0a6c8;--openyap:#f0a6c8;--career:#c4b5fd}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f5fb;--surface:#ffffff;--raise:#ffffff;--line:rgba(26,26,46,.08);--line-2:rgba(26,26,46,.15);
  --text:#1a1a2e;--body:#3f3f55;--muted:#6b6b80;--faint:#b9b9c8;
  --accent:#7c3aed;--on-accent:#ffffff;--career:#2563eb;--openyap:#7c3aed;
  --danger:#dc2626;--urgent:#b45309;--ok:#15803d;--scrim:rgba(26,26,46,.28);
}
[data-theme="minimal"]{
  color-scheme:light;
  --bg:#ffffff;--surface:#f7f7f7;--raise:#ffffff;--line:#efefef;--line-2:#dedede;
  --text:#171717;--body:#3a3a3a;--muted:#8c8c8c;--faint:#cfcfcf;
  --accent:#171717;--on-accent:#ffffff;--career:#737373;--openyap:#171717;
  --danger:#c0392b;--urgent:#171717;--ok:#171717;--scrim:rgba(0,0,0,.18);
}
[data-theme="dracula"]{
  color-scheme:dark;
  --bg:#282a36;--surface:#21222c;--raise:#343746;--line:rgba(98,114,164,.22);--line-2:#44475a;
  --text:#f8f8f2;--body:#e0e0da;--muted:#6272a4;--faint:#4b5270;
  --accent:#bd93f9;--on-accent:#282a36;--career:#8be9fd;--openyap:#bd93f9;
  --danger:#ff5555;--urgent:#ffb86c;--ok:#50fa7b;--scrim:rgba(20,21,28,.7);
  --font:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ── Header ── */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:58px}
.today{font-weight:600;font-size:15px;letter-spacing:-.005em;white-space:nowrap}
.offline{font-size:12px;color:var(--danger)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{padding:6px 11px;border-radius:7px;color:var(--muted);font-size:14px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);background:var(--raise)}
.acts{display:flex;align-items:center;gap:10px}
.theme-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center}
.theme-btn span{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--accent) 50%,var(--career) 50%)}

/* ── Controls ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);font-size:13px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:none}
.btn.danger{color:var(--danger)}
.link{color:var(--accent);font-size:13px}
.link:hover{text-decoration:underline}
.link.danger{color:var(--danger)}
.seg{justify-self:start;display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.seg button{padding:4px 11px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.seg.sm button{padding:2px 9px;font-size:12px}
.chip{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--muted)}
.chip.urgent[aria-pressed="true"]{color:var(--urgent);border-color:var(--urgent)}
.txt{height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);width:100%;outline:none}
.txt:focus{border-color:var(--accent)}
.icon-btn{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:7px;color:var(--muted)}
.icon-btn:hover{color:var(--text);background:var(--surface)}

/* ── Tasks view: two sides ── */
.switch{display:none}
.switch .dim{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.sides{display:grid;grid-template-columns:1fr 1fr;padding-top:8px}
.side{display:grid;grid-template-rows:subgrid;grid-row:span 4;padding:0 36px 48px;min-width:0}
.side:first-child{padding-left:0}
.side:last-child{padding-right:0;border-left:1px solid var(--line)}
.side[data-side="career"]{--side-c:var(--career)}
.side[data-side="openyap"]{--side-c:var(--openyap)}
.side-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 0 0}
.side-name{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.side-name::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--side-c)}
.side-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* The one loud element: what you are doing right now, per side. */
.now{padding:18px 0 22px 16px;margin:14px 0 6px;border-left:2px solid var(--side-c);min-width:0}
.now.empty{border-left-color:var(--line-2)}
.now-label{font-size:12px;color:var(--side-c);font-weight:500}
.now.empty .now-label{color:var(--muted)}
.now-title{font-size:26px;line-height:1.22;font-weight:500;letter-spacing:-.015em;margin:4px 0 8px;overflow-wrap:anywhere;cursor:text}
.now.empty .now-title{color:var(--faint);cursor:default}
.now-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.now-acts{display:flex;gap:8px;margin-top:14px}
.now-acts .btn.primary{background:var(--side-c);border-color:var(--side-c)}
.now-more{margin-top:12px;font-size:13px;color:var(--muted)}
.now-more button{color:var(--body);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.now .editor{padding-top:6px}

.add{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);padding:10px 0;margin-top:6px}
.add:focus-within{border-bottom-color:var(--side-c,var(--accent))}
.add input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.add input::placeholder{color:var(--muted)}
.plus{width:18px;display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1}
.plus::before{content:'+'}
.add-hint{font-size:12px;color:var(--muted);padding-top:6px;display:none}
.addwrap:focus-within .add-hint{display:block}

.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.task.open{display:block}
.ck{flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck:hover{border-color:var(--side-c)}
.task.completing .ck{background:var(--side-c);border-color:var(--side-c)}
.task.completing .t-title{color:var(--muted);text-decoration:line-through}
.task.completing{transition:opacity .28s .1s;opacity:.35}
.t-main{flex:1;min-width:0;cursor:text}
.t-title{overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:2px;font-size:12px;color:var(--muted)}
.t-meta svg{display:block}
.due.late{color:var(--danger)}
.due.soon{color:var(--text)}
.urgent{color:var(--urgent)}
.t-go{flex:none;width:28px;height:28px;margin-top:-3px;display:grid;place-items:center;border-radius:7px;color:var(--muted);opacity:0;transition:opacity .12s}
.t-go:hover{color:var(--side-c);background:var(--surface)}
.task:hover .t-go,.t-go:focus-visible{opacity:1}
@media (hover:none){.t-go{opacity:.7}}
.list-empty{padding:14px 0;color:var(--muted);font-size:14px;list-style:none}
.side-foot{padding-top:14px;font-size:13px;color:var(--muted)}
.side-foot button{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.side-foot button:hover{color:var(--text)}

/* Inline editor */
.editor{display:grid;gap:10px;padding:4px 0 6px}
.e-title{width:100%;background:none;border:0;border-bottom:1px solid var(--line-2);padding:4px 0 8px;font-size:16px;font-weight:500;outline:none}
.e-title:focus{border-bottom-color:var(--side-c,var(--accent))}
.e-notes{width:100%;min-height:76px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.5;outline:none;color:var(--body)}
.e-notes:focus{border-color:var(--line-2)}
.e-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.e-field{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.e-field input{height:28px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);padding:0 8px;font-size:12px;outline:none}
.e-foot{padding-top:2px}
.e-created{font-size:12px;color:var(--muted);margin-left:auto}

/* ── Done view ── */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:26px 0 0}
.search{flex:1;min-width:180px;max-width:280px;margin-left:auto;height:32px;font-size:13px}
.summary{margin:18px 0 0;font-size:14px;color:var(--body)}
.summary .dim{color:var(--muted)}
.bulk{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
.logadd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);padding:10px 0;margin-top:14px}
.logadd:focus-within{border-bottom-color:var(--accent)}
.logadd input{flex:1;min-width:0;background:none;border:0;outline:none}
.logadd input::placeholder{color:var(--muted)}
.wk{margin-top:30px}
.wk-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.drow{display:grid;grid-template-columns:56px 8px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.d-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.d-dot{width:7px;height:7px;border-radius:50%;background:var(--side-c);align-self:center}
.d-main{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.d-title{overflow-wrap:anywhere}
.d-proj{font-size:12px;color:var(--muted)}
.d-lock{color:var(--muted);display:inline-flex;align-self:center}
.drow.is-priv .d-title{color:var(--muted)}
.d-acts{display:flex;gap:2px;opacity:0;transition:opacity .12s;align-self:center}
.drow:hover .d-acts,.drow:focus-within .d-acts{opacity:1}
@media (hover:none){.d-acts{opacity:.8}}
.done-empty{padding:40px 0;color:var(--muted)}

/* ── Files view ── */
.narrow{max-width:760px}
.h{font-size:18px;font-weight:600;margin:30px 0 6px;letter-spacing:-.01em}
.lede{margin:0 0 22px;color:var(--body);max-width:62ch}
.steps{margin:0;padding:0 0 0 22px;display:grid;gap:22px}
.steps li{padding-left:6px}
.steps li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.st-t{font-weight:500;margin-bottom:6px}
.steps p{margin:0 0 10px;color:var(--body);font-size:14px;max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .txt{flex:1;min-width:220px}
pre.script{max-height:240px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--mono);color:var(--body);margin:10px 0 0}
.msg{min-height:20px;font-size:13px;color:var(--muted);margin:14px 0 0}
.msg.err{color:var(--danger)}
details.other{margin-top:26px;font-size:14px;color:var(--body)}
details.other summary{cursor:pointer;color:var(--muted)}
details.other > div{padding-top:10px;display:grid;gap:10px}
.code{display:block;font:12px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-wrap:anywhere;color:var(--body)}
.files-head{display:flex;align-items:baseline;gap:16px;margin:30px 0 16px}
.files-head .h{margin:0;margin-right:auto}
.drop{border:1px dashed var(--line-2);border-radius:12px;padding:22px;display:grid;gap:12px;justify-items:center;text-align:center;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--accent);color:var(--text);background:var(--surface)}
.drop .row{justify-content:center}
.drop .txt{max-width:420px;height:32px;font-size:13px}
.up-status{margin-top:10px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.up-status .ok{color:var(--ok)}
.up-status .err{color:var(--danger)}
.flist-bar{display:flex;align-items:center;justify-content:space-between;margin:26px 0 4px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.f-name{overflow-wrap:anywhere;text-decoration:none}
.f-name:hover{text-decoration:underline}
.f-note{display:block;font-size:12px;color:var(--muted)}
.f-side,.f-date,.f-size{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.f-trash{font-size:12px;color:var(--danger)}

/* ── Export sheet ── */
.back{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);border:1px solid var(--line-2);border-radius:14px;width:min(700px,100%);max-height:min(90vh,920px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.sheet-head h2{margin:0;font-size:17px;font-weight:600}
.sheet-body{padding:16px 22px 8px;overflow:auto;display:grid;gap:16px}
.fld{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.lbl{font-size:13px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:16px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--body);cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.pick-head{display:flex;align-items:baseline;gap:14px;font-size:13px;color:var(--body)}
.pick-head span{margin-right:auto}
.pick{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto}
.pick-row{display:grid;grid-template-columns:16px 58px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.pick-row:last-child{border-bottom:0}
.pick-row input{accent-color:var(--accent);margin:0;align-self:center}
.pk-date{color:var(--muted);font-variant-numeric:tabular-nums}
.pk-title{overflow-wrap:anywhere}
.pk-tag{font-size:11px;color:var(--muted)}
.pick-empty{padding:18px 12px;color:var(--muted);font-size:13px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tpl{display:grid;gap:6px;align-content:start;padding:10px;border:1px solid var(--line-2);border-radius:10px;color:var(--muted)}
.tpl:hover{border-color:var(--muted)}
.tpl[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--text)}
.tpl svg{width:48px;height:62px;color:var(--muted)}
.tpl[aria-checked="true"] svg{color:var(--accent)}
.tpl-name{font-size:13px;font-weight:500;color:var(--text)}
.tpl-desc{font-size:12px;line-height:1.35;color:var(--muted)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.sheet-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.ex-status{margin-right:auto;font-size:13px;color:var(--muted)}
.ex-status.err{color:var(--danger)}

/* ── Theme popover, toast, footer ── */
.pop{position:fixed;z-index:70;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:10px;width:282px;box-shadow:0 18px 44px rgba(0,0,0,.3)}
.th-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.th{display:grid;justify-items:center;gap:6px;padding:8px 4px;border-radius:8px;font-size:12px;color:var(--muted)}
.th:hover{background:var(--surface);color:var(--text)}
.th[aria-pressed="true"]{color:var(--text);background:var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.th-sw{width:44px;height:30px;border-radius:7px;border:1px solid;position:relative;overflow:hidden}
.th-sw i{position:absolute;left:7px;right:7px;height:3px;border-radius:2px}
.th-sw i:first-child{top:9px}
.th-sw i:last-child{top:16px;right:18px}
.th-new{font-size:10px;color:var(--accent)}

<body>

<header class="top">
  <div class="wrap">
    <span class="today" id="today"></span>
    <span class="offline" id="offline" hidden>Offline</span>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-view="tasks">Tasks</button>
      <button class="tab" role="tab" data-view="done">Done</button>
      <button class="tab" role="tab" data-view="files">Files</button>
    </nav>
    <div class="acts">
      <button class="btn" id="exportBtn">Export</button>
      <button class="theme-btn" id="themeBtn" aria-label="Change theme" title="Theme"><span></span></button>
    </div>
  </div>
</header>

<main>
  <section id="v-tasks" class="view" aria-label="Tasks">
    <div class="wrap">
      <div class="switch"><div class="seg" role="group" aria-label="Side" id="mswitch"></div></div>
      <div class="sides" id="sides"></div>
    </div>
  </section>

  <section id="v-done" class="view" aria-label="Done" hidden>
    <div class="wrap">
      <div class="bar">
        <div class="seg" role="group" aria-label="Period" data-g="range"></div>
        <div class="seg" role="group" aria-label="Side" data-g="dside"></div>
        <input class="txt search" id="doneSearch" type="search" placeholder="Search finished work" aria-label="Search finished work">
      </div>
      <p class="summary" id="doneSummary"></p>
      <form class="logadd" id="logAdd" autocomplete="off">
        <span class="plus" aria-hidden="true"></span>
        <input type="text" id="logInput" placeholder="Log something you finished. Add @yesterday or @9/18 to backdate it." aria-label="Log finished work" enterkeyhint="done">
        <div class="seg sm" role="group" aria-label="Side for logged work" data-g="logside"></div>
      </form>
      <div id="doneList"></div>
    </div>
  </section>

  <section id="v-files" class="view" aria-label="Files" hidden>
    <div class="wrap narrow" id="filesHost"></div>
  </section>
</main>

<footer class="foot wrap"><a href="legacy/">Open the legacy version</a></footer>

<div class="back" id="exBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <div class="sheet-head">
      <h2 id="exTitle">Export PDF</h2>
      <button class="icon-btn" data-ex="close" aria-label="Close"></button>
    </div>
    <div class="sheet-body">
      <div class="seg" role="group" aria-label="Export type" data-exg="tab"></div>
      <div id="exBody"></div>
    </div>
    <div class="sheet-foot">
      <span class="ex-status" id="exStatus" aria-live="polite"></span>
      <button class="btn" data-ex="preview">Preview</button>
      <button class="btn" data-ex="drive" hidden>Save to Drive</button>
      <button class="btn" data-ex="share" hidden title="Open in Notability or another app">Share</button>
      <button class="btn primary" data-ex="download">Download PDF</button>
    </div>
  </div>
</div>

<div class="pop" id="themePop" role="dialog" aria-label="Theme" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';

// ═══ Small helpers ═══════════════════════════════════════════════════════
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS={
  get(k,d=null){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const sod=(d=new Date())=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=sod(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtMD=d=>MON[d.getMonth()]+' '+d.getDate();
const fmtMDY=d=>fmtMD(d)+', '+d.getFullYear();
function fmtTime(d){let h=d.getHours();const m=d.getMinutes(),ap=h<12?'am':'pm';h=h%12||12;return h+(m?':'+pad(m):'')+' '+ap}
function fmtDur(ms){const m=Math.floor(ms/60000);if(m<1)return 'under a minute';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h'+(m%60?' '+(m%60)+'m':'');const d=Math.floor(h/24);return d+'d'+(h%24?' '+(h%24)+'h':'')}
function fmtSize(b){if(!b&&b!==0)return '';if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB'}
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICON={
  play:'<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3.2v9.6l7.5-4.8z" fill="currentColor"/></svg>',
  lock:'<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5.3a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  unlock:'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5.3a2.5 2.5 0 0 1 4.8-1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  swap:'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3 5.5h9.5L10 3M13 10.5H3.5L6 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  undo:'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.5 3.5 3 6l2.5 2.5M3.5 6h6a3 3 0 0 1 0 6H7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  note:'<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3.5 4.5h9M3.5 8h9M3.5 11.5h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
};

// ═══ Themes ══════════════════════════════════════════════════════════════
// Swatch colors for the picker; print colors are the PDF ink for headings
// and the two sides (dark-theme accents are too pale for white paper).
const THEMES=[
  {id:'slate',  name:'Slate',  bg:'#0b0e14',line:'#262c37',a:'#7c9cff',b:'#5ec2d6',print:'#4f6bdc',pc:'#0e7c8c',po:'#4f6bdc'},
  {id:'ocean',  name:'Ocean',  bg:'#0b0e14',line:'#262c37',a:'#38bdf8',b:'#5eead4',print:'#0284c7',pc:'#0f766e',po:'#0284c7'},
  {id:'forest', name:'Forest', bg:'#0b0e14',line:'#262c37',a:'#6ee7a0',b:'#a3c9b4',print:'#15803d',pc:'#4d7c65',po:'#15803d'},
  {id:'sunset', name:'Sunset', bg:'#0b0e14',line:'#262c37',a:'#fb923c',b:'#f9a8d4',print:'#c2410c',pc:'#be185d',po:'#c2410c'},
  {id:'mono',   name:'Mono',   bg:'#0b0e14',line:'#262c37',a:'#cdd5de',b:'#8b95a3',print:'#334155',pc:'#64748b',po:'#1e293b'},
  {id:'sakura', name:'Sakura', bg:'#0b0e14',line:'#262c37',a:'#f0a6c8',b:'#c4b5fd',print:'#be185d',pc:'#6d28d9',po:'#be185d'},
  {id:'light',  name:'Light',  bg:'#f6f5fb',line:'#dcdbe6',a:'#7c3aed',b:'#2563eb',print:'#7c3aed',pc:'#2563eb',po:'#7c3aed'},
  {id:'minimal',name:'Minimal',bg:'#ffffff',line:'#dedede',a:'#171717',b:'#9a9a9a',print:'#171717',pc:'#6b6b6b',po:'#171717',isNew:true},
  {id:'dracula',name:'Dracula',bg:'#282a36',line:'#44475a',a:'#bd93f9',b:'#50fa7b',print:'#6d4fc2',pc:'#0e7490',po:'#6d4fc2',isNew:true,mono:true}
];
const curTheme=()=>THEMES.find(t=>t.id===document.documentElement.dataset.theme)||THEMES[0];
function applyTheme(id){
  if(!THEMES.some(t=>t.id===id))id='slate';
  document.documentElement.dataset.theme=id;
  LS.set('oym_theme',id);
  const m=$('meta[name="theme-color"]');if(m)m.content=curTheme().bg;
}

// ═══ Firebase (same database and paths as the legacy app) ═══════════════
const DB_URL='https://gen-lang-client-0119642855-default-rtdb.firebaseio.com';
let db=null;
try{if(!firebase.apps.length)firebase.initializeApp({databaseURL:DB_URL});db=firebase.database()}catch(e){console.error('Firebase',e)}
const newKey=p=>db.ref(p).push().key;
function upd(o){if(!db)return Promise.reject(new Error('No database'));return db.ref().update(o).catch(err=>{toast('Could not save: '+err.message);throw err})}
const TP=id=>'todo/tasks/'+id;

// ═══ State ═══════════════════════════════════════════════════════════════
const SIDES=['career','openyap'];
const SIDE_NAME={career:'Career',openyap:'OpenYap'};
const other=s=>s==='career'?'openyap':'career';
const PRI_RANK={high:0,medium:1,low:2};
// Legacy tasks have no side. OpenYap-flavored titles land on the OpenYap side.
const OY_RE=/open\s?yap|\bai\b|\bllm\b|claude|minimax|deepseek/i;

let tasks={},hist={},projects={},sideMap={};
const ready={tasks:false,hist:false};
let view=LS.get('oym_view','tasks');if(!['tasks','done','files'].includes(view))view='tasks';
let mSide=LS.get('oym_mside','career');if(!SIDES.includes(mSide))mSide='career';
let openId=null;
let lastAddSide='career';
const doneF={range:LS.get('oym_drange','week'),side:LS.get('oym_dside','all'),q:''};
let logSide=LS.get('oym_logside','career');if(!SIDES.includes(logSide))logSide='career';

// ═══ Sides and privacy ═══════════════════════════════════════════════════
// todo/sides/{projectId} = {side, private}. Maps legacy projects onto a side and
// marks the ones that must never reach a report.
function projSide(pid){
  if(!pid)return null;
  if(sideMap[pid])return sideMap[pid];
  if(/open\s?yap/i.test(projects[pid]?.name||''))return {side:'openyap'};
  return null;
}
function taskSide(t){
  if(t.side==='career'||t.side==='openyap')return t.side;
  const m=projSide(t.projectId);
  if(m&&SIDES.includes(m.side))return m.side;
  return OY_RE.test(t.title||'')?'openyap':'career';
}
function taskPrivate(t){
  if(t.private!=null)return !!t.private;
  const m=projSide(t.projectId);
  if(m&&m.private)return true;
  return t.category==='personal';
}
const projName=pid=>(pid&&projects[pid]?.name)||'';
const oyProjectId=()=>{for(const [id,p] of Object.entries(projects))if(p&&/^open\s?yap$/i.test(p.name||'')&&p.status!=='archived')return id;return ''};
const shownProject=(name,side)=>name&&name.toLowerCase().replace(/\s/g,'')!==SIDE_NAME[side].toLowerCase()?name:'';

// ═══ Done log ════════════════════════════════════════════════════════════
// History rows are the record. A one-shot task keeps only its latest row, a
// reopened task drops out, and completed tasks that predate the history log
// are folded in so nothing finished goes missing.
let _entries=null;
function entries(){
  if(_entries)return _entries;
  const out=[],best=new Map();
  for(const [hid,h] of Object.entries(hist)){
    if(!h||!h.completedAt)continue;
    const t=h.taskId?tasks[h.taskId]:null;
    const oneShot=!!(t&&(t.repeat||'none')==='none'&&!h.subId);
    if(oneShot&&(!t.completed||t.logHidden))continue;
    const e=rowEntry(hid,h,t,oneShot);
    if(oneShot){const k=h.taskId,cur=best.get(k);if(!cur||cur.completedAt<e.completedAt)best.set(k,e)}
    else out.push(e);
  }
  for(const [id,t] of Object.entries(tasks)){
    if(!t||!t.completed||!t.completedAt||t.logHidden||(t.repeat||'none')!=='none'||best.has(id))continue;
    best.set(id,{key:'t:'+id,hid:null,taskId:id,title:t.title||'(untitled)',notes:t.notes||'',completedAt:t.completedAt,
      projectName:projName(t.projectId),side:taskSide(t),private:taskPrivate(t),routine:false,timeSpent:t.timeSpent||0,reopenable:true});
  }
  _entries=out.concat([...best.values()]).sort((a,b)=>a.completedAt<b.completedAt?1:a.completedAt>b.completedAt?-1:0);
  return _entries;
}
function rowEntry(hid,h,t,oneShot){
  let side=h.side;
  if(!SIDES.includes(side))side=t?taskSide(t):(projSide(h.projectId)?.side||(OY_RE.test(h.title||'')?'openyap':'career'));
  let priv;
  if(h.private!=null)priv=!!h.private;
  else if(t)priv=taskPrivate(t);
  else{const m=projSide(h.projectId);priv=!!(m&&m.private)||h.category==='personal'}
  return {key:'h:'+hid,hid,taskId:h.taskId||null,title:h.title||'(untitled)',notes:h.notes||'',completedAt:h.completedAt,
    projectName:h.projectName||projName(h.projectId),side,private:priv,routine:h.category==='routine',timeSpent:h.timeSpent||0,reopenable:oneShot};
}
function rangeBounds(r){
  const now=new Date(),mon=mondayOf(now);
  if(r==='week')return [mon,addDays(mon,7)];
  if(r==='lastweek')return [addDays(mon,-7),mon];
  if(r==='month')return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)];
  return [new Date(0),new Date(8.64e15)];
}
function inRange(e,r){const [a,b]=rangeBounds(r),d=new Date(e.completedAt);return d>=a&&d<b}
function spanLabel(a,b){
  if(a.getFullYear()!==b.getFullYear())return fmtMDY(a)+' – '+fmtMDY(b);
  if(a.getMonth()===b.getMonth())return MON[a.getMonth()]+' '+a.getDate()+'–'+b.getDate()+', '+b.getFullYear();
  return fmtMD(a)+' – '+fmtMD(b)+', '+b.getFullYear();
}
function rangeTitle(r,list){
  const now=new Date(),mon=mondayOf(now);
  if(r==='week')return 'This week, '+spanLabel(mon,addDays(mon,6));
  if(r==='lastweek')return 'Last week, '+spanLabel(addDays(mon,-7),addDays(mon,-1));
  if(r==='month')return MONL[now.getMonth()]+' '+now.getFullYear();
  if(list&&list.length)return 'All time, '+spanLabel(new Date(list[list.length-1].completedAt),now);
  return 'All time';
}
const RANGES=[['week','This week'],['lastweek','Last week'],['month','This month'],['all','All time']];
const RANGE_PHRASE={week:'this week',lastweek:'last week',month:'this month',all:'in total'};

// ═══ Task actions ════════════════════════════════════════════════════════
function buildTask(o={}){return{
  title:'',priority:'medium',category:'work',difficulty:'medium',
  progress:0,dueDate:'',dueTime:'',repeat:'none',notes:'',from:'',projectId:'',
  completed:false,completedAt:'',createdAt:new Date().toISOString(),order:Date.now(),...o}}
function sideFields(side){
  return side==='openyap'?{side,category:'project',projectId:oyProjectId()}:{side,category:'work'};
}
function nextDueDate(ds,rep){
  if(!ds||!rep||rep==='none')return '';
  const d=parseYmd(ds);
  if(rep==='daily')d.setDate(d.getDate()+1);else if(rep==='weekly')d.setDate(d.getDate()+7);else if(rep==='monthly')d.setMonth(d.getMonth()+1);else return '';
  return ymd(d);
}
const sessionMs=t=>t&&t.doing&&t.doingSince?Math.max(0,Date.now()-Date.parse(t.doingSince)):0;
function pauseFields(id,t,up){
  const spent=(t.timeSpent||0)+sessionMs(t);
  up[TP(id)+'/doing']=null;up[TP(id)+'/doingSince']=null;up[TP(id)+'/timeSpent']=spent||null;
}

// Quick add: "@fri" or "@9/30" sets a date, a lone "!" marks it urgent, "// text" becomes a note.
function parseDateTok(tok,past){
  tok=tok.toLowerCase().replace(/[.,;]$/,'');
  const base=sod();
  if(tok==='today'||tok==='tod'||tok==='now')return ymd(base);
  if(tok==='tomorrow'||tok==='tmr'||tok==='tom')return ymd(addDays(base,1));
  if(tok==='yesterday'||tok==='yday')return ymd(addDays(base,-1));
  if(tok==='nextweek'||tok==='next-week'){const m=mondayOf(base);return ymd(addDays(m,7))}
  let m=tok.match(/^(sun|mon|tue|wed|thu|fri|sat)[a-z]*$/);
  if(m){
    const i=DOW.map(s=>s.toLowerCase()).indexOf(m[1]);
    if(past){let diff=(base.getDay()-i+7)%7;return ymd(addDays(base,-diff))}
    let diff=(i-base.getDay()+7)%7;if(diff===0)diff=7;return ymd(addDays(base,diff));
  }
  m=tok.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return ymd(new Date(+m[1],m[2]-1,+m[3]));
  m=tok.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){
    let y=m[3]?+m[3]:base.getFullYear();if(y<100)y+=2000;
    const d=new Date(y,m[1]-1,+m[2]);
    if(!m[3]){if(!past&&d<addDays(base,-30))d.setFullYear(y+1);if(past&&d>base)d.setFullYear(y-1)}
    return isNaN(d)?null:ymd(d);
  }
  m=tok.match(/^in(\d{1,3})d$/);
  if(m&&!past)return ymd(addDays(base,+m[1]));
  return null;
}
function parseQuick(raw,past){
  let s=' '+String(raw||'').trim()+' ',notes='';
  const ni=s.indexOf(' // ');
  if(ni>=0){notes=s.slice(ni+4).trim();s=s.slice(0,ni)+' '}
  let urgent=false,due='';
  s=s.replace(/\s!(?:high|urgent)?(?=\s)/gi,()=>{urgent=true;return ' '});
  s=s.replace(/\s@(\S+)(?=\s)/g,(all,tok)=>{const d=parseDateTok(tok,past);if(d){due=d;return ' '}return all});
  return {title:s.replace(/\s+/g,' ').trim(),urgent,due,notes};
}

    if(payload)res=await fetch(b.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,action,k:b.key})});
    else res=await fetch(b.url+(b.url.includes('?')?'&':'?')+new URLSearchParams({action,k:b.key}));
  }catch(e){throw new Error('Could not reach the Drive connector. Check your connection.')}
  let j;
  try{j=await res.json()}catch(e){throw new Error('The connector answered with a web page instead of data. Redeploy it with Execute as: Me and Who has access: Anyone.')}
  if(!j.ok)throw new Error(j.error||'The Drive connector returned an error.');
  return j;
}
function connectorScript(folderId,key){return [
"// OpenYap Todo, Drive connector. It runs in your Google account and saves",
"// uploads into your notes folder. Deploy as a Web app: Execute as Me, access Anyone.",
"const FOLDER_ID = '"+folderId+"';",
"const KEY = '"+key+"';",
"",
"function doGet(e) { return handle_((e && e.parameter) || {}); }",
"function doPost(e) {",
"  var body = {};",
"  try { body = JSON.parse(e.postData.contents); } catch (err) {}",
"  return handle_(body);",
"}",
"function handle_(p) {",
"  if (p.k !== KEY) return out_({ ok: false, error: 'Wrong connection key' });",
"  try {",
"    var root = DriveApp.getFolderById(FOLDER_ID);",
"    if (p.action === 'ping') return out_({ ok: true, folder: root.getName(), url: root.getUrl() });",
"    if (p.action === 'list') return out_({ ok: true, files: list_(root) });",
"    if (p.action === 'upload') return out_({ ok: true, file: upload_(root, p) });",
"    if (p.action === 'trash') return out_({ ok: true, trashed: trash_(root, p.id) });",
"    return out_({ ok: false, error: 'Unknown action' });",
"  } catch (err) {",
"    return out_({ ok: false, error: String((err && err.message) || err) });",
"  }",
"}",
"function sub_(root, name) {",
"  var it = root.getFoldersByName(name);",
"  return it.hasNext() ? it.next() : root.createFolder(name);",
"}",
"function list_(root) {",
"  var out = [];",
"  function walk(folder, side, depth) {",
"    var files = folder.getFiles();",
"    while (files.hasNext()) {",
"      var f = files.next();",
"      out.push({ id: f.getId(), name: f.getName(), mime: f.getMimeType(), size: f.getSize(),",
"        created: f.getDateCreated().toISOString(), url: f.getUrl(), side: side, note: f.getDescription() || '' });",
"    }",
"    if (depth > 2) return;",
"    var subs = folder.getFolders();",
"    while (subs.hasNext()) { var s = subs.next(); walk(s, side || s.getName(), depth + 1); }",
"  }",
"  walk(root, '', 0);",
"  out.sort(function (a, b) { return a.created < b.created ? 1 : -1; });",
"  return out;",
"}",
"function upload_(root, p) {",
"  var folder = p.side ? sub_(root, String(p.side)) : root;",
"  var blob = Utilities.newBlob(Utilities.base64Decode(p.data), p.mime || 'application/octet-stream', p.name || 'note');",
"  var f = folder.createFile(blob);",
"  if (p.note) f.setDescription(String(p.note));",
"  return { id: f.getId(), name: f.getName(), url: f.getUrl() };",
"}",
"function trash_(root, id) {",
"  var f = DriveApp.getFileById(id);",
"  if (!inside_(f, root.getId(), 0)) throw new Error('That file is not in the notes folder');",
"  f.setTrashed(true);",
"  return id;",
"}",
"function inside_(item, rootId, depth) {",
"  if (depth > 4) return false;",
"  var ps = item.getParents();",
"  while (ps.hasNext()) { var p = ps.next(); if (p.getId() === rootId || inside_(p, rootId, depth + 1)) return true; }",
"  return false;",
"}",
"function out_(o) {",
"  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);",
"}",
""].join('\n')}
const connCode=b=>'oym1.'+btoa(JSON.stringify({url:b.url,key:b.key}));
function parseConnCode(s){s=String(s||'').trim();if(!s.startsWith('oym1.'))return null;try{const o=JSON.parse(atob(s.slice(5)));return o&&o.url&&o.key?o:null}catch(e){return null}}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true}catch(e){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}

async function refreshFiles(){

function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
async function uploadFiles(list){
  const note=($('#upNote')?.value||'').trim();
  for(const f of list){
    if(f.size>30*1048576){upLog.push({msg:f.name+' is over 30 MB. Upload it in Drive directly.',cls:'err'});renderUpLog();continue}
    const line={msg:'Uploading '+f.name+'…'};upLog.push(line);renderUpLog();
    try{
      await bridgeCall('upload',{name:f.name,mime:f.type||'application/octet-stream',data:await blobToB64(f),side:upSide,note});
      line.msg='Saved '+f.name+' to '+upSide;line.cls='ok';
    }catch(e){line.msg=f.name+': '+e.message;line.cls='err'}
    renderUpLog();
  }
  const n=$('#upNote');if(n)n.value='';
  refreshFiles();
}
async function filesAct(act,el){
  const msg=(t,err)=>{const m=$('#stMsg');if(m){m.textContent=t;m.className='msg'+(err?' err':'')}};
  if(act==='copy'||act==='show'){
    const url=$('#stFolder').value,id=folderIdFrom(url);
    if(!id){msg('Paste the Drive folder link first. It looks like drive.google.com/drive/folders/…',true);return}
    const p=pending.get();p.key=p.key||randKey();p.folderId=id;p.folderUrl=url.trim();pending.set(p);
    const s=connectorScript(id,p.key);
    if(act==='show'){const pre=$('#stScript');pre.textContent=s;pre.hidden=!pre.hidden;return}
    msg((await copyText(s))?'Script copied. Paste it into script.new.':'Copy did not work here. Use Show script and copy it by hand.',false);
  }else if(act==='connect'){
    const url=$('#stUrl').value.trim(),p=pending.get();
    if(!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(url)){msg('That is not a web app URL. It starts with https://script.google.com and ends with /exec.',true);return}
    if(!p.key){msg('Copy the script first (step 2), so the key in the script matches this device.',true);return}
    await connect({url,key:p.key},msg);
  }else if(act==='code'){
    const o=parseConnCode($('#stCode').value);
    if(!o){msg('That connection code is not valid. It starts with oym1.',true);return}
    await connect(o,msg);
  }else if(act==='refresh'){files=null;refreshFiles()}
  else if(act==='pick'){$('#fileIn').click()}
  else if(act==='copycode'){toast((await copyText(connCode(bridge.get())))?'Connection code copied':'Copy did not work. Select the code and copy it.')}
  else if(act==='disconnect'){bridge.set(null);files=null;renderFiles();toast('Disconnected this device. Your files stay in Drive.')}
  else if(act==='arm'){trashArm=el.dataset.fid;renderFileList();setTimeout(()=>{if(trashArm===el.dataset.fid){trashArm=null;renderFileList()}},4000)}
  else if(act==='trash'){
    const id=el.dataset.fid;trashArm=null;el.disabled=true;el.textContent='Moving…';
    try{await bridgeCall('trash',{id});files=(files||[]).filter(f=>f.id!==id);renderFileList();toast('Moved to Drive trash. Restore it from Drive if needed.')}
    catch(e){toast(e.message);renderFileList()}
  }
}
async function connect(b,msg){
  msg('Connecting…');
  const prev=bridge.get();bridge.set(b);
  try{
    const j=await bridgeCall('ping');
    bridge.set({...b,folderUrl:j.url,folderName:j.folder});
    files=null;renderFiles();toast('Connected to “'+j.folder+'”');
  }catch(e){bridge.set(prev);msg(e.message,true)}
}

// ═══ PDF export ══════════════════════════════════════════════════════════
let pdfLib=null;
function loadPDF(){
  if(window.jspdf)return Promise.resolve();
  if(!pdfLib)pdfLib=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=()=>res();s.onerror=()=>{pdfLib=null;rej(new Error('The PDF library did not load. Check your connection and try again.'))};
    document.head.appendChild(s);
  });
  return pdfLib;
}
// Standard PDF fonts only carry Latin-1; fold typographic marks, drop the rest.
const pc=s=>String(s||'').replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"').replace(/[–—−]/g,'-').replace(/…/g,'...')
  .replace(/[   ]/g,' ').replace(/•/g,'-').replace(/[\r\t]/g,' ').replace(/[^\n\x20-\x7E¡-ÿ]/g,'').replace(/ {2,}/g,' ').trim();
const hexRgb=h=>{h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return isNaN(n)?[80,80,80]:[n>>16&255,n>>8&255,n&255]};
function pdfKit(paper){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:paper==='a4'?'a4':'letter',compress:true});
  const th=curTheme();
  const P={ink:[28,31,36],body:[64,70,80],muted:[118,124,134],rule:[208,213,219],line:[208,215,224],dot:[168,175,184],
    acc:hexRgb(th.print),career:hexRgb(th.pc),openyap:hexRgb(th.po),font:th.mono?'courier':'helvetica'};
  return {doc,P,F:P.font,W:doc.internal.pageSize.getWidth(),H:doc.internal.pageSize.getHeight()};
}
function fit(doc,s,w){s=pc(s);if(doc.getTextWidth(s)<=w)return s;while(s.length>1&&doc.getTextWidth(s+'...')>w)s=s.slice(0,-1);return s.trimEnd()+'...'}
function wrap(doc,s,w,max){
  let lines=doc.splitTextToSize(pc(s)||' ',w);
  if(max&&lines.length>max){lines=lines.slice(0,max);let last=lines[max-1];while(last.length>1&&doc.getTextWidth(last+'...')>w)last=last.slice(0,-1);lines[max-1]=last.trimEnd()+'...'}
  return lines;
}
function setT(k,style,size,color){k.doc.setFont(k.F,style);k.doc.setFontSize(size);k.doc.setTextColor(...color)}
function pageNumbers(k,label){
  const n=k.doc.getNumberOfPages();if(n<2&&!label)return;
  for(let i=1;i<=n;i++){k.doc.setPage(i);setT(k,'normal',7.5,k.P.muted);
    const m=k.M||40;
    if(label)k.doc.text(fit(k.doc,label,k.W-2*m-80),m,k.H-24);
    if(n>1)k.doc.text('Page '+i+' of '+n,k.W-m,k.H-24,{align:'right'})}
}

// Report for a manager: finished work in a period, grouped by side, then by day or week.
function buildReport(o){
  const k=pdfKit(o.paper),{doc,P,W,H}=k,M=54,R=W-M;let y=M;k.M=M;
  const byDay=o.range==='week'||o.range==='lastweek';
  function head(first){
    y=M;
    if(first){
      setT(k,'bold',20,P.ink);doc.text('Completed work',M,y+16);
      setT(k,'normal',9.5,P.muted);doc.text(pc(o.rangeTitle),R,y+8,{align:'right'});doc.text('Generated '+fmtMDY(new Date()),R,y+21,{align:'right'});
      if(o.name){setT(k,'normal',11,P.body);doc.text(fit(doc,o.name,R-M-200),M,y+35)}
      y+=o.name?48:34;doc.setDrawColor(...P.acc);doc.setLineWidth(1.2);doc.line(M,y,R,y);y+=26;
    }else{setT(k,'normal',8.5,P.muted);doc.text(pc('Completed work, '+o.rangeTitle),M,y+2);y+=26}
  }
  const need=h=>{if(y+h>H-M-10){doc.addPage();head(false);return true}return false};
  head(true);
  const cnt={career:0,openyap:0};o.items.forEach(e=>cnt[e.side]++);
  let s=o.items.length+' task'+(o.items.length===1?'':'s')+' completed';
  if(o.side==='both')s+=': '+cnt.career+' Career, '+cnt.openyap+' OpenYap';
  if(o.routine.length)s+='. Plus '+o.routine.length+' recurring check'+(o.routine.length===1?'':'s');
  setT(k,'normal',11,P.ink);doc.text(pc(s+'.'),M,y);y+=26;
  if(!o.items.length&&!o.routine.length){setT(k,'normal',10.5,P.muted);doc.text('Nothing was completed in this period.',M,y)}
  const sides=o.side==='both'?SIDES:[o.side];
  const colW=R-M-14-122;
  for(const side of sides){
    const list=o.items.filter(e=>e.side===side);if(!list.length)continue;
    if(sides.length>1){
      need(70);setT(k,'bold',13,P[side]);doc.text(SIDE_NAME[side],M,y);
      setT(k,'normal',10,P.muted);doc.text(String(list.length),R,y,{align:'right'});
      y+=8;doc.setDrawColor(...P.rule);doc.setLineWidth(.6);doc.line(M,y,R,y);y+=20;
    }
    const groups=new Map();
    for(const e of list){const d=new Date(e.completedAt),g=byDay?ymd(d):ymd(mondayOf(d));if(!groups.has(g))groups.set(g,[]);groups.get(g).push(e)}
    for(const [g,rows] of groups){
      const gd=parseYmd(g);
      need(44);setT(k,'bold',9.5,P.muted);doc.text(pc(byDay?DOWL[gd.getDay()]+', '+fmtMD(gd):'Week of '+fmtMDY(gd)),M,y);y+=16;
      for(const e of rows){
        const d=new Date(e.completedAt);
        setT(k,'normal',10.5,P.ink);const lines=wrap(doc,e.title,colW,3);
        let notes=[];if(o.notes&&e.notes){doc.setFontSize(9);notes=wrap(doc,e.notes.replace(/\s+/g,' '),colW,2)}
        need(lines.length*13.5+(notes.length?notes.length*11.6+2:0)+8);
        doc.setFillColor(...P[side]);doc.rect(M+1,y-7,4,4,'F');
        setT(k,'normal',10.5,P.ink);doc.text(lines,M+14,y,{lineHeightFactor:1.29});
        const right=[];if(!byDay)right.push(DOW[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate());
        const pn=shownProject(e.projectName,e.side);if(pn)right.push(pn);if(e.timeSpent)right.push(fmtDur(e.timeSpent));
        setT(k,'normal',8.5,P.muted);let ry=y;for(const t of right.slice(0,3)){doc.text(fit(doc,t,116),R,ry,{align:'right'});ry+=11}
        y+=Math.max(lines.length*13.5,(Math.min(right.length,3))*11);
        if(notes.length){setT(k,'normal',9,P.muted);doc.text(notes,M+14,y-1.5,{lineHeightFactor:1.29});y+=notes.length*11.6+2}
        y+=8;
      }
      y+=8;
    }
    y+=10;
  }
  if(o.routine.length){
    need(70);setT(k,'bold',13,P.ink);doc.text('Recurring checks',M,y);
    setT(k,'normal',10,P.muted);doc.text(String(o.routine.length),R,y,{align:'right'});
    y+=8;doc.setDrawColor(...P.rule);doc.setLineWidth(.6);doc.line(M,y,R,y);y+=20;
    const tally=new Map();for(const e of o.routine)tally.set(e.title,(tally.get(e.title)||0)+1);
    for(const [t,n] of [...tally].sort((a,b)=>b[1]-a[1])){
      need(16);setT(k,'normal',10,P.body);doc.text(fit(doc,t,R-M-80),M+14,y);
      setT(k,'normal',9,P.muted);doc.text(n===1?'once':n+' times',R,y,{align:'right'});y+=15;
    }
  }
  pageNumbers(k,(o.name?o.name+'. ':'')+'Completed work, '+o.rangeTitle);
  return doc;
}

function taskMeta(t){
  const m=[];if(t.doing)m.push('In progress');
  if(t.dueDate){const dl=dueLabel(t.dueDate);m.push((dl.cls==='late'?'Overdue, ':'Due ')+(dl.txt==='Today'||dl.txt==='Tomorrow'?dl.txt.toLowerCase():dl.txt))}
  if(t.priority==='high')m.push('Urgent');
  const pn=shownProject(projName(t.projectId),taskSide(t));if(pn)m.push(pn);
  return m.join(', ');
}
function dumpData(o){
  const sides=o.side==='both'?SIDES:[o.side];
  const groups=sides.map(s=>{const {doing,rest}=openFor(s);return {side:s,tasks:doing.concat(rest).map(([,t])=>t)}});
  const wins=o.wins?entries().filter(e=>inRange(e,'week')&&sides.includes(e.side)&&!e.routine):[];
  return {sides,groups,wins,week:'Week of '+fmtMDY(mondayOf(new Date()))};
}
function buildDump(o){

function dumpHead(k,title){

  doc.setDrawColor(...P.acc);doc.setLineWidth(1);doc.line(M,M+20,W-M,M+20);
  return M+20;
}
function checkbox(k,x,y,color,filled){
  const {doc}=k;doc.setDrawColor(...color);doc.setLineWidth(.8);doc.rect(x,y-7,7,7,'S');
  if(filled){doc.setLineWidth(1.1);doc.line(x+1.4,y-3.4,x+3,y-1.6);doc.line(x+3,y-1.6,x+5.8,y-5.6)}
}
function ruled(k,x1,x2,y1,y2,gap){const {doc,P}=k;doc.setDrawColor(...P.line);doc.setLineWidth(.5);for(let y=y1;y<=y2;y+=gap)doc.line(x1,y,x2,y)}

function tplCornell(k){
  const {doc,P,W,H,M}=k,G=24,cueW=Math.round((W-2*M)*.31),xr=M+cueW,sumTop=H-M-Math.round((H-2*M)*.17);
  let top=0,rows=0,r=0;
  function frame(title){
    top=dumpHead(k,title)+26;
    setT(k,'normal',7.5,P.muted);doc.text('Cues',M,top-9);doc.text('Notes',xr+10,top-9);
    ruled(k,xr+8,W-M,top+G,sumTop-6,G);
    doc.setDrawColor(...P.acc);doc.setLineWidth(.9);doc.line(xr,top-20,xr,sumTop);doc.line(M,sumTop,W-M,sumTop);
    setT(k,'normal',7.5,P.muted);doc.text('Summary',M,sumTop+13);
    ruled(k,M,W-M,sumTop+G+8,H-M-4,G);
    rows=Math.floor((sumTop-6-top)/G);r=0;
  }
  const rowY=i=>top+(i+1)*G-6;
  const place=n=>{if(r+n>rows){doc.addPage();frame('Brain dump, continued')}};
  frame('Brain dump');
  let any=false;
  for(const g of k.d.groups){
    if(!g.tasks.length)continue;any=true;
    if(k.d.sides.length>1){place(2);setT(k,'bold',9.5,P[g.side]);doc.text(SIDE_NAME[g.side],M,rowY(r));r+=1}
    for(const t of g.tasks){
      setT(k,'normal',9.5,P.ink);const lines=wrap(doc,t.title,cueW-22,4),meta=taskMeta(t);
      const n=Math.max(3,Math.ceil((lines.length*11.5+(meta?10:0)+6)/G)+1);place(n);
      const y0=rowY(r);checkbox(k,M,y0,P[g.side],false);
      setT(k,'normal',9.5,P.ink);doc.text(lines,M+13,y0,{lineHeightFactor:1.21});
      if(meta){setT(k,'normal',7.5,P.muted);doc.text(fit(doc,meta,cueW-22),M+13,y0+lines.length*11.5)}
      r+=n;
    }
  }
  if(k.d.wins.length){
    place(2);setT(k,'bold',9.5,P.muted);doc.text('Finished this week',M,rowY(r));r+=1;
    for(const e of k.d.wins){place(1);const y0=rowY(r);checkbox(k,M,y0,P[e.side],true);setT(k,'normal',9,P.body);doc.text(fit(doc,e.title,cueW-22),M+13,y0);r+=1}
  }
  if(!any&&!k.d.wins.length){setT(k,'normal',9.5,P.muted);doc.text('No open tasks.',M,rowY(0))}
  for(let i=0;i<k.o.blanks;i++){doc.addPage();frame('Notes')}
}
function tplBlocks(k){
  const {doc,P,W,H,M}=k,G=22,per=3;
  const items=[];for(const g of k.d.groups)for(const t of g.tasks)items.push({side:g.side,t});
  let top=0,bh=0;
  const page=title=>{top=dumpHead(k,title)+14;bh=(H-M-top)/per};
  page('Brain dump');
  if(!items.length){setT(k,'normal',10,P.muted);doc.text('No open tasks.',M,top+20)}
  items.forEach((it,i)=>{
    if(i&&i%per===0){doc.addPage();page('Brain dump, continued')}
    const by=top+(i%per)*bh;let y=by+18;
    doc.setFillColor(...P[it.side]);doc.rect(M,y-8,4,9,'F');
    setT(k,'bold',12,P.ink);const lines=wrap(doc,it.t.title,W-2*M-14,2);doc.text(lines,M+12,y,{lineHeightFactor:1.25});y+=lines.length*15;
    const meta=[SIDE_NAME[it.side],taskMeta(it.t)].filter(Boolean).join(', ');
    setT(k,'normal',8.5,P.muted);doc.text(fit(doc,meta,W-2*M-14),M+12,y);y+=11;
    if(it.t.notes){doc.text(fit(doc,it.t.notes.replace(/\s+/g,' '),W-2*M-14),M+12,y);y+=11}
    ruled(k,M,W-M,y+G-6,by+bh-38,G);
    setT(k,'normal',8,P.muted);doc.text('Next step',M,by+bh-18);
    doc.setDrawColor(...P.line);doc.setLineWidth(.5);doc.line(M+48,by+bh-17,W-M,by+bh-17);
    if(i%per!==per-1&&i<items.length-1){doc.setDrawColor(...P.rule);doc.setLineWidth(.6);doc.line(M,by+bh-4,W-M,by+bh-4)}
  });
  for(let i=0;i<k.o.blanks;i++){doc.addPage();const t=dumpHead(k,'Notes');ruled(k,M,W-M,t+30,H-M,G)}
}
function tplReview(k){
  const {doc,P,W,H,M}=k,sides=k.d.sides,gap=24,cw=(W-2*M-gap*(sides.length-1))/sides.length;
  const y0=dumpHead(k,'Weekly review')+28,bottom=H-M-10;let colEnd=y0;
  sides.forEach((side,i)=>{
    const x=M+i*(cw+gap);let y=y0;
    setT(k,'bold',12,P[side]);doc.text(SIDE_NAME[side],x,y);y+=20;
    const wins=k.d.wins.filter(e=>e.side===side),open=(k.d.groups.find(g=>g.side===side)||{tasks:[]}).tasks;
    const maxWins=Math.min(wins.length,Math.max(4,Math.floor((bottom-y0-120)/14/2)));
    setT(k,'bold',8.5,P.muted);doc.text('Finished this week',x,y);y+=14;
    if(!wins.length){setT(k,'normal',9,P.muted);doc.text(k.o.wins?'Nothing logged yet.':'Not included.',x,y);y+=14}
    wins.slice(0,maxWins).forEach(e=>{checkbox(k,x,y,P[side],true);setT(k,'normal',9.5,P.body);doc.text(fit(doc,e.title,cw-14),x+12,y);y+=14});
    if(wins.length>maxWins){setT(k,'normal',8.5,P.muted);doc.text('and '+(wins.length-maxWins)+' more',x+12,y);y+=14}
    y+=12;setT(k,'bold',8.5,P.muted);doc.text('Open',x,y);y+=14;
    const room=Math.floor((bottom-y)/14),show=open.length>room?room-1:open.length;
    if(!open.length){setT(k,'normal',9,P.muted);doc.text('Nothing open.',x,y)}
    open.slice(0,show).forEach(t=>{checkbox(k,x,y,P[side],false);setT(k,'normal',9.5,P.ink);doc.text(fit(doc,t.title,cw-14),x+12,y);y+=14});
    if(open.length>show){setT(k,'normal',8.5,P.muted);doc.text('and '+(open.length-show)+' more',x+12,y);y+=14}
    colEnd=Math.max(colEnd,y);
  });
  // Whatever room is left on the first page becomes lined note space.
  if(bottom-colEnd>110){const ny=colEnd+22;setT(k,'bold',8.5,P.muted);doc.text('Notes',M,ny);ruled(k,M,W-M,ny+22,bottom,22)}
  doc.addPage();
  let y=dumpHead(k,'Weekly review, reflection')+30;
  const G=22,prompts=['What moved forward','What is stuck, and why','Decisions I need to make'];
  const topN=sides.map(s=>SIDE_NAME[s]+': top three for next week');
  const fixed=topN.length*(20+3*G+14),flex=(H-M-y-fixed)/prompts.length;
  for(const p of prompts){setT(k,'bold',10,P.ink);doc.text(p,M,y);ruled(k,M,W-M,y+G,y+flex-16,G);y+=flex}
  for(const p of topN){
    setT(k,'bold',10,P.ink);doc.text(pc(p),M,y);y+=6;
    for(let i=1;i<=3;i++){y+=G;setT(k,'normal',9,P.muted);doc.text(i+'.',M,y-4);doc.setDrawColor(...P.line);doc.setLineWidth(.5);doc.line(M+14,y,W-M,y)}
    y+=20;
  }
  for(let i=0;i<k.o.blanks;i++){doc.addPage();const t=dumpHead(k,'Notes');ruled(k,M,W-M,t+30,H-M,G)}
}
function tplSplit(k){
  const {doc,P,W,H,M}=k,sides=k.d.sides,gap=22,cw=(W-2*M-gap*(sides.length-1))/sides.length,G=22,bottom=H-M;
  const queues=sides.map(s=>(k.d.groups.find(g=>g.side===s)||{tasks:[]}).tasks.slice());
  const blockH=t=>{setT(k,'normal',10,P.ink);return wrap(doc,t.title,cw-12,3).length*12.5+(taskMeta(t)?10:0)+3*G+8};
  let first=true,placed=1;
  do{
    if(!placed)break;placed=0;
    if(!first)doc.addPage();
    const y0=dumpHead(k,first?'Brain dump':'Brain dump, continued')+28;
    sides.forEach((side,i)=>{
      const x=M+i*(cw+gap);let y=y0;
      setT(k,'bold',11,P[side]);doc.text(SIDE_NAME[side]+(first?'':', continued'),x,y);y+=20;
      if(first&&!queues[i].length){setT(k,'normal',9,P.muted);doc.text('Nothing open.',x,y)}
      while(queues[i].length&&y+blockH(queues[i][0])<=bottom){
        const t=queues[i].shift();placed++;
        checkbox(k,x,y,P[side],false);setT(k,'normal',10,P.ink);const lines=wrap(doc,t.title,cw-12,3);
        doc.text(lines,x+12,y,{lineHeightFactor:1.25});y+=lines.length*12.5;
        const meta=taskMeta(t);if(meta){setT(k,'normal',7.5,P.muted);doc.text(fit(doc,meta,cw-12),x+12,y);y+=10}
        ruled(k,x,x+cw,y+G-6,y+3*G-6,G);y+=3*G+8;
      }
      if(i>0){doc.setDrawColor(...P.rule);doc.setLineWidth(.6);doc.line(x-gap/2,y0-12,x-gap/2,bottom)}
    });
    first=false;
  }while(queues.some(q=>q.length));
  for(let i=0;i<k.o.blanks;i++){doc.addPage();const t=dumpHead(k,'Notes');ruled(k,M,W-M,t+30,H-M,G)}
}
function tplDots(k){
  const {doc,P,W,H,M}=k,sides=k.d.sides,gap=22,cw=(W-2*M-gap*(sides.length-1))/sides.length,L=14;
  const grid=(y1)=>{doc.setFillColor(...P.dot);for(let y=y1;y<=H-M;y+=18)for(let x=M;x<=W-M+.1;x+=18)doc.circle(x,y,.6,'F')};
  const lists=sides.map(s=>(k.d.groups.find(g=>g.side===s)||{tasks:[]}).tasks.slice());
  const maxRows=Math.floor((H*.55)/L);
  let first=true,yEnd=0;
  do{
    if(!first)doc.addPage();
    const y0=dumpHead(k,first?'Brain dump':'Brain dump, continued')+26;yEnd=y0;
    sides.forEach((side,i)=>{
      const x=M+i*(cw+gap);let y=y0;
      setT(k,'bold',10,P[side]);doc.text(SIDE_NAME[side],x,y);y+=16;
      let n=0;
      while(lists[i].length&&n<maxRows){const t=lists[i].shift();checkbox(k,x,y,P[side],false);setT(k,'normal',9.5,P.ink);doc.text(fit(doc,t.title,cw-12),x+12,y);y+=L;n++}
      if(first&&!n){setT(k,'normal',9,P.muted);doc.text('Nothing open.',x,y);y+=L}
      yEnd=Math.max(yEnd,y);
    });
    first=false;
  }while(lists.some(l=>l.length));
  grid(Math.ceil((yEnd+12-M)/18)*18+M);
  for(let i=0;i<k.o.blanks;i++){doc.addPage();const t=dumpHead(k,'Notes');grid(Math.ceil((t+18-M)/18)*18+M)}
}

    $('#exRoutineLbl').textContent='Recurring checks'+(rout?' ('+rout+')':'');
    const st=pick.scrollTop;
    pick.innerHTML=rows.length?rows.map(e=>{const d=new Date(e.completedAt);return `<label class="pick-row"><input type="checkbox" data-key="${esc(e.key)}"${included(e)?' checked':''}><span class="pk-date">${DOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</span><span class="pk-title">${esc(e.title)}</span><span class="pk-tag">${e.private?'Private':SIDE_NAME[e.side]}</span></label>`}).join('')
      :'<div class="pick-empty">Pick another period, or log finished work on the Done tab.</div>';
    pick.scrollTop=st;
  }else{
    const el=$('#dumpCount');if(!el)return;
    const d=dumpData(dumpOpts()),n=d.groups.reduce((a,g)=>a+g.tasks.length,0);
    el.textContent=`${n} open task${n===1?'':'s'}`+(EX.wins?`, ${d.wins.length} finished this week`:'')+'. Pages use white paper and light lines so your ink stands out.';
  }
}
function exFileName(){
  const d=ymd(new Date());
  if(EX.tab==='report'){const r={week:'This week',lastweek:'Last week',month:MONL[new Date().getMonth()],all:'All time'}[EX.range];return `Completed work - ${r}${EX.side==='both'?'':' - '+SIDE_NAME[EX.side]} - ${d}.pdf`}
  return `Brain dump - ${TPLS.find(t=>t.id===EX.tpl).name} - ${d}.pdf`;
}
async function makePDF(){
  await loadPDF();
  const doc=EX.tab==='report'?buildReport(reportOpts()):buildDump(dumpOpts());
  return {blob:doc.output('blob'),name:exFileName()};
}
async function exportAct(act){
  if(act==='close')return closeExport();
  if(act==='all'||act==='none'){for(const e of reportPool())if(!e.routine)EX.over[e.key]=act==='all';renderExportLive();return}
  let w=null;
  if(act==='preview')w=window.open('','_blank');
  exStatus('Building PDF…');
  try{
    const {blob,name}=await makePDF();
    const url=URL.createObjectURL(blob);
    if(act==='preview'){if(w)w.location.href=url;else download(url,name);exStatus('')}
    else if(act==='download'){download(url,name);exStatus('Downloaded '+name)}
    else if(act==='share'){
      const file=new File([blob],name,{type:'application/pdf'});
      try{await navigator.share({files:[file],title:name});exStatus('')}catch(e){exStatus(e&&e.name==='AbortError'?'':'Sharing did not work here. Use Download PDF.',e&&e.name!=='AbortError')}
    }else if(act==='drive'){
      exStatus('Saving to Drive…');
      await bridgeCall('upload',{name,mime:'application/pdf',data:await blobToB64(blob),side:'Exports',note:EX.tab==='report'?reportOpts().rangeTitle:'Brain dump template'});
      exStatus('Saved to Drive, in Exports.');files=null;
    }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){if(w)w.close();exStatus(e.message,true)}
}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100)}

// ═══ Theme popover and toast ════════════════════════════════════════════
function openThemes(){
  const pop=$('#themePop'),cur=curTheme().id,b=$('#themeBtn').getBoundingClientRect();
  pop.innerHTML=`<div class="th-grid">${THEMES.map(t=>`<button class="th" data-theme-id="${t.id}" aria-pressed="${t.id===cur}"><span class="th-sw" style="background:${t.bg};border-color:${t.line}"><i style="background:${t.a}"></i><i style="background:${t.b}"></i></span><span>${t.name}${t.isNew?' <span class="th-new">new</span>':''}</span></button>`).join('')}</div>
    <div class="pop-foot"><a class="link" href="legacy/">Open the legacy version</a></div>`;
  pop.hidden=false;
  const w=pop.offsetWidth;pop.style.top=(b.bottom+8)+'px';pop.style.left=Math.max(8,Math.min(window.innerWidth-w-8,b.right-w))+'px';
  pop.querySelector('[aria-pressed="true"]')?.focus();
}
const closeThemes=()=>{$('#themePop').hidden=true};
let toastTimer=0;
function toast(msg,label,fn){
  const el=$('#toast');
  el.innerHTML=`<span>${esc(msg)}</span>${label?`<button class="link" id="toastAct">${esc(label)}</button>`:''}`;
  el.classList.add('show');
  if(label)$('#toastAct').onclick=()=>{hideToast();fn()};
  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,label?7000:3200);
}
function hideToast(){$('#toast').classList.remove('show')}

// ═══ Events ══════════════════════════════════════════════════════════════
document.addEventListener('click',e=>{
  const t=e.target;
  if(!$('#themePop').hidden&&!t.closest('#themePop')&&!t.closest('#themeBtn'))closeThemes();
  const act=t.closest('[data-act]');
  if(act){const host=act.closest('[data-id]');if(host)handleAct(act.dataset.act,host.dataset.id,act);return}
  const v=t.closest('[data-view]');if(v){setView(v.dataset.view);return}
  const ms=t.closest('[data-mside]');if(ms){mSide=ms.dataset.mside;LS.set('oym_mside',mSide);renderTasks();return}
  const gd=t.closest('[data-go-done]');if(gd){doneF.side=gd.dataset.goDone;doneF.range='week';LS.set('oym_dside',doneF.side);LS.set('oym_drange','week');setView('done');return}
  const r=t.closest('[data-range]');if(r){doneF.range=r.dataset.range;LS.set('oym_drange',doneF.range);renderDone();return}
  const ds=t.closest('[data-dside]');if(ds){doneF.side=ds.dataset.dside;LS.set('oym_dside',doneF.side);if(SIDES.includes(doneF.side)){logSide=doneF.side;LS.set('oym_logside',logSide)}renderDone();return}
  const lsd=t.closest('[data-logside]');if(lsd){logSide=lsd.dataset.logside;LS.set('oym_logside',logSide);renderDone();$('#logInput').focus();return}
  const bk=t.closest('[data-bulk]');if(bk){bulkAct(bk.dataset.bulk,bk.dataset.v);return}
  const da=t.closest('[data-dact]');if(da){const e2=doneByKey.get(da.closest('[data-key]').dataset.key);if(e2)doneAct(da.dataset.dact,e2);return}
  const fs=t.closest('[data-fs]');if(fs){filesAct(fs.dataset.fs,fs);return}
  const us=t.closest('[data-upside]');if(us){upSide=us.dataset.upside;LS.set('oym_upside',upSide);renderUpSide();return}
  const fsd=t.closest('[data-fside]');if(fsd){fSide=fsd.dataset.fside;renderFileList();return}
  if(t.closest('#exportBtn')){openExport();return}
  if(t.closest('#themeBtn')){$('#themePop').hidden?openThemes():closeThemes();return}
  const th=t.closest('[data-theme-id]');if(th){applyTheme(th.dataset.themeId);openThemes();return}
  // Export sheet
  if(t===$('#exBack')){closeExport();return}
  const ex=t.closest('[data-ex]');if(ex){exportAct(ex.dataset.ex);return}
  const map=[['data-extab','tab'],['data-exrange','range'],['data-exside','side'],['data-exdside','dside'],['data-expaper','paper']];
  for(const [attr,key] of map){const b=t.closest('['+attr+']');if(b){EX[key]=b.getAttribute(attr);saveEX();renderExport();return}}
  const bl=t.closest('[data-exblanks]');if(bl){EX.blanks=+bl.dataset.exblanks;saveEX();renderExport();return}
  const tp=t.closest('[data-tpl]');if(tp){EX.tpl=tp.dataset.tpl;saveEX();renderExport();return}
  // Clicking outside an open editor closes it.
  if(openId&&!t.closest('.editor')&&!t.closest('.toast'))closeEditor();
});
function handleAct(act,id,el){
  const t=tasks[id];if(!t)return;
  if(act==='complete')completeTask(id,el);
  else if(act==='start')startTask(id);
  else if(act==='pause')pauseTask(id);
  else if(act==='edit')openEditor(id);
  else if(act==='close')closeEditor();
  // Editor toggles re-render at once, even if the notes box still holds focus.
  else if(act==='urgent'){flushNotes();upd({[TP(id)+'/priority']:t.priority==='high'?'medium':'high'});render(true)}
  else if(act==='side'){flushNotes();setTaskSide(id,el.dataset.v);render(true)}
  else if(act==='private'){flushNotes();upd({[TP(id)+'/private']:!taskPrivate(t)});render(true)}
  else if(act==='delete')deleteTask(id);
}
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.add){const inp=f.querySelector('input');lastAddSide=f.dataset.add;if(addTask(f.dataset.add,inp.value))inp.value=''}
  else if(f.id==='logAdd'){const inp=$('#logInput');if(logDone(inp.value,logSide))inp.value=''}
});
document.addEventListener('focusin',e=>{const f=e.target.closest&&e.target.closest('[data-add]');if(f)lastAddSide=f.dataset.add});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){const ed=t.closest('.editor');if(ed){if(t.dataset.f==='notes'){notesPending=null;clearTimeout(notesTimer)}saveField(ed.dataset.id,t.dataset.f,t.value)}return}
  if(t.dataset.exc){EX[t.dataset.exc]=t.checked;saveEX();renderExportLive();return}
  if(t.dataset.key&&t.closest('#exPick')){EX.over[t.dataset.key]=t.checked;renderExportLive();return}
  if(t.id==='fileIn'&&t.files.length){uploadFiles([...t.files]);t.value=''}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f==='notes'){const id=t.closest('.editor').dataset.id;notesPending=[id,t.value];clearTimeout(notesTimer);notesTimer=setTimeout(flushNotes,700)}
  else if(t.id==='doneSearch'){doneF.q=t.value;renderDone()}
  else if(t.id==='exName'){EX.name=t.value;LS.set('oym_name',EX.name)}
});
document.addEventListener('focusout',e=>{if(deferred&&e.target.closest&&e.target.closest('.editor'))setTimeout(()=>{if(deferred)render()},0)});
// A re-render between mousedown and mouseup would swallow the click, so hold renders until the pointer lifts.
document.addEventListener('pointerdown',()=>{pointerDown=true},true);
const liftPointer=()=>{pointerDown=false;if(deferred)setTimeout(()=>{if(deferred)render()},0)};
document.addEventListener('pointerup',liftPointer,true);
document.addEventListener('pointercancel',liftPointer,true);
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){
    if(!$('#exBack').hidden){closeExport();return}
    if(!$('#themePop').hidden){closeThemes();$('#themeBtn').focus();return}
    if(openId){closeEditor();return}
    return;
  }
  if(e.key==='Enter'&&t.classList&&t.classList.contains('e-title')){e.preventDefault();saveField(t.closest('.editor').dataset.id,'title',t.value);closeEditor();return}
  if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('[role="button"][data-act]')){e.preventDefault();t.click();return}
  if(t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='n'&&$('#exBack').hidden){
    e.preventDefault();if(view!=='tasks')setView('tasks');
    const side=window.innerWidth<=820?mSide:lastAddSide;$(`[data-add="${side}"] input`).focus();
  }
});
// Drag and drop onto the Files drop zone
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d&&!d.contains(e.relatedTarget))d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files.length)uploadFiles([...e.dataTransfer.files])}});
// Keep the Now clocks and the date current.
setInterval(()=>{
  for(const el of $$('[data-meta]')){const t=tasks[el.dataset.meta];if(t)el.textContent=nowMeta(t)}
  renderHeader();
},30000);

// ═══ Boot ════════════════════════════════════════════════════════════════
buildSides();
applyTheme(document.documentElement.dataset.theme);
render(true);
if(view==='files')renderFiles();
if(db){
  db.ref('todo/tasks').on('value',s=>{tasks=s.val()||{};ready.tasks=true;schedule()});
  db.ref('todo/history').on('value',s=>{hist=s.val()||{};ready.hist=true;schedule()});
  db.ref('todo/projects').on('value',s=>{projects=s.val()||{};schedule()});
  db.ref('todo/sides').on('value',s=>{sideMap=s.val()||{};schedule()});
  let seen=false;
  db.ref('.info/connected').on('value',s=>{const on=!!s.val();if(on)seen=true;$('#offline').hidden=on||!seen});
}
window.__oym={connectorScript,get tasks(){return tasks},get hist(){return hist},entries,buildReport,buildDump,reportOpts,dumpOpts,EX,parseQuick,taskSide,taskPrivate,applyTheme,renderFiles};
})();
</script>
