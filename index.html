// Reusable styled date picker — opens anchored to a button, fires onPick(ds)
let _rfiDpTarget=null,_rfiDpMonth=new Date().getMonth(),_rfiDpYear=new Date().getFullYear(),_rfiDpOnPick=null,_rfiDpCurrent='';
function openRFIDatePicker(e,btnEl,currentDate,onPick){
  e?.stopPropagation();
  closeRFIDatePicker();
  _rfiDpTarget=btnEl;_rfiDpOnPick=onPick;_rfiDpCurrent=currentDate||'';
  if(currentDate){const d=new Date(currentDate+'T00:00:00');_rfiDpMonth=d.getMonth();_rfiDpYear=d.getFullYear();}
  const pop=document.createElement('div');
  pop.className='dp-pop';pop.id='rfiDatePickerPop';
  document.body.appendChild(pop);
  const r=btnEl.getBoundingClientRect();
  let left=r.left;
  if(left+280>window.innerWidth-8)left=window.innerWidth-288;
  if(left<8)left=8;
  const top=r.bottom+8;
  const maxH=Math.max(260,window.innerHeight-top-12);
  pop.style.left=left+'px';pop.style.top=top+'px';
  pop.style.maxHeight=maxH+'px';pop.style.overflowY='auto';
  renderRFIDatePicker();
  setTimeout(()=>document.addEventListener('click',_rfiDpClickOutside),50);
}
function _rfiDpClickOutside(e){
  if(!e.target.closest('#rfiDatePickerPop')&&!e.target.closest('.rfi-date-btn'))closeRFIDatePicker();
}
function closeRFIDatePicker(){
  document.getElementById('rfiDatePickerPop')?.remove();
  document.removeEventListener('click',_rfiDpClickOutside);
  _rfiDpTarget=null;_rfiDpOnPick=null;
}
function renderRFIDatePicker(){
  const pop=document.getElementById('rfiDatePickerPop');if(!pop)return;
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const todayStr=new Date().toISOString().slice(0,10);
  const tomorrowStr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)})();
  const nextWeek=(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)})();
  const selected=_rfiDpCurrent;
  const first=new Date(_rfiDpYear,_rfiDpMonth,1);
  const startDay=first.getDay();
  const daysInMonth=new Date(_rfiDpYear,_rfiDpMonth+1,0).getDate();
  const dayTasks={};
  Object.values(tasks).forEach(t=>{if(!t.dueDate||t.completed)return;if(!dayTasks[t.dueDate])dayTasks[t.dueDate]=0;dayTasks[t.dueDate]++});
  let html=`<div class="dp-head">
    <button class="dp-nav" onclick="rfiDpNav(-1)">&larr;</button>
    <div class="dp-title">${months[_rfiDpMonth]} ${_rfiDpYear}</div>
    <button class="dp-nav" onclick="rfiDpNav(1)">&rarr;</button>
  </div>
  <div class="dp-grid">
    ${['S','M','T','W','T','F','S'].map(d=>`<div class="dp-dow">${d}</div>`).join('')}`;
  for(let i=0;i<startDay;i++)html+=`<div class="dp-day blank"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${_rfiDpYear}-${String(_rfiDpMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const isSel=ds===selected;
    const isPast=ds<todayStr;
    const count=dayTasks[ds]||0;
    const hasTasks=count>0?'has-tasks':'';
    const badge=count?`<span class="dp-day-count ${isPast?'overdue':''}">${count}</span>`:'';
    html+=`<div class="dp-day ${isToday?'today':''} ${isSel?'selected':''} ${isPast?'past':''} ${hasTasks}" onclick="rfiDpSelect('${ds}')">${d}${badge}</div>`;
  }
  html+=`</div>
  <div class="dp-quick">
    <button onclick="rfiDpSelect('${todayStr}')">Today</button>
    <button onclick="rfiDpSelect('${tomorrowStr}')">Tmrw</button>
    <button onclick="rfiDpSelect('${nextWeek}')">+1wk</button>
    <button class="clear" onclick="rfiDpSelect('')">Clear</button>
  </div>`;
  pop.innerHTML=html;
}
function rfiDpNav(dir){
  _rfiDpMonth+=dir;
  if(_rfiDpMonth<0){_rfiDpMonth=11;_rfiDpYear--}
  if(_rfiDpMonth>11){_rfiDpMonth=0;_rfiDpYear++}
  renderRFIDatePicker();
}
function rfiDpSelect(ds){
  if(_rfiDpOnPick)_rfiDpOnPick(ds);
  closeRFIDatePicker();
}

// Format YYYY-MM-DD → "Apr 21" etc.
function fmtRfiDate(ds){
  if(!ds)return '';
  const d=new Date(ds+'T00:00:00');
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return mo+' '+d.getDate();
}

function rfiStats(){
  const rfis=Object.entries(tasks).filter(([,t])=>t.category==='rfi');
  const open=rfis.filter(([,t])=>!t.completed&&!t.sent).length;
  const sent=rfis.filter(([,t])=>t.sent&&!t.completed).length;
  const done=rfis.filter(([,t])=>t.completed).length;
  const today=new Date().toISOString().slice(0,10);
  const overdue=rfis.filter(([,t])=>!t.completed&&!t.sent&&t.dueDate&&t.dueDate<today).length;
  const weekAhead=(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)})();
  const dueSoon=rfis.filter(([,t])=>!t.completed&&!t.sent&&t.dueDate&&t.dueDate<=weekAhead&&t.dueDate>=today).length;
  return {rfis,open,sent,done,overdue,dueSoon,total:rfis.length};
}
function rfiRecipients(){
  const m=new Map();
  Object.values(tasks).forEach(t=>{
    if(t.category!=='rfi'||t.completed)return;
    const r=(t.sendTo||'').trim();
    if(!r)return;
    m.set(r,(m.get(r)||0)+1);
  });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

function renderRFIDashboard(){
  const el=document.getElementById('rfiDashView');
  if(!el)return;
  const {rfis,open,sent,done,overdue,dueSoon,total}=rfiStats();
  const today=new Date();today.setHours(0,0,0,0);

  // ── Next-up RFI
  const nextUp=rfis
    .filter(([,t])=>!t.completed&&!t.sent)
    .sort((a,b)=>(a[1].dueDate||'9999').localeCompare(b[1].dueDate||'9999'))[0];

  // ── Recipient leaderboard
  const recipients=new Map();
  rfis.forEach(([,t])=>{
    const r=(t.sendTo||'').trim()||'(no recipient)';
    if(!recipients.has(r))recipients.set(r,{total:0,open:0,sent:0,done:0});
    const rec=recipients.get(r);
    rec.total++;
    if(t.completed)rec.done++;
    else if(t.sent)rec.sent++;
    else rec.open++;
  });
  const leaderboard=[...recipients.entries()].sort((a,b)=>b[1].total-a[1].total).slice(0,5);
  const maxRec=Math.max(1,...leaderboard.map(([,r])=>r.total));

  // ── Recent activity (last 10 events: sent + closed)
  const activity=[];
  rfis.forEach(([id,t])=>{
    if(t.sent&&t.sentAt)activity.push({ts:t.sentAt,type:'sent',id,t});
    if(t.completed&&t.completedAt)activity.push({ts:t.completedAt,type:'closed',id,t});
    if(t.createdAt)activity.push({ts:t.createdAt,type:'opened',id,t});
  });
  activity.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const recent=activity.slice(0,10);

  // ── Weekly throughput (last 8 weeks, count of RFIs closed)
  const weeks=[];
  for(let w=7;w>=0;w--){
    const start=new Date(today);start.setDate(today.getDate()-today.getDay()-(w*7));
    const end=new Date(start);end.setDate(start.getDate()+7);
    const count=rfis.filter(([,t])=>{
      if(!t.completedAt)return false;
      const d=new Date(t.completedAt);
      return d>=start&&d<end;
    }).length;
    weeks.push({count,label:(start.getMonth()+1)+'/'+start.getDate()});
  }
  const maxWeek=Math.max(1,...weeks.map(w=>w.count));

  // ── Aging open RFIs (oldest first)
  const openRfis=rfis.filter(([,t])=>!t.completed);
  const aged=openRfis
    .filter(([,t])=>t.createdAt)
    .map(([id,t])=>{
      const d=new Date(t.createdAt);
      const days=Math.floor((today-d)/86400000);
      return {id,t,days};
    })
    .sort((a,b)=>b.days-a.days)
    .slice(0,5);

  // ── Build HTML
  el.innerHTML=`
    <div class="rfi-hero">
      <div class="rfi-hero-big">
        <div class="rfi-hero-lbl">Open RFIs</div>
        <div class="rfi-hero-val">${open+sent}</div>
        <div class="rfi-hero-sub">${open} to send · ${sent} waiting for reply${overdue?' · <span style="color:#ef4444;font-weight:700">'+overdue+' overdue</span>':''}</div>
      </div>
      <div class="rfi-hero-mini">
        <div class="rfi-hero-mini-card" onclick="jumpRFIFilter('tosend')" style="cursor:pointer" title="Show RFIs that still need to be sent">
          <div class="rfi-hero-mini-val">${open}</div>
          <div class="rfi-hero-mini-lbl">To Send</div>
        </div>
        <div class="rfi-hero-mini-card" onclick="jumpRFIFilter('awaiting')" style="cursor:pointer" title="Show sent RFIs still open">
          <div class="rfi-hero-mini-val sent">${sent}</div>
          <div class="rfi-hero-mini-lbl">Awaiting</div>
        </div>
        <div class="rfi-hero-mini-card" onclick="jumpRFIFilter('overdue')" style="cursor:pointer" title="Show open RFIs past due date">
          <div class="rfi-hero-mini-val${overdue?' danger':''}">${overdue}</div>
          <div class="rfi-hero-mini-lbl">Overdue</div>
        </div>
      </div>
    </div>

    ${nextUp?(()=>{
      const [uid,ut]=nextUp;
      const od=ut.dueDate&&ut.dueDate<today.toISOString().slice(0,10);
      const dueLbl=ut.dueDate?(od?'Overdue · ':'Due ')+fmtRfiDate(ut.dueDate):'No due date set';
      const sendTo=ut.sendTo?' → '+esc(ut.sendTo):'';
      const sentOn=!!ut.sent;
      const sendLbl=sentOn?'Sent ✓':'Mark Sent';
      return `<div class="rfi-urgent">
        <span class="rfi-urgent-lbl">Next up</span>
        <div class="rfi-urgent-body">
          <div class="rfi-urgent-title">${esc(ut.rfiNumber||'')} · ${esc(ut.title||'(no subject)')}</div>
          <div class="rfi-urgent-meta">${dueLbl}${sendTo}</div>
        </div>
        <div class="rfi-urgent-actions">
          <button class="rfi-urgent-cta" onclick="toggleRFISent('${uid}')">${sendLbl}</button>
          <button class="rfi-inline-btn close" onclick="toggleRFIDone('${uid}')" title="Close RFI"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 7 12 13 4"/></svg>Close</button>
        </div>
      </div>`;
    })():''}

    <div class="rfi-two-col">
      <div class="rfi-panel">
        <h3>Recipient Leaderboard</h3>
        ${leaderboard.length?`<div class="rfi-leader">${leaderboard.map(([name,r])=>`
          <div class="rfi-leader-row">
            <div class="rfi-leader-name">${esc(name)}</div>
            <div class="rfi-leader-stat">${r.open}<span style="color:var(--text-muted)"> open</span> · ${r.sent}<span style="color:var(--text-muted)"> waiting</span></div>
            <div class="rfi-leader-stat"><span class="pct">${r.total}</span></div>
            <div class="rfi-leader-bar"><div class="rfi-leader-bar-fill" style="width:${Math.round(r.total/maxRec*100)}%"></div></div>
          </div>`).join('')}</div>`:'<div style="color:var(--text-muted);font-size:12px">No RFIs with recipients yet.</div>'}
      </div>

      <div class="rfi-panel">
        <h3>Weekly Closed · Last 8 Weeks</h3>
        <div class="rfi-week-bars">
          ${weeks.map(w=>`<div class="rfi-week-bar" data-count="${w.count}" style="height:${Math.round(w.count/maxWeek*100)}%" title="${w.count} closed"></div>`).join('')}
        </div>
        <div class="rfi-week-labels">
          ${weeks.map(w=>`<div>${w.label}</div>`).join('')}
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:10px;text-align:right">
          Total closed: <span style="color:#34d399;font-weight:700">${done}</span>
        </div>
      </div>
    </div>

    <div class="rfi-two-col">
      <div class="rfi-panel">
        <h3>Oldest Open</h3>
        ${aged.length?`<div class="rfi-aging">${aged.map(a=>{
          const old=a.days>=14;
          const sentOn=!!a.t.sent;
          const sendTitle=sentOn?'Unmark sent':'Mark sent';
          return `<div class="rfi-aging-row${old?' old':''}" data-id="${a.id}">
            <span class="rfi-aging-main" onclick="openRFIInList('${a.id}')" title="Open in list">
              <span class="rfi-aging-num">${esc(a.t.rfiNumber||'?')}</span>
              <span class="rfi-aging-title">${esc(a.t.title||'(no subject)')}</span>
              <span class="rfi-aging-days${old?' old':''}">${a.days}d</span>
            </span>
            <span class="rfi-aging-actions">
              <button class="rfi-inline-btn send${sentOn?' on':''}" onclick="event.stopPropagation();toggleRFISent('${a.id}')" title="${sendTitle}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l5 2 7-7-5 12-2-4z"/></svg>${sentOn?'Sent':'Send'}</button>
              <button class="rfi-inline-btn close" onclick="event.stopPropagation();toggleRFIDone('${a.id}')" title="Close RFI"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 7 12 13 4"/></svg>Close</button>
            </span>
          </div>`;
        }).join('')}</div>`:'<div style="color:var(--text-muted);font-size:12px">No open RFIs — you’re clear.</div>'}
      </div>

      <div class="rfi-panel">
        <h3>Recent Activity</h3>
        ${recent.length?`<div class="rfi-activity">${recent.map(ev=>{
          const when=fmtActivityWhen(ev.ts);
          const label=ev.type==='sent'?'Sent':ev.type==='closed'?'Closed':'Created';
          return `<div class="rfi-activity-row">
            <span class="rfi-activity-dot ${ev.type}"></span>
            <div class="rfi-activity-text">
              <div class="rfi-activity-action">${label}</div>
              <div class="rfi-activity-body">${esc(ev.t.rfiNumber||'')} · ${esc(ev.t.title||'(no subject)')}</div>
            </div>
            <span class="rfi-activity-when">${when}</span>
          </div>`;
        }).join('')}</div>`:'<div style="color:var(--text-muted);font-size:12px">No activity yet — create your first RFI.</div>'}
      </div>
    </div>
  `;
}

function fmtActivityWhen(iso){
  if(!iso)return '';
  const d=new Date(iso);
  const diffMs=Date.now()-d.getTime();
  const diffDays=Math.floor(diffMs/86400000);
  const diffHrs=Math.floor(diffMs/3600000);
  if(diffDays>=7)return fmtRfiDate(iso.slice(0,10));
  if(diffDays>=1)return diffDays+'d ago';
  if(diffHrs>=1)return diffHrs+'h ago';
  const diffMin=Math.max(1,Math.floor(diffMs/60000));
  return diffMin+'m ago';
}

function renderRFI(){
  // Apply the currently-selected sub-view and delegate accordingly
  const dashEl=document.getElementById('rfiDashView');
  const listEl=document.getElementById('rfiListView');
  if(dashEl)dashEl.style.display=rfiSubView==='dash'?'':'none';
  if(listEl)listEl.style.display=rfiSubView==='list'?'':'none';
  if(rfiSubView==='dash'){
    renderRFIDashboard();
    return;
  }
  const list=document.getElementById('rfiList');
  if(!list)return;
  const {rfis,open,sent,done,overdue,dueSoon,total}=rfiStats();

  // ── Urgent "next to send" callout
  const urgEl=document.getElementById('rfiUrgent');
  if(urgEl){
    // Find the most urgent unsent+open RFI
    const today=new Date().toISOString().slice(0,10);
    const urg=rfis
      .filter(([,t])=>!t.completed&&!t.sent)
      .sort((a,b)=>{
        const ad=a[1].dueDate||'9999';
        const bd=b[1].dueDate||'9999';
        return ad.localeCompare(bd);
      })[0];
    if(urg){
      const [uid,ut]=urg;
      const od=ut.dueDate&&ut.dueDate<today;
      const dueLbl=ut.dueDate?(od?'Overdue · ':'Due ')+fmtRfiDate(ut.dueDate):'No due date';
      const sendTo=ut.sendTo?' → '+esc(ut.sendTo):'';
      urgEl.innerHTML=`<div class="rfi-urgent">
        <span class="rfi-urgent-lbl">Next up</span>
        <div class="rfi-urgent-body">
          <div class="rfi-urgent-title">${esc(ut.rfiNumber||'')} · ${esc(ut.title||'(no subject)')}</div>
          <div class="rfi-urgent-meta">${dueLbl}${sendTo}</div>
        </div>
        <button class="rfi-urgent-cta" onclick="toggleRFISent('${uid}')">Mark Sent</button>
      </div>`;
    }else{
      urgEl.innerHTML='';
    }
  }

  // ── Recipient filter pills (only shown if recipients exist)
  const recs=rfiRecipients();
  const recsEl=document.getElementById('rfiRecipients');
  const recPillsEl=document.getElementById('rfiRecPills');
  if(recsEl&&recPillsEl){
    if(recs.length){
      recsEl.style.display='';
      let pillsHtml=`<span class="rfi-rec-pill ${rfiRecFilter==='all'?'active':''}" onclick="setRFIRecFilter('all')">All</span>`;
      recs.forEach(([n,c])=>{
        const safe=esc(n);
        pillsHtml+=`<span class="rfi-rec-pill ${rfiRecFilter===n?'active':''}" onclick="setRFIRecFilter('${safe.replace(/'/g,"\\'")}')">${safe} <span class="cnt">${c}</span></span>`;
      });
      recPillsEl.innerHTML=pillsHtml;
    }else{
      recsEl.style.display='none';
    }
  }

  // ── List
  let filtered=rfis;
  if(rfiRecFilter!=='all'){
    filtered=filtered.filter(([,t])=>(t.sendTo||'').trim()===rfiRecFilter);
  }
  // Triage filter set by dashboard mini-card clicks
  if(rfiListFilter!=='all'){
    const todayStr=new Date().toISOString().slice(0,10);
    if(rfiListFilter==='tosend')   filtered=filtered.filter(([,t])=>!t.completed&&!t.sent);
    if(rfiListFilter==='awaiting') filtered=filtered.filter(([,t])=>!t.completed&& t.sent);
    if(rfiListFilter==='overdue')  filtered=filtered.filter(([,t])=>!t.completed&&t.dueDate&&t.dueDate<todayStr);
  }
  // Active triage chip above the list
  const chipEl=document.getElementById('rfiFilterChip');
  if(chipEl){
    if(rfiListFilter==='all'){chipEl.style.display='none';chipEl.innerHTML='';}
    else{
      const chipLbl={tosend:'To Send',awaiting:'Awaiting reply',overdue:'Overdue'}[rfiListFilter]||rfiListFilter;
      chipEl.style.display='';
      chipEl.innerHTML=`<span class="rfi-triage-chip"><span class="rfi-triage-dot ${rfiListFilter}"></span>${chipLbl}<button onclick="clearRFIListFilter()" aria-label="Clear filter">×</button></span>`;
    }
  }
  // Sort: unsent first, then sent-waiting, then done. Within group by RFI number desc.
  filtered.sort((a,b)=>{
    const rank=t=>t.completed?2:(t.sent?1:0);
    const ra=rank(a[1]),rb=rank(b[1]);
    if(ra!==rb)return ra-rb;
    const an=parseInt((a[1].rfiNumber||'').match(/\d+/)?.[0]||'0',10);
    const bn=parseInt((b[1].rfiNumber||'').match(/\d+/)?.[0]||'0',10);
    return bn-an;
  });

  if(!filtered.length){
    list.innerHTML=total?'<div class="rfi-empty">No RFIs match this filter.</div>':'<div class="rfi-empty">No RFIs yet. Click <b>+ New RFI</b> to start your list.</div>';
    return;
  }
  const today=new Date().toISOString().slice(0,10);
  list.innerHTML=filtered.map(([id,t])=>{
    const dn=!!t.completed;
    const isSent=!!t.sent;
    const od=t.dueDate&&!dn&&!isSent&&t.dueDate<today;
    const dueLbl=t.dueDate?(od?'Overdue · ':'Due ')+fmtRfiDate(t.dueDate):'Set date';
    const klass=dn?'done':(isSent?'sent':'');
    return `<div class="rfi-card ${klass}" data-id="${id}" data-num="${esc(t.rfiNumber||'')}">
      <div class="rfi-top">
        <span class="rfi-num-badge"><input class="rfi-num-input" value="${esc(t.rfiNumber||'')}" onchange="updateRFI('${id}','rfiNumber',this.value)" spellcheck="false"></span>
        <input class="rfi-subj-input" placeholder="Subject…" value="${esc(t.title||'')}" onchange="updateRFI('${id}','title',this.value)">
        <div class="rfi-status-group">
          <label class="rfi-sent-toggle ${isSent?'on':''}" onclick="event.preventDefault();toggleRFISent('${id}')">
            <input type="checkbox" ${isSent?'checked':''}>
            ${isSent?'Sent':'Send?'}
          </label>
        </div>
      </div>
      <textarea class="rfi-desc" placeholder="Description — what info do you need?" rows="2" onchange="updateRFI('${id}','description',this.value)">${esc(t.description||'')}</textarea>
      <div class="rfi-meta">
        <button class="rfi-meta-btn rfi-date-btn ${t.dueDate?'has-val':''} ${od?'overdue':''}" onclick="openRFIDatePicker(event,this,'${esc(t.dueDate||'')}',ds=>updateRFI('${id}','dueDate',ds))">
          <span>📅</span><span>${dueLbl}</span>
        </button>
        <button class="rfi-meta-btn ${t.sendTo?'has-val':''}" onclick="this.querySelector('.rfi-sendto-input').focus()">
          <span>→</span>
          <input class="rfi-sendto-input" placeholder="Send to…" value="${esc(t.sendTo||'')}" onchange="updateRFI('${id}','sendTo',this.value);this.closest('.rfi-meta-btn').classList.toggle('has-val',!!this.value)" onclick="event.stopPropagation()" list="fromSuggestions">
        </button>
        <div class="rfi-actions">
          <button onclick="toggleRFIDone('${id}')" title="${dn?'Reopen':'Close RFI'}">${dn?'↺ Reopen':'✓ Close'}</button>
          <button class="rfi-del" onclick="deleteRFI('${id}')" title="Delete">×</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function safeHtml(html){
  // Whitelist sanitizer for journal HTML — allows formatting tags, safe style attrs, and images.
  const okTags=new Set(['B','STRONG','I','EM','U','S','STRIKE','DEL','BR','P','DIV','SPAN','UL','OL','LI','H2','H3','BLOCKQUOTE','CODE','A','MARK','IMG','FIGURE','FIGCAPTION']);
  const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  const root=doc.body.firstChild;
  const walk=(node)=>{
    [...node.childNodes].forEach(child=>{
      if(child.nodeType===1){
        const tag=child.tagName;
        if(!okTags.has(tag)){
          const tx=document.createTextNode(child.textContent||'');
          child.replaceWith(tx);
          return;
        }
        [...child.attributes].forEach(a=>{
          const n=a.name.toLowerCase();
          if(n==='style'){
            const safe=a.value.split(';').map(s=>s.trim()).filter(s=>/^(color|background-color|max-width|width|height)\s*:\s*([\w#().,%\- ]+)$/i.test(s)).join(';');
            if(safe)child.setAttribute('style',safe);else child.removeAttribute('style');
          }else if(n==='href'&&tag==='A'){
            const v=a.value;
            if(/^(https?:|mailto:)/i.test(v))child.setAttribute('href',v);else child.removeAttribute('href');
            child.setAttribute('target','_blank');child.setAttribute('rel','noopener noreferrer');
          }else if(tag==='IMG'&&n==='src'){
            const v=a.value;
            if(/^(data:image\/(png|jpe?g|gif|webp|svg\+xml);|https:)/i.test(v))child.setAttribute('src',v);
            else child.remove();
          }else if(tag==='IMG'&&(n==='alt'||n==='title')){
            // ok
          }else{
            child.removeAttribute(a.name);
          }
        });
        if(tag==='IMG')child.setAttribute('loading','lazy');
        walk(child);
      }else if(child.nodeType!==3){
        child.remove();
      }
    });
  };
  walk(root);
  return root.innerHTML;
}

function goalProgress(g){
  const ms=g.milestones?Object.values(g.milestones):[];
  if(ms.length)return Math.round(ms.filter(m=>m.done).length/ms.length*100);
  return Math.max(0,Math.min(100,g.progress||0));
}
function ringHTML(pct,cls){const p=Math.round(pct);return `<div class="planner-ring-wrap ${cls||''}"><div class="planner-ring" style="--p:${p}"></div><span class="planner-ring-num">${p}<i>%</i></span></div>`}
function msDots(g){const ms=g.milestones?Object.values(g.milestones):[];if(!ms.length)return '';const dots=ms.slice(0,8).map(m=>`<span class="md-dot${m.done?' done':''}"></span>`).join('');return `<div class="planner-dots">${dots}${ms.length>8?`<span class="md-more">+${ms.length-8}</span>`:''}</div>`}

        return `<div class="planner-goal${exp?' expanded':''}">

        const snip=(it.text||'').length>140?esc(it.text.slice(0,140))+'…':esc(it.text||'');
        return `<div class="planner-tl-row journal">
          <div class="planner-tl-dot"></div>
          <div class="planner-tl-card">
            <div class="planner-tl-meta"><span class="planner-tl-kind subtle">Journal</span><span class="planner-tl-time">${tlabel}</span></div>${it.title?`<div class="planner-tl-text">${esc(it.title)}</div>`:''}
            <div class="planner-tl-text muted">${snip.replace(/\n/g,' ')}</div>
            ${(it.tags&&it.tags.length)?`<div class="planner-entry-tags">${it.tags.map(t=>`<span class="planner-chip subtle">#${esc(t)}</span>`).join('')}</div>`:''}
          </div>
        </div>`;
      }).join('');
      return `<div class="planner-tl-day"><div class="planner-day-divider"><span class="planner-day-label">${jDateLabel(ds)}</span><span class="planner-day-line"></span><span class="planner-day-count">${groups[ds].length}</span></div>${rows}</div>`;
    }).join('')+`</div>`;
  }
  el.innerHTML=html;
}

function insertImageFile(file){
  // Resize large images to keep Firebase payload (and DOM) sane.
  const MAX_DIM=1600,QUALITY=0.86;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>MAX_DIM||h>MAX_DIM){
        if(w>=h){h=Math.round(h*MAX_DIM/w);w=MAX_DIM}
        else{w=Math.round(w*MAX_DIM/h);h=MAX_DIM}
      }
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const isPng=/png/i.test(file.type);
      const dataUrl=cv.toDataURL(isPng?'image/png':'image/jpeg',QUALITY);
      const ed=document.getElementById('newJournalEditor');if(!ed)return;
      ed.focus();
      const html=`<img src="${dataUrl}" alt="" style="max-width:100%" />`;
      document.execCommand('insertHTML',false,html);
    };
    img.onerror=()=>alert('Could not load image');
    img.src=reader.result;
  };
  reader.onerror=()=>alert('Could not read file');
  reader.readAsDataURL(file);
}

// ═══════════════════════════════════════════
//  Calendar
// ═══════════════════════════════════════════
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();

function calNav(dir){calMonth+=dir;if(calMonth>11){calMonth=0;calYear++}if(calMonth<0){calMonth=11;calYear--}renderCalendar()}

function renderCalendar(){
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonth').textContent=months[calMonth]+' '+calYear;
  const grid=document.getElementById('calGrid');
  const today=new Date();const todayStr=today.toISOString().slice(0,10);
  const first=new Date(calYear,calMonth,1);
  const startDay=first.getDay(); // 0=Sun
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();

  // Build the date → tasks map. For recurring tasks, project all occurrences
  // that fall within the visible month (and a small buffer either side so the
  // padding cells from neighboring months also light up).
  const tMap={};
  const monthStart=new Date(calYear,calMonth,1);
  const monthEnd=new Date(calYear,calMonth+1,0);
  // Buffer 6 days each side to cover the calendar grid padding
  const winStart=new Date(monthStart);winStart.setDate(winStart.getDate()-6);
  const winEnd=new Date(monthEnd);winEnd.setDate(winEnd.getDate()+6);
  const fmt=d=>d.toISOString().slice(0,10);
  Object.entries(tasks).forEach(([id,t])=>{
    if(!t.dueDate)return;
    const rep=t.repeat||'none';
    if(rep==='none'){
      if(!tMap[t.dueDate])tMap[t.dueDate]=[];
      tMap[t.dueDate].push({id,...t});
      return;
    }
    // Walk backwards from the stored dueDate to find the earliest occurrence
    // that lands inside the visible window, then walk forward through it.
    const seed=new Date(t.dueDate+'T00:00:00');
    let cur=new Date(seed);
    if(rep==='daily'){
      // Jump to winStart
      while(cur>winStart)cur.setDate(cur.getDate()-1);
      while(cur<winStart)cur.setDate(cur.getDate()+1);
      while(cur<=winEnd){
        const ds=fmt(cur);
        if(!tMap[ds])tMap[ds]=[];
        tMap[ds].push({id,...t,dueDate:ds,_recurring:true});
        cur.setDate(cur.getDate()+1);
      }
    } else if(rep==='weekly'){
      while(cur>winStart)cur.setDate(cur.getDate()-7);
      while(cur<winStart)cur.setDate(cur.getDate()+7);
      while(cur<=winEnd){
        const ds=fmt(cur);
        if(!tMap[ds])tMap[ds]=[];
        tMap[ds].push({id,...t,dueDate:ds,_recurring:true});
        cur.setDate(cur.getDate()+7);
      }
    } else if(rep==='monthly'){
      while(cur>winStart)cur.setMonth(cur.getMonth()-1);
      while(cur<winStart)cur.setMonth(cur.getMonth()+1);
      while(cur<=winEnd){
        const ds=fmt(cur);
        if(!tMap[ds])tMap[ds]=[];
        tMap[ds].push({id,...t,dueDate:ds,_recurring:true});
        cur.setMonth(cur.getMonth()+1);
      }
    }
  });

  let html='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{html+=`<div class="cal-day-head">${d}</div>`});

  // Previous month padding
  const prevDays=new Date(calYear,calMonth,0).getDate();
  for(let i=startDay-1;i>=0;i--){
    const d=prevDays-i;
    html+=`<div class="cal-day other"><span class="cal-num">${d}</span></div>`;
  }

  // Current month
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===todayStr;
    const dayTasks=tMap[dateStr]||[];
    const doneCount=dayTasks.filter(t=>t.completed).length;
    const heat=doneCount>=3?'3':doneCount>=1?String(doneCount):'0';
    const overdue=dayTasks.some(t=>!t.completed&&dateStr<todayStr);
    const shown=dayTasks.slice(0,2);
    const dots=dayTasks.slice(0,9).map(t=>`<span class="cal-dot ${t.category||'personal'} ${t.completed?'done':''}"></span>`).join('');
    const countBadge=dayTasks.length?`<span class="cal-count ${overdue?'has-overdue':''}">${dayTasks.length}</span>`:'';
    html+=`<div class="cal-day ${isToday?'today':''}" data-done="${heat}" onclick="openDayModal('${dateStr}')">
      <span class="cal-num">${d}</span>
      ${countBadge}
      ${shown.map(t=>`<div class="cal-task ${t.category||'personal'} ${t.completed?'done':''}" onclick="event.stopPropagation();openDayModal('${dateStr}')">${t.dueTime?'<span style="opacity:.6">'+fmtTime12(t.dueTime)+'</span> ':''}${esc(t.title||'')}</div>`).join('')}
      ${dayTasks.length>2?`<div style="font-size:7px;color:var(--text-muted);font-weight:600;margin-top:1px">+${dayTasks.length-2} more</div>`:''}
      ${dots?`<div class="cal-dots">${dots}</div>`:''}
    </div>`;
  }

  // Next month padding
  const totalCells=startDay+daysInMonth;
  const remaining=totalCells%7===0?0:7-totalCells%7;
  for(let i=1;i<=remaining;i++){html+=`<div class="cal-day other"><span class="cal-num">${i}</span></div>`}

  grid.innerHTML=html;
  // Cursor-tracked aurora glow on each day cell
  grid.querySelectorAll('.cal-day').forEach(el=>{
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect();
      el.style.setProperty('--cmx',((e.clientX-r.left)/r.width*100)+'%');
      el.style.setProperty('--cmy',((e.clientY-r.top)/r.height*100)+'%');
    });
    el.addEventListener('mouseleave',()=>{
      el.style.setProperty('--cmx','50%');
      el.style.setProperty('--cmy','50%');
    });
  });
}

function openDayModal(dateStr){
  closeDayModal();
  const tEntries=Object.entries(tasks).filter(([,t])=>t.dueDate===dateStr);
  const dt=new Date(dateStr+'T00:00:00');
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const dateLabel=`${months[dt.getMonth()]} ${dt.getDate()}`;
  const yearLabel=dt.getFullYear();
  const dayLabel=days[dt.getDay()];
  const today=new Date().toISOString().slice(0,10);
  const total=tEntries.length;
  const done=tEntries.filter(([,t])=>t.completed).length;
  const overdueCount=tEntries.filter(([,t])=>!t.completed&&dateStr<today).length;
  const remaining=total-done;

  let html=`<div class="day-modal" id="dayModal" onclick="if(event.target===this)closeDayModal()">
    <div class="day-modal-card">
      <div class="day-modal-head">
        <div>
          <div class="day-modal-date">${dateLabel} <span style="font-size:14px;font-weight:600;opacity:.6">${yearLabel}</span></div>
          <div class="day-modal-day">${dayLabel}${dateStr===today?'<span class="today-pill">TODAY</span>':''}</div>
        </div>
        <button class="day-modal-x" onclick="closeDayModal()" title="Close">&times;</button>
      </div>
      <div class="day-modal-stats">
        <div class="day-stat"><div class="day-stat-val accent">${total}</div><div class="day-stat-label">Total</div></div>
        <div class="day-stat"><div class="day-stat-val done">${done}</div><div class="day-stat-label">Done</div></div>
        <div class="day-stat"><div class="day-stat-val">${remaining}</div><div class="day-stat-label">Remaining</div></div>
        <div class="day-stat"><div class="day-stat-val ${overdueCount?'red':''}">${overdueCount}</div><div class="day-stat-label">Overdue</div></div>
      </div>
      <div class="day-view-toggle">
        <button class="${dayView==='chart'?'active':''}" onclick="setDayView('chart','${dateStr}')">📊 Chart</button>
        <button class="${dayView==='list'?'active':''}" onclick="setDayView('list','${dateStr}')">📋 List</button>
      </div>`;

  // ── CHART VIEW ──
  if(dayView==='chart'&&tEntries.length){
    const cs=getComputedStyle(document.body);
    const a1=cs.getPropertyValue('--accent1').trim()||'#8B5CF6';
    const a2=cs.getPropertyValue('--accent2').trim()||'#3B82F6';
    const a3=cs.getPropertyValue('--accent3').trim()||'#ec4899';
    // Category buckets
    const catColors={work:a2,personal:a1,project:a3};
    const catCounts={work:0,personal:0,project:0};
    tEntries.forEach(([,t])=>{const c=t.category||'personal';if(catCounts[c]!==undefined)catCounts[c]++});
    // Difficulty buckets (count + weight)
    const diffWeights={easy:1,medium:2,hard:4,epic:8,super_epic:16};
    const diffColors={easy:'#34d399',medium:'#fbbf24',hard:'#f97316',epic:a3,super_epic:'#7c9cff'};
    const diffCounts={easy:0,medium:0,hard:0,epic:0,super_epic:0};
    tEntries.forEach(([,t])=>{const d=t.difficulty||'medium';if(diffCounts[d]!==undefined)diffCounts[d]++});
    const totalWeight=Object.entries(diffCounts).reduce((s,[d,n])=>s+n*diffWeights[d],0);
    // Donut SVG
    const r=42,strokeW=12,c=2*Math.PI*r;
    let donut='<svg class="donut-svg" viewBox="0 0 104 104">';
    donut+=`<circle cx="52" cy="52" r="${r}" stroke="rgba(255,255,255,0.06)" stroke-width="${strokeW}" fill="none"/>`;
    let off=0;
    Object.entries(catCounts).forEach(([cat,n])=>{
      if(!n)return;
      const len=n/total*c;
      donut+=`<circle cx="52" cy="52" r="${r}" stroke="${catColors[cat]}" stroke-width="${strokeW}" fill="none" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 52 52)" stroke-linecap="round"/>`;
      off+=len;
    });
    donut+=`<text x="52" y="49" class="donut-center">${total}</text>`;
    donut+=`<text x="52" y="64" class="donut-center-label">tasks</text>`;
    donut+='</svg>';
    // Donut legend
    let donutLegend='<div class="donut-legend">';
    Object.entries(catCounts).forEach(([cat,n])=>{
      if(!n)return;
      const pct=Math.round(n/total*100);
      donutLegend+=`<div class="donut-legend-item"><span class="donut-legend-dot" style="background:${catColors[cat]}"></span><span class="donut-legend-name">${cat}</span><span class="donut-legend-count">${n} <span style="color:var(--text-muted);font-weight:600">·${pct}%</span></span></div>`;
    });
    donutLegend+='</div>';
    // Difficulty stacked bar
    let diffBar='<div class="diff-bar-track">';
    const diffOrder=['easy','medium','hard','epic','super_epic'];
    diffOrder.forEach(d=>{
      const n=diffCounts[d];if(!n)return;
      const weight=n*diffWeights[d];
      const flex=weight;
      const label=n>0?`${n}`:'';
      diffBar+=`<div class="diff-bar-seg" style="background:${diffColors[d]};flex:${flex} 1 0">${label}</div>`;
    });
    diffBar+='</div><div class="diff-bar-legend">';
    diffOrder.forEach(d=>{
      const n=diffCounts[d];
      const weight=n*diffWeights[d];
      diffBar+=`<div class="diff-bar-legend-item"${n?'':' style="opacity:.35"'}><span class="diff-bar-legend-dot" style="background:${diffColors[d]}"></span>${d}${n?' '+n+'×'+diffWeights[d]+'pt':''}</div>`;
    });
    diffBar+='</div>';
    diffBar+=`<div style="font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;margin-top:4px">Total weight: <span style="color:var(--accent1);font-size:11px">${totalWeight} pts</span></div>`;
    // Hourly timeline (only if completions exist for this day)
    const dayHistory=Object.values(taskHistory||{}).filter(h=>(h.completedAt||'').slice(0,10)===dateStr);
    let timeline='';
    if(dayHistory.length){
      const W=440,H=64,padL=20,padR=12,padT=6,padB=18;
      const innerW=W-padL-padR;
      timeline+=`<svg class="timeline-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
      // Axis
      timeline+=`<line class="timeline-axis" x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}"/>`;
      // Hour ticks every 4h
      [0,4,8,12,16,20,24].forEach(h=>{
        const x=padL+(h/24)*innerW;
        timeline+=`<line class="timeline-axis" x1="${x}" y1="${H-padB}" x2="${x}" y2="${H-padB+3}"/>`;
        const lbl=h===0?'12a':h===12?'12p':h<12?h+'a':(h-12)+'p';
        if(h<24)timeline+=`<text class="timeline-tick-label" x="${x}" y="${H-4}">${lbl}</text>`;
      });
      // Dots
      dayHistory.forEach(h=>{
        const d=new Date(h.completedAt);
        const hourFloat=d.getHours()+d.getMinutes()/60;
        const x=padL+(hourFloat/24)*innerW;
        const y=H-padB-Math.random()*22-4;
        const col=catColors[h.category||'personal']||a1;
        timeline+=`<circle class="timeline-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${col}" style="color:${col}"/>`;
      });
      timeline+='</svg>';
    }

    html+='<div class="day-charts">';
    html+='<div class="day-chart-row">';
    html+=`<div class="day-chart-card"><div class="chart-label">Categories</div><div class="donut-wrap">${donut}${donutLegend}</div></div>`;
    html+=`<div class="day-chart-card"><div class="chart-label">Difficulty Mix</div><div class="diff-bar-wrap">${diffBar}</div></div>`;
    html+='</div>';
    if(timeline){
      html+=`<div class="day-chart-card"><div class="chart-label">Completions Today</div>${timeline}</div>`;
    }
    html+='</div>';
  }

  if(!tEntries.length){
    const curTheme=localStorage.getItem('oyt_theme')||'';
    const m=(THEMES[curTheme]||THEMES['']).mascot;
    html+=`<div class="day-modal-empty">
      <span class="day-modal-empty-emoji">${m}</span>
      <div class="day-modal-empty-text">Nothing on the books for this day</div>
    </div>`;
  } else if(dayView==='list') {
    html+=`<div class="day-modal-tasks">`;
    tEntries.sort((a,b)=>{if(a[1].completed!==b[1].completed)return a[1].completed?1:-1;const pri={high:0,medium:1,low:2};return(pri[a[1].priority]||1)-(pri[b[1].priority]||1)});
    tEntries.forEach(([id,t])=>{
      const cc=t.category==='work'?'var(--accent2)':t.category==='project'?'var(--accent3)':t.category==='rfi'?'#fbbf24':'var(--accent1)';
      const od=!t.completed&&dateStr<today;
      const diff=t.difficulty||'medium';
      const diffStars={easy:'★',medium:'★★',hard:'★★★',epic:'★★★★',super_epic:'★★★★★'}[diff];
      html+=`<div class="tc ${t.completed?'done':''}" style="border-left:3px solid ${cc}">
        <button class="ck" onclick="toggleDone('${id}');setTimeout(()=>openDayModal('${dateStr}'),100)">${t.completed?'&#10003;':''}</button>
        <div class="tb">
          <div class="tt">${esc(t.title||'')}</div>
          ${t.notes?`<div class="t-notes">${esc(t.notes)}</div>`:''}
          <div class="tm">
            <span class="pd ${t.priority||'medium'}"></span>
            <span class="cat ${t.category||'personal'}">${t.category||'personal'}</span>
            <span class="t-diff ${diff}">${diffStars}</span>
            ${t.repeat&&t.repeat!=='none'?`<span class="t-repeat">${t.repeat}</span>`:''}
            ${t.dueTime?`<span class="dl">${fmtTime12(t.dueTime)}</span>`:''}
            ${od?`<span class="dl od">Overdue</span>`:''}
          </div>
        </div>
        <div class="ta" style="opacity:1">
          <button class="tab del" onclick="deleteTask('${id}');setTimeout(()=>openDayModal('${dateStr}'),100)">&times;</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  // ── Completed on this day ──
  // Pull from todo/history (recurring + one-shot completions are logged there).
  const completedHere=Object.values(taskHistory||{})
    .filter(h=>(h.completedAt||'').slice(0,10)===dateStr)
    .sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  if(completedHere.length){
    html+=`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--card-border)">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent1);margin-bottom:8px;display:flex;align-items:center;gap:6px">
        <span style="font-size:12px">✓</span> Completed on this day · ${completedHere.length}
      </div>
      <div class="day-modal-tasks">`;
    completedHere.forEach(h=>{
      const cc=h.category==='work'?'var(--accent2)':h.category==='project'?'var(--accent3)':'var(--accent1)';
      const diff=h.difficulty||'medium';
      const diffStars={easy:'★',medium:'★★',hard:'★★★',epic:'★★★★',super_epic:'★★★★★'}[diff];
      const time=new Date(h.completedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      html+=`<div class="tc done" style="border-left:3px solid ${cc};opacity:.78">
        <div class="ck" style="border-color:${cc};background:${cc};color:#fff">&#10003;</div>
        <div class="tb">
          <div class="tt" style="font-size:13px">${esc(h.title||'(untitled)')}</div>
          <div class="tm">
            <span class="cat ${h.category||'personal'}">${h.category||'personal'}</span>
            <span class="t-diff ${diff}">${diffStars}</span>
            <span class="dl">${time}</span>
          </div>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  }

  html+=`<div class="day-modal-add-wrap">
      <input class="day-modal-add-input" id="dayModalAddInput" type="text" placeholder="+ Add a task for this day..." onkeydown="if(event.key==='Enter')dayModalAdd('${dateStr}')">
      <button class="day-modal-add-btn" onclick="dayModalAdd('${dateStr}')">Add</button>
    </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  fxModalIn(document.querySelector('#dayModal .day-modal-card'));
  setTimeout(()=>document.getElementById('dayModalAddInput')?.focus(),100);
}

  createTask({title,category:newCat||'personal',dueDate:dateStr});
  setTimeout(()=>openDayModal(dateStr),250);
}

}

// Turn bare URLs in notes into clickable links (after HTML-escaping)
function linkifyNotes(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
// Task detail popup. mode='view' shows a clean info card; mode='edit' turns
// the SAME card into a full editable form (no cramped inline column).
let _editTaskId=null;
function openTaskModal(id,mode){
  closeTaskModal();
  const t=tasks[id];
  if(!t)return;
  mode=mode||'view';
  _editTaskId=mode==='edit'?id:null;
  const today=new Date().toISOString().slice(0,10);
  const od=t.dueDate&&!t.completed&&t.dueDate<today;
  const diff=t.difficulty||'medium';
  const diffStars={easy:'★',medium:'★★',hard:'★★★',epic:'★★★★',super_epic:'★★★★★'}[diff];
  const diffLabel=diff.replace('_',' ');
  const prog=t.completed?100:Math.max(0,Math.min(100,parseFloat(t.progress)||0));
  const proj=t.projectId?projects[t.projectId]:null;
  const fmtDay=ds=>{if(!ds)return '';const d=new Date(ds.slice(0,10)+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'})};

  let body,foot,title;
  if(mode==='edit'){
    const projOptions=`<option value="">No project</option>`+Object.entries(projects)
      .filter(([pid,p])=>p.status!=='archived'||pid===(t.projectId||''))
      .sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''))
      .map(([pid,p])=>`<option value="${pid}" ${t.projectId===pid?'selected':''}>${esc(p.name||'Untitled')}</option>`).join('');
    const starsIdx=DIFF_ORDER.indexOf(diff);
    const stars=DIFF_ORDER.map((d,i)=>`<button class="qa-star ${i<=starsIdx?'on':''}" onclick="editSetDiff('${d}')" title="${d.replace('_',' ')}">★</button>`).join('');
    title=`<input class="tm-edit-title" value="${esc(t.title||'')}" placeholder="Task title" onchange="updateTask('${id}','title',this.value)">`;
    body=`
      <div class="tm-edit">
        <label class="tm-edit-field wide"><span class="tm-field-lbl">Notes</span>
          <textarea class="tm-edit-notes" placeholder="Add notes…" onchange="updateTask('${id}','notes',this.value)">${esc(t.notes||'')}</textarea>
        </label>
        <div class="tm-edit-grid">
          <div class="tm-edit-field"><span class="tm-field-lbl">Priority</span>
            <div class="seg">${['high','medium','low'].map(p=>`<button class="seg-btn ${((t.priority||'medium')===p)?'on':''}" onclick="editSet('${id}','priority','${p}',this)">${p}</button>`).join('')}</div>
          </div>
          <div class="tm-edit-field"><span class="tm-field-lbl">Difficulty</span>
            <div class="qa-stars" id="editStars">${stars}</div>
          </div>
          <div class="tm-edit-field"><span class="tm-field-lbl">Category</span>
            <select onchange="updateTask('${id}','category',this.value)">${['work','personal','project','rfi'].map(c=>`<option value="${c}" ${(t.category||'personal')===c?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="tm-edit-field"><span class="tm-field-lbl">Project</span>
            <select onchange="updateTask('${id}','projectId',this.value)">${projOptions}</select>
          </div>
          <div class="tm-edit-field"><span class="tm-field-lbl">Due date</span>
            <span class="date-btn ${t.dueDate?'has-date':''}" id="editDateBtn" onclick="toggleDatePicker(event,{dueId:'editDue',wrapId:'editDateBtn',after:updateEditDateBtn})">
              <span id="editDateLabel">${t.dueDate?fmtDay(t.dueDate):'Due date'}</span>
              <input type="hidden" id="editDue" value="${t.dueDate||''}">
            </span>
          </div>
          <div class="tm-edit-field"><span class="tm-field-lbl">Time</span>
            <input type="time" value="${t.dueTime||''}" onchange="updateTask('${id}','dueTime',this.value)">
          </div>
          <div class="tm-edit-field"><span class="tm-field-lbl">Repeat</span>
            <select onchange="updateTask('${id}','repeat',this.value)">${[['none','No repeat'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(([v,lb])=>`<option value="${v}" ${(t.repeat||'none')===v?'selected':''}>${lb}</option>`).join('')}</select>
          </div>
          <div class="tm-edit-field"><span class="tm-field-lbl">From</span>
            <input type="text" value="${esc(t.from||'')}" placeholder="Who asked?" list="fromSuggestions" onchange="updateTask('${id}','from',this.value)">
          </div>
        </div>
        ${!t.completed?`<div class="tm-edit-field wide"><span class="tm-field-lbl">Progress · <span id="editProgVal">${prog}%</span></span>
          <input type="range" min="0" max="100" step="5" value="${prog}" oninput="document.getElementById('editProgVal').textContent=this.value+'%'" onchange="setProgress('${id}',this.value)" style="accent-color:var(--accent1)">
        </div>`:''}
      </div>`;
    foot=`
      <button class="tm-modal-btn danger" onclick="if(confirm('Delete this task?')){deleteTask('${id}');closeTaskModal()}">Delete</button>
      <button class="tm-modal-btn" onclick="toggleDone('${id}');closeTaskModal()">${t.completed?'↩ Mark active':'✓ Mark done'}</button>
      <button class="tm-modal-btn primary" onclick="openTaskModal('${id}','view')">Done</button>`;
  } else {
    const field=(lbl,val,cls)=>val?`<div class="tm-field ${cls||''}"><span class="tm-field-lbl">${lbl}</span><span class="tm-field-val">${val}</span></div>`:'';
    const statusTxt=t.completed?'Done':od?'Overdue':'Active';
    title=`<div class="tm-modal-title ${t.completed?'done':''}">${esc(t.title||'(untitled)')}</div>`;
    const grid=`<div class="tm-grid">
      ${field('Status',`<span class="tm-status ${t.completed?'done':od?'od':'active'}">${statusTxt}</span>`)}
      ${field('Priority',`<span class="pd ${t.priority||'medium'}"></span> ${t.priority||'medium'}`)}
      ${field('Category',esc(t.category||'personal'))}
      ${proj?field('Project',`<span class="t-proj" style="--pc:${proj.color||'#7c9cff'}" onclick="closeTaskModal();openProjectView('${t.projectId}')">${proj.icon?proj.icon+' ':''}${esc(proj.name||'Untitled')}</span>`):''}
      ${field('Effort',`<span class="t-diff ${diff}">${diffStars}</span> ${diffLabel}`)}
      ${field('Due',t.dueDate?`${fmtDay(t.dueDate)}${t.dueTime?' · '+fmtTime12(t.dueTime):''}${od?' <span class="tm-od">overdue</span>':''}`:'')}
      ${field('Repeat',t.repeat&&t.repeat!=='none'?t.repeat:'')}
      ${field('From',esc(t.from||''))}
      ${t.category==='rfi'?field('RFI #',esc(t.rfiNumber||'')):''}
      ${t.category==='rfi'?field('Send to',esc(t.sendTo||'')):''}
      ${field('Created',fmtDay(t.createdAt))}
      ${t.completed?field('Completed',fmtDay(t.completedAt)):''}
    </div>`;
    const progBlock=!t.completed&&prog>0?`<div class="tm-modal-prog">
        <div class="tm-modal-prog-head"><span class="tm-field-lbl">Progress</span><span class="tm-prog-val">${prog}%</span></div>
        <div class="tm-modal-prog-bar"><div class="tm-modal-prog-fill" style="width:${prog}%"></div></div>
      </div>`:'';
    const notes=(t.notes||'').trim();
    const desc=(t.description||'').trim();
    const notesBlock=(notes||desc)
      ? `${desc?`<div class="tm-modal-section-label">Description</div><div class="tm-modal-notes">${linkifyNotes(desc)}</div>`:''}
         ${notes?`<div class="tm-modal-section-label">Notes</div><div class="tm-modal-notes">${linkifyNotes(notes)}</div>`:''}`
      : `<div class="tm-modal-notes-empty">No notes yet — tap Edit to add some.</div>`;
    body=`${grid}${progBlock}${notesBlock}`;
    foot=`
      <button class="tm-modal-btn danger" onclick="if(confirm('Delete this task?')){deleteTask('${id}');closeTaskModal()}">Delete</button>
      <button class="tm-modal-btn" onclick="toggleDone('${id}');closeTaskModal()">${t.completed?'↩ Mark active':'✓ Mark done'}</button>
      <button class="tm-modal-btn primary" onclick="openTaskModal('${id}','edit')">✎ Edit</button>`;
  }

  const html=`<div class="day-modal" id="taskModal" onclick="if(event.target===this)closeTaskModal()">
    <div class="day-modal-card" style="max-width:600px">
      <div class="day-modal-head">
        ${title}
        <button class="day-modal-x" onclick="closeTaskModal()" title="Close">&times;</button>
      </div>
      ${body}
      <div class="tm-modal-foot">${foot}</div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  fxModalIn(document.querySelector('#taskModal .day-modal-card'));
  document.addEventListener('keydown',taskModalEsc);
}
// Edit-mode helpers (operate on the task currently open in the modal)
function editSetDiff(d){if(_editTaskId){updateTask(_editTaskId,'difficulty',d);paintStars(document.getElementById('editStars'),d)}}
function editSet(id,field,val,btn){
  updateTask(id,field,val);
  if(btn&&btn.parentElement)btn.parentElement.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('on',b===btn));
}
function updateEditDateBtn(v){
  const wrap=document.getElementById('editDateBtn'),label=document.getElementById('editDateLabel');
  if(_editTaskId!==null)updateTask(_editTaskId,'dueDate',v||'');
  if(!wrap||!label)return;
  if(v){
    wrap.classList.add('has-date');
    const today=new Date().toISOString().slice(0,10);
    const tmr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)})();
    label.textContent=v===today?'Today':v===tmr?'Tomorrow':new Date(v+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }else{wrap.classList.remove('has-date');label.textContent='Due date'}
}
function taskModalEsc(e){if(e.key==='Escape')closeTaskModal()}
function closeTaskModal(){
  _editTaskId=null;
  document.getElementById('taskModal')?.remove();
  document.removeEventListener('keydown',taskModalEsc);
}

function addTaskForDate(dateStr){
  const title=prompt('Task title:');
  if(!title)return;
  createTask({title,category:'personal',dueDate:dateStr});
  setTimeout(()=>openDayModal(dateStr),200);
}

let statsRange=parseInt(localStorage.getItem('oyt_stats_range')||'30',10);
const _statCharts={};
function setStatsRange(d){statsRange=d;localStorage.setItem('oyt_stats_range',String(d));renderStatsView()}
function _dayStr(dt){return dt.toISOString().slice(0,10)}
function _addDays(base,n){const d=new Date(base);d.setDate(d.getDate()+n);return d}
function _fmtNum(n){n=Math.round(n);if(Math.abs(n)>=1000)return (n/1000).toFixed(n%1000?1:0).replace(/\.0$/,'')+'k';return String(n)}
// Difficulty-weighted points from a completion record
function _histPts(h){return DIFF_WEIGHTS[h.difficulty||'medium']||2}

// Build a per-day series of {date,label,value(points),count} across [start..today]
function buildDailySeries(hist,startStr){
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(startStr+'T00:00:00');
  const byDay={};
  hist.forEach(h=>{const d=(h.completedAt||'').slice(0,10);if(d>=startStr){if(!byDay[d])byDay[d]={pts:0,n:0};byDay[d].pts+=_histPts(h);byDay[d].n++}});
  const out=[];
  for(let d=new Date(start);d<=today;d=_addDays(d,1)){
    const ds=_dayStr(d);const e=byDay[ds]||{pts:0,n:0};
    out.push({date:ds,label:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),value:e.pts,count:e.n});
  }
  return out;
}

function renderStatsDashboard(){
  const hist=Object.values(taskHistory||{}).filter(h=>h.completedAt);
  const all=Object.values(tasks);
  const active=all.filter(t=>!t.completed);
  const today=new Date();today.setHours(0,0,0,0);
  const todayStr=_dayStr(today);
  const rangeDays=statsRange>0?statsRange:Math.max(30,(()=>{
    if(!hist.length)return 30;
    const earliest=hist.map(h=>h.completedAt.slice(0,10)).sort()[0];
    return Math.ceil((today-new Date(earliest+'T00:00:00'))/86400000)+1;
  })());
  const startStr=_dayStr(_addDays(today,-(rangeDays-1)));
  const prevStartStr=_dayStr(_addDays(today,-(rangeDays*2-1)));

  const inRange=hist.filter(h=>h.completedAt.slice(0,10)>=startStr);
  const prevRange=hist.filter(h=>{const d=h.completedAt.slice(0,10);return d>=prevStartStr&&d<startStr});
  const pts=inRange.reduce((s,h)=>s+_histPts(h),0);
  const prevPts=prevRange.reduce((s,h)=>s+_histPts(h),0);
  const series=buildDailySeries(hist,startStr);
  const streak=calcStreak();
  const avgPerDay=rangeDays?pts/rangeDays:0;
  const prevAvg=rangeDays?prevPts/rangeDays:0;

  // KPI deltas
  const delta=(cur,prev)=>{
    if(!prev)return cur?{cls:'up',txt:'new'}:{cls:'flat',txt:'—'};
    const pct=Math.round((cur-prev)/prev*100);
    if(pct===0)return{cls:'flat',txt:'0%'};
    return{cls:pct>0?'up':'down',txt:(pct>0?'▲':'▼')+' '+Math.abs(pct)+'%'};
  };
  const spark=series.slice(-14).map(p=>p.value);
  const kpi=(label,val,unit,d,sparkVals)=>`<div class="kpi-tile">
    <div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-delta ${d.cls}">${d.txt}</span></div>
    <div class="kpi-val">${val}${unit?`<span class="unit">${unit}</span>`:''}</div>
    <div class="kpi-spark">${sparkline(sparkVals)}</div>
  </div>`;

  const kpiRow=`<div class="kpi-row">
    ${kpi('Completed',_fmtNum(inRange.length),'',delta(inRange.length,prevRange.length),series.slice(-14).map(p=>p.count))}
    ${kpi('Points earned',_fmtNum(pts),'',delta(pts,prevPts),spark)}
    ${kpi('Current streak',streak,streak===1?'day':'days',{cls:streak?'up':'flat',txt:streak?'active':'—'},spark)}
    ${kpi('Avg / day',avgPerDay.toFixed(1),'pts',delta(avgPerDay,prevAvg),spark)}
  </div>`;

  // snapshot chips (current state, not range)
  const overdue=active.filter(t=>t.dueDate&&t.dueDate<todayStr).length;
  const highActive=active.filter(t=>t.priority==='high').length;
  const snap=`<div class="snap-row">
    <div class="snap-chip"><span class="v">${active.length}</span><span class="l">Active tasks</span></div>
    <div class="snap-chip"><span class="v ${highActive?'warn':''}">${highActive}</span><span class="l">High priority</span></div>
    <div class="snap-chip"><span class="v ${overdue?'bad':''}">${overdue}</span><span class="l">Overdue</span></div>
    <div class="snap-chip"><span class="v">${all.filter(t=>t.completed).length}</span><span class="l">Done all-time</span></div>
  </div>`;

  // Main area chart — daily points
  const areaChart=series.some(p=>p.value)
    ? statAreaChart('sc_area',series)
    : `<div class="viz-empty">No completions in this range yet.</div>`;

  // Weekday rhythm columns (within range)
  const wd=[0,0,0,0,0,0,0];
  inRange.forEach(h=>{const dow=new Date(h.completedAt.slice(0,10)+'T00:00:00').getDay();wd[dow]+=_histPts(h)});
  const wdNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const wdData=[1,2,3,4,5,6,0].map(i=>({label:wdNames[i],value:wd[i]})); // Mon-first
  const rhythmChart=wd.some(v=>v)?statColumns('sc_wd',wdData):`<div class="viz-empty">Not enough data.</div>`;

  // By category (magnitude → sequential single hue, sorted, labeled)
  const catAgg={};
  inRange.forEach(h=>{const c=h.category||'personal';catAgg[c]=(catAgg[c]||0)+1});
  const catBars=Object.entries(catAgg).sort((a,b)=>b[1]-a[1]);
  const catMax=Math.max(...catBars.map(b=>b[1]),1);
  const catBlock=catBars.length?catBars.map(([name,v])=>hbar(name,v,catMax)).join(''):`<div class="viz-empty">No completions yet.</div>`;

  // By project (progress % of active/all projects)
  const projList=Object.entries(projects).filter(([,p])=>p.status!=='archived'&&p.status!=='done')
    .map(([id,p])=>({name:(p.icon?p.icon+' ':'')+(p.name||'Untitled'),pct:projectStats(id).pct}))
    .sort((a,b)=>b.pct-a.pct).slice(0,8);
  const projBlock=projList.length?projList.map(p=>hbar(p.name,p.pct,100,'%')).join(''):`<div class="viz-empty">No active projects.</div>`;

  // Deadline performance (status stacked bar)
  const withDue=hist.filter(h=>h.dueDate&&h.completedAt);
  let early=0,onTime=0,late=0;
  withDue.forEach(h=>{const c=h.completedAt.slice(0,10);if(c<h.dueDate)early++;else if(c===h.dueDate)onTime++;else late++});
  const dlTotal=early+onTime+late;
  const beatPct=dlTotal?Math.round((early+onTime)/dlTotal*100):0;
  const dlBlock=dlTotal?`
    <div class="dl-bar">
      ${early?`<div class="dl-seg early" style="width:${early/dlTotal*100}%"></div>`:''}
      ${onTime?`<div class="dl-seg ontime" style="width:${onTime/dlTotal*100}%"></div>`:''}
      ${late?`<div class="dl-seg late" style="width:${late/dlTotal*100}%"></div>`:''}
    </div>
    <div class="dl-legend">
      <span class="dl-key"><span class="dot" style="background:var(--good)"></span>Early <b>${early}</b></span>
      <span class="dl-key"><span class="dot" style="background:var(--accent1)"></span>On time <b>${onTime}</b></span>
      <span class="dl-key"><span class="dot" style="background:var(--bad)"></span>Late <b>${late}</b></span>
    </div>`:`<div class="viz-empty">No dated completions to grade yet.</div>`;

  const rangeLabel=statsRange>0?`last ${statsRange} days`:'all time';
  const RANGES=[[7,'7D'],[30,'30D'],[90,'90D'],[0,'All']];
  return `
  <div class="stats-head">
    <h2 class="stats-h2">Productivity</h2>
    <div class="stats-sub"><b>${_fmtNum(pts)}</b> points · <b>${inRange.length}</b> done · <b>${beatPct}%</b> deadlines met · ${rangeLabel}</div>
  </div>
  <div class="viz-filters">
    ${RANGES.map(([d,l])=>`<button class="viz-range-btn ${statsRange===d?'on':''}" onclick="setStatsRange(${d})">${l}</button>`).join('')}
  </div>
  ${kpiRow}
  ${snap}
  <div class="viz-card full">
    <div class="viz-card-head"><span class="viz-card-title">Points earned over time</span><span class="viz-card-note">difficulty-weighted · ${rangeLabel}</span></div>
    ${areaChart}
  </div>
  <div class="viz-grid2">
    <div class="viz-card">
      <div class="viz-card-head"><span class="viz-card-title">Rhythm by weekday</span><span class="viz-card-note">points</span></div>
      ${rhythmChart}
    </div>
    <div class="viz-card">
      <div class="viz-card-head"><span class="viz-card-title">Deadline performance</span><span class="viz-card-note">${dlTotal} dated</span></div>
      ${dlBlock}
    </div>
    <div class="viz-card">
      <div class="viz-card-head"><span class="viz-card-title">By category</span><span class="viz-card-note">completed</span></div>
      ${catBlock}
    </div>
    <div class="viz-card">
      <div class="viz-card-head"><span class="viz-card-title">Project progress</span><span class="viz-card-note">% complete</span></div>
      ${projBlock}
    </div>
  </div>`;
}

// Tiny sparkline (no axes, no hover) — de-emphasis line, accent end-dot
function sparkline(vals){
  vals=(vals||[]).map(v=>+v||0);
  if(vals.length<2)vals=[0,0];
  const W=120,H=30,pad=3,max=Math.max(...vals,1);
  const step=(W-pad*2)/(vals.length-1);
  const pts=vals.map((v,i)=>[pad+i*step,H-pad-(v/max)*(H-pad*2)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--viz-soft)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="var(--viz)"/></svg>`;
}

// Area chart with crosshair hover. Stores series in _statCharts[id] for wiring.
function statAreaChart(id,series){
  const W=720,H=210,pL=34,pR=10,pT=12,pB=22;
  const plotW=W-pL-pR,plotH=H-pT-pB;
  const maxV=Math.max(...series.map(p=>p.value),1);
  // nice y ticks
  const ticks=4;const stepV=niceStep(maxV/ticks);const topV=Math.max(stepV*ticks,stepV);
  const n=series.length;
  const stepX=n>1?plotW/(n-1):0;
  const xy=series.map((p,i)=>[pL+i*stepX,pT+plotH-(p.value/topV)*plotH]);
  const linePath=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const areaPath=`M${xy[0][0].toFixed(1)} ${(pT+plotH).toFixed(1)} `+xy.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${xy[n-1][0].toFixed(1)} ${(pT+plotH).toFixed(1)} Z`;
  let grid='';
  for(let i=0;i<=ticks;i++){
    const val=topV/ticks*i;const y=pT+plotH-(val/topV)*plotH;
    grid+=`<line class="viz-grid-line" x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}"/>`;
    grid+=`<text class="viz-axis-txt" x="${pL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${_fmtNum(val)}</text>`;
  }
  // x labels — ~6 evenly spaced
  let xlabels='';const nLab=Math.min(6,n);
  for(let i=0;i<nLab;i++){
    const idx=Math.round(i*(n-1)/(nLab-1||1));const x=pL+idx*stepX;
    xlabels+=`<text class="viz-axis-txt" x="${x.toFixed(1)}" y="${H-6}" text-anchor="middle">${series[idx].label}</text>`;
  }
  _statCharts[id]={W,H,pL,pT,plotH,stepX,n,topV,series,xy};
  return `<div class="viz-plot" style="position:relative">
    <svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}">
      ${grid}
      <path class="viz-area" d="${areaPath}"/>
      <path class="viz-line" d="${linePath}"/>
      <circle class="viz-dot" cx="${xy[n-1][0].toFixed(1)}" cy="${xy[n-1][1].toFixed(1)}" r="3.5"/>
      <line class="viz-crosshair" id="${id}_cross" y1="${pT}" y2="${pT+plotH}"/>
      <circle class="viz-hover-dot" id="${id}_hdot" r="4"/>
      <rect id="${id}_hit" x="${pL}" y="${pT}" width="${plotW}" height="${plotH}" fill="transparent" style="cursor:crosshair"/>
    </svg>
    <div class="viz-tip" id="${id}_tip"></div>
  </div>`;
}

// Vertical columns with per-bar hover tooltip; emphasis on peak
function statColumns(id,data){
  const W=340,H=150,pL=8,pR=8,pT=8,pB=20;
  const plotW=W-pL-pR,plotH=H-pT-pB;
  const maxV=Math.max(...data.map(d=>d.value),1);
  const n=data.length;const slot=plotW/n;const bw=Math.min(24,slot-6);
  const peak=data.reduce((m,d,i)=>d.value>data[m].value?i:m,0);
  let bars='';
  data.forEach((d,i)=>{
    const h=d.value/maxV*plotH;const x=pL+i*slot+(slot-bw)/2;const y=pT+plotH-h;
    bars+=`<rect class="viz-col ${i===peak&&d.value?'peak':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="3" data-l="${d.label}" data-v="${d.value}"><title>${d.label}: ${d.value} pts</title></rect>`;
    bars+=`<text class="viz-axis-txt" x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.label}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bars}</svg>`;
}

function hbar(name,val,max,unit){
  const pct=Math.max(2,Math.min(100,val/max*100));
  return `<div class="hbar-row">
    <span class="hbar-name" title="${esc(String(name))}">${esc(String(name))}</span>
    <span class="hbar-track"><span class="hbar-fill" style="width:${pct}%"></span></span>
    <span class="hbar-val">${val}${unit||''}</span>
  </div>`;
}

// round a raw step up to 1/2/5 × 10^n
function niceStep(raw){
  if(raw<=0)return 1;
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=norm<=1?1:norm<=2?2:norm<=5?5:10;
  return step*mag;
}

// Attach crosshair hover to any area charts on screen
function wireStatCharts(){
  Object.keys(_statCharts).forEach(id=>{
    const svg=document.getElementById(id);const hit=document.getElementById(id+'_hit');
    if(!svg||!hit)return;
    const c=_statCharts[id];
    const cross=document.getElementById(id+'_cross');
    const hdot=document.getElementById(id+'_hdot');
    const tip=document.getElementById(id+'_tip');
    const move=e=>{
      const rect=svg.getBoundingClientRect();
      const clientX=(e.touches?e.touches[0].clientX:e.clientX);
      const vbX=(clientX-rect.left)/rect.width*c.W;
      let idx=Math.round((vbX-c.pL)/(c.stepX||1));
      idx=Math.max(0,Math.min(c.n-1,idx));
      const p=c.series[idx];const[px,py]=c.xy[idx];
      cross.setAttribute('x1',px);cross.setAttribute('x2',px);cross.style.opacity='1';
      hdot.setAttribute('cx',px);hdot.setAttribute('cy',py);hdot.style.opacity='1';
      tip.style.opacity='1';
      tip.style.left=(px/c.W*rect.width)+'px';
      tip.style.top=((py/c.H*rect.height)-10)+'px';
      tip.innerHTML=`<div class="tip-v">${p.value} pts</div><div class="tip-l">${p.count} task${p.count===1?'':'s'} · ${p.label}</div>`;
    };
    const leave=()=>{cross.style.opacity='0';hdot.style.opacity='0';tip.style.opacity='0'};
    hit.addEventListener('pointermove',move);
    hit.addEventListener('pointerleave',leave);
    hit.addEventListener('touchmove',move,{passive:true});
    hit.addEventListener('touchend',leave);
  });
}

function fmtMinsShort(m){
  m=Math.max(0,Math.round(m||0));
  if(m>=60){const h=Math.floor(m/60),r=m%60;return h+'h'+(r?' '+r+'m':'')}
  return m+'m';
}

    .sort((a,b)=>{
      if(wastedSort==='biggest')return b.mins-a.mins;

      return (b.createdAt||'').localeCompare(a.createdAt||''); // recent (default)

              ${['work','project','rfi','personal',''].map(c=>`<option value="${c}" ${e.category===c?'selected':''}>${c||'Other'}</option>`).join('')}
            </select>
            <input type="date" value="${e.date||''}" onchange="updateWasted('${e.id}','date',this.value)" style="background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:6px 10px;color:var(--text);font-size:11px;color-scheme:dark">
          </div>
        </div>`:''}
      </div>`;
    }).join('');
  }

  el.innerHTML=html;
}

function setWastedSort(s){ wastedSort=s; renderWasted(); }
function toggleWastedExpand(id){ wastedExpanded=wastedExpanded===id?null:id; renderWasted(); }

function addWasted(){
  const title=(document.getElementById('wAddTitle').value||'').trim();
  const desc=(document.getElementById('wAddDesc').value||'').trim();
  const mins=parseFloat(document.getElementById('wAddMins').value)||0;
  const cat=document.getElementById('wAddCat').value;
  const date=document.getElementById('wAddDate').value||new Date().toISOString().slice(0,10);
  if(!title && !desc){
    const el=document.getElementById('wAddTitle');if(el){el.style.borderColor='#ef4444';setTimeout(()=>el.style.borderColor='',1200)}
    return;
  }
  fbPush('todo/wasted',{
    title, description:desc, mins, category:cat, date,
    createdAt:new Date().toISOString()
  });
  document.getElementById('wAddTitle').value='';
  document.getElementById('wAddDesc').value='';
  document.getElementById('wAddMins').value='';
  // keep cat/date for rapid-fire entry
}

function updateWasted(id,field,value){
  if(!wastedLog[id])return;
  fbSet(`todo/wasted/${id}/${field}`,value);
}

function deleteWasted(id){
  if(!confirm('Delete this entry?'))return;
  fbSet(`todo/wasted/${id}`,null);
  if(wastedExpanded===id)wastedExpanded=null;
}

// Init
const savedTheme=localStorage.getItem('oyt_theme')||'';
setTheme(savedTheme);
if(initFB())attachListeners();
renderTasks();
paintStars(document.getElementById('qaStars'),newDiff);
</script>
</body>
</html>
