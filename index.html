.tm-field-val{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;text-transform:capitalize;min-width:0}
.tm-field-val .t-proj{text-transform:none}
.tm-status{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:20px;border:1px solid var(--card-border)}
.tm-status.active{color:var(--accent1);border-color:var(--accent1)}
.tm-status.done{color:#34d399;border-color:#34d399}
.tm-status.od{color:var(--red);border-color:var(--red)}
.tm-od{color:var(--red);font-size:10px;font-weight:800;text-transform:uppercase}
.tm-modal-prog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tm-prog-val{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent1)}
.tm-modal-btn.danger{flex:0 0 auto;color:var(--text-muted)}
.tm-modal-btn.danger:hover{color:var(--red);border-color:var(--red);background:rgba(248,113,113,0.06)}
.tm-modal-section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin:18px 0 8px}
/* Task modal — edit mode (full card form) */
.tm-edit-title{width:100%;font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--text);background:transparent;border:none;border-bottom:1px dashed transparent;padding:4px 0;padding-right:12px}
.tm-edit-title:hover,.tm-edit-title:focus{border-bottom-color:var(--card-border);outline:none}
.tm-edit{display:flex;flex-direction:column;gap:14px;margin:16px 0 4px}
.tm-edit-field{display:flex;flex-direction:column;gap:6px}
.tm-edit-field.wide{width:100%}
.tm-edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 16px}
.tm-edit-notes{width:100%;min-height:80px;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:12px;padding:11px 13px;color:var(--text-body);font-size:14px;line-height:1.55;font-family:inherit;resize:vertical}
.tm-edit-notes:focus{outline:none;border-color:var(--accent1)}
.tm-edit-field select,.tm-edit-field input[type="time"],.tm-edit-field input[type="text"]{background:var(--panel-2,rgba(0,0,0,0.3));color:var(--text);border:1px solid var(--card-border);border-radius:10px;padding:8px 10px;font-size:12px;font-family:inherit;width:100%}
.tm-edit-field select:focus,.tm-edit-field input:focus{outline:none;border-color:var(--accent1)}
.tm-edit-field .qa-stars{padding:2px 0}
.tm-edit-field input[type="range"]{width:100%}
.seg{display:inline-flex;gap:3px;background:var(--panel-2,rgba(0,0,0,0.25));border:1px solid var(--card-border);border-radius:10px;padding:3px}
.seg-btn{flex:1;background:transparent;border:none;color:var(--text-muted);font-size:11px;font-weight:700;text-transform:capitalize;padding:5px 8px;border-radius:7px;cursor:pointer;transition:all .15s var(--ease);font-family:inherit}
.seg-btn:hover{color:var(--text-body)}
.seg-btn.on{background:var(--accent1-10);color:var(--accent1)}
.tm-modal-notes{background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:var(--text-body);white-space:pre-wrap;word-break:break-word}
.tm-modal-notes a{color:var(--accent1);text-decoration:underline;word-break:break-all}
.tm-modal-notes-empty{background:rgba(255,255,255,0.02);border:1px dashed var(--card-border);border-radius:14px;padding:24px 16px;text-align:center;font-size:12px;color:var(--text-muted)}
.tm-modal-prog{margin-top:14px}
.tm-modal-prog-bar{height:8px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden}
.tm-modal-prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent1),var(--accent2))}
.tm-modal-foot{display:flex;gap:10px;margin-top:20px}
.tm-modal-btn{flex:1;padding:11px 16px;border-radius:12px;border:1px solid var(--card-border);background:rgba(255,255,255,0.04);color:var(--text);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tm-modal-btn:hover{border-color:var(--card-hover);background:rgba(255,255,255,0.07);transform:translateY(-1px)}
.tm-modal-btn.primary{background:linear-gradient(135deg,var(--accent1),var(--accent2));border-color:transparent;color:#fff}
.tm-modal-btn.primary:hover{box-shadow:0 6px 20px var(--accent1-10)}
/* View toggle (List ↔ Chart) */
.day-view-toggle{display:inline-flex;background:rgba(255,255,255,0.04);border:1px solid var(--card-border);border-radius:10px;padding:3px;margin-bottom:14px;gap:2px}
.day-view-toggle button{padding:5px 14px;border-radius:7px;border:none;background:transparent;color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;font-family:inherit;transition:all .2s var(--ease);display:inline-flex;align-items:center;gap:4px}
.day-view-toggle button.active{background:var(--accent1-10);color:var(--accent1);box-shadow:0 0 12px var(--accent1-10)}
.day-view-toggle button:hover:not(.active){color:var(--text-body)}
/* Chart blocks */
.day-charts{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.day-chart-row{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
@media(max-width:520px){.day-chart-row{grid-template-columns:1fr}}
.day-chart-card{background:rgba(255,255,255,0.025);border:1px solid var(--card-border);border-radius:14px;padding:14px;position:relative}
.day-chart-card .chart-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent1);margin-bottom:8px}
.day-chart-empty{text-align:center;font-size:11px;color:var(--text-muted);font-style:italic;padding:18px 0}
/* Donut */
.donut-wrap{display:flex;align-items:center;gap:12px}
.donut-svg{width:104px;height:104px;flex-shrink:0}
.donut-center{font-size:22px;font-weight:900;fill:var(--text);text-anchor:middle;dominant-baseline:central}
.donut-center-label{font-size:7px;font-weight:700;fill:var(--text-muted);text-anchor:middle;text-transform:uppercase;letter-spacing:0.6px}
.donut-legend{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.donut-legend-item{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600}
.donut-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.donut-legend-name{flex:1;text-transform:capitalize;color:var(--text-body)}
.donut-legend-count{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
/* Difficulty stacked bar */
.diff-bar-wrap{display:flex;flex-direction:column;gap:10px}
.diff-bar-track{width:100%;height:30px;border-radius:8px;background:rgba(255,255,255,0.04);overflow:hidden;display:flex;border:1px solid var(--card-border)}
.diff-bar-seg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#000;transition:flex .4s var(--ease);min-width:0;overflow:hidden;white-space:nowrap}
.diff-bar-legend{display:flex;flex-wrap:wrap;gap:8px;font-size:9px}
.diff-bar-legend-item{display:flex;align-items:center;gap:4px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.diff-bar-legend-dot{width:8px;height:8px;border-radius:2px}
/* Hourly timeline */
.timeline-svg{width:100%;height:64px;display:block}
.timeline-axis{stroke:rgba(255,255,255,0.08);stroke-width:1}
.timeline-tick-label{font-size:7px;fill:var(--text-muted);font-weight:600;text-anchor:middle}
.timeline-dot{filter:drop-shadow(0 0 4px currentColor)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.cal-task{font-size:7px;font-weight:600;padding:2px 4px;border-radius:4px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-task.work{background:var(--cat-work-bg);color:var(--cat-work-fg)}
.cal-task.personal{background:var(--cat-pers-bg);color:var(--cat-pers-fg)}
.cal-task.project{background:var(--cat-proj-bg);color:var(--cat-proj-fg)}
.cal-task.done{opacity:.3;text-decoration:line-through}

/* Stats View */
.wasted-wrap{max-width:720px;margin:0 auto;padding:20px 20px 100px;position:relative;z-index:1}
.w-hero{background:linear-gradient(135deg,rgba(239,68,68,0.14),rgba(251,146,60,0.06));border:1px solid rgba(239,68,68,0.22);border-radius:18px;padding:22px 20px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.w-hero-big .l{font-size:9px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;color:#ef4444;margin-bottom:6px}
.w-hero-big .v{font-size:46px;font-weight:200;color:var(--text);letter-spacing:-0.04em;line-height:1}
.w-hero-big .s{font-size:11px;color:var(--text-muted);margin-top:4px}
.w-hero-side{display:flex;flex-direction:column;gap:6px;min-width:140px;text-align:right}
.w-hero-side .n{font-size:22px;font-weight:300;color:var(--text);line-height:1}
.w-hero-side .m{font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted)}
.w-add{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.w-add-title{font-size:10px;color:var(--text-muted);letter-spacing:0.6px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.w-add input[type="text"],.w-add textarea{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;width:100%;box-sizing:border-box}
.w-add input[type="text"]:focus,.w-add textarea:focus{outline:0;border-color:var(--accent1)}
.w-add textarea{resize:vertical;min-height:52px}
.w-add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.w-add-row .mins-wrap{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:4px 10px}
.w-add-row .mins-wrap input{background:transparent;border:0;color:var(--text);font-size:13px;width:60px;padding:5px 0}
.w-add-row .mins-wrap input:focus{outline:0}
.w-add-row .mins-wrap .u{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;font-weight:700}
.w-add-row select{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;cursor:pointer}
.w-add-btn{margin-left:auto;background:linear-gradient(135deg,var(--accent1),var(--accent2));border:0;border-radius:8px;color:#fff;font-weight:700;padding:10px 18px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:transform 0.1s ease,box-shadow 0.2s ease}
.w-add-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--accent1-10)}
.w-add-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
.w-filter{display:flex;gap:4px;margin-bottom:10px}
.w-filter button{background:var(--card);border:1px solid var(--card-border);color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;cursor:pointer;transition:all 0.15s}
.w-filter button.active{background:var(--accent1-10);color:var(--accent1);border-color:var(--card-hover)}
.w-entry{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:background 0.15s ease,border-color 0.15s ease}
.w-entry:hover{background:var(--card-hover);border-color:rgba(239,68,68,0.2)}
.w-entry-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.w-entry-title{font-size:13px;color:var(--text);font-weight:600}
.w-entry-desc{font-size:12px;color:var(--text-body);font-style:italic;margin-top:1px}
.w-entry-meta{font-size:10px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.w-entry-mins{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:700;color:#ef4444;white-space:nowrap}
.w-entry-mins .u{font-size:9px;color:var(--text-muted);letter-spacing:0.1em;margin-left:2px;font-weight:500;text-transform:uppercase}
.w-entry-actions{display:flex;gap:4px;margin-left:8px}
.w-entry-actions button{background:transparent;border:0;color:var(--text-muted);font-size:16px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px;transition:all 0.12s}
.w-entry-actions .edit:hover{color:var(--accent1);background:var(--accent1-10)}
.w-entry-actions .del:hover{color:#ef4444;background:rgba(239,68,68,0.1)}
.w-entry.expanded{background:rgba(139,92,246,0.04);border-color:var(--accent1)}
.w-entry.expanded .w-entry-title{color:var(--accent1)}
.w-edit{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid var(--card-border)}
.w-edit input,.w-edit textarea{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;font-family:inherit;width:100%;box-sizing:border-box}
.w-empty{text-align:center;padding:44px 20px;color:var(--text-muted)}
.w-empty .g{font-size:42px;opacity:0.35;margin-bottom:12px}
.w-empty .t{font-weight:700;color:var(--text);margin-bottom:6px;font-size:15px}
.w-empty .h{font-size:12px;max-width:340px;margin:0 auto;line-height:1.5}
/* ── Stats dashboard (bklit-style data-viz) ── */
.stats-wrap{max-width:min(1180px,95vw);margin:0 auto;padding:22px 28px 100px;position:relative;z-index:1;
  --viz:var(--accent1);--viz-soft:color-mix(in srgb,var(--accent1) 55%,var(--text-muted));
  --viz-grid:var(--card-border);--viz-axis:var(--text-muted);--viz-fill:var(--accent1-10);
  --good:#34d399;--bad:#f87171;--warn:#fbbf24}
.stats-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.stats-h2{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.01em}
.stats-sub{font-size:12px;color:var(--text-muted)}
.stats-sub b{color:var(--text-body);font-weight:700}
/* range filter row — one row above everything */
.viz-filters{display:flex;gap:6px;margin:14px 0 18px}
.viz-range-btn{padding:5px 13px;border-radius:9px;border:1px solid var(--card-border);background:transparent;color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .18s var(--ease);font-family:inherit}
.viz-range-btn:hover{color:var(--text-body);border-color:var(--card-hover)}
.viz-range-btn.on{background:var(--accent1-10);border-color:var(--accent1);color:var(--accent1)}
/* KPI tiles */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi-tile{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
.kpi-delta{font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:20px}
.kpi-delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.kpi-delta.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.kpi-delta.flat{color:var(--text-muted);background:transparent}
.kpi-val{font-size:30px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-0.02em}
.kpi-val .unit{font-size:13px;font-weight:600;color:var(--text-muted);margin-left:3px}
.kpi-spark{margin-top:2px}
.kpi-spark svg{display:block;width:100%;height:30px}
/* viz cards */
.viz-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:760px){.viz-grid2{grid-template-columns:1fr}}
.viz-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:16px 18px;position:relative;min-width:0}
.viz-card.full{grid-column:1/-1}
.viz-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.viz-card-title{font-size:12px;font-weight:700;color:var(--text-body);letter-spacing:.02em}
.viz-card-note{font-size:10px;color:var(--text-muted)}
.viz-card svg.chart{display:block;width:100%;height:auto;overflow:visible}
.viz-grid-line{stroke:var(--viz-grid);stroke-width:1}
.viz-axis-txt{fill:var(--viz-axis);font-size:9px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.viz-area{fill:var(--viz-fill)}
.viz-line{fill:none;stroke:var(--viz);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz-col{fill:var(--viz-soft);transition:fill .15s}
.viz-col.peak{fill:var(--viz)}
.viz-col:hover{fill:var(--viz)}
.viz-dot{fill:var(--viz);stroke:var(--card);stroke-width:2}
.viz-crosshair{stroke:var(--viz);stroke-width:1;stroke-dasharray:3 3;opacity:0;pointer-events:none}
.viz-hover-dot{fill:var(--viz);stroke:var(--card);stroke-width:2;opacity:0;pointer-events:none}
.viz-tip{position:absolute;pointer-events:none;background:var(--panel-2);border:1px solid var(--card-border);border-radius:9px;padding:7px 10px;font-size:11px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,0.4);opacity:0;transition:opacity .12s;transform:translate(-50%,-100%);white-space:nowrap;z-index:5}
.viz-tip .tip-v{font-weight:800;font-size:13px}
.viz-tip .tip-l{color:var(--text-muted);font-size:10px}
/* horizontal bars */
.hbar-row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;margin-bottom:9px}
.hbar-name{font-size:11px;color:var(--text-body);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hbar-track{height:8px;border-radius:20px;background:var(--card-border);overflow:hidden}
.hbar-fill{height:100%;border-radius:20px;background:var(--viz);transition:width .5s var(--ease)}
.hbar-val{font-size:11px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
/* deadline stacked bar */
.dl-bar{display:flex;height:12px;border-radius:20px;overflow:hidden;gap:2px;margin:4px 0 12px}
.dl-seg{height:100%}
.dl-seg.early{background:var(--good)}
.dl-seg.ontime{background:var(--accent1)}
.dl-seg.late{background:var(--bad)}
.dl-legend{display:flex;gap:16px;flex-wrap:wrap}
.dl-key{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-body)}
.dl-key .dot{width:9px;height:9px;border-radius:3px}
.dl-key b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.viz-empty{text-align:center;color:var(--text-muted);font-size:12px;padding:26px 0}
.snap-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.snap-chip{flex:1;min-width:120px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.snap-chip .v{font-size:18px;font-weight:800;color:var(--text);line-height:1}
.snap-chip .v.warn{color:var(--warn)}
.snap-chip .v.bad{color:var(--bad)}
.snap-chip .l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}

/* Sort bar */
.sort-bar{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.sort-label{font-size:8px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;margin-right:4px}
.sort-btn{padding:3px 10px;border-radius:10px;font-size:9px;font-weight:600;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.45);cursor:pointer;transition:all .15s}
.sort-btn:hover{color:rgba(255,255,255,0.4)}
/* Task rank number */
.t-rank{font-size:9px;font-weight:700;color:rgba(255,255,255,0.1);min-width:16px;text-align:center;flex-shrink:0;margin-top:4px}
/* Reorder arrows */
.reorder{display:flex;flex-direction:column;gap:1px;flex-shrink:0;opacity:0;transition:opacity .2s}
.tc:hover .reorder{opacity:1}
.ro-btn{width:18px;height:14px;border:none;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.2);cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:all .15s}
.ro-btn:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5)}
/* Drag reorder */
.tc[draggable="true"]{cursor:grab}
.tc[draggable="true"]:active{cursor:grabbing}
.tc.dragging{opacity:0.3;transform:scale(0.97)}
.tc.drag-over{border-top:2px solid var(--accent1);margin-top:-1px}

@media(max-width:768px){.main{padding:12px 10px 80px}}

/* ═══ Calendar Sort View ═══ */
.cal-sort-wrap{margin-top:4px;overflow:hidden}
.cal-sort-nav{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding:8px 14px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;justify-content:center}
.cal-sort-nav button{padding:5px 10px;border-radius:10px;font-size:10px;font-weight:700;border:1px solid var(--card-border);background:transparent;color:var(--text-body);cursor:pointer;transition:all .18s var(--ease);flex-shrink:0}
.cal-sort-nav button:hover{border-color:var(--accent1);color:var(--accent1);background:var(--accent1-06)}
.cal-sort-nav .cal-sort-label{font-size:11px;font-weight:800;color:var(--text);min-width:0;text-align:center;letter-spacing:.3px;white-space:nowrap}
.cal-sort-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cal-sort-col{min-height:90px;min-width:0;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:8px 5px;display:flex;flex-direction:column;gap:4px;transition:all .2s var(--ease);overflow:hidden}
.cal-sort-col:hover{border-color:var(--accent1);box-shadow:0 4px 20px rgba(0,0,0,0.25);transform:translateY(-2px)}
.cal-sort-col.today{border-color:var(--accent1);background:linear-gradient(180deg,var(--accent1-06),transparent);box-shadow:0 0 16px rgba(var(--accent1-rgb,120,80,255),0.12)}
.cal-sort-col.past{opacity:.6}
.cal-sort-col-head{text-align:center;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.04);margin-bottom:2px}
.cal-sort-col-head .cal-sort-day-name{font-size:8px;font-weight:700;text-transform:uppercase;color:var(--text-muted);letter-spacing:.8px;display:block}
.cal-sort-col-head .cal-sort-day-num{display:block;font-size:16px;font-weight:800;color:var(--text);margin-top:2px;line-height:1}
.cal-sort-col.today .cal-sort-col-head .cal-sort-day-name{color:var(--accent1)}
.cal-sort-col.today .cal-sort-col-head .cal-sort-day-num{background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cal-sort-col-count{font-size:7px;font-weight:600;color:var(--text-muted);text-align:center;margin-bottom:2px}
.cal-sort-task{display:flex;align-items:center;gap:4px;padding:4px 5px;border-radius:8px;background:rgba(255,255,255,0.02);border-left:2px solid transparent;cursor:pointer;transition:all .15s var(--ease);font-size:8px;color:var(--text-body);line-height:1.3;min-width:0}
.cal-sort-task:hover{background:rgba(255,255,255,0.06);transform:translateX(2px)}
.cal-sort-task.done{opacity:.3;text-decoration:line-through}
.cal-sort-task .cst-ck{width:12px;height:12px;border-radius:3px;border:1.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:7px;cursor:pointer;transition:all .15s}
.cal-sort-task .cst-ck.checked{background:var(--accent1);border-color:var(--accent1);color:#000}
.cal-sort-task .cst-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-sort-empty{font-size:8px;color:var(--text-muted);text-align:center;padding:12px 0;opacity:.4;font-style:italic}
.cal-sort-unscheduled{margin-top:14px;padding:12px;background:var(--card);border:1px solid var(--card-border);border-radius:14px}
.cal-sort-unscheduled h4{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;margin:0 0 8px 0;display:flex;align-items:center;gap:6px}
.cal-sort-unscheduled h4::before{content:'';width:12px;height:1px;background:var(--text-muted);opacity:.3}
.cal-sort-unscheduled .cal-sort-task{margin-bottom:3px}
@media(max-width:600px){
  .cal-sort-grid{grid-template-columns:1fr;gap:6px}
  .cal-sort-col{min-height:auto;flex-direction:column;padding:8px 10px}
  .cal-sort-col-head{text-align:left;display:flex;gap:8px;align-items:center;border-bottom:none;padding-bottom:0;margin-bottom:4px}
  .cal-sort-col-head .cal-sort-day-name{display:inline;font-size:9px}
  .cal-sort-col-head .cal-sort-day-num{display:inline;font-size:13px}
  .cal-sort-col.past:not(.today){display:none}
}

/* ═══ Control Bar (compact filter/sort) ═══ */
.control-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;position:relative}
.control-bar .search-input{flex:1;min-width:120px;padding:5px 10px 5px 28px;border-radius:10px;font-size:10px;background:var(--card);border:1px solid var(--card-border);color:var(--text);outline:none;transition:border-color .2s}
.control-bar .search-input:focus{border-color:var(--accent1)}
.control-bar .search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.4;pointer-events:none}
.ctrl-search-wrap{position:relative;flex:1;min-width:120px}
.ctrl-pill-wrap{position:relative}
.ctrl-pill{padding:4px 12px;border-radius:10px;font-size:9px;font-weight:600;border:1px solid var(--card-border);background:var(--card);color:var(--text-body);cursor:pointer;transition:all .18s var(--ease);white-space:nowrap;display:flex;align-items:center;gap:4px}
.ctrl-pill:hover{border-color:var(--accent1);color:var(--accent1)}
.ctrl-pill .ctrl-val{color:var(--accent1);font-weight:700}
.ctrl-pill .ctrl-chev{font-size:7px;opacity:.5;transition:transform .2s}
.ctrl-pill.open .ctrl-chev{transform:rotate(180deg)}
.ctrl-pop{position:absolute;top:100%;right:0;margin-top:4px;z-index:120;min-width:160px;padding:8px;border-radius:14px;background:rgba(18,18,28,0.92);border:1px solid var(--card-border);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 12px 40px rgba(0,0,0,0.6);display:none;flex-direction:column;gap:2px;animation:fadeIn .15s var(--ease)}
.ctrl-pop.open{display:flex}
.ctrl-pop-item{padding:6px 10px;border-radius:8px;font-size:10px;font-weight:500;color:var(--text-body);cursor:pointer;transition:all .12s;border:none;background:transparent;text-align:left;display:flex;align-items:center;gap:6px}
.ctrl-pop-item:hover{background:rgba(255,255,255,0.06)}
.ctrl-pop-item.active{color:var(--accent1);font-weight:700;background:var(--accent1-06)}
.ctrl-pop-item .pop-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ctrl-pop-divider{height:1px;background:rgba(255,255,255,0.06);margin:3px 0}
body.t-light .ctrl-pop{background:rgba(255,255,255,0.95);border-color:rgba(0,0,0,0.08)}
body.t-light .ctrl-pop-item:hover{background:rgba(0,0,0,0.04)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ═══ Command Center (collapsible dashboard) ═══ */
/* ── Command deck (Tasks-page stat strip) ── */
.cmd-strip{padding:16px 18px;background:linear-gradient(150deg,color-mix(in srgb,var(--accent1) 5%,var(--card)),var(--card));border:1px solid var(--card-border);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:1;min-width:0;position:relative;overflow:hidden}
.cmd-strip::before{content:'';position:absolute;top:-40%;right:-10%;width:280px;height:280px;background:radial-gradient(circle,var(--accent1-10),transparent 68%);pointer-events:none}
.tasks-top{display:flex;gap:14px;align-items:stretch;margin-bottom:14px}
@media (max-width:900px){.tasks-top{flex-direction:column}}
.cmd-metrics{width:100%;min-width:0;position:relative;z-index:1}
.deck{display:grid;grid-template-columns:auto minmax(210px,1.1fr) minmax(170px,1fr);grid-template-areas:'hero kpis spark' 'meters meters meters';gap:16px 22px;align-items:center}
@media (max-width:900px){.deck{grid-template-columns:auto 1fr;grid-template-areas:'hero kpis' 'spark spark' 'meters meters'}}
@media (max-width:560px){.deck{grid-template-columns:1fr;grid-template-areas:'hero' 'kpis' 'spark' 'meters'}}
/* hero ring */
.deck-hero{grid-area:hero;display:flex;align-items:center;gap:14px}
.deck-ring{width:96px;height:96px;position:relative;flex:none}
.deck-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.deck-ring .ring-bg{fill:none;stroke:var(--card-border);stroke-width:6}
.deck-ring .ring-fg{fill:none;stroke:url(#deckRingGrad);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.deck-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.deck-ring-pct{font-size:23px;font-weight:800;color:var(--text);letter-spacing:-0.03em;line-height:1}
.deck-ring-cap{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted)}
.deck-hero-side{display:flex;flex-direction:column;gap:8px}
.deck-hero-pts{font-size:11px;color:var(--text-muted)}
.deck-hero-pts b{color:var(--text-body);font-weight:700;font-family:var(--font-mono)}
/* KPI cells */
.deck-kpis{grid-area:kpis;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.deck-kpis{grid-template-columns:repeat(4,1fr)}}
.deck-kpi{position:relative;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:transform .2s var(--ease),border-color .2s var(--ease)}
.deck-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent1));opacity:.85}
.deck-kpi:hover{transform:translateY(-2px);border-color:var(--card-hover)}
.deck-kpi-val{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px}
.deck-kpi-val .ic{font-size:12px}
.deck-kpi-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-kpi.warn .deck-kpi-val{color:var(--red)}
.deck-kpi.warn .deck-kpi-val{color:var(--yellow)}
/* spark */
.deck-spark{grid-area:spark;display:flex;flex-direction:column;gap:5px;min-width:0}
.deck-spark-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.deck-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.deck-spark-head b{font-family:var(--font-mono);font-size:10px;color:var(--text-body);font-weight:700}
.deck-spark svg{display:block;width:100%;height:46px;overflow:visible}
.deck-spark-days{display:flex;justify-content:space-between;margin-top:1px}
.deck-spark-days span{font-family:var(--font-mono);font-size:8px;color:var(--text-muted);opacity:.6;flex:1;text-align:center}
.deck-spark-days span.today{color:var(--accent1);opacity:1;font-weight:700}
/* meters */
.deck-meters{grid-area:meters;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;padding-top:14px;border-top:1px solid var(--card-border)}
@media (max-width:560px){.deck-meters{grid-template-columns:1fr}}
.deck-meter-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.deck-meter-head b{font-family:var(--font-mono);font-size:10px;color:var(--text-body);font-weight:700}
.deck-meter{display:flex;height:9px;border-radius:20px;overflow:hidden;gap:2px}
.deck-meter-seg{height:100%;border-radius:2px;transition:flex .45s var(--ease)}
.deck-meter-empty{flex:1;background:var(--card-border);border-radius:20px}
.deck-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}
.deck-legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text-body)}
.deck-legend i{width:8px;height:8px;border-radius:2px;flex:none}
.deck-legend b{color:var(--text-muted);font-weight:600;font-family:var(--font-mono);font-size:9px}

/* ═══ Dashboard redesign (3 cards) ═══ */
.dash-v2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.dash-v2-card{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--card-border);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);position:relative;overflow:hidden;transition:all .2s var(--ease)}
.dash-v2-card:hover{border-color:var(--accent1);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.dash-v2-card .dv2-hero{font-size:28px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dash-v2-card .dv2-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-top:4px}
.dash-v2-card .dv2-sub{font-size:9px;color:var(--text-muted);margin-top:6px;line-height:1.4}
.dash-v2-card .dv2-sub b{color:var(--text-body);font-weight:700}
.dash-v2-bar{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:8px;overflow:hidden}
.dash-v2-bar-fill{height:100%;border-radius:2px;transition:width .4s var(--ease)}
.dash-v2-spark{display:flex;align-items:flex-end;gap:2px;height:20px;margin-top:8px}
.dash-v2-spark-bar{flex:1;border-radius:2px;background:var(--accent1);opacity:.5;transition:all .2s}
.dash-v2-spark-bar.today-bar{opacity:1;background:linear-gradient(to top,var(--accent1),var(--accent2))}
.dv2-overdue{color:var(--cat-work-fg,#ff6b6b)!important;font-weight:700!important}
.dv2-verdict{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;background:linear-gradient(135deg,var(--accent1),var(--accent3,var(--accent2)));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:4px}
@media(max-width:600px){.dash-v2{grid-template-columns:1fr}.cal-sort-grid{grid-template-columns:1fr}}
@media(max-width:768px){.dash-v2{grid-template-columns:1fr 1fr}}

/* ── More menu (tucked-away tabs) ── */
.more-menu{position:relative;display:inline-block}
.more-dropdown{display:none;position:absolute;top:100%;right:0;margin-top:8px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--card-border);border-radius:12px;padding:6px;flex-direction:column;gap:2px;width:130px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.35)}
.more-dropdown.show{display:flex}
.more-dropdown .tab-btn{width:100%;text-align:left;justify-content:flex-start}

/* ── Planner: shared ── */
.planner-subnav button.active{background:var(--accent1-10)!important;color:var(--accent1)!important;box-shadow:inset 0 0 0 1px var(--card-hover)!important}
.planner-add input[type="text"]#newGoalTitle{width:100%;background:transparent;border:none;font-size:15px;color:var(--text);outline:none;margin-bottom:12px}
.planner-add input[type="text"]#newGoalTitle::placeholder{color:rgba(168,164,184,0.4)}
.planner-date{background:var(--card);border:1px solid var(--card-border);border-radius:14px;color:var(--text-body);font-family:inherit;font-size:11px;padding:5px 10px;outline:none;color-scheme:dark}
body.t-light .planner-date{color-scheme:light}
.planner-date:focus{border-color:var(--accent1)}
.planner-empty{color:var(--text-muted);font-size:12px;font-style:italic;padding:8px 4px 16px;opacity:.7}
.planner-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--accent1-10);color:var(--accent1);letter-spacing:.02em}
.planner-chip.subtle{background:rgba(255,255,255,0.05);color:var(--text-muted)}
.planner-x{margin-left:auto;background:transparent;border:none;color:var(--text-muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px;border-radius:6px;transition:all .15s}
.planner-x:hover{color:var(--red,#ff4d6d);background:rgba(255,77,109,0.1)}
.planner-pct{font-size:11px;font-weight:800;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── Planner: goal bands + cards ── */
.planner-band{margin-bottom:22px}
.planner-band-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.planner-band-label{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.planner-band-sub{font-size:10px;color:var(--text-muted);letter-spacing:.04em}
.planner-band-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--text-muted);background:rgba(255,255,255,0.05);border-radius:100px;padding:2px 9px}
.planner-goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.planner-goal{position:relative;background:linear-gradient(135deg,var(--panel-1),var(--panel-2));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid transparent;background-clip:padding-box;border-radius:14px;padding:14px;transition:transform .35s var(--ease),box-shadow .55s var(--ease);animation:ti .35s var(--ease) both}
.planner-goal::before{content:'';position:absolute;inset:-1.5px;border-radius:14px;padding:1.5px;background:linear-gradient(135deg,var(--accent1),var(--accent3),var(--accent2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.30;transition:opacity .35s}

.planner-tl-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.planner-tl-kind{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--h-accent,var(--accent1))}
.planner-tl-kind.subtle{color:var(--text-muted)}
.planner-tl-mood{font-size:15px;line-height:1}
.planner-tl-time{margin-left:auto;font-size:10px;font-weight:700;color:var(--text-muted)}
.planner-tl-text{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
.planner-tl-text.muted{font-weight:400;color:var(--text-body)}
.planner-tl-sub{font-size:11px;color:var(--text-muted);margin-top:3px}
.planner-tl-sub strong{color:var(--text-body);font-weight:700}
@media(max-width:600px){.planner-stats{grid-template-columns:repeat(2,1fr)}}

/* ── Planner v2: goal card internals ── */
.planner-goal-main{flex:1;min-width:0}
.planner-goal-meta{margin-top:6px}
.planner-dots{display:flex;align-items:center;gap:5px;margin-top:9px}
.md-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.14);transition:all .3s var(--ease)}
.md-dot.done{background:var(--h-accent,var(--accent1));box-shadow:0 0 8px var(--h-accent,var(--accent1))}
.md-more{font-size:9px;font-weight:700;color:var(--text-muted);margin-left:2px}

/* ── Planner v2: journal dates ── */
.planner-datelbl{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.planner-day-group{margin-bottom:20px}
.planner-day-divider{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.planner-day-label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent1);white-space:nowrap}
.planner-day-line{flex:1;height:1px;background:linear-gradient(90deg,var(--card-hover),transparent)}
.planner-day-count{font-size:10px;color:var(--text-muted);white-space:nowrap}
.planner-entry{display:flex;gap:12px}
.planner-entry-stamp{flex:none;width:48px;text-align:center;align-self:flex-start;border-radius:10px;background:linear-gradient(160deg,var(--accent1-10),transparent);border:1px solid var(--card-border);padding:7px 0}
.pe-mon{display:block;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--accent1);text-transform:uppercase}
.pe-day{display:block;font-size:19px;font-weight:800;color:var(--text);line-height:1.05}
.planner-entry-body{flex:1;min-width:0}
.planner-entry-time{font-size:11px;font-weight:700;color:var(--text-muted)}
@media(max-width:600px){.planner-tl{padding-left:22px}.planner-tl-dot{left:-22px}.planner-tl-day .planner-day-divider{margin-left:-22px}}

/* ── Projects ── */
.proj-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.proj-h2{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.01em}
.proj-h2 .cn{font-size:11px;font-weight:600;color:var(--text-muted);margin-left:8px}
.proj-section{margin-bottom:26px}
.proj-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--card-border);cursor:pointer;user-select:none}
.proj-sec-head h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-body)}
.proj-sec-head .dc-chev{margin-left:auto;transition:transform .25s var(--ease);color:var(--text-muted)}
.proj-section.collapsed .dc-chev{transform:rotate(-90deg)}
.proj-section.collapsed .proj-grid{display:none}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.proj-card{display:flex;align-items:center;gap:14px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--card-border);border-left:3px solid var(--pc);border-radius:14px;padding:16px;cursor:pointer;transition:transform .25s var(--ease),border-color .25s var(--ease),box-shadow .3s var(--ease)}
.proj-card:hover{transform:translateY(-2px);border-color:var(--pc);box-shadow:0 10px 24px rgba(0,0,0,0.30)}
.proj-ring{position:relative;flex:none}
.proj-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.proj-ring .ring-bg{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:5}
.proj-ring .ring-fg{fill:none;stroke:var(--pc,var(--accent1));stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease)}
.proj-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--text)}
.proj-body{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-ico{margin-right:6px}
.proj-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.proj-status{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--card-border);color:var(--text-body)}
.proj-status.active{color:var(--pc,var(--accent1));border-color:var(--pc,var(--accent1))}
.proj-status.onhold{color:var(--yellow,#fbbf24);border-color:var(--yellow,#fbbf24)}
.proj-status.done{color:#34d399;border-color:#34d399}
.proj-counts{font-size:11px;color:var(--text-muted)}
.proj-od{color:var(--red,#f87171);font-weight:700}
.proj-target{font-size:11px;color:var(--text-muted);margin-top:5px}
.proj-target.late{color:var(--red,#f87171);font-weight:700}
/* legacy strip */
.proj-legacy{background:var(--card);border:1px solid var(--card-border);border-radius:12px;margin-bottom:18px;overflow:hidden}
.proj-legacy-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px;font-weight:600;color:var(--text-body);cursor:pointer;user-select:none}
.proj-legacy .proj-legacy-rows{display:none;padding:0 14px 12px}
.proj-legacy.open .proj-legacy-rows{display:block}
.proj-legacy-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--card-border)}
.proj-legacy-title{flex:1;font-size:12px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-legacy-row select{background:var(--panel-2,rgba(0,0,0,0.3));color:var(--text);border:1px solid var(--card-border);border-radius:8px;padding:4px 8px;font-size:11px}
/* detail */
.proj-back{background:none;border:none;color:var(--text-body);font-size:12px;font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:12px}
.proj-back:hover{color:var(--accent1)}
.proj-detail-head{display:flex;gap:20px;align-items:flex-start;background:var(--card);border:1px solid var(--card-border);border-left:3px solid var(--pc);border-radius:14px;padding:18px;margin-bottom:16px}
.proj-detail-info{flex:1;min-width:0}
.proj-detail-titlerow{display:flex;gap:8px;align-items:center}
.proj-icon-input{width:44px;text-align:center;font-size:18px;background:var(--panel-2,rgba(0,0,0,0.25));border:1px solid var(--card-border);border-radius:10px;padding:6px 2px;color:var(--text)}
.proj-name-input{flex:1;font-size:18px;font-weight:800;background:transparent;border:none;border-bottom:1px dashed transparent;color:var(--text);padding:6px 2px;letter-spacing:-0.01em}
.proj-name-input:hover,.proj-name-input:focus{border-bottom-color:var(--card-border);outline:none}
.proj-detail-ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.proj-detail-ctrls select{background:var(--panel-2,rgba(0,0,0,0.3));color:var(--text);border:1px solid var(--card-border);border-radius:8px;padding:5px 8px;font-size:11px}
.proj-swatches{display:inline-flex;gap:5px;align-items:center}
.proj-swatch{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.proj-swatch.sel{border-color:var(--text);transform:scale(1.15)}
.proj-target-lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted)}
.proj-target-lbl.late{color:var(--red,#f87171)}
.proj-target-lbl input{background:var(--panel-2,rgba(0,0,0,0.3));color:var(--text);border:1px solid var(--card-border);border-radius:8px;padding:4px 6px;font-size:11px}
.proj-del{margin-left:auto;background:none;border:1px solid var(--card-border);color:var(--text-muted);font-size:10px;font-weight:700;border-radius:8px;padding:4px 10px;cursor:pointer}
.proj-del:hover{color:var(--red,#f87171);border-color:var(--red,#f87171)}
.proj-desc{width:100%;margin-top:10px;background:var(--panel-2,rgba(0,0,0,0.2));border:1px solid var(--card-border);border-radius:10px;color:var(--text-body);font-size:12px;padding:8px 10px;min-height:38px;resize:vertical;font-family:inherit}
.proj-detail-stats{margin-top:8px;font-size:11px;color:var(--text-muted)}
.proj-scoped-add{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.proj-add-bar{display:flex;gap:8px}
.proj-scoped-add input[type="text"]{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:13px}
.proj-scoped-add input[type="text"]:focus{outline:none;border-color:var(--pc,var(--accent1))}
.proj-taskgrp{margin-bottom:20px}
.proj-taskgrp-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.proj-taskgrp-head h4{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-body)}
.proj-taskgrp.od .proj-taskgrp-head h4{color:var(--red,#f87171)}
.proj-taskgrp.donegrp{opacity:.7}
/* task-card project badge */
.t-proj{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:20px;border:1px solid var(--pc,var(--accent1));color:var(--pc,var(--accent1));cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .2s var(--ease)}
.t-proj:hover{background:rgba(255,255,255,0.06)}
/* new-project modal */
.proj-new-card{max-width:400px;padding:20px}
.proj-new-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px}
.proj-new-card input[type=text]{width:100%;background:var(--panel-2,rgba(0,0,0,0.25));border:1px solid var(--card-border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;margin-bottom:10px}
.proj-new-card input[type=text]:focus{outline:none;border-color:var(--accent1)}
.proj-new-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.proj-new-row #npIcon{width:56px;text-align:center;margin-bottom:0}
.proj-new-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
@media(max-width:600px){.proj-grid{grid-template-columns:1fr}.proj-detail-head{flex-direction:column;align-items:center}}

/* ── Smart quick-add ── */
.qa{padding:10px 14px}
.qa-bar{display:flex;align-items:center;gap:10px}
.qa-plus{font-size:16px;color:var(--text-muted);flex:none;line-height:1}
.qa .qa-bar input[type="text"]{flex:1;margin-bottom:0;font-size:14px}
.qa-add{margin-left:0;flex:none}
.qa-chev{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--card-border);background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;transition:transform .3s var(--ease),color .2s,border-color .2s;display:flex;align-items:center;justify-content:center}
.qa-chev:hover{color:var(--accent1);border-color:var(--accent1)}
.qa-chev.open{transform:rotate(180deg);color:var(--accent1);border-color:var(--accent1)}
/* always-visible quick controls: stars + due date */
.qa-quick{display:flex;align-items:center;gap:14px;margin-top:9px;flex-wrap:wrap}
.qa-stars{display:inline-flex;align-items:center;gap:2px}
.qa-star{background:none;border:none;padding:1px 2px;font-size:17px;line-height:1;cursor:pointer;color:var(--card-hover);transition:color .12s var(--ease),transform .12s var(--ease)}
.qa-star:hover{transform:scale(1.18)}
.qa-star.on{color:var(--yellow)}
.qa-quick .date-btn{margin-left:2px}
.qa-chips{display:none;flex-wrap:wrap;gap:6px;margin-top:8px}
.qa-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 6px 3px 10px;border-radius:20px;border:1px solid var(--card-hover);color:var(--text-body);background:var(--accent1-06)}
.qa-chip.pri{color:var(--accent1);border-color:var(--accent1)}
.qa-chip.proj,.qa-chip.projSel{color:var(--accent3);border-color:var(--accent3)}
.qa-chip.due{color:var(--accent2);border-color:var(--accent2)}
.qa-chip.diff{color:var(--yellow);border-color:var(--yellow)}
.qa-chip.notes{color:var(--text-body);border-color:var(--card-border);text-transform:none}
.qa-chip-x{background:none;border:none;color:inherit;opacity:.6;font-size:12px;cursor:pointer;padding:0 2px;line-height:1}
.qa-chip-x:hover{opacity:1}
.qa-panel{display:block;margin-top:12px;padding-top:12px;border-top:1px solid var(--card-border)}
.qa-panel[hidden]{display:none}
.qa-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qa-lbl{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.qa-proj-sel{background:var(--panel-2,rgba(0,0,0,0.3));color:var(--text);border:1px solid var(--card-border);border-radius:10px;padding:5px 8px;font-size:11px;max-width:180px}
</style>
</head>
<body>

<div class="bg-mesh"></div>
<!-- celebOverlay removed — see .tc.celebrating in <style> for the lean replacement -->

<nav class="header">
  <div class="header-inner">
    <span class="app-title" onclick="switchView('tasks');window.scrollTo({top:0,behavior:'smooth'})" style="cursor:pointer">openyap todo</span>
    <div style="display:flex;gap:3px;align-items:center">
      <button class="tab-btn active" onclick="switchView('tasks')">Tasks</button>
      <button class="tab-btn" onclick="openProjectId=null;switchView('projects')">Projects</button>
      <button class="tab-btn" onclick="switchView('planner')">Planner</button>
      <button class="tab-btn" onclick="switchView('calendar')">Calendar</button>
      <button class="tab-btn" onclick="switchView('stats')">Stats</button>
      <div class="more-menu">
        <button class="tab-btn" id="moreBtn" onclick="document.getElementById('moreDropdown').classList.toggle('show')">More ▾</button>
        <div class="more-dropdown" id="moreDropdown">
          <button class="tab-btn" onclick="switchView('rfi');document.getElementById('moreDropdown').classList.remove('show')">RFIs</button>
          <button class="tab-btn" onclick="switchView('wasted');document.getElementById('moreDropdown').classList.remove('show')">Wasted</button>
        </div>
      </div>
    </div>
    <div class="header-right">
      <span class="sync-label">synced</span>
      <span class="sync-dot"></span>
      <button class="tab-btn" id="motionToggle" onclick="toggleMotion()" title="Toggle ambient motion">⎯</button>
      <div class="theme-picker">
        <button class="tab-btn" onclick="document.getElementById('themeDots').classList.toggle('show')">Theme</button>
        <div class="theme-dots" id="themeDots">
          <div class="theme-dot active" onclick="setTheme('')" style="background:linear-gradient(135deg,#7c9cff,#0b0e14)" title="Slate">🤖</div>
          <div class="theme-dot" onclick="setTheme('t-ocean')" style="background:linear-gradient(135deg,#38bdf8,#0b0e14)" title="Ocean">🐋</div>
          <div class="theme-dot" onclick="setTheme('t-forest')" style="background:linear-gradient(135deg,#6ee7a0,#0b0e14)" title="Forest">🌱</div>
          <div class="theme-dot" onclick="setTheme('t-sunset')" style="background:linear-gradient(135deg,#fb923c,#0b0e14)" title="Sunset">🦊</div>
          <div class="theme-dot" onclick="setTheme('t-mono')" style="background:linear-gradient(135deg,#a8b2c0,#0b0e14)" title="Mono">🗿</div>
          <div class="theme-dot" onclick="setTheme('t-sakura')" style="background:linear-gradient(135deg,#f0a6c8,#0b0e14)" title="Sakura">🌸</div>
          <div class="theme-dot" onclick="setTheme('t-light')" style="background:linear-gradient(135deg,#f6f5fb,#c4b5fd);color:#7c3aed" title="Light">☀️</div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="main">
<!-- Tasks View -->
<div class="view active" id="v-tasks">
  <!-- Input -->
  <div class="input-card qa" id="quickAdd">
    <div class="qa-bar">
      <span class="qa-plus">＋</span>
      <input id="newTask" type="text" placeholder="Add a task…  !high  #project  fri  *hard  // notes" oninput="qaParse(this.value)" onkeydown="qaKeydown(event)" autocomplete="off">
      <button class="add-btn qa-add" onclick="addTask()">Add</button>
      <button class="qa-chev" id="qaChev" onclick="toggleQaPanel()" title="More options (⌘.)">⌄</button>
    </div>
    <div class="qa-quick">
      <div class="qa-stars" id="qaStars" title="Difficulty">
        <button class="qa-star" data-lv="1" onclick="setDiff('easy')" title="Easy">★</button>
        <button class="qa-star" data-lv="2" onclick="setDiff('medium')" title="Medium">★</button>
        <button class="qa-star" data-lv="3" onclick="setDiff('hard')" title="Hard">★</button>
        <button class="qa-star" data-lv="4" onclick="setDiff('epic')" title="Epic">★</button>
        <button class="qa-star" data-lv="5" onclick="setDiff('super_epic')" title="Super epic">★</button>
      </div>
      <span class="date-btn" id="dateBtnWrap" onclick="toggleDatePicker(event)">
        <span id="dateBtnLabel">Due date</span>
        <input type="hidden" id="newDue">
      </span>
    </div>
    <div class="qa-chips" id="qaChips"></div>
    <div class="qa-panel input-opts" id="qaPanel" hidden>
      <div class="qa-row">
        <span class="qa-lbl">Priority</span>
        <div class="opt-grp">
          <button class="ob" data-p="high" onclick="setPri('high')">High</button>
          <button class="ob s" data-p="medium" onclick="setPri('medium')">Med</button>
          <button class="ob" data-p="low" onclick="setPri('low')">Low</button>
        </div>
        <span class="qa-lbl">Category</span>
        <div class="opt-grp">
          <button class="ob s" data-c="work" onclick="setCat('work')">Work</button>
          <button class="ob" data-c="personal" onclick="setCat('personal')">Personal</button>
        </div>
      </div>
      <div class="qa-row">
        <span class="qa-lbl">Repeat</span>
        <div class="opt-grp">
          <button class="ob s" data-r="none" onclick="setRep('none')" title="No repeat">Once</button>
          <button class="ob" data-r="daily" onclick="setRep('daily')" title="Repeats every day">↻ Daily</button>
          <button class="ob" data-r="weekly" onclick="setRep('weekly')" title="Repeats every 7 days">↻ Weekly</button>
          <button class="ob" data-r="monthly" onclick="setRep('monthly')" title="Repeats every month">↻ Monthly</button>
        </div>
        <span class="qa-lbl">Project</span>
        <select id="newProject" class="qa-proj-sel" onchange="qaProject=this.value;qaRenderChips()"><option value="">No project</option></select>
        <span class="time-btn" id="timeBtnWrap" onclick="toggleTimePicker(event)">
          <span id="timeBtnLabel">Time</span>
          <input type="hidden" id="newTime">
        </span>
      </div>
      <div class="notes-row">
        <textarea id="newNotes" placeholder="Add notes..." rows="1"></textarea>
        <input id="newFrom" type="text" class="from-input" placeholder="From (who asked?)" list="fromSuggestions">
        <datalist id="fromSuggestions"></datalist>
      </div>
    </div>
  </div>

  <!-- Top strip: productivity metrics -->
  <div class="tasks-top">
    <div class="cmd-strip"><div class="cmd-metrics" id="cmdMetrics"></div></div>
  </div>

  <!-- Control Bar (search + filter pill + sort pill) -->
  <div class="control-bar" id="controlBar">
    <div class="ctrl-search-wrap">
      <span class="search-icon">🔎</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search tasks..." oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Escape'){this.value='';onSearchInput('')}">
    </div>
    <div class="ctrl-pill-wrap">
      <button class="ctrl-pill" id="filterPill" onclick="toggleFilterPop()">
        <span class="ctrl-val" id="filterPillLabel">All</span>
        <span class="ctrl-chev">▼</span>
      </button>
      <div class="ctrl-pop" id="filterPop"></div>
    </div>
    <div class="ctrl-pill-wrap">
      <button class="ctrl-pill" id="sortPill" onclick="toggleSortPop()">
        Sort: <span class="ctrl-val" id="sortPillLabel">Manual</span>
        <span class="ctrl-chev">▼</span>
      </button>
      <div class="ctrl-pop" id="sortPop"></div>
    </div>
    <button class="focus-btn" id="focusBtn" onclick="toggleFocus()" title="Hide far-out + low-priority clutter">◉ Focus</button>
  </div>

  <!-- Requester pill strip -->
  <div class="req-strip" id="reqStrip"></div>

  <!-- Task List -->
  <div class="task-list" id="taskList"></div>
  <div class="stats" id="stats"></div>
</div><!-- /tasks -->

<!-- Projects View -->
<div class="view" id="v-projects">
  <div id="projectsHost"></div>
</div><!-- /projects -->

<!-- Planner View -->
<div class="view" id="v-planner">
  <div class="rfi-subnav planner-subnav">
    <button id="planTabGoals" class="active" onclick="setPlannerView('goals')">Goals</button>
    <button id="planTabJournal" onclick="setPlannerView('journal')">Journal</button>

<script>
// ═══════════════════════════════════════════
//  Firebase
// ═══════════════════════════════════════════
const DB_URL='https://gen-lang-client-0119642855-default-rtdb.firebaseio.com';
let db=null;
function initFB(){try{if(!firebase.apps.length)firebase.initializeApp({databaseURL:DB_URL});db=firebase.database();return true}catch(e){console.error('Firebase:',e);return false}}
function fbSet(p,d){if(db)return db.ref(p).set(d)}
function fbPush(p,d){if(db)return db.ref(p).push(d)}
function fbGet(p){if(db)return db.ref(p).once('value').then(s=>s.val());return Promise.resolve(null)}
function fbListen(p,cb){if(db)db.ref(p).on('value',s=>cb(s.val()))}

// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
let tasks={},taskHistory={},wastedLog={},expanded=null,wastedExpanded=null,wastedSort='recent',fStatus='all',fCat='all',fFrom='all',fProject='all',newCat='work',newPri='medium',newDiff='medium',newRep='none',sortBy='manual',searchQuery='';
let projects={},openProjectId=null;
// Entrance animations play ONLY for user-initiated re-renders (view switch,
// filter/sort/search, initial load) — Firebase listener re-renders never
// animate, otherwise every remote write would flicker the whole board.
let listAnimPending=true;
let plannerGoals={},plannerJournal={},plannerSubView='goals',planGoalHorizon='year',planMood='',planTags=[],planJournalTagFilter='all',planTLFilter='all',planExpandedGoal=null,planEditEntry=null;
let focusOn=(localStorage.getItem('oyt_focus')||'1')==='1';
let dayView=localStorage.getItem('oyt_day_view')||'chart';
let calSortWeekOffset=0;
// cmdExpanded removed — Sisyphus collapse mechanism deleted; cmd-metrics is now a flat strip
function setDayView(v,dateStr){dayView=v;localStorage.setItem('oyt_day_view',v);openDayModal(dateStr)}
// Difficulty point weights (used in dashboard + celebration intensity)
const DIFF_WEIGHTS={easy:1,medium:2,hard:4,epic:8,super_epic:16};

function attachListeners(){
  fbListen('todo/tasks',val=>{tasks=val||{};renderTasks();if(currentView==='calendar')renderCalendar();if(currentView==='rfi')renderRFI();if(currentView==='projects')renderProjects()});
  fbListen('todo/projects',val=>{projects=val||{};if(currentView==='projects')renderProjects();renderTasks()});
  fbListen('todo/history',val=>{taskHistory=val||{};renderDashV2();renderCmdMetrics()});
  fbListen('todo/wasted',val=>{wastedLog=val||{};if(currentView==='wasted')renderWasted()});
  fbListen('todo/planner/goals',val=>{plannerGoals=val||{};plannerRefresh()});
  fbListen('todo/planner/journal',val=>{plannerJournal=val||{};plannerRefresh()});
}

// ═══════════════════════════════════════════
//  CRUD
// ═══════════════════════════════════════════
// Single factory for task objects — every creation path goes through here
// so new fields (e.g. projectId) exist on all tasks from day one.
function buildTask(o={}){return{
  title:'',priority:'medium',category:'work',difficulty:'medium',
  progress:0,dueDate:'',dueTime:'',repeat:'none',notes:'',from:'',projectId:'',
  completed:false,completedAt:'',
  createdAt:new Date().toISOString(),order:Date.now(),...o}}
function createTask(o){return fbPush('todo/tasks',buildTask(o))}
// History snapshot fields shared by all completion loggers
function historyProjectFields(t){return{projectId:t.projectId||'',projectName:(typeof projects==='object'&&projects[t.projectId]?.name)||''}}

// ═══════════════════════════════════════════
//  Projects — long-running efforts holding many tasks.
//  Progress is computed from member tasks (difficulty-weighted,
//  partial credit from task progress), never stored.
// ═══════════════════════════════════════════
const PROJECT_COLORS=['#7c9cff','#5ec2d6','#9d8cff','#34d399','#fbbf24','#fb923c','#f472b6','#94a3b8'];
const PROJECT_STATUS_LABELS={active:'Active',onhold:'On hold',done:'Done',archived:'Archived'};
function createProject(f={}){return fbPush('todo/projects',{
  name:'',color:PROJECT_COLORS[0],icon:'',status:'active',description:'',targetDate:'',
  createdAt:new Date().toISOString(),order:Date.now(),...f})}
function updateProject(id,f,v){fbSet(`todo/projects/${id}/${f}`,v)}
function setProjectStatus(id,s){updateProject(id,'status',s)}
// Delete the project but keep (and unassign) its tasks
function deleteProjectKeepTasks(id){
  const p=projects[id];
  if(!confirm(`Delete project "${p?.name||'Untitled'}"? Its tasks are kept and unassigned.`))return;
  const upd={};
  Object.entries(tasks).forEach(([tid,t])=>{if(t.projectId===id)upd[`${tid}/projectId`]=''});
  const fin=()=>{if(openProjectId===id)openProjectId=null;fbSet(`todo/projects/${id}`,null)};
  if(Object.keys(upd).length&&db)db.ref('todo/tasks').update(upd).then(fin);else fin();
}
function projectStats(id){
  let totalPts=0,donePts=0,active=0,done=0,overdue=0;
  const today=new Date().toISOString().slice(0,10);
  Object.values(tasks).forEach(t=>{
    if((t.projectId||'')!==id)return;
    const w=DIFF_WEIGHTS[t.difficulty||'medium']||2;
    totalPts+=w;
    if(t.completed){donePts+=w;done++}
    else{
      active++;
      if(t.dueDate&&t.dueDate<today)overdue++;
      donePts+=w*(Math.max(0,Math.min(100,parseFloat(t.progress)||0))/100);
    }
  });
  return{totalPts,donePts,active,done,overdue,pct:totalPts?Math.round(donePts/totalPts*100):0};
}
function openProjectView(id){openProjectId=id;switchView('projects')}
// SVG progress ring shared by cards + detail header. r=26 → C≈163.36
const PROJ_RING_C=2*Math.PI*26;
function projectRing(pct,size){
  const off=PROJ_RING_C*(1-Math.max(0,Math.min(100,pct))/100);
  return `<div class="proj-ring" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/>
    <circle class="ring-fg" cx="30" cy="30" r="26" stroke-dasharray="${PROJ_RING_C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" data-pct="${pct}"/></svg>
    <span class="proj-pct">${pct}%</span></div>`;
}
function projectCardHTML(id,p){
  const s=projectStats(id);
  const today=new Date().toISOString().slice(0,10);
  const late=p.targetDate&&p.targetDate<today&&p.status==='active';
  return `<div class="proj-card" data-pid="${id}" style="--pc:${p.color||'#7c9cff'}" onclick="openProjectView('${id}')">
    ${projectRing(s.pct,64)}
    <div class="proj-body">
      <div class="proj-name">${p.icon?`<span class="proj-ico">${p.icon}</span>`:''}${esc(p.name||'Untitled')}</div>
      <div class="proj-meta">
        <span class="proj-status ${p.status}">${PROJECT_STATUS_LABELS[p.status]||p.status}</span>
        <span class="proj-counts">${s.active} active · ${s.done} done${s.overdue?` · <span class="proj-od">${s.overdue} overdue</span>`:''}</span>
      </div>
      ${p.targetDate?`<div class="proj-target ${late?'late':''}">🎯 ${p.targetDate}${late?' — past target':''}</div>`:''}
    </div>
  </div>`;
}
function renderProjects(){
  const host=document.getElementById('projectsHost');
  if(!host)return;
  if(openProjectId){
    if(projects[openProjectId]){
      host.innerHTML=renderProjectDetail(openProjectId);
      paintStars(document.getElementById('projStars'),projAddDiff);
      updateProjDateBtn('');
      return;
    }
    openProjectId=null;
  }
  const entries=Object.entries(projects).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const grp={active:[],onhold:[],closed:[]};
  entries.forEach(([id,p])=>{
    if(p.status==='onhold')grp.onhold.push([id,p]);
    else if(p.status==='done'||p.status==='archived')grp.closed.push([id,p]);
    else grp.active.push([id,p]);
  });
  const section=(title,arr,collapsed)=>arr.length?`<div class="proj-section ${collapsed?'collapsed':''}">
    <div class="proj-sec-head" onclick="this.parentElement.classList.toggle('collapsed')"><h3>${title}</h3><span class="kc-count">${arr.length}</span><span class="dc-chev">&#9662;</span></div>
    <div class="proj-grid">${arr.map(([id,p])=>projectCardHTML(id,p)).join('')}</div>
  </div>`:'';
  host.innerHTML=`
    <div class="proj-header">
      <h2 class="proj-h2">Projects<span class="cn">项目</span></h2>
      <button class="add-btn" onclick="openNewProjectModal()">＋ New Project</button>
    </div>
    ${entries.length?`${section('Active',grp.active,false)}${section('On hold',grp.onhold,false)}${section('Done & archived',grp.closed,true)}`
      :`<div class="empty-state"><div class="empty-mascot">🗂️</div><div class="empty-bubble">No projects yet — create one for long-running work like escalator coordination</div></div>`}
  `;
  animateRings(host);
}
function renderProjectDetail(id){
  const p=projects[id];
  const s=projectStats(id);
  const today=new Date().toISOString().slice(0,10);
  const members=Object.entries(tasks).filter(([,t])=>(t.projectId||'')===id);
  const priRank={high:0,medium:1,low:2};
  const activeSort=(a,b)=>((priRank[a[1].priority||'medium']-priRank[b[1].priority||'medium'])||((a[1].dueDate||'9999')<(b[1].dueDate||'9999')?-1:1));
  const overdue=members.filter(([,t])=>!t.completed&&t.dueDate&&t.dueDate<today).sort(activeSort);
  const active=members.filter(([,t])=>!t.completed&&!(t.dueDate&&t.dueDate<today)).sort(activeSort);
  const done=members.filter(([,t])=>t.completed).sort((a,b)=>(b[1].completedAt||'')<(a[1].completedAt||'')?-1:1);
  const cardOpts={drag:false,rank:false,showProject:false};
  const grpHTML=(cls,title,arr)=>arr.length?`<div class="proj-taskgrp ${cls}">
    <div class="proj-taskgrp-head"><h4>${title}</h4><span class="kc-count">${arr.length}</span></div>
    <div class="task-list">${arr.map(([tid,t],i)=>renderTaskCard(tid,t,i,cardOpts)).join('')}</div>
  </div>`:'';
  const late=p.targetDate&&p.targetDate<today&&p.status==='active';
  return `<div class="proj-detail" style="--pc:${p.color||'#7c9cff'}">
    <button class="proj-back" onclick="openProjectId=null;renderProjects()">← All projects</button>
    <div class="proj-detail-head">
      ${projectRing(s.pct,88)}
      <div class="proj-detail-info">
        <div class="proj-detail-titlerow">
          <input class="proj-icon-input" maxlength="4" value="${esc(p.icon||'')}" placeholder="🗂" onchange="updateProject('${id}','icon',this.value.trim())" title="Icon (emoji)">
          <input class="proj-name-input" value="${esc(p.name||'')}" placeholder="Project name" onblur="updateProject('${id}','name',this.value.trim())" onkeydown="if(event.key==='Enter')this.blur()">
        </div>
        <div class="proj-detail-ctrls">
          <select onchange="setProjectStatus('${id}',this.value)">${Object.entries(PROJECT_STATUS_LABELS).map(([k,l])=>`<option value="${k}" ${p.status===k?'selected':''}>${l}</option>`).join('')}</select>
          <span class="proj-swatches">${PROJECT_COLORS.map(c=>`<button class="proj-swatch ${p.color===c?'sel':''}" style="background:${c}" onclick="updateProject('${id}','color','${c}')"></button>`).join('')}</span>
          <label class="proj-target-lbl ${late?'late':''}">Target <input type="date" value="${esc(p.targetDate||'')}" onchange="updateProject('${id}','targetDate',this.value)"></label>
          <button class="proj-del" onclick="deleteProjectKeepTasks('${id}')" title="Delete project, keep tasks">Delete</button>
        </div>
        <textarea class="proj-desc" placeholder="Description / scope notes…" onblur="updateProject('${id}','description',this.value)">${esc(p.description||'')}</textarea>
        <div class="proj-detail-stats">${s.active} active · ${s.done} done${s.overdue?` · <span class="proj-od">${s.overdue} overdue</span>`:''} · ${Math.round(s.donePts)}/${s.totalPts} pts</div>
      </div>
    </div>
    <div class="proj-scoped-add">
      <div class="proj-add-bar">
        <input id="projScopedAdd" type="text" placeholder="Add a task to this project…" onkeydown="if(event.key==='Enter')projScopedAddTask('${id}')">
        <button class="add-btn" onclick="projScopedAddTask('${id}')">Add</button>
      </div>
      <div class="qa-quick">
        <div class="qa-stars" id="projStars" title="Difficulty">
          <button class="qa-star" data-lv="1" onclick="setProjDiff('easy')" title="Easy">★</button>
          <button class="qa-star" data-lv="2" onclick="setProjDiff('medium')" title="Medium">★</button>
          <button class="qa-star" data-lv="3" onclick="setProjDiff('hard')" title="Hard">★</button>
          <button class="qa-star" data-lv="4" onclick="setProjDiff('epic')" title="Epic">★</button>
          <button class="qa-star" data-lv="5" onclick="setProjDiff('super_epic')" title="Super epic">★</button>
        </div>
        <span class="date-btn" id="projDateBtn" onclick="toggleDatePicker(event,{dueId:'projScopedDue',wrapId:'projDateBtn',after:updateProjDateBtn})">
          <span id="projDateLabel">Due date</span>
          <input type="hidden" id="projScopedDue">
        </span>
      </div>
    </div>
    ${grpHTML('od','Overdue',overdue)}
    ${grpHTML('','Active',active)}
    ${members.length?'':'<div class="kc-empty">No tasks yet — add one above, or use #'+esc((p.name||'').toLowerCase().split(/\s+/).join('-'))+' in the quick-add</div>'}
    ${grpHTML('donegrp','Done',done)}
  </div>`;
}
let projAddDiff='medium';
function setProjDiff(d){projAddDiff=d;paintStars(document.getElementById('projStars'),d)}
function updateProjDateBtn(v){
  const wrap=document.getElementById('projDateBtn'),label=document.getElementById('projDateLabel');
  if(!wrap||!label)return;
  const val=v!==undefined?v:(document.getElementById('projScopedDue')||{}).value||'';
  if(val){
    wrap.classList.add('has-date');
    const today=new Date().toISOString().slice(0,10);
    const tmr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)})();
    label.textContent=val===today?'Today':val===tmr?'Tomorrow':new Date(val+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }else{wrap.classList.remove('has-date');label.textContent='Due date'}
}
function projScopedAddTask(pid){
  const inp=document.getElementById('projScopedAdd');
  if(!inp)return;
  const title=inp.value.trim();if(!title)return;
  const due=(document.getElementById('projScopedDue')||{}).value||'';
  createTask({title,projectId:pid,difficulty:projAddDiff,dueDate:due});
  inp.value='';projAddDiff='medium';
  paintStars(document.getElementById('projStars'),'medium');
  updateProjDateBtn('');
  const dueEl=document.getElementById('projScopedDue');if(dueEl)dueEl.value='';
  inp.focus();
}
function openNewProjectModal(){
  closeNewProjectModal();
  const html=`<div class="day-modal" id="newProjModal" onclick="if(event.target===this)closeNewProjectModal()">
    <div class="day-modal-card proj-new-card">
      <h3 class="proj-new-title">New Project</h3>
      <input id="npName" type="text" placeholder="Project name (e.g. Escalator coordination)" onkeydown="if(event.key==='Enter')submitNewProject()">
      <div class="proj-new-row">
        <input id="npIcon" type="text" maxlength="4" placeholder="🛗" title="Icon (emoji, optional)">
        <span class="proj-swatches" id="npSwatches">${PROJECT_COLORS.map((c,i)=>`<button class="proj-swatch ${i===0?'sel':''}" style="background:${c}" data-c="${c}" onclick="document.querySelectorAll('#npSwatches .proj-swatch').forEach(b=>b.classList.toggle('sel',b===this))"></button>`).join('')}</span>
      </div>
      <div class="proj-new-row"><label class="proj-target-lbl">Target date <input id="npTarget" type="date"></label></div>
      <div class="proj-new-actions">
        <button class="ob" onclick="closeNewProjectModal()">Cancel</button>
        <button class="add-btn" onclick="submitNewProject()">Create</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  fxModalIn(document.querySelector('#newProjModal .day-modal-card'));
  setTimeout(()=>document.getElementById('npName')?.focus(),60);
}
function closeNewProjectModal(){document.getElementById('newProjModal')?.remove()}
function submitNewProject(){
  const name=(document.getElementById('npName')?.value||'').trim();
  if(!name)return;
  const color=document.querySelector('#npSwatches .proj-swatch.sel')?.dataset.c||PROJECT_COLORS[0];
  const icon=(document.getElementById('npIcon')?.value||'').trim();
  const target=document.getElementById('npTarget')?.value||'';
  const ref=createProject({name,color,icon,targetDate:target});
  closeNewProjectModal();
  if(ref&&ref.key)openProjectId=ref.key; // listener re-renders into detail view
}
// Animate progress rings from their previously-seen value so completing a
// task visibly sweeps the ring instead of snapping.
const _lastRingPct=new Map();
function animateRings(root){
  root.querySelectorAll('.ring-fg').forEach(c=>{
    const el=c.closest('[data-pid]');
    const key=el?.dataset.pid||('detail:'+openProjectId);
    const next=parseFloat(c.dataset.pct)||0;
    const prev=_lastRingPct.has(key)?_lastRingPct.get(key):0;
    _lastRingPct.set(key,next);
    if(prev===next||!fxOn())return;
    const offFor=p=>PROJ_RING_C*(1-Math.max(0,Math.min(100,p))/100);
    c.setAttribute('stroke-dashoffset',offFor(prev));
    fx(c,{strokeDashoffset:[offFor(prev),offFor(next)],duration:700,ease:'inOut(2)'});
  });
}
function setCat(c){
  newCat=c;
  document.querySelectorAll('.input-opts .ob[data-c]').forEach(b=>b.classList.toggle('s',b.dataset.c===c));
}
function setPri(p){
  newPri=p;
  document.querySelectorAll('.input-opts .ob[data-p]').forEach(b=>b.classList.toggle('s',b.dataset.p===p));
}
const DIFF_ORDER=['easy','medium','hard','epic','super_epic'];
// Fill a star row up to (and including) the star matching difficulty d
function paintStars(container,d){
  if(!container)return;
  const idx=DIFF_ORDER.indexOf(d);
  container.querySelectorAll('.qa-star').forEach((s,i)=>s.classList.toggle('on',i<=idx));
}

// Highlight matched substring in escaped text
function highlightMatch(text){
  if(!searchQuery)return esc(text||'');
  const safe=esc(text||'');
  // Escape regex special chars in query
  const q=searchQuery.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp('('+q+')','gi'),'<span class="search-hl">$1</span>');
}
// Advance a YYYY-MM-DD date string by the recurrence interval
function nextDueDate(dateStr,repeat){
  if(!dateStr||!repeat||repeat==='none')return '';
  const d=new Date(dateStr+'T00:00:00');
  if(repeat==='daily')d.setDate(d.getDate()+1);
  else if(repeat==='weekly')d.setDate(d.getDate()+7);
  else if(repeat==='monthly')d.setMonth(d.getMonth()+1);
  else return '';
  return d.toISOString().slice(0,10);
}
