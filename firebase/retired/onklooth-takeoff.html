<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OnKlooth Takeoff has moved</title>
<style>
:root{--bg:#fff;--text:#171717;--muted:#686868;--line:#e5e5e5}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e14;--text:#e6edf3;--muted:#7d8896;--line:rgba(255,255,255,.13)}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:420px;width:100%}
.k{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:6px 0 10px}
p{color:var(--muted);margin-bottom:22px}
a.b{display:inline-block;background:var(--text);color:var(--bg);text-decoration:none;font-weight:500;padding:11px 18px;border-radius:8px}
small{display:block;margin-top:22px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<main>
  <div class="k">OnKlooth Takeoff</div>
  <h1>This app has moved</h1>
  <p>This takeoff tool has been retired. Use the OpenYap Command Center.</p>
  <a class="b" href="https://openyap-prod.web.app/command-center/">Open the Command Center</a>
  <small>Retired September 25, 2026. Sign in with your usual OpenYap account. If you do not have access yet, ask your project engineer.</small>
</main>
</body>
</html>
